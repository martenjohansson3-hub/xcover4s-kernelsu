name: Build XCover Root Manager APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK ready"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p XCoverRootManager/app/src/main/java/com/xcover/rootmanager

          cp AndroidManifest.xml \
            XCoverRootManager/app/src/main/AndroidManifest.xml

          cp MainActivity.java \
            XCoverRootManager/app/src/main/java/com/xcover/rootmanager/MainActivity.java

          cat > XCoverRootManager/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'XCoverRootManager'
          include ':app'
          EOF

          cat > XCoverRootManager/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > XCoverRootManager/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.xcover.rootmanager'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.xcover.rootmanager'
                  minSdk 30
                  targetSdk 30
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          test -s XCoverRootManager/settings.gradle
          test -s XCoverRootManager/build.gradle
          test -s XCoverRootManager/app/build.gradle
          test -s XCoverRootManager/app/src/main/AndroidManifest.xml
          test -s XCoverRootManager/app/src/main/java/com/xcover/rootmanager/MainActivity.java

          echo "Android project ready"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: XCoverRootManager
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="XCoverRootManager/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p deliver

          cp "$APK" deliver/XCoverRootManager-UNTESTED.apk

          sha256sum deliver/XCoverRootManager-UNTESTED.apk \
            > deliver/SHA256SUMS.txt

          echo "APK successfully compiled"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XCoverRootManager-UNTESTED-APK
          path: deliver/
          retention-days: 7
