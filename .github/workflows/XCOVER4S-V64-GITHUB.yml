name: XCOVER4S V65 SELINUX ONLY ODIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential clang llvm lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 python3-pip cpio zip unzip

      - name: Reconstruct original boot image
        run: |
          set -euo pipefail

          test -s boot.img.part1
          test -s boot.img.part2

          cat boot.img.part1 boot.img.part2 > original-boot.img

          echo "Original boot SHA256:"
          sha256sum original-boot.img

          echo "f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  original-boot.img" \
            | sha256sum -c -

          test "$(stat -c%s original-boot.img)" -eq 37748736

      - name: Download original kernel source
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          test "$(git -C kernel rev-parse HEAD)" = \
            "6020dfa8315134187f07ca903c9d2ed7ee0256f5"

      - name: Patch SELinux only
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")
          hooks = root / "security/selinux/hooks.c"
          fs = root / "security/selinux/selinuxfs.c"

          s = hooks.read_text()

          # Inspect the actual SELinux enforcement implementation.
          # Refuse to patch an unexpected source layout.
          definitions = list(re.finditer(
              r'(?m)^\s*int\s+selinux_enforcing\s*=\s*[^;]+;',
              s
          ))

          if len(definitions) != 1:
              raise SystemExit(
                  "V65: unexpected selinux_enforcing definition"
              )

          s = re.sub(
              r'(?m)^(\s*int\s+selinux_enforcing\s*=\s*)[^;]+;',
              r'\g<1>0;',
              s,
              count=1
          )

          setup = re.search(
              r'static\s+int\s+__init\s+enforcing_setup'
              r'\s*\([^)]*\)\s*\{',
              s
          )

          if not setup:
              raise SystemExit(
                  "V65: enforcing_setup not found"
              )

          pos = setup.end()
          s = (
              s[:pos]
              + "\n\tselinux_enforcing = 0;\n\treturn 1;\n"
              + s[pos:]
          )

          hooks.write_text(s)

          t = fs.read_text()

          match = re.search(
              r'static\s+ssize_t\s+sel_write_enforce'
              r'\s*\([^)]*\)\s*\{',
              t
          )

          if not match:
              raise SystemExit(
                  "V65: sel_write_enforce not found"
              )

          pos = match.end()

          t = (
              t[:pos]
              + "\n\treturn -EPERM;\n"
              + t[pos:]
          )

          fs.write_text(t)
          PY

          git -C kernel diff --check
          git -C kernel diff > selinux-v65.patch

          echo "Changed source files:"
          git -C kernel diff --name-only | tee changed-files.txt

          test "$(wc -l < changed-files.txt)" -eq 2
          grep -qx "security/selinux/hooks.c" changed-files.txt
          grep -qx "security/selinux/selinuxfs.c" changed-files.txt

      - name: Configure kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            lineage_xcover4s_defconfig

          kernel/scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            -d SECURITY_SELINUX_DISABLE

          kernel/scripts/config --file out/.config \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          grep -E \
            'CONFIG_(SECURITY_SELINUX|ALWAYS_ENFORCE)' \
            out/.config | tee selinux-config.txt

          if grep -qx "CONFIG_ALWAYS_ENFORCE=y" out/.config; then
            echo "ERROR: Samsung ALWAYS_ENFORCE is active"
            exit 1
          fi

          grep -qx \
            "CONFIG_SECURITY_SELINUX_DEVELOP=y" \
            out/.config

      - name: Compile kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 Image 2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image

      - name: Repack original Android boot image
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import struct
          import hashlib

          original = Path("original-boot.img").read_bytes()
          kernel = Path(
              "out/arch/arm64/boot/Image"
          ).read_bytes()

          if original[:8] != b"ANDROID!":
              raise SystemExit("Not a standard Android boot image")

          old_kernel_size = struct.unpack_from(
              "<I", original, 8
          )[0]

          ramdisk_size = struct.unpack_from(
              "<I", original, 16
          )[0]

          second_size = struct.unpack_from(
              "<I", original, 24
          )[0]

          page_size = struct.unpack_from(
              "<I", original, 36
          )[0]

          dt_size = struct.unpack_from(
              "<I", original, 40
          )[0]

          if page_size not in (2048, 4096, 8192, 16384):
              raise SystemExit(
                  f"Unsupported boot page size: {page_size}"
              )

          if not (10000000 < old_kernel_size < 40000000):
              raise SystemExit("Unexpected original kernel size")

          if not (10000000 < len(kernel) < 40000000):
              raise SystemExit("Unexpected new kernel size")

          def align(n):
              return (n + page_size - 1) // page_size * page_size

          # This packer supports legacy Android boot header v0.
          # Reject v1/v2 instead of producing a misleading Odin file.
          header_version = struct.unpack_from(
              "<I", original, 44
          )[0]

          if header_version != 0:
              raise SystemExit(
                  "V65: boot header requires additional "
                  "format-specific repacking verification"
              )

          old_kernel_offset = page_size
          ramdisk_offset = (
              old_kernel_offset + align(old_kernel_size)
          )

          second_offset = (
              ramdisk_offset + align(ramdisk_size)
          )

          dt_offset = (
              second_offset + align(second_size)
          )

          end = dt_offset + align(dt_size)

          if end > len(original):
              raise SystemExit(
                  "Original boot sections exceed file size"
              )

          ramdisk = original[
              ramdisk_offset:ramdisk_offset + ramdisk_size
          ]

          second = original[
              second_offset:second_offset + second_size
          ]

          dt = original[
              dt_offset:dt_offset + dt_size
          ]

          trailer = original[end:]

          if len(trailer) > 1048576:
              raise SystemExit(
                  "Unexpected trailing boot data; "
                  "manual inspection required"
              )

          header = bytearray(original[:page_size])

          struct.pack_into(
              "<I", header, 8, len(kernel)
          )

          digest = hashlib.sha1()

          for data in (kernel, ramdisk, second, dt):
              digest.update(data)
              digest.update(struct.pack("<I", len(data)))

          header[576:596] = digest.digest()
          header[596:608] = bytes(12)

          output = bytearray(header)

          for data in (kernel, ramdisk, second, dt):
              output.extend(data)
              output.extend(
                  bytes(align(len(data)) - len(data))
              )

          output.extend(trailer)

          Path("boot.img").write_bytes(output)

          print("Original kernel:", old_kernel_size)
          print("New kernel:", len(kernel))
          print("Ramdisk preserved:", len(ramdisk))
          print("Second preserved:", len(second))
          print("Device tree preserved:", len(dt))
          print("Trailing data preserved:", len(trailer))
          print("Output size:", len(output))

          assert Path("boot.img").read_bytes()[:8] == b"ANDROID!"
          PY

      - name: Create Odin package
        run: |
          set -euo pipefail

          test -s boot.img

          tar --format=ustar -cf XCOVER4S-V65-ODIN.tar boot.img

          tar -tf XCOVER4S-V65-ODIN.tar \
            | grep -qx boot.img

          sha256sum \
            original-boot.img \
            boot.img \
            XCOVER4S-V65-ODIN.tar \
            > checksums.txt

          echo "ODIN PACKAGE CREATED"
          ls -lh XCOVER4S-V65-ODIN.tar

      - name: Upload Odin package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V65-ODIN
          path: |
            XCOVER4S-V65-ODIN.tar
            boot.img
            checksums.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V65-DIAGNOSTICS
          path: |
            build.log
            selinux-v65.patch
            changed-files.txt
            selinux-config.txt
            out/.config
            checksums.txt
          if-no-files-found: warn
