name: XCOVER4S V66 SELINUX ONLY ODIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            git make bc bison flex \
            build-essential clang llvm lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            python3 cpio zip unzip

      - name: Reconstruct original boot image
        run: |
          set -euo pipefail

          cat boot.img.part1 boot.img.part2 > original-boot.img

          echo "f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  original-boot.img" \
            | sha256sum -c -

          test "$(stat -c%s original-boot.img)" -eq 37748736

      - name: Download kernel source
        run: |
          set -euo pipefail

          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          test "$(git -C kernel rev-parse HEAD)" = \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Patch SELinux only
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          hooks = Path("kernel/security/selinux/hooks.c")
          s = hooks.read_text()

          pattern = (
              r'(?m)^([ \t]*int[ \t]+selinux_enforcing'
              r'[ \t]*=[ \t]*)[^;]+;'
          )

          matches = list(re.finditer(pattern, s))

          if len(matches) != 1:
              raise SystemExit(
                  f"Unexpected SELinux enforcing definitions: {len(matches)}"
              )

          s = re.sub(
              pattern,
              lambda m: m.group(1) + "0;",
              s,
              count=1
          )

          setup = re.search(
              r'static\s+int\s+__init\s+enforcing_setup'
              r'\s*\([^)]*\)\s*\{',
              s
          )

          if not setup:
              raise SystemExit("enforcing_setup not found")

          pos = setup.end()

          s = (
              s[:pos]
              + "\n\tselinux_enforcing = 0;\n"
              + "\treturn 1;\n"
              + s[pos:]
          )

          hooks.write_text(s)

          fs = Path("kernel/security/selinux/selinuxfs.c")
          s = fs.read_text()

          match = re.search(
              r'static\s+ssize_t\s+sel_write_enforce'
              r'\s*\([^)]*\)\s*\{',
              s
          )

          if not match:
              raise SystemExit("sel_write_enforce not found")

          pos = match.end()

          s = s[:pos] + "\n\treturn -EPERM;\n" + s[pos:]

          fs.write_text(s)
          PY

          git -C kernel diff --check
          git -C kernel diff > selinux.patch
          git -C kernel diff --name-only > changed-files.txt

          test "$(wc -l < changed-files.txt)" -eq 2
          grep -qx 'security/selinux/hooks.c' changed-files.txt
          grep -qx 'security/selinux/selinuxfs.c' changed-files.txt

      - name: Configure kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            lineage_xcover4s_defconfig

          kernel/scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          if grep -qx 'CONFIG_ALWAYS_ENFORCE=y' out/.config; then
            echo "ERROR: Samsung ALWAYS_ENFORCE enabled"
            exit 1
          fi

          grep -qx 'CONFIG_SECURITY_SELINUX_DEVELOP=y' \
            out/.config

      - name: Compile kernel
        run: |
          set -uo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          set +e

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 Image > build.log 2>&1

          result=$?

          set -e

          tail -100 build.log

          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi

          test -s out/arch/arm64/boot/Image

      - name: Download Android boot image tools
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/aosp-mirror/platform_system_tools_mkbootimg.git \
            boottools

          test -f boottools/mkbootimg.py
          test -f boottools/unpack_bootimg.py

      - name: Repack Android boot header v1
        run: |
          set -euo pipefail

          mkdir -p unpacked

          python3 boottools/unpack_bootimg.py \
            --boot_img original-boot.img \
            --out unpacked \
            --format mkbootimg \
            > boot-arguments.txt

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import struct
          import shlex
          import sys

          original = Path("original-boot.img").read_bytes()

          if original[:8] != b"ANDROID!":
              raise SystemExit("Invalid Android boot magic")

          if len(original) != 37748736:
              raise SystemExit("Unexpected original image size")

          header_version = struct.unpack_from(
              "<I", original, 40
          )[0]

          if header_version != 1:
              raise SystemExit(
                  f"Expected Android boot header v1, got {header_version}"
              )

          new_kernel = Path(
              "out/arch/arm64/boot/Image"
          ).resolve()

          if not new_kernel.is_file():
              raise SystemExit("Compiled kernel missing")

          raw = Path("boot-arguments.txt").read_text().strip()
          args = shlex.split(raw)

          if args and (
              args[0].endswith("mkbootimg.py")
              or args[0] == "mkbootimg"
          ):
              args.pop(0)

          if "--kernel" not in args:
              raise SystemExit("Missing kernel argument")

          if "--header_version" not in args:
              raise SystemExit("Missing header version argument")

          idx = args.index("--header_version")

          if args[idx + 1] != "1":
              raise SystemExit("Incorrect unpacked header version")

          idx = args.index("--kernel")
          args[idx + 1] = str(new_kernel)

          if "--output" in args:
              idx = args.index("--output")
              args[idx + 1] = "boot.img"
          else:
              args.extend(["--output", "boot.img"])

          command = [
              sys.executable,
              "boottools/mkbootimg.py",
              *args
          ]

          print("Repacking Android boot header v1")

          subprocess.run(command, check=True)

          result = Path("boot.img").read_bytes()

          if result[:8] != b"ANDROID!":
              raise SystemExit("Repacked image invalid")

          version = struct.unpack_from(
              "<I", result, 40
          )[0]

          if version != 1:
              raise SystemExit("Repacked header version changed")

          print("Repacked boot.img:", len(result), "bytes")
          PY

      - name: Verify repacked boot sections
        run: |
          set -euo pipefail

          mkdir -p verified-original verified-new

          python3 boottools/unpack_bootimg.py \
            --boot_img original-boot.img \
            --out verified-original \
            > original-header.txt

          python3 boottools/unpack_bootimg.py \
            --boot_img boot.img \
            --out verified-new \
            > new-header.txt

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          old = Path("verified-original")
          new = Path("verified-new")

          for name in ("ramdisk", "second", "recovery_dtbo", "dtb"):
              a = old / name
              b = new / name

              if a.exists() != b.exists():
                  raise SystemExit(
                      f"Boot section changed presence: {name}"
                  )

              if a.exists() and a.read_bytes() != b.read_bytes():
                  raise SystemExit(
                      f"Boot section changed contents: {name}"
                  )

          compiled = Path(
              "out/arch/arm64/boot/Image"
          ).read_bytes()

          unpacked = (new / "kernel").read_bytes()

          if unpacked != compiled:
              raise SystemExit("Repacked kernel does not match build")

          print("Kernel verified")
          print("Ramdisk and other extracted sections preserved")
          print("SHA256:", hashlib.sha256(
              Path("boot.img").read_bytes()
          ).hexdigest())
          PY

      - name: Create Odin TAR
        run: |
          set -euo pipefail

          test -s boot.img

          tar --format=ustar \
            -cf XCOVER4S-V66-ODIN.tar boot.img

          tar -tf XCOVER4S-V66-ODIN.tar \
            | grep -qx boot.img

          sha256sum \
            original-boot.img \
            boot.img \
            XCOVER4S-V66-ODIN.tar \
            > checksums.txt

          ls -lh boot.img XCOVER4S-V66-ODIN.tar

      - name: Upload Odin package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V66-ODIN
          path: |
            XCOVER4S-V66-ODIN.tar
            boot.img
            checksums.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V66-DIAGNOSTICS
          path: |
            build.log
            selinux.patch
            changed-files.txt
            boot-arguments.txt
            original-header.txt
            new-header.txt
            out/.config
            checksums.txt
          if-no-files-found: warn
