
name: XCOVER4S V64 - Display Fixed Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v64:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex git make \
            clang lld gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            libssl-dev libelf-dev python3 \
            cpio gzip xz-utils unzip

      - name: Validate Python files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apply_kernel.py \
            tools/repack_boot.py

      - name: Verify original boot
        shell: bash
        run: |
          set -euo pipefail
          unzip -o boot-original-for-github.zip -d .
          test -s boot-original.img
          echo \
          'f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  boot-original.img' \
            | sha256sum -c -

      - name: Download pinned Samsung kernel
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply V64 CP patch
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/apply_kernel.py

          git -C kernel diff --check

          git -C kernel diff \
            > V64-applied-kernel.patch

          test -s V64-applied-kernel.patch

      - name: Fix display floating-point compilation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/video/fbdev/exynos/"
              "dpu_7885/decon_reg.c"
          )

          s = p.read_text()

          old = (
              "const double "
              "decon_clocks_table[][CLK_ID_MAX]"
          )

          new = (
              "const unsigned int "
              "decon_clocks_table[][CLK_ID_MAX]"
          )

          if s.count(old) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one "
                  "decon_clocks_table declaration"
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          assert old not in s
          assert s.count(new) == 1

          print("PASS: floating-point table removed")
          print("PASS: display clock values preserved")
          print("PASS: CP patch unchanged")
          PY

          git -C kernel diff --check

          git -C kernel diff \
            > V64-applied-kernel.patch

      - name: Save display source diagnostics
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/video/fbdev/exynos/"
              "dpu_7885/decon_reg.c"
          )

          lines = p.read_text().splitlines()

          output = []

          for i, line in enumerate(lines):
              if (
                  "decon_clocks_table" in line
                  or "decon_reg_get_clock_ratio" in line
              ):
                  start = max(0, i - 3)
                  end = min(len(lines), i + 10)

                  for j in range(start, end):
                      output.append(
                          f"{j + 1}: {lines[j]}"
                      )

          Path("V64-display-source.txt").write_text(
              "\n".join(output) + "\n"
          )

          print("PASS: display diagnostics saved")
          PY

      - name: Configure ARM64 kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            lineage_xcover4s_defconfig

          kernel/scripts/config \
            --file out/.config \
            -e CP_PMUCAL \
            -e OVERLAY_FS

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          grep -qx \
            'CONFIG_CP_PMUCAL=y' \
            out/.config

      - name: Compile display driver first
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            2>&1 | tee V64-display-test.log

          test -s \
            out/drivers/video/fbdev/exynos/dpu_7885/decon_reg.o

          echo "PASS: display driver compiled"

      - name: Compile complete kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 Image \
            2>&1 | tee V64-build.log

          test -s out/arch/arm64/boot/Image

          echo "PASS: kernel Image compiled"

      - name: Compile ARM64 rootbroker
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("tools/rootbroker.c")
          s = p.read_text()

          if "#include <stddef.h>" not in s:
              s = "#include <stddef.h>\n" + s
              p.write_text(s)
          PY

          aarch64-linux-gnu-gcc \
            -static -Os -Wall \
            -o tools/rootbroker.arm64 \
            tools/rootbroker.c

          aarch64-linux-gnu-gcc \
            -static -Os -Wall \
            -o tools/init-wrapper.arm64 \
            tools/init-wrapper.c

          test -s tools/rootbroker.arm64
          test -s tools/init-wrapper.arm64

          echo "PASS: rootbroker compiled"

      - name: Repack boot and prepare Odin TAR
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/repack_boot.py

          test -s deliver/boot.img

          test "$(stat -c %s deliver/boot.img)" \
            = 37748736

          tar -C deliver \
            --format=ustar \
            -cf deliver/V64-EXPERIMENTAL-ODIN.tar \
            boot.img

          mkdir -p restore

          cp boot-original.img restore/boot.img

          tar -C restore \
            --format=ustar \
            -cf deliver/V64-ORIGINAL-RESTORE.tar \
            boot.img

          sha256sum deliver/*.tar \
            > deliver/V64-checksums.txt

          echo "PASS: Odin TAR packages created"

      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V64-RESULTS
          path: |
            V64-applied-kernel.patch
            V64-display-source.txt
            V64-display-test.log
            V64-build.log
            out/.config
            out/arch/arm64/boot/Image
            deliver/
          if-no-files-found: warn
          retention-days: 14
