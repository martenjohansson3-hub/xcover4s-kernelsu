          print('V35 patched modem_v1 SS310AP power-on request to CP_POWER_OFF')
          PY
          git -C kernel diff > diagnostics/v35.patch
          grep -n -C 12 'V35 experimental' kernel/drivers/misc/modem_v1/modem_ctrl_ss310ap.c > diagnostics/power-off-context.txt
          grep -R -n 'CONFIG_.*MODEM\|CONFIG_.*SS310' kernel/arch/arm64/configs/lineage_xcover4s_defconfig > diagnostics/modem-config-hints.txt || true
      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out lineage_xcover4s_defconfig
          scripts/config --file out/.config -d DEBUG_INFO -d DEBUG_INFO_BTF -d KALLSYMS_ALL -e SECURITY_SELINUX -e SECURITY_SELINUX_DEVELOP -e SECURITY_SELINUX_BOOTPARAM --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0
          make O=out olddefconfig
          cp out/.config ../diagnostics/final.config
          grep -Ei 'MODEM|SS310|CP_PMUCAL' out/.config > ../diagnostics/modem-config.txt || true
      - name: Targeted compile first
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error
          make O=out -j2 drivers/misc/modem_v1/modem_ctrl_ss310ap.o drivers/soc/samsung/cal-if/cal-if.o drivers/video/fbdev/exynos/dpu_7885/decon_abd.o drivers/video/fbdev/exynos/dpu_7885/decon_reg.o drivers/video/fbdev/exynos/dpu_7885/decon_core.o drivers/video/fbdev/exynos/dpu_7885/helper.o 2>&1 | tee ../diagnostics/targeted-build.log
      - name: Full Image build
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error
          make O=out -j2 Image 2>&1 | tee ../diagnostics/full-build.log
      - name: Package kernel and warnings
        run: |
          set -euo pipefail
          cp kernel/out/arch/arm64/boot/Image artifact/Image
          cp diagnostics/v35.patch artifact/v35.patch
          cp diagnostics/final.config artifact/final.config
          sha256sum artifact/Image > artifact/SHA256SUMS
          cat > artifact/READ-ME-FIRST.txt <<'EOF'
          V35 IS EXPERIMENTAL AND NOT ODIN FLASHABLE.
          V35 replaces one SS310AP modem_v1 CP_POWER_ON call with CP_POWER_OFF.
          This may not be the active driver on XCover4s. Bootloop risk is substantial.
          CP_POWER_OFF does NOT prove zero voltage on modem rails.
          This build has NOT been boot-tested or hardware-verified.
          Do not flash until active driver and hardware sequence are confirmed.
          EOF
      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V35-EXPERIMENTAL-KERNEL
          path: artifact/
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V35-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
