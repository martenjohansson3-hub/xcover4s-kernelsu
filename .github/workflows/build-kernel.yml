name: XCOVER4S V60 - SELinux Permissive + Root CP Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: xcover4s
      KBUILD_BUILD_HOST: github
      KCFLAGS: -Wno-error

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            make \
            cpio \
            xz-utils \
            zip \
            unzip

      - name: Download original kernel source
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          git rev-parse HEAD

          test -f drivers/misc/modem_v1/modem_ctrl_ss310ap.c
          test -f security/selinux/hooks.c
          test -f arch/arm64/configs/lineage_xcover4s_defconfig

      - name: Patch SELinux permissive and CP control
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")

          # ------------------------------------------------
          # SELinux: permissive kernel default
          # ------------------------------------------------

          hooks = root / "security/selinux/hooks.c"
          s = hooks.read_text()

          pattern = r'(?m)^int selinux_enforcing;\s*$'

          matches = re.findall(pattern, s)

          if len(matches) != 1:
              raise SystemExit(
                  "V60: unexpected SELinux layout"
              )

          s = re.sub(
              pattern,
              "int selinux_enforcing = 0;",
              s,
              count=1
          )

          hooks.write_text(s)

          # ------------------------------------------------
          # Samsung SS310AP modem control
          # ------------------------------------------------

          p = root / "drivers/misc/modem_v1/modem_ctrl_ss310ap.c"
          s = p.read_text()

          required = [
              "static struct modem_ctl *g_mc;",
              "static int ss310ap_on(",
              "static int ss310ap_off(",
              "static int ss310ap_boot_on(",
              "cal_cp_status()",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "V60: missing modem symbol: " + item
                  )

          # ------------------------------------------------
          # New root-only sysfs interface
          #
          # /sys/kernel/cp_control/status
          # /sys/kernel/cp_control/off
          # /sys/kernel/cp_control/lock
          #
          # lock=1 prevents the normal ss310ap_on
          # and ss310ap_boot_on entry points.
          #
          # This is NOT a verified hardware power latch.
          # ------------------------------------------------

          anchor = "static struct modem_ctl *g_mc;"

          if s.count(anchor) != 1:
              raise SystemExit("V60: modem anchor mismatch")

          code = r'''
          /* V60 root-controlled CP interface */
          #include <linux/kobject.h>
          #include <linux/sysfs.h>
          #include <linux/atomic.h>
          #include <linux/capability.h>
          #include <linux/errno.h>

          static atomic_t v60_cp_locked = ATOMIC_INIT(0);

          static int ss310ap_off(struct modem_ctl *mc);

          static ssize_t v60_status_show(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              char *buf)
          {
          #ifdef CONFIG_CP_PMUCAL
              int hw = cal_cp_status();
          #else
              int hw = exynos_get_cp_power_status();
          #endif

              return scnprintf(
                  buf, PAGE_SIZE,
                  "cp_status=%d locked=%d modem_ctl=%s\n",
                  hw,
                  atomic_read(&v60_cp_locked),
                  g_mc ? "ready" : "missing"
              );
          }

          static ssize_t v60_off_store(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              const char *buf,
              size_t count)
          {
              int ret;

              if (!capable(CAP_SYS_ADMIN))
                  return -EPERM;

              if (!sysfs_streq(buf, "1"))
                  return -EINVAL;

              if (!g_mc)
                  return -ENODEV;

              ret = ss310ap_off(g_mc);

              if (ret)
                  return ret;

              pr_warn(
                  "V60: CP modem_off requested; "
                  "physical power removal not verified\n"
              );

              return count;
          }

          static ssize_t v60_lock_show(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              char *buf)
          {
              return scnprintf(
                  buf, PAGE_SIZE, "%d\n",
                  atomic_read(&v60_cp_locked)
              );
          }

          static ssize_t v60_lock_store(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              const char *buf,
              size_t count)
          {
              if (!capable(CAP_SYS_ADMIN))
                  return -EPERM;

              if (sysfs_streq(buf, "1"))
                  atomic_set(&v60_cp_locked, 1);
              else if (sysfs_streq(buf, "0"))
                  atomic_set(&v60_cp_locked, 0);
              else
                  return -EINVAL;

              return count;
          }

          static struct kobj_attribute v60_status_attr =
              __ATTR(status, 0444, v60_status_show, NULL);

          static struct kobj_attribute v60_off_attr =
              __ATTR(off, 0200, NULL, v60_off_store);

          static struct kobj_attribute v60_lock_attr =
              __ATTR(lock, 0600,
                     v60_lock_show, v60_lock_store);

          static struct kobject *v60_cp_kobj;

          static int __init v60_cp_control_init(void)
          {
              int ret;

              v60_cp_kobj =
                  kobject_create_and_add(
                      "cp_control", kernel_kobj
                  );

              if (!v60_cp_kobj)
                  return -ENOMEM;

              ret = sysfs_create_file(
                  v60_cp_kobj,
                  &v60_status_attr.attr
              );
              if (ret)
                  goto fail;

              ret = sysfs_create_file(
                  v60_cp_kobj,
                  &v60_off_attr.attr
              );
              if (ret)
                  goto fail;

              ret = sysfs_create_file(
                  v60_cp_kobj,
                  &v60_lock_attr.attr
              );
              if (ret)
                  goto fail;

              pr_info("V60: CP control ready\n");
              return 0;

          fail:
              kobject_put(v60_cp_kobj);
              return ret;
          }

          late_initcall(v60_cp_control_init);
          /* End V60 interface */
          '''

          s = s.replace(anchor, anchor + "\n" + code, 1)

          # ------------------------------------------------
          # Guard the normal CP-on entry points
          # ------------------------------------------------

          on_pattern = (
              r'(static int ss310ap_on'
              r'\(struct modem_ctl \*mc\)\s*\{)'
          )

          boot_pattern = (
              r'(static int ss310ap_boot_on'
              r'\(struct modem_ctl \*mc\)\s*\{)'
          )

          for pattern, name in [
              (on_pattern, "ss310ap_on"),
              (boot_pattern, "ss310ap_boot_on"),
          ]:
              if len(re.findall(pattern, s)) != 1:
                  raise SystemExit(
                      "V60: unexpected " + name
                  )

          # Insert checks after local declarations, not before
          # them, to remain compatible with the old C kernel.

          on_marker = (
              '\tmif_err("+++\\n");'
          )

          on_start = s.index(
              "static int ss310ap_on("
          )

          on_end = s.index(
              "static int ss310ap_off(",
              on_start + 30
          )

          # There is a forward declaration above the
          # function. Locate the real function definition.
          actual_on = re.search(
              on_pattern, s
          )

          start = actual_on.start()
          next_function = s.find(
              "static int ss310ap_off(",
              actual_on.end()
          )

          segment = s[start:next_function]

          if segment.count(on_marker) != 1:
              raise SystemExit(
                  "V60: cannot locate modem-on body"
              )

          segment = segment.replace(
              on_marker,
              '''\
              if (atomic_read(&v60_cp_locked)) {
                  pr_warn("V60: CP start blocked\\n");
                  return -EPERM;
              }

              ''' + on_marker,
              1
          )

          s = s[:start] + segment + s[next_function:]

          actual_boot = re.search(
              boot_pattern, s
          )

          if not actual_boot:
              raise SystemExit(
                  "V60: boot-on function missing"
              )

          start = actual_boot.start()

          next_function = s.find(
              "static int ss310ap_boot_off(",
              actual_boot.end()
          )

          if next_function < 0:
              raise SystemExit(
                  "V60: boot-off function missing"
              )

          segment = s[start:next_function]

          marker = '\tmif_info("+++\\n");'

          if segment.count(marker) != 1:
              raise SystemExit(
                  "V60: cannot locate modem boot"
              )

          segment = segment.replace(
              marker,
              '''\
              if (atomic_read(&v60_cp_locked)) {
                  pr_warn("V60: CP boot blocked\\n");
                  return -EPERM;
              }

              ''' + marker,
              1
          )

          s = s[:start] + segment + s[next_function:]

          p.write_text(s)

          print("V60 patches applied")
          PY

      - name: Configure kernel
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          ./scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -d ALWAYS_ENFORCE \
            -d RKP_KDP

          make O=out olddefconfig

          grep -q '^CONFIG_SECURITY_SELINUX=y$' out/.config

          grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' \
            out/.config

          if grep -q '^CONFIG_ALWAYS_ENFORCE=y$' out/.config; then
            echo "ERROR: always-enforce remains enabled"
            exit 1
          fi

          grep -E \
            'CONFIG_SECURITY_SELINUX|CONFIG_ALWAYS_ENFORCE|CONFIG_CP_PMUCAL' \
            out/.config

      - name: Compile XCover 4s kernel
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make \
            O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            -j2 \
            Image 2>&1 | tee ../build.log

      - name: Verify kernel output
        run: |
          set -euo pipefail

          IMAGE="kernel/out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          echo "Kernel Image:"
          ls -lh "$IMAGE"

          sha256sum "$IMAGE"

          grep -q 'v60_cp_control_init' \
            kernel/drivers/misc/modem_v1/modem_ctrl_ss310ap.c

          grep -q 'int selinux_enforcing = 0;' \
            kernel/security/selinux/hooks.c

          echo "V60 source and build output checks passed"

      - name: Collect V60 artifacts
        if: always()
        run: |
          mkdir -p deliver

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image \
              deliver/XCOVER4S-V60-Image
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config \
              deliver/V60-kernel-config.txt
          fi

          if [ -f build.log ]; then
            cp build.log deliver/build.log
          fi

          if [ -d kernel/.git ]; then
            git -C kernel rev-parse HEAD \
              > deliver/source-commit.txt

            git -C kernel diff \
              > deliver/V60-applied.patch
          fi

          cat > deliver/README.txt <<'EOF'
          XCOVER4S V60

          Device: Samsung XCover 4s SM-G398F
          Kernel: Exynos7885 lineage-18.1

          Changes:
          - SELinux permissive kernel default
          - Root-controlled modem interface
          - CP start guard for selected entry points
          - No automatic CP shutdown during startup

          Proposed sysfs interface after boot:

          /sys/kernel/cp_control/status
          /sys/kernel/cp_control/off
          /sys/kernel/cp_control/lock

          IMPORTANT:
          The off interface uses Samsung ss310ap_off.
          On CONFIG_CP_PMUCAL kernels this is NOT proven
          to physically disconnect modem power.

          The lock is not a complete hardware-enforced
          prohibition against all CP restart paths.

          This build is experimental.
          A compiled Image is NOT an Odin-flashable boot image.
          A known-good matching boot image is required for
          proper repacking and packaging.

          Do not flash Image directly with Odin.
          EOF

      - name: Upload V60 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V60-DIAGNOSTICS
          path: deliver/
          if-no-files-found: warn
