
name: XCOVER4S V38 FULL CPLOCK BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3

      - name: Clone V36 source
        run: |
          set -euo pipefail
          git clone \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          git -C kernel checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply V38 patches
        run: |
          set -euo pipefail

          cat > /tmp/patch_v38.py <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")

          def replace_once(path, old, new):
              p = root / path
              s = p.read_text()
              if s.count(old) != 1:
                  raise RuntimeError(
                      f"Expected one match in {path}: {old!r}; "
                      f"found {s.count(old)}"
                  )
              p.write_text(s.replace(old, new, 1))
              print("PATCHED", path)

          # Previously needed DPU build fixes.
          replace_once(
              "drivers/video/fbdev/exynos/dpu_7885/decon_reg.c",
              "const double decon_clocks_table",
              "const unsigned long decon_clocks_table"
          )

          replace_once(
              "drivers/video/fbdev/exynos/dpu_7885/decon.h",
              "#define decon_create_debugfs(...) do { } while(0)",
              "#define decon_create_debugfs(...) (0)"
          )

          replace_once(
              "drivers/video/fbdev/exynos/dpu_7885/decon.h",
              "#define decon_destroy_debugfs(..) do { } while(0)",
              "#define decon_destroy_debugfs(...) do { } while(0)"
          )

          helper = root / (
              "drivers/video/fbdev/exynos/dpu_7885/helper.c"
          )
          h = helper.read_text()
          if "ACQUIRE_FENCE_LEN" not in h:
              raise RuntimeError("ACQUIRE_FENCE_LEN not found")
          if "#define ACQUIRE_FENCE_LEN" not in h:
              helper.write_text(
                  "#ifndef ACQUIRE_FENCE_LEN\n"
                  "#define ACQUIRE_FENCE_LEN 1024\n"
                  "#endif\n\n" + h
              )

          # CPLOCK: PMUCAL functions have int ret as
          # their first declaration. Insert AFTER it.
          cp = (
              "drivers/soc/samsung/cal-if/pmucal_cp.c"
          )

          for func in (
              "pmucal_cp_init",
              "pmucal_cp_reset_release",
          ):
              old = (
                  f"int {func}(void)\n"
                  "{\n"
                  "\tint ret;\n"
              )
              new = (
                  old
                  + "\n"
                  + "\t/* CPLOCK V38 */\n"
                  + "\tpr_warn_ratelimited("
                  + f"\"CPLOCK: denied {func}\\n\");\n"
                  + "\treturn -EPERM;\n"
              )
              replace_once(cp, old, new)

          # Reject SS310AP modem_on before any CP
          # activation code, but after declarations.
          modem = (
              "drivers/misc/modem_v1/"
              "modem_ctrl_ss310ap.c"
          )
          p = root / modem
          s = p.read_text()

          pattern = (
              r"(static int ss310ap_on"
              r"\(struct modem_ctl \*mc\)\s*\{"
              r".*?"
              r"int cp_status = mbox_extract_value"
              r"\(MCU_CP, mc->mbx_cp_status,"
              r".*?;\s*)"
              r"(\s*mif_err\(\"\+\+\+\\n\"\);)"
          )

          def patch_on(match):
              return (
                  match.group(1)
                  + '\n\t/* CPLOCK V38 */\n'
                  + '\tmif_err("CPLOCK: modem_on denied\\n");\n'
                  + '\tmc->phone_state = STATE_OFFLINE;\n'
                  + '\treturn -EPERM;\n\n'
                  + match.group(2)
              )

          s, count = re.subn(
              pattern,
              patch_on,
              s,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise RuntimeError(
                  "Could not safely patch ss310ap_on"
              )

          p.write_text(s)
          print("PATCHED SS310AP modem_on")

          # Add an explicit, non-panicking OFF attempt.
          # This is not proof of physical power removal.
          p = root / cp
          s = p.read_text()

          if "CPLOCK V38 FORCE OFF" in s:
              raise RuntimeError("Already patched")

          s = (
              '#include <linux/init.h>\n'
              '#include <linux/errno.h>\n'
              '#include <linux/printk.h>\n'
              + s
          )

          s += r'''

          /* CPLOCK V38 FORCE OFF */
          static int __init xcover4s_cp_force_off(void)
          {
              int ret;

              pr_info("CPLOCK: force-off requested\n");

              if (!pmucal_cp_list.reset_assert) {
                  pr_err("CPLOCK: OFF sequence missing\n");
                  return 0;
              }

              ret = pmucal_rae_handle_cp_seq(
                  pmucal_cp_list.reset_assert,
                  pmucal_cp_list.num_reset_assert);

              if (ret)
                  pr_err("CPLOCK: OFF failed: %d\n", ret);
              else
                  pr_info("CPLOCK: OFF sequence complete\n");

              return 0;
          }
          late_initcall(xcover4s_cp_force_off);
          '''

          p.write_text(s)
          print("PATCHED CP force-off")

          # Archive source references for next revision.
          pattern = re.compile(
              r"CP_POWER_ON|CP_POWER_OFF|"
              r"cal_cp_init|cal_cp_reset_release|"
              r"pmucal_cp_init|pmucal_cp_reset_release"
          )

          with open("/tmp/v38-callers.txt", "w") as out:
              for file in (root / "drivers").rglob("*.c"):
                  for number, line in enumerate(
                      file.read_text(
                          errors="replace"
                      ).splitlines(), 1
                  ):
                      if pattern.search(line):
                          out.write(
                              f"{file}:{number}: {line}\n"
                          )

          print("V38 patches applied")
          PY

          python3 /tmp/patch_v38.py

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p out

          make O=out \
            lineage_xcover4s_defconfig

          make O=out olddefconfig

          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config
          grep -qx 'CONFIG_SEC_MODEM_SS310AP=y' out/.config

      - name: Full kernel build
        run: |
          set -euo pipefail
          cd kernel

          make O=out -j2 Image \
            2>&1 | tee /tmp/v38-build.log

          test -s out/arch/arm64/boot/Image

      - name: Validate ARM64 image
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path(
              "kernel/out/arch/arm64/boot/Image"
          )

          data = p.read_bytes()

          if len(data) < 1000000:
              raise SystemExit("Kernel unexpectedly small")

          magic = struct.unpack_from(
              "<I", data, 0x38
          )[0]

          if magic != 0x644d5241:
              raise SystemExit(
                  "Invalid ARM64 kernel header"
              )

          print("ARM64 kernel header OK")
          print("Image size:", len(data))
          PY

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p dist

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image \
              dist/Image
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config dist/final.config
          fi

          if [ -f /tmp/v38-build.log ]; then
            cp /tmp/v38-build.log dist/build.log
          fi

          if [ -f /tmp/v38-callers.txt ]; then
            cp /tmp/v38-callers.txt \
              dist/cp-callers.txt
          fi

          if [ -d kernel/.git ]; then
            git -C kernel diff > dist/v38.patch
            git -C kernel rev-parse HEAD \
              > dist/source-commit.txt
          fi

          if [ -f dist/Image ]; then
            sha256sum dist/Image \
              > dist/Image.sha256
          fi

          cat > dist/README.txt <<'EOF'
          XCOVER4S V38 EXPERIMENTAL

          Full kernel build.
          Not an Odin package.

          C90 declaration issue addressed.
          PMUCAL CP start gates added.
          SS310AP modem_on denied.
          PMUCAL OFF attempted at late init.

          Remaining risks:
          - Other CP reactivation paths
          - Late power-off timing
          - Kernel boot compatibility
          - Unknown physical CP power state

          DO NOT FLASH IMAGE DIRECTLY.
          EOF

      - name: Upload V38
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V38-FULL-KERNEL
          path: dist/
          if-no-files-found: error
          retention-days: 30
