name: XCover4s - SELinux Permissive Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: kernel
  KERNEL_REPO: https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
  KERNEL_BRANCH: lineage-18.1
  KERNEL_DEFCONFIG: lineage_xcover4s_defconfig

  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            make \
            cpio \
            rsync \
            python3 \
            git

      - name: Clone XCover4s kernel
        run: |
          set -eux

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo
          echo "=========================================="
          echo "KERNEL"
          echo "=========================================="

          git -C "$KERNEL_DIR" rev-parse HEAD

          echo
          echo "DEFCONFIG:"
          ls -lh \
            "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

      - name: Inspect SELinux
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          echo
          echo "=========================================="
          echo "SELINUX REFERENCES"
          echo "=========================================="

          grep -RInE \
            "selinux_enforcing|security_setenforce" \
            security/selinux security \
            2>/dev/null \
            | head -200 || true

      - name: Force SELinux permissive in kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):
              text = p.read_text(errors="ignore")
              original = text

              # Change literal kernel defaults:
              #
              # selinux_enforcing = 1;
              #
              # to:
              #
              # selinux_enforcing = 0;

              text = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  text
              )

              if text != original:
                  p.write_text(text)
                  changed.append(str(p))

          print()
          print("Changed SELinux source files:")

          for item in changed:
              print("  " + item)

          if not changed:
              raise SystemExit(
                  "ERROR: No selinux_enforcing = 1 assignment found."
              )

          print()
          print("SELinux modification completed.")
          PY

          echo
          echo "=========================================="
          echo "SELINUX ASSIGNMENTS AFTER PATCH"
          echo "=========================================="

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo "SELINUX DIFF"
          echo "=========================================="

          git diff -- security/selinux

      - name: Inspect modem RF power paths
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set +e

          echo
          echo "=========================================="
          echo "MODEM / CP / RF"
          echo "=========================================="

          grep -RInE \
            "modem|cpif|cp_power|cp.*power|modap|link_pm|mif|radio" \
            arch/arm64 drivers include \
            2>/dev/null \
            | head -500

          echo
          echo "=========================================="
          echo "REGULATOR CONTROL"
          echo "=========================================="

          grep -RInE \
            "regulator_(enable|disable)|regulator_get|regulator_bulk|regulator.*disable|regulator.*enable" \
            drivers arch/arm64 \
            2>/dev/null \
            | head -500

          echo
          echo "=========================================="
          echo "MODEM / RF DEVICE TREE"
          echo "=========================================="

          grep -RInE \
            "modem|cpif|cp_power|vdd.*cp|vdd.*modem|regulator.*cp|regulator.*modem|modap|mif" \
            arch/arm64/boot/dts \
            2>/dev/null \
            | head -500

          echo
          echo "=========================================="
          echo "RADIO CONFIG"
          echo "=========================================="

          grep -RInE \
            "CONFIG_.*(MODEM|CPIF|RADIO|RF|MIF|MODAP)" \
            arch/arm64/configs \
            2>/dev/null \
            | head -300

          echo
          echo "NO RF REGULATOR IS DISABLED IN THIS BUILD."
          echo "THIS STEP ONLY IDENTIFIES THE CORRECT POWER PATH."

          true

      - name: Verify WiFi and GNSS are untouched
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          echo
          echo "=========================================="
          echo "WIFI / GNSS SAFETY CHECK"
          echo "=========================================="

          echo "No WiFi source files are modified."
          echo "No GNSS/GPS source files are modified."
          echo "No modem regulator is disabled."

          git diff --name-only

          echo
          echo "SELinux-only source modification is expected."

      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          rm -rf out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            "$KERNEL_DEFCONFIG"

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "=========================================="
          echo "FINAL CONFIG"
          echo "=========================================="

          grep -E \
            "CONFIG_SECURITY_SELINUX|CONFIG_SECURITY_SELINUX_DEVELOP|CONFIG_SECURITY_SELINUX_BOOTPARAM" \
            out/.config \
            || true

      - name: Build full kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          KCFLAGS: -Wno-error
        run: |
          set -eux

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 | tee build.log

      - name: Verify kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          test -f out/arch/arm64/boot/Image

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          ls -lh \
            out/arch/arm64/boot/Image

          echo
          echo "SHA256:"

          sha256sum \
            out/arch/arm64/boot/Image

          echo
          echo "SELINUX CONFIG:"

          grep -E \
            "CONFIG_SECURITY_SELINUX|CONFIG_SECURITY_SELINUX_DEVELOP|CONFIG_SECURITY_SELINUX_BOOTPARAM" \
            out/.config \
            || true

      - name: Package artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            "${KERNEL_DIR}/out/arch/arm64/boot/Image" \
            artifacts/Image-selinux-permissive

          cp \
            "${KERNEL_DIR}/out/.config" \
            artifacts/kernel-config

          cp \
            "${KERNEL_DIR}/build.log" \
            artifacts/build.log

          tar -czf \
            artifacts/xcover4s-selinux-permissive.tar.gz \
            -C artifacts \
            Image-selinux-permissive \
            kernel-config \
            build.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-selinux-permissive
          path: artifacts/
          if-no-files-found: error
