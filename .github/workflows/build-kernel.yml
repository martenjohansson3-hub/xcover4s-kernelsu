name: XCover4s CP POWER OFF v9 - Flashable

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  KCFLAGS: -Wno-error

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      # ==========================================================
      # 1. TOOLS
      # ==========================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            cpio \
            rsync \
            unzip \
            wget \
            curl \
            file

      # ==========================================================
      # 2. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 3. KERNEL SOURCE
      # ==========================================================

      - name: Clone kernel
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          echo "SOURCE COMMIT:"
          git -C kernel rev-parse HEAD

      # ==========================================================
      # 4. PATCH CP
      # ==========================================================

      - name: Apply CP OFF v9 patch
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("drivers/soc/samsung/pmu-cp.c")
          s = p.read_text()

          # ------------------------------------------------------
          # RESET FUNCTION
          # ------------------------------------------------------

          pattern_reset = re.compile(
              r'/\* reset cp \*/\n'
              r'int exynos_cp_reset\(void\)\n'
              r'\{.*?\n\}\n',
              re.S
          )

          reset = r'''/* reset cp */
          int exynos_cp_reset(void)
          {
              /*
               * XCOVER4S_V9_CP_OFF
               *
               * Do not assert CP_PWRON.
               * Do not start the cellular CP.
               * Use Samsung's normal CP_POWER_OFF sequence.
               */
              pr_info(
                  "XCOVER4S_V9: CP reset blocked - forcing OFF\n"
              );

              return exynos_set_cp_power_onoff(CP_POWER_OFF);
          }
          '''

          s2, n = pattern_reset.subn(reset, s, count=1)

          if n != 1:
              raise SystemExit(
                  "Could not replace exynos_cp_reset()"
              )

          s = s2

          # ------------------------------------------------------
          # RELEASE FUNCTION
          # ------------------------------------------------------

          pattern_release = re.compile(
              r'/\* release cp \*/\n'
              r'int exynos_cp_release\(void\)\n'
              r'\{.*?\n\}\n'
              r'\n/\* clear cp active \*/',
              re.S
          )

          release = r'''/* release cp */
          int exynos_cp_release(void)
          {
              /*
               * XCOVER4S_V9_CP_OFF
               *
               * Do not write CP_START.
               * Do not write CP_POWER_ON.
               */
              pr_info(
                  "XCOVER4S_V9: CP release blocked - forcing OFF\n"
              );

              return exynos_set_cp_power_onoff(CP_POWER_OFF);
          }

          /* clear cp active */'''

          s2, n = pattern_release.subn(
              release,
              s,
              count=1
          )

          if n != 1:
              raise SystemExit(
                  "Could not replace exynos_cp_release()"
              )

          s = s2

          # ------------------------------------------------------
          # CENTRAL POWER FUNCTION
          #
          # IMPORTANT:
          # declarations remain BEFORE executable statements.
          # This is required for compatibility with this old kernel.
          # ------------------------------------------------------

          marker = "int exynos_set_cp_power_onoff(enum cp_mode mode)\n{"

          if s.count(marker) != 1:
              raise SystemExit(
                  "Could not find unique CP power function"
              )

          old = marker + r'''
              u32 cp_ctrl;
              u32 __maybe_unused cp_ctrl2;
              int ret = 0;
              int wait_count = 0;
          '''

          new = marker + r'''
              u32 cp_ctrl;
              u32 __maybe_unused cp_ctrl2;
              int ret = 0;
              int wait_count = 0;

              /*
               * XCOVER4S_V9_CP_OFF
               *
               * Any request to power the cellular CP on is converted
               * into the normal Samsung CP_POWER_OFF sequence.
               */
              if (mode == CP_POWER_ON) {
                  pr_info(
                      "XCOVER4S_V9: CP POWER_ON blocked - forcing OFF\n"
                  );

                  mode = CP_POWER_OFF;
              }
          '''

          if old not in s:
              raise SystemExit(
                  "Expected original CP function declarations not found"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("========================================")
          print("XCOVER4S V9 CP PATCH APPLIED")
          print("========================================")
          PY

      # ==========================================================
      # 5. SELINUX PERMISSIVE
      # ==========================================================

      - name: Configure SELinux permissive
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):
              old = p.read_text()

              new = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  old
              )

              if new != old:
                  p.write_text(new)
                  changed.append(str(p))

          if not changed:
              raise SystemExit(
                  "SELinux permissive patch was not applied"
              )

          print("SELinux patched:")
          for x in changed:
              print(x)
          PY

      # ==========================================================
      # 6. SOURCE VERIFICATION
      # ==========================================================

      - name: Verify CP source
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          s = Path(
              "drivers/soc/samsung/pmu-cp.c"
          ).read_text()

          # ------------------------------------------------------
          # RESET
          # ------------------------------------------------------

          a = s.index(
              "int exynos_cp_reset(void)"
          )

          b = s.index(
              "/* release cp */",
              a
          )

          reset = s[a:b]

          if "CP_PWRON" in reset:
              raise SystemExit(
                  "FAIL: CP_PWRON remains in reset"
              )

          if "CP_POWER_OFF" not in reset:
              raise SystemExit(
                  "FAIL: CP_POWER_OFF missing from reset"
              )

          # ------------------------------------------------------
          # RELEASE
          # ------------------------------------------------------

          a = s.index(
              "int exynos_cp_release(void)"
          )

          b = s.index(
              "/* clear cp active */",
              a
          )

          release = s[a:b]

          if "CP_START" in release:
              raise SystemExit(
                  "FAIL: CP_START remains in release"
              )

          if "CP_POWER_ON" in release:
              raise SystemExit(
                  "FAIL: CP_POWER_ON remains in release"
              )

          if "CP_POWER_OFF" not in release:
              raise SystemExit(
                  "FAIL: CP_POWER_OFF missing from release"
              )

          # ------------------------------------------------------
          # CENTRAL FUNCTION
          # ------------------------------------------------------

          if "XCOVER4S_V9_CP_OFF" not in s:
              raise SystemExit(
                  "FAIL: v9 marker missing"
              )

          if (
              "mode = CP_POWER_OFF;"
              not in s
          ):
              raise SystemExit(
                  "FAIL: CP POWER_ON redirect missing"
              )

          # ------------------------------------------------------
          # CHECK THAT SAMSUNG POWER-DOWN SEQUENCE STILL EXISTS
          # ------------------------------------------------------

          required = [
              "exynos_sys_powerdown_conf_cp();",
              "CP_PWRON",
              "EXYNOS_PMU_CENTRAL_SEQ_CP_CONFIGURATION",
              "EXYNOS_PMU_TCXO_GATE_SYS_PWR_REG",
              "EXYNOS_PMU_CP_DISABLE_ISO_SYS_PWR_REG",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "FAIL: missing required Samsung CP code: "
                      + item
                  )

          print(
              "CP SOURCE VERIFICATION PASSED"
          )
          PY

      # ==========================================================
      # 7. SHOW PATCH
      # ==========================================================

      - name: Show CP diff
        working-directory: kernel
        run: |
          set -eux

          git diff -- \
            drivers/soc/samsung/pmu-cp.c \
            security/selinux

      # ==========================================================
      # 8. CONFIG
      # ==========================================================

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            lineage_xcover4s_defconfig

          python3 <<'PY'
          from pathlib import Path

          p = Path("out/.config")
          s = p.read_text()

          key = (
              "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE="
          )

          lines = [
              x for x in s.splitlines()
              if not x.startswith(key)
          ]

          lines.append(
              key + "0"
          )

          p.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          grep \
            '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0$' \
            out/.config

      # ==========================================================
      # 9. TARGETED BUILD
      # ==========================================================

      - name: Targeted PMU compile
        working-directory: kernel
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            drivers/soc/samsung/pmu-cp.o \
            2>&1 \
          | tee targeted-build.log

          echo
          echo "TARGETED PMU COMPILE PASSED"

      # ==========================================================
      # 10. FULL BUILD
      # ==========================================================

      - name: Full kernel build
        working-directory: kernel
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail

          echo "========================================"
          echo "FULL KERNEL BUILD V9"
          echo "========================================"

          date -u

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 \
          | tee build.log \
          | awk '
              /aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)/ {
                  next
              }

              /aarch64-linux-gnu-objdump: Warning: Bogus end-of-siblings marker/ {
                  next
              }

              /aarch64-linux-gnu-objdump: Warning: Further warnings about bogus end-of-sibling markers suppressed/ {
                  next
              }

              /aarch64-linux-gnu-objdump: Warning: DIE at offset/ {
                  next
              }

              {
                  print
                  fflush()
              }
            '

          echo
          echo "========================================"
          echo "FULL KERNEL BUILD PASSED"
          echo "========================================"

          date -u

      # ==========================================================
      # 11. VERIFY IMAGE
      # ==========================================================

      - name: Verify kernel Image
        working-directory: kernel
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          file "$IMAGE"

          SIZE="$(stat -c%s "$IMAGE")"

          echo "Image size: $SIZE"

          if [ "$SIZE" -lt 20000000 ]; then
              echo "ERROR: Image is unexpectedly small"
              exit 1
          fi

          sha256sum "$IMAGE"

      # ==========================================================
      # 12. VERIFY ORIGINAL BOOT
      # ==========================================================

      - name: Verify original boot image
        run: |
          set -eux

          if [ ! -f boot-original.img ]; then
              echo
              echo "ERROR: boot-original.img is missing."
              echo
              echo "Put your known-good original boot image"
              echo "in the repository root as:"
              echo
              echo "boot-original.img"
              exit 1
          fi

          SHA="$(
            sha256sum boot-original.img \
            | awk '{print $1}'
          )"

          echo "Original boot SHA256:"
          echo "$SHA"

          EXPECTED="f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9"

          if [ "$SHA" != "$EXPECTED" ]; then
              echo
              echo "ERROR: ORIGINAL BOOT HASH DOES NOT MATCH"
              echo
              echo "Expected:"
              echo "$EXPECTED"
              echo
              echo "Got:"
              echo "$SHA"
              exit 1
          fi

          echo "ORIGINAL BOOT VERIFIED"

      # ==========================================================
      # 13. GET MAGISKBOOT
      # ==========================================================

      - name: Get magiskboot
        run: |
          set -eux

          API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          URL="$(
            curl -fsSL "$API" \
            | python3 -c '
          import json
          import sys

          d = json.load(sys.stdin)

          for a in d["assets"]:
              if a["name"].endswith(".apk"):
                  print(a["browser_download_url"])
                  break
          '
          )"

          test -n "$URL"

          wget -q \
            "$URL" \
            -O Magisk.apk

          unzip -j -o \
            Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d .

          mv \
            libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          ./magiskboot --help \
            >/dev/null 2>&1 \
            || true

          file magiskboot

      # ==========================================================
      # 14. UNPACK ORIGINAL BOOT
      # ==========================================================

      - name: Unpack original boot
        run: |
          set -eux

          rm -rf boot-unpack
          mkdir boot-unpack

          cd boot-unpack

          ../magiskboot unpack \
            ../boot-original.img

          echo
          echo "===== BOOT CONTENTS ====="

          ls -lah

      # ==========================================================
      # 15. VERIFY ORIGINAL KERNEL
      # ==========================================================

      - name: Verify original boot kernel
        run: |
          set -eux

          test -f boot-unpack/kernel

          echo "Original embedded kernel:"
          file boot-unpack/kernel

          stat boot-unpack/kernel

      # ==========================================================
      # 16. INSTALL NEW KERNEL
      # ==========================================================

      - name: Install v9 kernel into boot image
        run: |
          set -eux

          test -s \
            kernel/out/arch/arm64/boot/Image

          cp \
            kernel/out/arch/arm64/boot/Image \
            boot-unpack/kernel

          echo
          echo "New kernel:"
          file boot-unpack/kernel

          sha256sum \
            boot-unpack/kernel

      # ==========================================================
      # 17. REPACK
      # ==========================================================

      - name: Repack boot image
        run: |
          set -eux

          ./magiskboot repack \
            boot-original.img \
            boot-CP-OFF-v9.img

          test -s \
            boot-CP-OFF-v9.img

          echo
          echo "========================================"
          echo "FLASHABLE BOOT CREATED"
          echo "========================================"

          ls -lh \
            boot-CP-OFF-v9.img

          file \
            boot-CP-OFF-v9.img

          sha256sum \
            boot-CP-OFF-v9.img

      # ==========================================================
      # 18. FINAL BOOT CHECK
      # ==========================================================

      - name: Final boot image verification
        run: |
          set -eux

          test -s \
            boot-CP-OFF-v9.img

          SIZE="$(stat -c%s boot-CP-OFF-v9.img)"

          echo "Flashable boot size: $SIZE"

          if [ "$SIZE" -lt 1000000 ]; then
              echo "ERROR: flashable boot is suspiciously small"
              exit 1
          fi

          ./magiskboot unpack \
            boot-CP-OFF-v9.img

          test -f kernel

          echo
          echo "Re-unpacked v9 boot successfully."

          echo
          echo "v9 embedded kernel:"
          file kernel

          sha256sum kernel

      # ==========================================================
      # 19. PACKAGE
      # ==========================================================

      - name: Package artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image-CP-POWER-OFF-v9

          cp \
            boot-CP-OFF-v9.img \
            artifacts/boot-CP-OFF-v9.img

          cp \
            boot-original.img \
            artifacts/boot-original.img

          cp \
            kernel/out/.config \
            artifacts/kernel-config

          cp \
            kernel/build.log \
            artifacts/build.log

          cp \
            kernel/targeted-build.log \
            artifacts/targeted-build.log

          cp \
            kernel/drivers/soc/samsung/pmu-cp.c \
            artifacts/pmu-cp-v9.c

          git -C kernel diff \
            -- drivers/soc/samsung/pmu-cp.c \
               security/selinux \
            > artifacts/kernel.patch

          git -C kernel rev-parse HEAD \
            > artifacts/source-commit.txt

          sha256sum \
            artifacts/boot-CP-OFF-v9.img \
            artifacts/Image-CP-POWER-OFF-v9 \
            artifacts/boot-original.img \
            > artifacts/SHA256SUMS

          echo
          echo "========================================"
          echo "V9 ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      # ==========================================================
      # 20. UPLOAD
      # ==========================================================

      - name: Upload flashable v9
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-CP-POWER-OFF-v9-FLASHABLE
          path: artifacts/
          if-no-files-found: error

      # ==========================================================
      # 21. FAILURE LOG
      # ==========================================================

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p failure-diagnostics

          if [ -f kernel/build.log ]; then
              cp \
                kernel/build.log \
                failure-diagnostics/
          fi

          if [ -f kernel/targeted-build.log ]; then
              cp \
                kernel/targeted-build.log \
                failure-diagnostics/
          fi

          if [ -f kernel/drivers/soc/samsung/pmu-cp.c ]; then
              cp \
                kernel/drivers/soc/samsung/pmu-cp.c \
                failure-diagnostics/
          fi

          if [ -d kernel ]; then
              git -C kernel diff \
                > failure-diagnostics/kernel.patch \
                || true
          fi

          echo
          echo "========================================"
          echo "BUILD FAILURE"
          echo "========================================"

          if [ -f kernel/build.log ]; then
              grep -Ei \
                'fatal error:|error:|undefined reference|No rule to make target|make.*Error' \
                kernel/build.log \
                | tail -100 \
                || true
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-v9-FAILURE-DIAGNOSTICS
          path: failure-diagnostics/
          if-no-files-found: ignore
