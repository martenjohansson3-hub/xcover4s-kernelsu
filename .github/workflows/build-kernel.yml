#!/usr/bin/env python3
"""V64 CP latch kernel patch.

SELinux boot default is configured separately in the GitHub Actions YAML.
Physical modem power-off is not verified.
"""

from pathlib import Path
import re

ROOT = Path("kernel")
cp = ROOT / "drivers/soc/samsung/cal-if/pmucal_cp.c"
modem = ROOT / "drivers/misc/modem_v1/modem_ctrl_ss310ap.c"

CP_PREAMBLE = r'''
#include <linux/srcu.h>
#include <linux/mutex.h>
#include <linux/errno.h>
#include <linux/init.h>
#include <linux/kernel.h>
#include <linux/kobject.h>
#include <linux/sysfs.h>

extern int pmucal_cp_reset_assert(void);

/*
 * V64 experimental software CP latch.
 * Not a verified physical RF power switch.
 */

static DEFINE_SRCU(v64_cp_srcu);
static DEFINE_MUTEX(v64_cp_set_mutex);

static int v64_cp_latched;
static int v64_cp_result = -EAGAIN;

int v64_cp_read_enter(void)
{
    int cookie = srcu_read_lock(&v64_cp_srcu);

    if (READ_ONCE(v64_cp_latched)) {
        srcu_read_unlock(&v64_cp_srcu, cookie);
        return -EPERM;
    }

    return cookie;
}

void v64_cp_read_leave(int cookie)
{
    srcu_read_unlock(&v64_cp_srcu, cookie);
}

static ssize_t v64_hard_off_lock_show(
    struct kobject *kobj,
    struct kobj_attribute *attr,
    char *buf)
{
    return scnprintf(
        buf, PAGE_SIZE, "%d\n",
        READ_ONCE(v64_cp_latched)
    );
}

static ssize_t v64_hard_off_result_show(
    struct kobject *kobj,
    struct kobj_attribute *attr,
    char *buf)
{
    return scnprintf(
        buf, PAGE_SIZE, "%d\n",
        READ_ONCE(v64_cp_result)
    );
}

static ssize_t v64_hard_off_lock_store(
    struct kobject *kobj,
    struct kobj_attribute *attr,
    const char *buf,
    size_t count)
{
    int ret;

    if (count != 2 || buf[0] != '1' || buf[1] != '\n')
        return -EINVAL;

    mutex_lock(&v64_cp_set_mutex);

    if (READ_ONCE(v64_cp_latched)) {
        mutex_unlock(&v64_cp_set_mutex);
        return -EPERM;
    }

    WRITE_ONCE(v64_cp_latched, 1);

    synchronize_srcu(&v64_cp_srcu);

    ret = pmucal_cp_reset_assert();

    WRITE_ONCE(v64_cp_result, ret);

    mutex_unlock(&v64_cp_set_mutex);

    return ret ? ret : count;
}

static struct kobj_attribute v64_lock_attr =
    __ATTR(
        hard_off_lock,
        0600,
        v64_hard_off_lock_show,
        v64_hard_off_lock_store
    );

static struct kobj_attribute v64_result_attr =
    __ATTR(
        hard_off_result,
        0400,
        v64_hard_off_result_show,
        NULL
    );

static int __init v64_cp_sysfs_init(void)
{
    struct kobject *kobj;
    int ret;

    kobj = kobject_create_and_add(
        "cp_control", kernel_kobj
    );

    if (!kobj)
        return -ENOMEM;

    ret = sysfs_create_file(
        kobj, &v64_lock_attr.attr
    );

    if (!ret)
        ret = sysfs_create_file(
            kobj, &v64_result_attr.attr
        );

    if (ret)
        kobject_put(kobj);

    return ret;
}

late_initcall(v64_cp_sysfs_init);
'''


def insert_after_function(src, func_name, wrapper):
    rgx = re.compile(
        r'(?m)^((?:static\s+)?int\s+)'
        + re.escape(func_name)
        + r'(\s*\([^;]*?\)\s*\{)',
        re.S
    )

    matches = list(rgx.finditer(src))

    if len(matches) != 1:
        raise RuntimeError(
            f"Expected one {func_name} definition; "
            f"found {len(matches)}"
        )

    m = matches[0]

    definition = src[m.start():m.end()].replace(
        func_name,
        "v64_original_" + func_name,
        1
    )

    src = (
        src[:m.start()]
        + definition
        + src[m.end():]
    )

    start = m.start() + len(definition)

    end = re.search(
        r'(?m)^\}\s*$',
        src[start:]
    )

    if not end:
        raise RuntimeError(
            "Could not find function end: " + func_name
        )

    i = start + end.end()

    return (
        src[:i]
        + "\n\n"
        + wrapper
        + "\n"
        + src[i:]
    )


def wrapped(name, param="void"):
    args = "" if param == "void" else "mc"

    return f'''int {name}({param})
{{
    int cookie;
    int ret;

    cookie = v64_cp_read_enter();

    if (cookie < 0)
        return cookie;

    ret = v64_original_{name}({args});

    v64_cp_read_leave(cookie);

    return ret;
}}'''


def patch_cp():
    s = cp.read_text()

    if "v64_cp_srcu" in s:
        raise RuntimeError(
            "CP source already contains V64 patch"
        )

    s = CP_PREAMBLE + "\n" + s

    for name in (
        "pmucal_cp_init",
        "pmucal_cp_reset_release"
    ):
        s = insert_after_function(
            s, name, wrapped(name)
        )

    for line in (
        'panic("cp reset assert fail");',
        'panic("cp reset release fail");'
    ):
        if s.count(line) != 1:
            raise RuntimeError(
                "Unexpected reset panic site: " + line
            )

        s = s.replace(
            line,
            "/* V64: original panic suppressed. */"
        )

    cp.write_text(s)


def patch_modem():
    s = modem.read_text()

    if "v64_cp_read_enter" in s:
        raise RuntimeError(
            "Modem source already contains V64 patch"
        )

    s = '''/* V64 CP action guard */
extern int v64_cp_read_enter(void);
extern void v64_cp_read_leave(int cookie);
''' + s

    for name in (
        "ss310ap_on",
        "ss310ap_reset",
        "ss310ap_boot_on",
        "ss310ap_dump_start"
    ):
        wrapper = wrapped(
            name,
            "struct modem_ctl *mc"
        )

        wrapper = wrapper.replace(
            "int " + name + "(",
            "static int " + name + "(",
            1
        )

        s = insert_after_function(
            s, name, wrapper
        )

    modem.write_text(s)


def main():
    for path in (cp, modem):
        if not path.is_file():
            raise RuntimeError(
                "Missing kernel source: " + str(path)
            )

    patch_cp()
    patch_modem()

    print("V64 CP patch applied:")
    print(cp)
    print(modem)
    print("SELinux boot default handled by kernel config.")


if __name__ == "__main__":
    main()#!/usr/bin/env python3
