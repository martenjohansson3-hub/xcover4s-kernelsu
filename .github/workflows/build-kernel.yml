
name: XCover4s V16 - CP OFF + SELinux Permissive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 65

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      EXPECTED_BOOT_SHA: f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            git python3 clang-14 lld-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            make curl unzip zip jq cpio

      - name: Check original boot image
        id: original
        run: |
          set -euo pipefail

          if [ -f boot-original.img ]; then
            echo "$EXPECTED_BOOT_SHA  boot-original.img" \
              | sha256sum -c -
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Original boot verified."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::boot-original.img missing. Kernel will build, but boot.img cannot be repacked."
          fi

      - name: Clone pinned kernel
        run: |
          set -euo pipefail

          git init kernel
          git -C kernel remote add origin \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git

          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel checkout --detach FETCH_HEAD

          test "$(git -C kernel rev-parse HEAD)" = \
            "6020dfa8315134187f07ca903c9d2ed7ee0256f5"

      - name: Apply CP OFF and SELinux patches
        run: |
          set -euo pipefail

          cat > patch_kernel.py <<'PY'
          from pathlib import Path
          import re

          cp = Path("kernel/drivers/soc/samsung/pmu-cp.c")
          if not cp.exists():
              raise SystemExit("CP source file missing")

          src = cp.read_text()
          original = src

          def replace_function(text, name, body):
              pattern = (
                  r"(?m)^[ \t]*(?:static[ \t]+)?"
                  r"(?:inline[ \t]+)?"
                  r"(?:int|void)[ \t]+"
                  + re.escape(name)
                  + r"[ \t]*\([^;]*?\)[ \t]*\{"
              )
              matches = list(re.finditer(pattern, text, re.S))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"{name}: expected one definition, found {len(matches)}"
                  )
              m = matches[0]
              opening = m.end() - 1
              depth = 0
              closing = None
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          closing = i
                          break
              if closing is None:
                  raise RuntimeError(f"{name}: unmatched braces")
              signature = text[m.start():opening]
              if re.search(r"\bvoid\s+" + re.escape(name), signature):
                  raise RuntimeError(f"{name}: unexpected void return")
              return (
                  text[:opening+1]
                  + "\n\t/* V16: block CP activation */\n"
                  + body
                  + "\n"
                  + text[closing:]
              )

          for function in ("exynos_cp_reset", "exynos_cp_release"):
              src = replace_function(
                  src, function, "\treturn -EPERM;"
              )

          # Block power-on requests, while retaining the power-off path.
          name = "exynos_set_cp_power_onoff"
          pattern = (
              r"(?m)^[ \t]*(?:static[ \t]+)?"
              r"int[ \t]+" + name
              + r"[ \t]*\(([^;]*?)\)[ \t]*\{"
          )
          matches = list(re.finditer(pattern, src, re.S))
          if len(matches) != 1:
              raise RuntimeError(
                  f"{name}: expected one definition, found {len(matches)}"
              )

          match = matches[0]
          args = match.group(1).strip()
          last_arg = args.split(",")[-1].strip()
          arg_match = re.search(r"([A-Za-z_]\w*)\s*$", last_arg)
          if not arg_match:
              raise RuntimeError("Cannot identify CP power argument")
          power_arg = arg_match.group(1)

          src = (
              src[:match.end()]
              + f"\n\tif ({power_arg})\n\t\treturn -EPERM;\n"
              + src[match.end():]
          )

          if src == original:
              raise RuntimeError("CP patch made no changes")
          cp.write_text(src)
          print("CP source patch applied")

          # Force initial SELinux state to permissive.
          candidates = [
              Path("kernel/security/selinux/hooks.c"),
              Path("kernel/security/selinux/selinuxfs.c"),
          ]
          count = 0
          for path in candidates:
              if not path.exists():
                  continue
              data = path.read_text()
              updated, n = re.subn(
                  r"\bselinux_enforcing\s*=\s*1\s*;",
                  "selinux_enforcing = 0;",
                  data
              )
              if n:
                  path.write_text(updated)
                  count += n

          if count == 0:
              raise RuntimeError(
                  "SELinux enforcing initializer not found; "
                  "refusing an unverified patch"
              )
          print(f"SELinux initializer patches: {count}")
          PY

          python3 patch_kernel.py

          git -C kernel diff -- \
            drivers/soc/samsung/pmu-cp.c \
            security/selinux/hooks.c \
            security/selinux/selinuxfs.c \
            > kernel-source.patch

          cat kernel-source.patch

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          mkdir -p out

          make O="$PWD/out" \
            ARCH=arm64 \
            lineage_xcover4s_defconfig

          CONFIG="out/.config"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("out/.config")
          text = path.read_text()

          values = {
              "CONFIG_SECURITY_SELINUX": "y",
              "CONFIG_SECURITY_SELINUX_DEVELOP": "y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM": "y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE": "0",
          }

          lines = [
              line for line in text.splitlines()
              if not any(
                  line.startswith(key + "=")
                  or line == "# " + key + " is not set"
                  for key in values
              )
          ]

          lines.extend(
              f"{key}={value}"
              for key, value in values.items()
          )

          path.write_text("\n".join(lines) + "\n")
          PY

          make O="$PWD/out" \
            ARCH=arm64 \
            CC=clang-14 \
            KCFLAGS=-Wno-error \
            olddefconfig

          grep -E \
            '^CONFIG_SECURITY_SELINUX(_DEVELOP|_BOOTPARAM|_BOOTPARAM_VALUE)?=' \
            out/.config

          grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0$' out/.config

      - name: Targeted CP source compilation
        working-directory: kernel
        timeout-minutes: 10
        run: |
          set -euo pipefail

          echo "Compiling CP source first..."

          timeout --signal=TERM --kill-after=20s 8m \
            make -j4 \
              O="$PWD/out" \
              ARCH=arm64 \
              CC=clang-14 \
              KCFLAGS=-Wno-error \
              drivers/soc/samsung/pmu-cp.o \
              2>&1 | tee targeted-build.log

          echo "Targeted CP compile passed."

      - name: Full kernel build with live log
        working-directory: kernel
        timeout-minutes: 40
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "V16 full build starting"
          echo "UTC start: $(date -u)"
          echo "CPU count: $(nproc)"
          echo "Live output enabled."

          (
            while true; do
              sleep 60
              echo ""
              echo "===== BUILD HEARTBEAT ====="
              date -u
              if [ -f build.log ]; then
                echo "Log size:"
                du -h build.log
                echo "Last 8 log lines:"
                tail -8 build.log
              fi
              echo "==========================="
            done
          ) &
          HEARTBEAT_PID=$!

          cleanup() {
            kill "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          set +e
          timeout --signal=TERM --kill-after=30s 35m \
            make -j4 \
              O="$PWD/out" \
              ARCH=arm64 \
              CC=clang-14 \
              KCFLAGS=-Wno-error \
              Image dtbs \
              2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Kernel build failed or timed out: $RESULT"
            echo "Last 120 log lines:"
            tail -120 build.log
            exit "$RESULT"
          fi

          test -s out/arch/arm64/boot/Image

          echo "Kernel compiled successfully"
          ls -lh out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Save compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V16-COMPILED-KERNEL
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/build.log
            kernel/targeted-build.log
            kernel-source.patch
          retention-days: 14

      - name: Download MagiskBoot for repacking
        if: success() && steps.original.outputs.available == 'true'
        run: |
          set -euo pipefail

          URL="$(
            curl -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '
                .assets[]
                | select(.name | endswith(".apk"))
                | .browser_download_url
              ' | head -1
          )"

          test -n "$URL"

          curl -fL --retry 3 "$URL" -o magisk.apk

          unzip -p magisk.apk \
            lib/x86_64/libmagiskboot.so > magiskboot

          chmod +x magiskboot
          ./magiskboot --help || true

      - name: Repack and verify boot image
        if: success() && steps.original.outputs.available == 'true'
        run: |
          set -euo pipefail

          mkdir -p boot-work boot-verify

          cp boot-original.img boot-work/boot.img

          cp magiskboot boot-work/magiskboot

          cd boot-work

          ./magiskboot unpack boot.img

          test -s kernel

          cp ../kernel/out/arch/arm64/boot/Image kernel

          ./magiskboot repack boot.img \
            boot-CP-OFF-SELINUX-PERMISSIVE-v16.img

          test -s boot-CP-OFF-SELINUX-PERMISSIVE-v16.img

          cp boot-CP-OFF-SELINUX-PERMISSIVE-v16.img \
            ../boot-verify/boot.img

          cd ../boot-verify

          cp ../magiskboot ./magiskboot

          ./magiskboot unpack boot.img

          cmp kernel \
            ../kernel/out/arch/arm64/boot/Image

          echo "Repacked image contains the compiled kernel."
          echo "This does NOT prove the image will boot."
          sha256sum boot.img

      - name: Upload repacked boot image
        if: success() && steps.original.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V16-BOOT-UNVERIFIED
          path: |
            boot-work/boot-CP-OFF-SELINUX-PERMISSIVE-v16.img
            kernel-source.patch
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V16-FAILURE-DIAGNOSTICS
          path: |
            kernel/build.log
            kernel/targeted-build.log
            kernel/out/.config
            kernel-source.patch
            patch_kernel.py
          if-no-files-found: warn
          retention-days: 14
