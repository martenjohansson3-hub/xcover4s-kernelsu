name: XCOVER4S V51 FAST CP AUDIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang llvm lld \
            python3 cpio file ripgrep

          mkdir -p diagnostics

      - name: Download exact XCover 4s kernel
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          git fetch --depth=1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          test "$(git rev-parse HEAD)" = \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git rev-parse HEAD \
            > ../diagnostics/source-commit.txt

      - name: Configure XCover 4s
        run: |
          set -euo pipefail

          cd kernel

          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig \
            2>&1 | tee ../diagnostics/config.log

          cp out/.config ../diagnostics/kernel.config

          grep -E \
            '^CONFIG_.*(MODEM|CP_|PMUCAL|EXYNOS)' \
            out/.config \
            > ../diagnostics/modem-config.txt || true

          grep -q '^CONFIG_CP_PMUCAL=y' out/.config
          grep -q '^CONFIG_SEC_MODEM_SS310AP=y' out/.config

      - name: Fast CP restart audit
        run: |
          set -euo pipefail

          echo "Searching CP restart paths..."

          rg -n -i \
            --glob '*.[ch]' \
            'pmucal_cp_|cal_cp_|exynos_cp_|ss310ap_|cp_power|cp_reset|modem_reset|modem_on|modem_boot|boot_on|dump_start|CP_PWRON|CP_START|CP_ACTIVE|IOCTL_MODEM_' \
            kernel/drivers \
            kernel/arch/arm64 \
            kernel/include \
            > diagnostics/all-cp-references.txt || true

          rg -n \
            --glob '*.[ch]' \
            'pmucal_cp_init|pmucal_cp_reset_release|pmucal_cp_reset_assert|exynos_cp_init|exynos_cp_release|exynos_cp_reset|exynos_set_cp_power_onoff|ss310ap_on|ss310ap_reset|ss310ap_boot_on|ss310ap_dump_start|cal_cp_init|cal_cp_reset_release' \
            kernel/drivers \
            kernel/arch/arm64 \
            kernel/include \
            > diagnostics/restart-call-sites.txt || true

          rg -n \
            --glob '*.[ch]' \
            'panic\(|BUG\(|BUG_ON\(|WARN_ON\(' \
            kernel/drivers/misc/modem_v1 \
            kernel/drivers/soc/samsung/cal-if \
            > diagnostics/modem-panic-paths.txt || true

          echo "CP audit complete"

          wc -l \
            diagnostics/all-cp-references.txt \
            diagnostics/restart-call-sites.txt \
            diagnostics/modem-panic-paths.txt

      - name: Save relevant modem sources
        run: |
          set -euo pipefail

          tar -czf diagnostics/modem-v1-source.tar.gz \
            -C kernel \
            drivers/misc/modem_v1

          tar -czf diagnostics/cal-if-source.tar.gz \
            -C kernel \
            drivers/soc/samsung/cal-if

          if [ -f kernel/drivers/soc/samsung/pmu-cp.c ]; then
            cp kernel/drivers/soc/samsung/pmu-cp.c \
              diagnostics/pmu-cp.c
          fi

      - name: Compile CP components
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail

          cd kernel

          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            drivers/soc/samsung/cal-if/pmucal_cp.o \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.o \
            2>&1 | tee ../diagnostics/targeted-compile.log

          test -s \
            out/drivers/soc/samsung/cal-if/pmucal_cp.o

          test -s \
            out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o

      - name: Disassemble CP objects without DWARF noise
        if: steps.compile.outcome == 'success'
        run: |
          set -euo pipefail

          mkdir -p diagnostics/disassembly

          for object in \
            kernel/out/drivers/soc/samsung/cal-if/pmucal_cp.o \
            kernel/out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o
          do
            name="$(basename "$object" .o)"

            aarch64-linux-gnu-objdump \
              -d "$object" \
              > "diagnostics/disassembly/${name}.txt" \
              2> >(
                grep -vE \
                  'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)([[:space:]]|$)' \
                  >&2 || true
              )
          done

          echo "Disassembly complete"

      - name: Save status
        if: always()
        run: |
          mkdir -p diagnostics

          {
            echo "XCOVER4S V51 FAST CP AUDIT"
            echo
            echo "Source:"
            if [ -d kernel/.git ]; then
              git -C kernel rev-parse HEAD
            else
              echo "Unavailable"
            fi
            echo
            echo "CP compilation:"
            echo "${{ steps.compile.outcome }}"
            echo
            echo "Original kernel source only."
            echo "No V50/V51 CP-off patch applied."
            echo "No flashable boot.img generated."
            echo "No Odin TAR generated."
          } > diagnostics/README.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V51-FAST-CP-AUDIT
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Report compilation failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "CP compilation failed."
          echo "Check targeted-compile.log in diagnostics."
          exit 1
