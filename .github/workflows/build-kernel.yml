
name: XCOVER4S V22 CP TARGETED TEST

on:
  workflow_dispatch:

jobs:
  cp-targeted-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Install compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-14 \
            lld-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev

      - name: Download kernel
        run: |
          git clone --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      - name: Prepare CP experiment
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("kernel/drivers/soc/samsung/cal-if/cal-if.c")
          original = p.read_text()

          functions = [
              "cal_cp_init",
              "cal_cp_reset_release",
          ]

          modified = original

          for name in functions:
              pattern = (
                  r"(void\s+" + name +
                  r"\s*\(\s*void\s*\)\s*\{)"
              )
              match = re.search(pattern, modified)

              if not match:
                  raise SystemExit(
                      "Function not found: " + name
                  )

              start = match.end()
              depth = 1
              end = start

              while depth and end < len(modified):
                  if modified[end] == "{":
                      depth += 1
                  elif modified[end] == "}":
                      depth -= 1
                  end += 1

              if depth:
                  raise SystemExit(
                      "Unbalanced function: " + name
                  )

              replacement = (
                  match.group(1) +
                  "\n\t/* V22 EXPERIMENT: block CP start */"
                  "\n\tpr_warn(\"V22: " + name +
                  " blocked\\n\");\n}"
              )

              modified = (
                  modified[:match.start()] +
                  replacement +
                  modified[end:]
              )

          p.write_text(modified)

          print("CP functions patched:")
          for name in functions:
              print(name)

          assert modified != original
          PY

          git -C kernel diff \
            > diagnostics/v22-cp-experiment.patch

      - name: Check GNSS untouched
        run: |
          set -euo pipefail

          if git -C kernel diff --name-only \
            | grep -Ei 'gnss|gps|wifi|wlan'; then
            echo "ERROR: GNSS or Wi-Fi changed"
            exit 1
          fi

          echo "GNSS and Wi-Fi sources untouched"

      - name: Prepare kernel configuration
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          grep '^CONFIG_CP_PMUCAL=y' out/.config

          make O=out -j2 prepare scripts

      - name: Compile CP control object only
        run: |
          set -o pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 \
            drivers/soc/samsung/cal-if/cal-if.o \
            2>&1 | tee ../diagnostics/compile.log

      - name: Check compiled object
        run: |
          set -euo pipefail

          OBJ=kernel/out/drivers/soc/samsung/cal-if/cal-if.o

          test -s "$OBJ"

          aarch64-linux-gnu-nm "$OBJ" \
            | grep -E 'cal_cp_init|cal_cp_reset_release' \
            > diagnostics/symbols.txt

          echo "TARGETED COMPILE PASSED" \
            > diagnostics/result.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V22-CP-TARGETED-TEST
          path: diagnostics/
          if-no-files-found: warn
