name: Build XCover4s KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            python3 \
            clang \
            lld \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            ccache

      # ============================================================
      # 2. KERNEL SOURCE
      # ============================================================

      - name: Clone XCover4s kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "=========================================="
          echo " KERNEL INFORMATION"
          echo "=========================================="

          git rev-parse HEAD

          grep '^VERSION =' Makefile || true
          grep '^PATCHLEVEL =' Makefile || true
          grep '^SUBLEVEL =' Makefile || true

      # ============================================================
      # 3. KERNELSU NEXT
      # ============================================================

      - name: Install KernelSU Next legacy
        working-directory: kernel
        run: |
          set -eux

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          echo
          echo "=========================================="
          echo " KERNELSU INSTALLED"
          echo "=========================================="

          find drivers/kernelsu \
            -maxdepth 2 \
            -type f \
            | head -40 || true

      # ============================================================
      # 4. OLD KERNEL COMPATIBILITY
      # ============================================================

      - name: Patch KernelSU for Samsung old kernel
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo " OLD KERNEL COMPATIBILITY"
          echo "=========================================="

          # --------------------------------------------------------
          # Old kernel header compatibility
          # --------------------------------------------------------

          echo
          echo "===== HEADER FIXES ====="

          grep -R -l \
            'linux/compiler_types.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
              's|<linux/compiler_types.h>|<linux/compiler.h>|g'

          grep -R -l \
            'linux/sched/signal.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
              's|<linux/sched/signal.h>|<linux/sched.h>|g'

          grep -R -l \
            'linux/sched/task.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
              's|<linux/sched/task.h>|<linux/sched.h>|g'

          grep -R -l \
            'linux/sched/user.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
              's|<linux/sched/user.h>|<linux/sched.h>|g'

          # --------------------------------------------------------
          # full_name_hash
          # --------------------------------------------------------

          echo
          echo "===== FULL_NAME_HASH ====="

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "drivers/kernelsu/manager/"
              "throne_tracker.c"
          )

          s = p.read_text()

          old = (
              "full_name_hash(NULL, dirpath, "
              "strlen(dirpath))"
          )

          new = (
              "full_name_hash("
              "(const unsigned char *)dirpath, "
              "strlen(dirpath))"
          )

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("PATCHED full_name_hash")

          elif new in s:
              print(
                  "full_name_hash already compatible"
              )

          else:
              print(
                  "full_name_hash pattern not found"
              )
          PY

          # --------------------------------------------------------
          # in_compat_syscall
          # --------------------------------------------------------

          echo
          echo "===== COMPAT SYSCALL ====="

          python3 <<'PY'
          from pathlib import Path

          root = Path("drivers/kernelsu")

          patched = 0

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if p.suffix not in (
                  ".c",
                  ".h"
              ):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              if "in_compat_syscall()" not in s:
                  continue

              s = s.replace(
                  "in_compat_syscall()",
                  "is_compat_task()"
              )

              if (
                  "#include <linux/compat.h>"
                  not in s
              ):
                  lines = s.splitlines()

                  insert_at = 0

                  for i, line in enumerate(lines):
                      if line.startswith(
                          "#include"
                      ):
                          insert_at = i + 1

                  lines.insert(
                      insert_at,
                      "#include <linux/compat.h>"
                  )

                  s = "\n".join(lines) + "\n"

              p.write_text(s)

              patched += 1

              print(
                  "PATCHED:",
                  p
              )

          print(
              "Compat syscall files patched:",
              patched
          )
          PY

          # --------------------------------------------------------
          # kvmalloc compatibility
          #
          # Instead of patching every call manually we provide
          # compatibility helpers through KernelSU compatibility
          # header when this kernel lacks kvmalloc.
          # --------------------------------------------------------

          echo
          echo "===== KVMALLOC CHECK ====="

          if grep -R -q \
            -E '(^|[[:space:]])kvmalloc[[:space:]]*\(' \
            include mm \
            2>/dev/null
          then

            echo \
              "Kernel already appears to provide kvmalloc"

          else

            echo \
              "Kernel does not provide kvmalloc - adding compatibility helper"

            cat > \
              drivers/kernelsu/ksu_old_kernel_compat.h \
              <<'EOF'
          #ifndef _KSU_OLD_KERNEL_COMPAT_H
          #define _KSU_OLD_KERNEL_COMPAT_H

          #include <linux/slab.h>
          #include <linux/vmalloc.h>
          #include <linux/types.h>

          static inline void *ksu_compat_kvmalloc(
              size_t size,
              gfp_t flags)
          {
              void *p;

              p = kmalloc(size, flags);

              if (!p)
                  p = vmalloc(size);

              return p;
          }

          #define kvmalloc(size, flags) \
              ksu_compat_kvmalloc((size), (flags))

          #endif
          EOF

            python3 <<'PY'
          from pathlib import Path

          root = Path("drivers/kernelsu")

          header = (
              '#include "ksu_old_kernel_compat.h"'
          )

          patched = 0

          for p in root.rglob("*.c"):

              try:
                  s = p.read_text()
              except Exception:
                  continue

              if "kvmalloc(" not in s:
                  continue

              if header in s:
                  continue

              lines = s.splitlines()

              pos = 0

              for i, line in enumerate(lines):
                  if line.startswith("#include"):
                      pos = i + 1

              lines.insert(
                  pos,
                  header
              )

              p.write_text(
                  "\n".join(lines) + "\n"
              )

              patched += 1

              print(
                  "KVMALLOC COMPAT:",
                  p
              )

          print(
              "kvmalloc files patched:",
              patched
          )
          PY

          fi

          # --------------------------------------------------------
          # ALIGN_DOWN
          # --------------------------------------------------------

          echo
          echo "===== ALIGN_DOWN CHECK ====="

          if grep -R -q \
            -E '#define[[:space:]]+ALIGN_DOWN|ALIGN_DOWN[[:space:]]*\(' \
            include \
            2>/dev/null
          then

            echo \
              "Kernel has ALIGN_DOWN"

          else

            echo \
              "Kernel lacks ALIGN_DOWN - patching adb_root.c"

            python3 <<'PY'
          from pathlib import Path

          p = Path(
              "drivers/kernelsu/feature/"
              "adb_root.c"
          )

          s = p.read_text()

          old1 = (
              "ALIGN_DOWN("
              "stackp - sizeof(kLdPreload), 8)"
          )

          new1 = (
              "((stackp - sizeof(kLdPreload)) "
              "& ~((typeof(stackp))7))"
          )

          old2 = (
              "ALIGN_DOWN("
              "stackp - sizeof(kLdLibraryPath), 8)"
          )

          new2 = (
              "((stackp - "
              "sizeof(kLdLibraryPath)) "
              "& ~((typeof(stackp))7))"
          )

          changed = False

          if old1 in s:
              s = s.replace(
                  old1,
                  new1
              )
              changed = True

          if old2 in s:
              s = s.replace(
                  old2,
                  new2
              )
              changed = True

          if changed:
              p.write_text(s)
              print(
                  "PATCHED ALIGN_DOWN"
              )
          else:
              print(
                  "No ALIGN_DOWN patch required"
              )
          PY

          fi

          # --------------------------------------------------------
          # sulog time compatibility
          # --------------------------------------------------------

          echo
          echo "===== SULOG TIME ====="

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "drivers/kernelsu/sulog/event.c"
          )

          s = p.read_text()

          old = (
              "#if KERNEL_VERSION(4, 19, 0) "
              "<= LINUX_VERSION_CODE"
          )

          new = (
              "#if KERNEL_VERSION(4, 14, 0) "
              "<= LINUX_VERSION_CODE"
          )

          if old in s:

              s = s.replace(
                  old,
                  new
              )

              p.write_text(s)

              print(
                  "PATCHED sulog time API"
              )

          else:

              print(
                  "No sulog version patch required"
              )
          PY

          echo
          echo "=========================================="
          echo " COMPATIBILITY PATCHING COMPLETE"
          echo "=========================================="

      # ============================================================
      # 5. PRE-FLIGHT
      # ============================================================

      - name: Deep compatibility preflight
        working-directory: kernel
        run: |
          set +e

          echo "=========================================="
          echo " DEEP PRE-FLIGHT"
          echo "=========================================="

          BAD=0

          echo
          echo "===== OLD HEADERS ====="

          for H in \
            linux/compiler_types.h \
            linux/sched/signal.h \
            linux/sched/task.h \
            linux/sched/user.h
          do

            if grep -R -n \
              "$H" \
              drivers/kernelsu \
              2>/dev/null
            then

              echo \
                "ERROR: incompatible header remains: $H"

              BAD=1

            fi

          done

          echo
          echo "===== IN_COMPAT_SYSCALL ====="

          if grep -R -n \
            'in_compat_syscall()' \
            drivers/kernelsu \
            2>/dev/null
          then

            echo \
              "ERROR: in_compat_syscall remains"

            BAD=1

          else

            echo \
              "OK: no in_compat_syscall remains"

          fi

          echo
          echo "===== IS_COMPAT_TASK ====="

          grep -R -n \
            'is_compat_task()' \
            drivers/kernelsu \
            || true

          echo
          echo "===== KVMALLOC ====="

          grep -R -n \
            'kvmalloc(' \
            drivers/kernelsu \
            || true

          echo
          echo "===== ALIGN_DOWN ====="

          grep -R -n \
            'ALIGN_DOWN(' \
            drivers/kernelsu \
            || true

          echo
          echo "===== FULL_NAME_HASH ====="

          grep -R -n \
            'full_name_hash' \
            drivers/kernelsu \
            || true

          echo
          echo "===== VERSION CONDITIONALS ====="

          grep -R -n \
            -E \
            'KERNEL_VERSION|LINUX_VERSION_CODE' \
            drivers/kernelsu \
            | head -200 \
            || true

          echo
          echo "===== POSSIBLE MODERN APIs ====="

          grep -R -n \
            -E \
            'strscpy|kvcalloc|kvzalloc|timespec64|ktime_get_real_ts64|refcount_t|memdup_user_nul' \
            drivers/kernelsu \
            | head -200 \
            || true

          if [ "$BAD" -ne 0 ]
          then

            echo
            echo "=========================================="
            echo " PRE-FLIGHT FAILED"
            echo "=========================================="

            exit 1

          fi

          echo
          echo "=========================================="
          echo " PRE-FLIGHT PASSED"
          echo "=========================================="

      # ============================================================
      # 6. ENABLE KERNELSU
      # ============================================================

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          set -eux

          if ! grep -q \
            '^CONFIG_KSU=y' \
            arch/arm64/configs/lineage_xcover4s_defconfig
          then

            cat >> \
              arch/arm64/configs/lineage_xcover4s_defconfig \
              <<'EOF'

          # KernelSU Next
          CONFIG_KSU=y
          EOF

          fi

          grep \
            '^CONFIG_KSU=y' \
            arch/arm64/configs/lineage_xcover4s_defconfig

      # ============================================================
      # 7. MANUAL KERNELSU HOOKS
      # ============================================================

      - name: Apply KernelSU manual hooks
        working-directory: kernel
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):

              p = Path(path)

              data = p.read_text()

              if new in data:
                  print(
                      "ALREADY PATCHED:",
                      path
                  )
                  return

              if old not in data:
                  raise SystemExit(
                      "PATCH TARGET NOT FOUND: "
                      + path
                  )

              p.write_text(
                  data.replace(
                      old,
                      new,
                      1
                  )
              )

              print(
                  "PATCHED:",
                  path
              )


          # ========================================================
          # EXEC
          # ========================================================

          patch(
              "fs/exec.c",

              """int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {""",

              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd,
          	struct filename **filename_ptr,
          	void *argv, void *envp, int *flags);
          #endif

          int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {"""
          )

          patch(
              "fs/exec.c",

              """	struct user_arg_ptr envp = { .ptr.native = __envp };
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);""",

              """	struct user_arg_ptr envp = { .ptr.native = __envp };
          #ifdef CONFIG_KSU
          	{
          		int ksu_fd = AT_FDCWD;
          		int ksu_flags = 0;
          		ksu_handle_execveat(&ksu_fd, &filename,
          			&argv, &envp, &ksu_flags);
          	}
          #endif
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"""
          )


          # ========================================================
          # ACCESS
          # ========================================================

          patch(
              "fs/open.c",

              """/*
           * access() needs to use the real uid/gid, not the effective uid/gid.""",

              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd,
          	const char __user **filename_user,
          	int *mode, int *flags);
          #endif

          /*
           * access() needs to use the real uid/gid, not the effective uid/gid."""
          )

          patch(
              "fs/open.c",

              """	unsigned int lookup_flags = LOOKUP_FOLLOW;

          	if (mode & ~S_IRWXO)""",

              """	unsigned int lookup_flags = LOOKUP_FOLLOW;

          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(
          		&dfd, &filename, &mode, NULL);
          #endif

          	if (mode & ~S_IRWXO)"""
          )


          # ========================================================
          # READ
          # ========================================================

          patch(
              "fs/read_write.c",

              """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {""",

              """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
          	unsigned int fd,
          	char __user **buf_ptr,
          	size_t *count_ptr);
          #endif

          SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {"""
          )

          patch(
              "fs/read_write.c",

              """	ssize_t ret = -EBADF;

          	if (f.file) {""",

              """	ssize_t ret = -EBADF;

          #ifdef CONFIG_KSU
          	if (unlikely(ksu_vfs_read_hook))
          		ksu_handle_sys_read(
          			fd,
          			(char __user **)&buf,
          			&count);
          #endif

          	if (f.file) {"""
          )


          # ========================================================
          # STAT
          # ========================================================

          patch(
              "fs/stat.c",

              """#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat""",

              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
          	const char __user **filename_user,
          	int *flags);
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat"""
          )

          patch(
              "fs/stat.c",

              """	struct kstat stat;
          	int error;

          	error = vfs_fstatat(dfd, filename, &stat, flag);""",

              """	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif

          	error = vfs_fstatat(dfd, filename, &stat, flag);"""
          )


          # ========================================================
          # REBOOT
          # ========================================================

          patch(
              "kernel/reboot.c",

              """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {""",

              """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1,
          	int magic2, unsigned int cmd,
          	void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {"""
          )

          patch(
              "kernel/reboot.c",

              """	int ret = 0;

          	/* We only trust the superuser with rebooting the system. */""",

              """	int ret = 0;

          #ifdef CONFIG_KSU
          	ksu_handle_sys_reboot(
          		magic1, magic2, cmd, &arg);
          #endif

          	/* We only trust the superuser with rebooting the system. */"""
          )


          print(
              "ALL KERNELSU HOOKS APPLIED"
          )
          PY

      # ============================================================
      # 8. VERIFY HOOKS
      # ============================================================

      - name: Verify KernelSU hooks
        working-directory: kernel
        run: |
          set -eux

          echo "===== EXEC ====="
          grep -n \
            "ksu_handle_execveat" \
            fs/exec.c

          echo "===== ACCESS ====="
          grep -n \
            "ksu_handle_faccessat" \
            fs/open.c

          echo "===== READ ====="
          grep -n \
            "ksu_handle_sys_read" \
            fs/read_write.c

          echo "===== STAT ====="
          grep -n \
            "ksu_handle_stat" \
            fs/stat.c

          echo "===== REBOOT ====="
          grep -n \
            "ksu_handle_sys_reboot" \
            kernel/reboot.c

          echo
          echo \
            "ALL MANUAL HOOKS VERIFIED"

      # ============================================================
      # 9. CONFIGURE
      # ============================================================

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          export \
            CCACHE_DIR="$HOME/.ccache"

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "=========================================="
          echo " KERNELSU CONFIG"
          echo "=========================================="

          grep \
            '^CONFIG_KSU=y' \
            out/.config

      # ============================================================
      # 10. BUILD
      # ============================================================

      - name: Build kernel
        working-directory: kernel
        run: |
          set +e

          echo "=========================================="
          echo " STARTING FULL KERNEL BUILD"
          echo " HEARTBEAT EVERY 30 SECONDS"
          echo "=========================================="

          export \
            CCACHE_DIR="$HOME/.ccache"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            > build.log \
            2>&1 &

          BUILD_PID=$!

          SECONDS_RUN=0

          while kill -0 \
            "$BUILD_PID" \
            2>/dev/null
          do

            sleep 30

            if kill -0 \
              "$BUILD_PID" \
              2>/dev/null
            then

              SECONDS_RUN=$(
                (
                  SECONDS_RUN + 30
                )
              )

              echo \
                "Kernel build still running... ${SECONDS_RUN}s"

            fi

          done

          wait "$BUILD_PID"

          RESULT=$?

          echo "$RESULT" \
            > build-result.txt

          echo
          echo "=========================================="
          echo " BUILD FINISHED - RESULT: $RESULT"
          echo "=========================================="

          if [ "$RESULT" -ne 0 ]
          then

            echo
            echo "===== REAL ERRORS ====="

            grep -iE \
              "fatal error:|error:|undefined reference|multiple definition|No rule to make target|Error [0-9]+|implicit declaration|undeclared|too many arguments|incompatible pointer|unknown type name|no member named" \
              build.log \
              | grep -viE \
                'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
              | tail -400 \
              || true

            echo
            echo "===== KERNELSU ERRORS ====="

            grep -i \
              'kernelsu' \
              build.log \
              | grep -iE \
                'error|warning|undefined|implicit|undeclared|incompatible|unknown' \
              | tail -300 \
              || true

            echo
            echo "===== CLEAN BUILD END ====="

            grep -viE \
              'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
              build.log \
              | tail -200 \
              || true

          else

            echo
            echo "=========================================="
            echo " SUCCESS - KERNEL COMPILED"
            echo "=========================================="

            find \
              out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -printf '%p %k KB\n' \
              | sort \
              || true

          fi

          exit "$RESULT"

      # ============================================================
      # 11. ALWAYS CREATE DIAGNOSTIC REPORT
      # ============================================================

      - name: Create final diagnostic report
        if: always()
        working-directory: kernel
        run: |
          set +e

          REPORT="$GITHUB_WORKSPACE/final-report.txt"

          {
            echo \
              "=========================================="

            echo \
              " XCover4s KernelSU FINAL REPORT"

            echo \
              "=========================================="

            echo

            echo \
              "Kernel commit:"

            git rev-parse HEAD \
              || true

            echo

            echo \
              "KernelSU commit:"

            if [ -d KernelSU-Next ]
            then

              git \
                -C KernelSU-Next \
                rev-parse HEAD \
                || true

            fi

            echo

            echo \
              "Build result:"

            if [ -f build-result.txt ]
            then
              cat build-result.txt
            else
              echo "BUILD DID NOT START OR FINISH"
            fi

            echo

            echo \
              "CONFIG_KSU:"

            if [ -f out/.config ]
            then
              grep \
                '^CONFIG_KSU' \
                out/.config \
                || true
            fi

            echo

            echo \
              "Kernel images:"

            find \
              out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -name 'Image*' \
              -ls \
              2>/dev/null \
              || true

            echo

            echo \
              "Remaining in_compat_syscall:"

            grep -R -n \
              'in_compat_syscall()' \
              drivers/kernelsu \
              2>/dev/null \
              || true

            echo

            echo \
              "Remaining ALIGN_DOWN:"

            grep -R -n \
              'ALIGN_DOWN(' \
              drivers/kernelsu \
              2>/dev/null \
              || true

            echo

            echo \
              "kvmalloc references:"

            grep -R -n \
              'kvmalloc(' \
              drivers/kernelsu \
              2>/dev/null \
              || true

            echo

            echo \
              "===== REAL BUILD ERRORS ====="

            if [ -f build.log ]
            then

              grep -iE \
                "fatal error:|error:|undefined reference|multiple definition|No rule to make target|Error [0-9]+|implicit declaration|undeclared|too many arguments|incompatible pointer|unknown type name|no member named" \
                build.log \
                | grep -viE \
                  'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
                | tail -500 \
                || true

            else

              echo \
                "build.log does not exist"

            fi

            echo
            echo \
              "=========================================="

            echo \
              " END REPORT"

            echo \
              "=========================================="

          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 12. UPLOAD DIAGNOSTICS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-build-diagnostics
          path: |
            final-report.txt
            kernel/build.log
            kernel/build-result.txt
            kernel/out/.config
          if-no-files-found: ignore

      # ============================================================
      # 13. VERIFY SUCCESSFUL IMAGE
      # ============================================================

      - name: Verify finished kernel
        if: success()
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo " VERIFYING FINISHED KERNEL"
          echo "=========================================="

          grep \
            '^CONFIG_KSU=y' \
            out/.config

          if [ ! -f \
            out/arch/arm64/boot/Image ]
          then

            echo \
              "ERROR: Kernel Image not found"

            exit 1

          fi

          echo
          echo "===== IMAGE ====="

          ls -lh \
            out/arch/arm64/boot/Image

          sha256sum \
            out/arch/arm64/boot/Image

          echo
          echo "===== KERNELSU SYMBOLS ====="

          grep \
            "ksu_handle_" \
            out/System.map \
            | head -50 \
            || true

          echo
          echo "=========================================="
          echo " KERNEL IS READY"
          echo "=========================================="

      # ============================================================
      # 14. UPLOAD FINISHED KERNEL
      # ============================================================

      - name: Upload finished kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-kernelsu-next
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
            kernel/out/System.map
          if-no-files-found: error
