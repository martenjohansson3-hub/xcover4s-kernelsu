
name: XCOVER4S V52 SELINUX FIX BUILD AND ODIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Check known-good backup
        run: |
          set -euo pipefail
          test -s boot-original.zip || { echo 'Missing boot-original.zip in repository root'; exit 1; }
          python3 - <<'PYBOOT'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile('boot-original.zip')
          assert z.namelist()==['boot-original.img'], 'ZIP must contain exactly boot-original.img'
          info=z.getinfo('boot-original.img')
          assert info.file_size==37748736, 'Unexpected uncompressed boot image size'
          Path('boot-original.img').write_bytes(z.read(info))
          PYBOOT
          echo 'f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  boot-original.img' | sha256sum -c -
          mkdir -p artifacts diagnostics

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev clang lld python3 cpio

      - name: Clone pinned kernel
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch lineage-18.1 https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          cd kernel
          git checkout --detach 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          test "$(git rev-parse HEAD)" = 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply unchanged V51 modem restart gates
        run: |
          set -euo pipefail
          cat > diagnostics/v51.patch.gz.b64 <<'PATCH64'
          H4sIAAAAAAAC/+VYbU/bSBD+nPyKKRXISZzEDiENcPTIQaiQeBOFqjqdtHLsdbLFXqe7NlCd+O83
