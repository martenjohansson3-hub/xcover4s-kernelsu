name: XCover4s KernelSU Fast Test 3

on:
  workflow_dispatch:

jobs:
  ksu-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git curl python3 \
            clang lld libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu ccache

      - name: Clone kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel
          git rev-parse HEAD

      - name: Install KernelSU Next
        working-directory: kernel
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

          if [ -d KernelSU-Next ]; then
            git -C KernelSU-Next describe --tags --always || true
          fi

      - name: Apply compatibility fixes
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo " APPLYING OLD KERNEL FIXES"
          echo "=========================================="

          # Missing headers in this old kernel
          grep -R -l 'linux/compiler_types.h' drivers/kernelsu 2>/dev/null \
            | xargs -r sed -i \
            's|<linux/compiler_types.h>|<linux/compiler.h>|g'

          grep -R -l 'linux/sched/signal.h' drivers/kernelsu 2>/dev/null \
            | xargs -r sed -i \
            's|<linux/sched/signal.h>|<linux/sched.h>|g'

          grep -R -l 'linux/sched/task.h' drivers/kernelsu 2>/dev/null \
            | xargs -r sed -i \
            's|<linux/sched/task.h>|<linux/sched.h>|g'

          grep -R -l 'linux/sched/user.h' drivers/kernelsu 2>/dev/null \
            | xargs -r sed -i \
            's|<linux/sched/user.h>|<linux/sched.h>|g'

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("drivers/kernelsu")

          # --------------------------------------------------------
          # full_name_hash
          # --------------------------------------------------------

          for p in root.rglob("*.c"):
              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              s = re.sub(
                  r'full_name_hash\s*\(\s*NULL\s*,\s*'
                  r'([^,]+?)\s*,\s*strlen\s*\(\s*\1\s*\)\s*\)',
                  r'full_name_hash((const unsigned char *)\1, strlen(\1))',
                  s
              )

              if s != old:
                  p.write_text(s)
                  print("PATCHED full_name_hash:", p)

          # --------------------------------------------------------
          # in_compat_syscall
          # --------------------------------------------------------

          for p in root.rglob("*"):

              if not p.is_file() or p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              if "in_compat_syscall()" not in s:
                  continue

              s = s.replace(
                  "in_compat_syscall()",
                  "is_compat_task()"
              )

              if "#include <linux/compat.h>" not in s:

                  lines = s.splitlines()
                  pos = 0

                  for i, line in enumerate(lines):
                      if line.startswith("#include"):
                          pos = i + 1

                  lines.insert(pos, "#include <linux/compat.h>")

                  s = "\n".join(lines) + "\n"

              p.write_text(s)

              print("PATCHED compat:", p)

          # --------------------------------------------------------
          # kvmalloc -> vmalloc
          # kvfree   -> vfree
          #
          # Add linux/vmalloc.h EXPLICITLY to every changed source.
          # --------------------------------------------------------

          for p in root.rglob("*"):

              if not p.is_file() or p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              original = s

              # KernelSU call form:
              # kvmalloc(size, GFP_KERNEL)
              s = re.sub(
                  r'\bkvmalloc\s*\(\s*([^,]+?)\s*,\s*'
                  r'GFP_[A-Z0-9_| ()]+\s*\)',
                  r'vmalloc(\1)',
                  s
              )

              s = re.sub(
                  r'\bkvfree\s*\(',
                  'vfree(',
                  s
              )

              if s != original:

                  if "#include <linux/vmalloc.h>" not in s:

                      lines = s.splitlines()

                      insert_at = 0

                      for i, line in enumerate(lines):
                          if line.startswith("#include"):
                              insert_at = i + 1

                      lines.insert(
                          insert_at,
                          "#include <linux/vmalloc.h>"
                      )

                      s = "\n".join(lines) + "\n"

                  p.write_text(s)

                  print("PATCHED VMALLOC:", p)

          # --------------------------------------------------------
          # IMPORTANT:
          # Force apk_sign.c fix explicitly.
          # --------------------------------------------------------

          apk = root / "manager" / "apk_sign.c"

          if not apk.exists():
              raise SystemExit("apk_sign.c NOT FOUND")

          s = apk.read_text()

          # Catch anything the generic conversion missed.
          s = re.sub(
              r'\bkvmalloc\s*\(\s*([^,]+?)\s*,\s*GFP_KERNEL\s*\)',
              r'vmalloc(\1)',
              s
          )

          s = s.replace("kvfree(", "vfree(")

          if "#include <linux/vmalloc.h>" not in s:

              lines = s.splitlines()

              insert_at = 0

              for i, line in enumerate(lines):
                  if line.startswith("#include"):
                      insert_at = i + 1

              lines.insert(
                  insert_at,
                  "#include <linux/vmalloc.h>"
              )

              s = "\n".join(lines) + "\n"

          apk.write_text(s)

          print("FORCED apk_sign.c vmalloc compatibility")

          # --------------------------------------------------------
          # ALIGN_DOWN
          # --------------------------------------------------------

          adb = root / "feature" / "adb_root.c"

          if adb.exists():

              s = adb.read_text()

              if (
                  "ALIGN_DOWN(" in s and
                  "#ifndef ALIGN_DOWN" not in s
              ):

                  lines = s.splitlines()

                  pos = 0

                  for i, line in enumerate(lines):
                      if line.startswith("#include"):
                          pos = i + 1

                  compat = [
                      "",
                      "#ifndef ALIGN_DOWN",
                      "#define ALIGN_DOWN(x, a) "
                      "((x) & ~((typeof(x))(a) - 1))",
                      "#endif",
                      ""
                  ]

                  for line in reversed(compat):
                      lines.insert(pos, line)

                  adb.write_text("\n".join(lines) + "\n")

                  print("PATCHED ALIGN_DOWN")

          # --------------------------------------------------------
          # sulog time compatibility
          # --------------------------------------------------------

          event = root / "sulog" / "event.c"

          if event.exists():

              s = event.read_text()

              old = (
                  "#if KERNEL_VERSION(4, 19, 0) "
                  "<= LINUX_VERSION_CODE"
              )

              new = (
                  "#if KERNEL_VERSION(4, 14, 0) "
                  "<= LINUX_VERSION_CODE"
              )

              if old in s:

                  event.write_text(
                      s.replace(old, new)
                  )

                  print("PATCHED event.c")

          print("ALL COMPATIBILITY FIXES APPLIED")
          PY

          echo
          echo "===== APK_SIGN CHECK ====="

          grep -n \
            -E 'vmalloc|vfree|kvmalloc|kvfree|vmalloc.h' \
            drivers/kernelsu/manager/apk_sign.c \
            || true

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          set -eux

          if ! grep -q '^CONFIG_KSU=y' \
            arch/arm64/configs/lineage_xcover4s_defconfig
          then
            echo 'CONFIG_KSU=y' \
              >> arch/arm64/configs/lineage_xcover4s_defconfig
          fi

      - name: Apply manual KernelSU hooks
        working-directory: kernel
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):

              p = Path(path)
              data = p.read_text()

              if new in data:
                  print("ALREADY PATCHED:", path)
                  return

              if old not in data:
                  raise SystemExit(
                      "PATCH TARGET NOT FOUND: " + path
                  )

              p.write_text(data.replace(old, new, 1))

              print("PATCHED:", path)


          patch(
              "fs/exec.c",
              """int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {""",
              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd,
          	struct filename **filename_ptr,
          	void *argv, void *envp, int *flags);
          #endif

          int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {"""
          )

          patch(
              "fs/exec.c",
              """	struct user_arg_ptr envp = { .ptr.native = __envp };
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);""",
              """	struct user_arg_ptr envp = { .ptr.native = __envp };
          #ifdef CONFIG_KSU
          	{
          		int ksu_fd = AT_FDCWD;
          		int ksu_flags = 0;
          		ksu_handle_execveat(&ksu_fd, &filename,
          			&argv, &envp, &ksu_flags);
          	}
          #endif
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"""
          )

          patch(
              "fs/open.c",
              """/*
           * access() needs to use the real uid/gid, not the effective uid/gid.""",
              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd,
          	const char __user **filename_user,
          	int *mode, int *flags);
          #endif

          /*
           * access() needs to use the real uid/gid, not the effective uid/gid."""
          )

          patch(
              "fs/open.c",
              """	unsigned int lookup_flags = LOOKUP_FOLLOW;

          	if (mode & ~S_IRWXO)""",
              """	unsigned int lookup_flags = LOOKUP_FOLLOW;

          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(
          		&dfd, &filename, &mode, NULL);
          #endif

          	if (mode & ~S_IRWXO)"""
          )

          patch(
              "fs/read_write.c",
              """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {""",
              """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
          	unsigned int fd,
          	char __user **buf_ptr,
          	size_t *count_ptr);
          #endif

          SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {"""
          )

          patch(
              "fs/read_write.c",
              """	ssize_t ret = -EBADF;

          	if (f.file) {""",
              """	ssize_t ret = -EBADF;

          #ifdef CONFIG_KSU
          	if (unlikely(ksu_vfs_read_hook))
          		ksu_handle_sys_read(
          			fd,
          			(char __user **)&buf,
          			&count);
          #endif

          	if (f.file) {"""
          )

          patch(
              "fs/stat.c",
              """#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat""",
              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
          	const char __user **filename_user,
          	int *flags);
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat"""
          )

          patch(
              "fs/stat.c",
              """	struct kstat stat;
          	int error;

          	error = vfs_fstatat(dfd, filename, &stat, flag);""",
              """	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif

          	error = vfs_fstatat(dfd, filename, &stat, flag);"""
          )

          patch(
              "kernel/reboot.c",
              """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {""",
              """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1,
          	int magic2, unsigned int cmd,
          	void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {"""
          )

          patch(
              "kernel/reboot.c",
              """	int ret = 0;

          	/* We only trust the superuser with rebooting the system. */""",
              """	int ret = 0;

          #ifdef CONFIG_KSU
          	ksu_handle_sys_reboot(
          		magic1, magic2, cmd, &arg);
          #endif

          	/* We only trust the superuser with rebooting the system. */"""
          )

          print("ALL KERNELSU HOOKS APPLIED")
          PY

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          export CCACHE_DIR="$HOME/.ccache"

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          grep '^CONFIG_KSU=y' out/.config

      - name: Prepare generated headers
        working-directory: kernel
        run: |
          set -eux

          export CCACHE_DIR="$HOME/.ccache"

          echo "=========================================="
          echo " PREPARING GENERATED HEADERS"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare scripts

          # Building this directory generates the SELinux headers
          # required by KernelSU on this kernel.
          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            security/selinux/ \
            > selinux.log \
            2>&1

          echo
          echo "===== FLASK.H ====="

          find out \
            -type f \
            -name flask.h \
            -print

          if ! find out \
            -type f \
            -name flask.h \
            -print -quit \
            | grep -q .
          then
              echo "ERROR: flask.h missing"
              tail -100 selinux.log || true
              exit 1
          fi

          echo "SELINUX HEADERS OK"

      - name: Fast KernelSU compile
        working-directory: kernel
        run: |
          set +e

          echo "=========================================="
          echo " FAST KERNELSU COMPILE TEST 3"
          echo "=========================================="

          export CCACHE_DIR="$HOME/.ccache"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            drivers/kernelsu/ \
            > ksu-build.log \
            2>&1

          RESULT=$?

          echo "$RESULT" > ksu-result.txt

          echo
          echo "=========================================="
          echo " KERNELSU RESULT: $RESULT"
          echo "=========================================="

          echo
          echo "===== REAL ERRORS ====="

          grep -iE \
            "fatal error:|error:|undefined reference|multiple definition|No rule to make target|implicit declaration|undeclared|too many arguments|incompatible pointer|unknown type name|no member named" \
            ksu-build.log \
            | grep -viE \
              'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
            | tail -400 \
            || true

          echo
          echo "===== LAST 100 CLEAN LINES ====="

          grep -viE \
            'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
            ksu-build.log \
            | tail -100 \
            || true

          if [ "$RESULT" -eq 0 ]; then

            echo
            echo "=========================================="
            echo " KERNELSU PASSED"
            echo " NEXT = FULL KERNEL BUILD"
            echo "=========================================="

          fi

          exit "$RESULT"

      - name: Create diagnostic report
        if: always()
        working-directory: kernel
        run: |
          set +e

          REPORT="$GITHUB_WORKSPACE/ksu-fast-report.txt"

          {
            echo "XCOVER4S KERNELSU FAST TEST 3"
            echo

            echo "RESULT:"
            cat ksu-result.txt 2>/dev/null \
              || echo "COMPILE DID NOT RUN"

            echo
            echo "CONFIG:"
            grep '^CONFIG_KSU' out/.config 2>/dev/null \
              || true

            echo
            echo "FLASK:"
            find out \
              -type f \
              -name flask.h \
              -print \
              2>/dev/null \
              || true

            echo
            echo "APK_SIGN VMALLOC:"
            grep -n \
              -E 'vmalloc|vfree|kvmalloc|kvfree|vmalloc.h' \
              drivers/kernelsu/manager/apk_sign.c \
              2>/dev/null \
              || true

            echo
            echo "ERRORS:"

            if [ -f ksu-build.log ]; then
              grep -iE \
                "fatal error:|error:|undefined reference|multiple definition|No rule to make target|implicit declaration|undeclared|too many arguments|incompatible pointer|unknown type name|no member named" \
                ksu-build.log \
                | grep -viE \
                  'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
                | tail -500 \
                || true
            fi

          } > "$REPORT"

          cat "$REPORT"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-ksu-fast-test-3
          path: |
            ksu-fast-report.txt
            kernel/ksu-build.log
            kernel/ksu-result.txt
            kernel/selinux.log
            kernel/out/.config
          if-no-files-found: warn
