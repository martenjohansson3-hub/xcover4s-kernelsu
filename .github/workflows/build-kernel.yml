name: XCover4s CP POWER OFF v10 - Flashable

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  KCFLAGS: -Wno-error

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git python3 make bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang lld llvm \
            cpio rsync unzip wget curl file

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Samsung kernel
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          echo "SOURCE COMMIT:"
          git -C kernel rev-parse HEAD

      # ==========================================================
      # PATCH ACTUAL SAMSUNG SOURCE
      # ==========================================================

      - name: Apply exact CP v10 patch
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/soc/samsung/pmu-cp.c")
          s = path.read_text()

          def find_function(text, name):
              """
              Find:
                  int name(...)
              and return the exact [start,end) range
              of the complete C function using brace matching.
              """
              pattern = re.compile(
                  r'\bint\s+' + re.escape(name) +
                  r'\s*\([^)]*\)\s*\{'
              )

              m = pattern.search(text)

              if not m:
                  raise SystemExit(
                      f"Could not find function: {name}"
                  )

              brace = text.find("{", m.start())

              depth = 0
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                  elif in_char:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False

                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "'":
                          in_char = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              return m.start(), i + 1

                  i += 1

              raise SystemExit(
                  f"Unclosed function: {name}"
              )

          # ------------------------------------------------------
          # RESET
          # ------------------------------------------------------

          start, end = find_function(
              s,
              "exynos_cp_reset"
          )

          reset = r'''int exynos_cp_reset(void)
          {
              /*
               * XCOVER4S_V10_CP_OFF
               *
               * Do not power the cellular CP on during reset.
               */
              pr_info(
                  "XCOVER4S_V10: CP reset blocked - forcing OFF\n"
              );

              return exynos_set_cp_power_onoff(
                  CP_POWER_OFF
              );
          }'''

          s = s[:start] + reset + s[end:]

          # ------------------------------------------------------
          # RELEASE
          # ------------------------------------------------------

          start, end = find_function(
              s,
              "exynos_cp_release"
          )

          release = r'''int exynos_cp_release(void)
          {
              /*
               * XCOVER4S_V10_CP_OFF
               *
               * Do not write CP_START or CP_POWER_ON.
               */
              pr_info(
                  "XCOVER4S_V10: CP release blocked - forcing OFF\n"
              );

              return exynos_set_cp_power_onoff(
                  CP_POWER_OFF
              );
          }'''

          s = s[:start] + release + s[end:]

          # ------------------------------------------------------
          # CENTRAL POWER FUNCTION
          #
          # Keep declarations first for old C/kernel compatibility.
          # ------------------------------------------------------

          marker = (
              "int exynos_set_cp_power_onoff"
              "(enum cp_mode mode)\n"
              "{"
          )

          if s.count(marker) != 1:
              raise SystemExit(
                  "Central CP power function not uniquely found"
              )

          old_decl = r'''int exynos_set_cp_power_onoff(enum cp_mode mode)
          {
              u32 cp_ctrl;
              u32 __maybe_unused cp_ctrl2;
              int ret = 0;
              int wait_count = 0;

          '''

          new_decl = r'''int exynos_set_cp_power_onoff(enum cp_mode mode)
          {
              u32 cp_ctrl;
              u32 __maybe_unused cp_ctrl2;
              int ret = 0;
              int wait_count = 0;

              /*
               * XCOVER4S_V10_CP_OFF
               *
               * Never allow CP_POWER_ON to reach the PMU write.
               */
              if (mode == CP_POWER_ON) {
                  pr_info(
                      "XCOVER4S_V10: CP POWER_ON blocked - forcing OFF\n"
                  );

                  mode = CP_POWER_OFF;
              }

          '''

          if old_decl not in s:
              raise SystemExit(
                  "Expected central function declaration block "
                  "was not found"
              )

          s = s.replace(
              old_decl,
              new_decl,
              1
          )

          path.write_text(s)

          print(
              "XCOVER4S V10 SOURCE PATCH APPLIED"
          )
          PY

      # ==========================================================
      # SELINUX
      # ==========================================================

      - name: Configure SELinux permissive
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):
              old = p.read_text()

              new = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  old
              )

              if new != old:
                  p.write_text(new)
                  changed.append(str(p))

          if not changed:
              raise SystemExit(
                  "SELinux permissive patch was not applied"
              )

          print("SELinux patched:")
          for x in changed:
              print(x)
          PY

      # ==========================================================
      # VERY STRICT SOURCE VERIFICATION
      # ==========================================================

      - name: Verify all CP start paths
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          s = Path(
              "drivers/soc/samsung/pmu-cp.c"
          ).read_text()

          def function_body(text, name):
              m = re.search(
                  r'\bint\s+' +
                  re.escape(name) +
                  r'\s*\([^)]*\)\s*\{',
                  text
              )

              if not m:
                  raise SystemExit(
                      "Function missing: " + name
                  )

              brace = text.find("{", m.start())
              depth = 0
              i = brace

              while i < len(text):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[m.start():i + 1]
                  i += 1

              raise SystemExit(
                  "Unclosed function: " + name
              )

          reset = function_body(
              s,
              "exynos_cp_reset"
          )

          release = function_body(
              s,
              "exynos_cp_release"
          )

          central = function_body(
              s,
              "exynos_set_cp_power_onoff"
          )

          # Reset must not directly power CP on.
          if "CP_PWRON" in reset:
              raise SystemExit(
                  "FAIL: CP_PWRON remains in exynos_cp_reset"
              )

          # Release must not directly start CP.
          if "CP_START" in release:
              raise SystemExit(
                  "FAIL: CP_START remains in exynos_cp_release"
              )

          if "CP_POWER_ON" in release:
              raise SystemExit(
                  "FAIL: CP_POWER_ON remains in exynos_cp_release"
              )

          # Both must force OFF.
          if "CP_POWER_OFF" not in reset:
              raise SystemExit(
                  "FAIL: reset does not force CP_POWER_OFF"
              )

          if "CP_POWER_OFF" not in release:
              raise SystemExit(
                  "FAIL: release does not force CP_POWER_OFF"
              )

          # Central redirect must exist.
          if "mode = CP_POWER_OFF;" not in central:
              raise SystemExit(
                  "FAIL: central POWER_ON redirect missing"
              )

          # The direct start expressions from the original
          # source must no longer exist.
          forbidden = [
              "CP_RESET_SET | CP_PWRON",
              "CP_START | CP_POWER_ON",
              "(CP_START | CP_POWER_ON)",
          ]

          for item in forbidden:
              if item in s:
                  raise SystemExit(
                      "FAIL: direct CP start expression remains: "
                      + item
                  )

          # Samsung's genuine OFF sequence must remain.
          required = [
              "exynos_sys_powerdown_conf_cp();",
              "cp_ctrl & ~CP_PWRON",
              "cp_ctrl & ~CP_START",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "FAIL: Samsung OFF sequence missing: "
                      + item
                  )

          if "XCOVER4S_V10_CP_OFF" not in s:
              raise SystemExit(
                  "FAIL: V10 marker missing"
              )

          print(
              "========================================"
          )
          print(
              "ALL CP START PATH CHECKS PASSED"
          )
          print(
              "========================================"
          )
          PY

      - name: Show final CP source
        working-directory: kernel
        run: |
          set -eux

          grep -n \
            -E \
            'exynos_cp_reset|exynos_cp_release|exynos_set_cp_power_onoff|XCOVER4S_V10|CP_PWRON|CP_START|CP_POWER_ON|CP_POWER_OFF' \
            drivers/soc/samsung/pmu-cp.c

      # ==========================================================
      # CONFIG
      # ==========================================================

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            lineage_xcover4s_defconfig

          python3 <<'PY'
          from pathlib import Path

          p = Path("out/.config")
          s = p.read_text()

          key = (
              "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE="
          )

          lines = [
              x for x in s.splitlines()
              if not x.startswith(key)
          ]

          lines.append(
              key + "0"
          )

          p.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          grep \
            '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0$' \
            out/.config

      # ==========================================================
      # TARGETED TEST
      # ==========================================================

      - name: Targeted PMU compile
        working-directory: kernel
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            drivers/soc/samsung/pmu-cp.o \
            2>&1 \
          | tee targeted-build.log

          echo
          echo "TARGETED PMU COMPILE PASSED"

      # ==========================================================
      # FULL BUILD
      # ==========================================================

      - name: Full kernel build
        working-directory: kernel
        shell: bash
        timeout-minutes: 25
        run: |
          set -o pipefail

          echo "========================================"
          echo "FULL KERNEL BUILD V10"
          echo "========================================"

          date -u

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 \
          | tee build.log \
          | awk '
              /aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)/ {
                  next
              }

              /aarch64-linux-gnu-objdump: Warning: Bogus end-of-siblings marker/ {
                  next
              }

              /aarch64-linux-gnu-objdump: Warning: Further warnings about bogus end-of-sibling markers suppressed/ {
                  next
              }

              /aarch64-linux-gnu-objdump: Warning: DIE at offset/ {
                  next
              }

              {
                  print
                  fflush()
              }
            '

          echo
          echo "========================================"
          echo "FULL KERNEL BUILD PASSED"
          echo "========================================"

          date -u

      # ==========================================================
      # VERIFY IMAGE
      # ==========================================================

      - name: Verify kernel Image
        working-directory: kernel
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          test -s "$IMAGE"

          file "$IMAGE"

          SIZE="$(stat -c%s "$IMAGE")"

          echo "Image size: $SIZE"

          if [ "$SIZE" -lt 20000000 ]; then
              echo "ERROR: Image unexpectedly small"
              exit 1
          fi

          sha256sum "$IMAGE"

      # ==========================================================
      # ORIGINAL BOOT
      # ==========================================================

      - name: Verify original boot
        run: |
          set -eux

          if [ ! -f boot-original.img ]; then
              echo "ERROR: boot-original.img missing"
              exit 1
          fi

          SHA="$(
            sha256sum boot-original.img |
            awk '{print $1}'
          )"

          EXPECTED="f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9"

          echo "Original SHA:"
          echo "$SHA"

          if [ "$SHA" != "$EXPECTED" ]; then
              echo "ERROR: original boot SHA mismatch"
              exit 1
          fi

          echo "ORIGINAL BOOT VERIFIED"

      # ==========================================================
      # MAGISKBOOT
      # ==========================================================

      - name: Get magiskboot
        run: |
          set -eux

          API="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"

          URL="$(
            curl -fsSL "$API" |
            python3 -c '
          import json
          import sys

          d = json.load(sys.stdin)

          for a in d["assets"]:
              if a["name"].endswith(".apk"):
                  print(a["browser_download_url"])
                  break
          '
          )"

          test -n "$URL"

          wget -q \
            "$URL" \
            -O Magisk.apk

          unzip -j -o \
            Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d .

          mv \
            libmagiskboot.so \
            magiskboot

          chmod +x magiskboot

          file magiskboot

      # ==========================================================
      # UNPACK ORIGINAL
      # ==========================================================

      - name: Unpack original boot
        run: |
          set -eux

          rm -rf boot-unpack

          mkdir boot-unpack

          cd boot-unpack

          ../magiskboot unpack \
            ../boot-original.img

          ls -lah

          test -f kernel

      # ==========================================================
      # REPLACE KERNEL ONLY
      # ==========================================================

      - name: Replace kernel
        run: |
          set -eux

          cp \
            kernel/out/arch/arm64/boot/Image \
            boot-unpack/kernel

          test -s boot-unpack/kernel

          echo "New kernel:"
          file boot-unpack/kernel

          sha256sum boot-unpack/kernel

      # ==========================================================
      # REPACK
      # ==========================================================

      - name: Create flashable boot image
        run: |
          set -eux

          ./magiskboot repack \
            boot-original.img \
            boot-CP-OFF-v10.img

          test -s boot-CP-OFF-v10.img

          echo
          echo "========================================"
          echo "FLASHABLE V10 CREATED"
          echo "========================================"

          ls -lh boot-CP-OFF-v10.img

          file boot-CP-OFF-v10.img

          sha256sum boot-CP-OFF-v10.img

      # ==========================================================
      # RE-UNPACK FLASH IMAGE
      # ==========================================================

      - name: Verify flashable image
        run: |
          set -eux

          rm -rf verify-boot

          mkdir verify-boot

          cd verify-boot

          ../magiskboot unpack \
            ../boot-CP-OFF-v10.img

          test -s kernel

          echo "Re-unpacked flash kernel:"
          file kernel

          sha256sum kernel

          echo
          echo "Flashable boot verification PASSED"

      # ==========================================================
      # PACKAGE
      # ==========================================================

      - name: Package artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            kernel/out/arch/arm64/boot/Image \
            artifacts/Image-CP-POWER-OFF-v10

          cp \
            boot-CP-OFF-v10.img \
            artifacts/boot-CP-OFF-v10.img

          cp \
            boot-original.img \
            artifacts/boot-original.img

          cp \
            kernel/out/.config \
            artifacts/kernel-config

          cp \
            kernel/build.log \
            artifacts/build.log

          cp \
            kernel/targeted-build.log \
            artifacts/targeted-build.log

          cp \
            kernel/drivers/soc/samsung/pmu-cp.c \
            artifacts/pmu-cp-v10.c

          git -C kernel diff \
            -- drivers/soc/samsung/pmu-cp.c \
               security/selinux \
            > artifacts/kernel.patch

          git -C kernel rev-parse HEAD \
            > artifacts/source-commit.txt

          sha256sum \
            artifacts/boot-CP-OFF-v10.img \
            artifacts/Image-CP-POWER-OFF-v10 \
            artifacts/boot-original.img \
            > artifacts/SHA256SUMS

          echo
          echo "========================================"
          echo "V10 ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      - name: Upload flashable v10
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-CP-POWER-OFF-v10-FLASHABLE
          path: artifacts/
          if-no-files-found: error

      # ==========================================================
      # FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p failure-diagnostics

          if [ -f kernel/build.log ]; then
              cp \
                kernel/build.log \
                failure-diagnostics/
          fi

          if [ -f kernel/targeted-build.log ]; then
              cp \
                kernel/targeted-build.log \
                failure-diagnostics/
          fi

          if [ -f kernel/drivers/soc/samsung/pmu-cp.c ]; then
              cp \
                kernel/drivers/soc/samsung/pmu-cp.c \
                failure-diagnostics/
          fi

          if [ -d kernel ]; then
              git -C kernel diff \
                > failure-diagnostics/kernel.patch \
                || true
          fi

          echo
          echo "========================================"
          echo "BUILD FAILURE"
          echo "========================================"

          if [ -f kernel/build.log ]; then
              grep -Ei \
                'fatal error:|error:|undefined reference|No rule to make target|make.*Error' \
                kernel/build.log \
                | tail -100 \
                || true
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-v10-FAILURE-DIAGNOSTICS
          path: failure-diagnostics/
          if-no-files-found: ignore
