
name: XCover4s V22 CP diagnostics

on:
  workflow_dispatch:

jobs:
  cp-diagnostics:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Fetch kernel source
        run: |
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

      - name: Inspect CP startup paths
        run: |
          mkdir -p diagnostics
          {
            echo "=== Kernel revision ==="
            git -C kernel log -1 --oneline
            echo
            echo "=== CP function references ==="
            grep -RnE \
              'exynos_cp_init|exynos_cp_release|exynos_cp_reset|exynos_set_cp_power_onoff' \
              kernel/drivers kernel/arch \
              || true
            echo
            echo "=== CP power control references ==="
            grep -RnE \
              'CP_POWER_ON|CP_PWRON|CP_START|CP_POWER_OFF|exynos_smc_write' \
              kernel/drivers/soc/samsung \
              kernel/drivers/misc \
              || true
            echo
            echo "=== Modem related source files ==="
            find kernel/drivers kernel/arch \
              -type f \
              \( -iname '*modem*' -o -iname '*link_device*' -o -iname '*pmu-cp*' \) \
              | sort
          } > diagnostics/cp-startup-report.txt

      - name: Save diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V22-CP-DIAGNOSTICS
          path: diagnostics/
