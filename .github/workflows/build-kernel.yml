name: Inspect KernelSU Legacy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kernel.yml"

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Download kernel source
        run: |
          git clone --depth=1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      - name: Integrate KernelSU Next legacy
        working-directory: kernel
        run: |
          set -eux
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      - name: Show exact compatibility code
        working-directory: kernel
        run: |
          echo "========== APK SIGN =========="
          grep -n -B20 -A40 \
            'kvmalloc\|kvfree\|eocd_buffer' \
            drivers/kernelsu/manager/apk_sign.c || true

          echo
          echo "========== THRONE TRACKER =========="
          grep -n -B10 -A15 \
            'full_name_hash' \
            drivers/kernelsu/manager/throne_tracker.c || true

          echo
          echo "========== KERNEL ALLOCATION API =========="
          grep -R -n \
            'kvmalloc\|kvfree' \
            include/linux mm 2>/dev/null | head -100 || true

          echo
          echo "========== FULL_NAME_HASH DECLARATION =========="
          grep -R -n \
            'full_name_hash' \
            include/linux/dcache.h fs 2>/dev/null | head -50 || true
