name: XCover4s KernelSU Fast Test 7

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Install only missing tools
        run: |
          set -eux

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            bc bison flex \
            gcc-aarch64-linux-gnu \
            libelf-dev

      - name: Clone kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      - name: Install KernelSU Next
        working-directory: kernel
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

      - name: Apply all known fixes
        working-directory: kernel
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("drivers/kernelsu")

          # ========================================================
          # OLD HEADER COMPATIBILITY
          # ========================================================

          replacements = {
              "linux/compiler_types.h":
                  "linux/compiler.h",

              "linux/sched/signal.h":
                  "linux/sched.h",

              "linux/sched/task.h":
                  "linux/sched.h",

              "linux/sched/user.h":
                  "linux/sched.h",
          }

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              for a, b in replacements.items():
                  s = s.replace(
                      f"<{a}>",
                      f"<{b}>"
                  )

              if s != old:
                  p.write_text(s)

          # ========================================================
          # FULL_NAME_HASH
          # ========================================================

          for p in root.rglob("*.c"):

              s = p.read_text()

              s2 = re.sub(
                  r'full_name_hash\s*\(\s*NULL\s*,\s*'
                  r'([^,]+?)\s*,\s*strlen\s*\(\s*\1\s*\)\s*\)',
                  r'full_name_hash((const unsigned char *)\1, strlen(\1))',
                  s
              )

              if s2 != s:
                  p.write_text(s2)

          # ========================================================
          # COMPAT SYSCALL
          # ========================================================

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              if "in_compat_syscall()" not in s:
                  continue

              s = s.replace(
                  "in_compat_syscall()",
                  "is_compat_task()"
              )

              if "#include <linux/compat.h>" not in s:
                  s = "#include <linux/compat.h>\n" + s

              p.write_text(s)

          # ========================================================
          # KVMALLOC / KVFREE
          # ========================================================

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              s = re.sub(
                  r'\bkvmalloc\s*\(\s*([^,]+?)\s*,\s*'
                  r'GFP_[A-Z0-9_| ()]+\s*\)',
                  r'vmalloc(\1)',
                  s
              )

              s = s.replace(
                  "kvfree(",
                  "vfree("
              )

              if s != old:

                  if "#include <linux/vmalloc.h>" not in s:
                      s = "#include <linux/vmalloc.h>\n" + s

                  p.write_text(s)

          # ========================================================
          # APK_SIGN - GUARANTEE VMALLOC HEADER FIRST
          # ========================================================

          apk = root / "manager" / "apk_sign.c"

          if apk.exists():

              s = apk.read_text()

              s = s.replace(
                  "#include <linux/vmalloc.h>\n",
                  ""
              )

              s = re.sub(
                  r'\bkvmalloc\s*\(\s*([^,]+?)\s*,\s*GFP_KERNEL\s*\)',
                  r'vmalloc(\1)',
                  s
              )

              s = s.replace(
                  "kvfree(",
                  "vfree("
              )

              s = "#include <linux/vmalloc.h>\n" + s

              apk.write_text(s)

          # ========================================================
          # ALIGN_DOWN
          # ========================================================

          adb = root / "feature" / "adb_root.c"

          if adb.exists():

              s = adb.read_text()

              if (
                  "ALIGN_DOWN(" in s
                  and "#ifndef ALIGN_DOWN" not in s
              ):

                  s = (
                      "#ifndef ALIGN_DOWN\n"
                      "#define ALIGN_DOWN(x, a) "
                      "((x) & ~((typeof(x))(a) - 1))\n"
                      "#endif\n\n"
                  ) + s

                  adb.write_text(s)

          # ========================================================
          # SULOG OLD KERNEL
          # ========================================================

          event = root / "sulog" / "event.c"

          if event.exists():

              s = event.read_text()

              s = s.replace(
                  "#if KERNEL_VERSION(4, 19, 0) <= LINUX_VERSION_CODE",
                  "#if KERNEL_VERSION(4, 14, 0) <= LINUX_VERSION_CODE"
              )

              event.write_text(s)

          # ========================================================
          # SELINUX_HIDE
          # ========================================================

          hide = root / "feature" / "selinux_hide.c"

          if not hide.exists():
              raise SystemExit(
                  "selinux_hide.c NOT FOUND"
              )

          s = hide.read_text()

          # Old ARM64 kernel has no asm/set_memory.h
          s = s.replace(
              "#include <asm/set_memory.h>\n",
              ""
          )

          s = s.replace(
              '#include "asm/set_memory.h"\n',
              ""
          )

          # Kernel 4.9 has no __nocfi annotation.
          if "__nocfi" in s:

              if "#ifndef __nocfi" not in s:

                  s = (
                      "#ifndef __nocfi\n"
                      "#define __nocfi\n"
                      "#endif\n\n"
                  ) + s

          hide.write_text(s)

          print("ALL COMPATIBILITY PATCHES APPLIED")
          PY

          echo
          echo "===== SELINUX_HIDE CHECK ====="

          grep -n -E \
            '__nocfi|set_memory|asm/set_memory' \
            drivers/kernelsu/feature/selinux_hide.c \
            || true

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          set -eux

          echo 'CONFIG_KSU=y' \
            >> arch/arm64/configs/lineage_xcover4s_defconfig

      - name: Apply required kernel hooks
        working-directory: kernel
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new):

              p = Path(path)
              s = p.read_text()

              if new in s:
                  return

              if old not in s:
                  raise SystemExit(
                      "HOOK TARGET NOT FOUND: " + path
                  )

              p.write_text(
                  s.replace(old, new, 1)
              )

          patch(
              "fs/exec.c",
              """int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {""",
              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd,
          	struct filename **filename_ptr,
          	void *argv, void *envp, int *flags);
          #endif

          int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {"""
          )

          patch(
              "fs/exec.c",
              """	struct user_arg_ptr envp = { .ptr.native = __envp };
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);""",
              """	struct user_arg_ptr envp = { .ptr.native = __envp };
          #ifdef CONFIG_KSU
          	{
          		int ksu_fd = AT_FDCWD;
          		int ksu_flags = 0;
          		ksu_handle_execveat(&ksu_fd, &filename,
          			&argv, &envp, &ksu_flags);
          	}
          #endif
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"""
          )

          patch(
              "fs/open.c",
              """/*
           * access() needs to use the real uid/gid, not the effective uid/gid.""",
              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd,
          	const char __user **filename_user,
          	int *mode, int *flags);
          #endif

          /*
           * access() needs to use the real uid/gid, not the effective uid/gid."""
          )

          patch(
              "fs/open.c",
              """	unsigned int lookup_flags = LOOKUP_FOLLOW;

          	if (mode & ~S_IRWXO)""",
              """	unsigned int lookup_flags = LOOKUP_FOLLOW;

          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(
          		&dfd, &filename, &mode, NULL);
          #endif

          	if (mode & ~S_IRWXO)"""
          )

          patch(
              "fs/read_write.c",
              """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {""",
              """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(
          	unsigned int fd,
          	char __user **buf_ptr,
          	size_t *count_ptr);
          #endif

          SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {"""
          )

          patch(
              "fs/read_write.c",
              """	ssize_t ret = -EBADF;

          	if (f.file) {""",
              """	ssize_t ret = -EBADF;

          #ifdef CONFIG_KSU
          	if (unlikely(ksu_vfs_read_hook))
          		ksu_handle_sys_read(
          			fd,
          			(char __user **)&buf,
          			&count);
          #endif

          	if (f.file) {"""
          )

          patch(
              "fs/stat.c",
              """#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat""",
              """#ifdef CONFIG_KSU
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
          	const char __user **filename_user,
          	int *flags);
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat"""
          )

          patch(
              "fs/stat.c",
              """	struct kstat stat;
          	int error;

          	error = vfs_fstatat(dfd, filename, &stat, flag);""",
              """	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif

          	error = vfs_fstatat(dfd, filename, &stat, flag);"""
          )

          patch(
              "kernel/reboot.c",
              """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {""",
              """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1,
          	int magic2, unsigned int cmd,
          	void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {"""
          )

          patch(
              "kernel/reboot.c",
              """	int ret = 0;

          	/* We only trust the superuser with rebooting the system. */""",
              """	int ret = 0;

          #ifdef CONFIG_KSU
          	ksu_handle_sys_reboot(
          		magic1, magic2, cmd, &arg);
          #endif

          	/* We only trust the superuser with rebooting the system. */"""
          )

          print("HOOKS OK")
          PY

      - name: Configure and prepare
        working-directory: kernel
        run: |
          set -eux

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare scripts

          # KernelSU needs generated SELinux headers.
          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            security/selinux/ \
            >/dev/null 2>&1

          test -n "$(
            find out \
              -name flask.h \
              -print \
              -quit
          )"

          echo "PREPARE OK"

      - name: Fast KernelSU compile
        working-directory: kernel
        run: |
          set +e

          echo "=========================================="
          echo " KERNELSU TEST 7"
          echo "=========================================="

          START=$(date +%s)

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            drivers/kernelsu/ \
            > ksu.log \
            2>&1

          RESULT=$?

          END=$(date +%s)

          echo "$RESULT" > result.txt

          echo
          echo "RESULT: $RESULT"
          echo "TIME: $((END-START)) seconds"
          echo "LINES: $(wc -l < ksu.log)"

          echo
          echo "========== REAL ERRORS =========="

          grep -n -iE \
            'fatal error:|error:|undefined reference|implicit declaration|undeclared|unknown type name|no member named|conflicting types|too many arguments|incompatible pointer|expected' \
            ksu.log \
            | grep -viE \
            'objdump:|Unrecognized form:|Bogus end-of-siblings|DIE at offset' \
            | tail -300 \
            || true

          echo
          echo "========== LAST OUTPUT =========="

          grep -viE \
            'objdump:|Unrecognized form:|Bogus end-of-siblings|DIE at offset' \
            ksu.log \
            | tail -100 \
            || true

          if [ "$RESULT" -eq 0 ]; then
            echo
            echo "=========================================="
            echo " KERNELSU PASSED"
            echo " RESULT 0"
            echo " NEXT = FULL KERNEL BUILD"
            echo "=========================================="
          fi

          exit "$RESULT"

      - name: Make diagnostic artifact
        if: always()
        working-directory: kernel
        run: |
          set +e

          {
            echo "XCOVER4S KERNELSU TEST 7"
            echo

            echo "RESULT:"
            cat result.txt 2>/dev/null || echo "NO RESULT"

            echo
            echo "TOTAL LOG LINES:"
            wc -l ksu.log 2>/dev/null || true

            echo
            echo "SELINUX_HIDE:"
            grep -n -E \
              '__nocfi|set_memory|asm/set_memory' \
              drivers/kernelsu/feature/selinux_hide.c \
              2>/dev/null || true

            echo
            echo "ERRORS:"
            grep -n -iE \
              'fatal error:|error:|undefined reference|implicit declaration|undeclared|unknown type name|no member named|conflicting types|too many arguments|incompatible pointer|expected' \
              ksu.log 2>/dev/null \
              | grep -viE \
              'objdump:|Unrecognized form:|Bogus end-of-siblings|DIE at offset' \
              | tail -400 || true

          } > "$GITHUB_WORKSPACE/test7-report.txt"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-test7
          path: |
            test7-report.txt
            kernel/ksu.log
            kernel/result.txt
          if-no-files-found: warn
