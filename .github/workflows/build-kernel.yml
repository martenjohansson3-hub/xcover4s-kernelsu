name: XCover4s V50 CP gate safety source audit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev clang lld python3 cpio

      - name: Get exact XCover4s kernel revision
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          cd kernel
          git checkout --detach 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          test "$(git rev-parse HEAD)" = 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Restore and verify exact V47-tested CP patch
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cat > diagnostics/v48-patch.gz.b64 <<'PATCH64'
          H4sIAAAAAAAC/9VWbW/bNhD+LP+Kq4cEsiVZfqubl2WN0blFgCQ1sqUrhgECQ1O2YJnUSMpJMfi/70gpfveQYsGA+YNt8o7PvT13
          ZBAEQMKRTOZMqlAJGioyUzkfh5SkQRKH2SzHfxHNGrTieR48vFT58hKClt8Br+W3TuHysuL9kHCa5iMGP6YJz5/CmRjlKcuIJLPG
          5Kc98lyzp70SJiUXVlLxwjp86fbOYEZ4TtL0G6RE0wkbwYdhIOIYSKyZhD4fSZGMQGkidZ41oB5WPFzohMLPg49Xt4Po5v7XwVd3
          3u2h/1Eq6LR2vlR5ECKFUoSgUWnj3DhQqiRcr2sopl0quNJAJ0RCfU5SH4oNpWVONUyZ5CyNbPxQn2Zr5rawxgbLojzkcczky4EO
          6kUiU+smzPIC/qp4gJ8GOo+rzWj8Ujbelo2tbIFGi4KWBuiDu1Ly4XjTmA+399fXPjR7zabxtwLLGldXLJpU9+xLwqzAMuyd/w68
          dge/kWFQAagD3DGdS66gCYKDyillSjXgs54w+Zgo5gNnY8zOnAHySEhM0og1zNGwEpjML+1HCU+0O0fe1HZKI2QyTjiq7dXGTIJj
          VCXT56WrnabfA6/b89tN66wjrZ/QRIUF6niHbZd1WQLalW0PS1T3eIu1VjkGd5extecarxByfhDDfEovg8FwcHdT7i+KH7mkwqFs
          1DZ8/QdLpZUiuoVpqwqE9XpR0BWoKUKuIADDQppBsbbFc5xnj9lTJhQOAC1g+Nvdh/61SRyTMaFYZlOJk7ZhTavVLmnjmFyh6Zot
          m5PJCInhVo8UHKmzkiRIpQnhI5w/YzQcSIYtERGlmMT+Yn/mjCP6H7zqGwTHGd7co+FoeIez5asPURTnnEYRhhugAcIT6lbRfwsD
          JUxMkrRqEuI4z0OtTIuR5JLBY6InIkeWGICpcQVJDeqb0mxmRxraXs8kOIuSfKdvbcjtt2XIUH/tXikyIlnKiGIvb5p9x7a6xxQk
          4bEwFTlSbs1kGQ4n2F48rRPTbK3uyQu7ba/3/8e22wzktfuPUMOFiCK6xC5c7oDd+c427JyemPdBt9v2Oz1bJOT22apURfUX5SXf
          B4WET7EJZKIZiBhaoDH+Mb5FIBOPTAYj8cgbSGVKOBcainBti9gybFz6//663uIHjgBsw9H5NmfWazZFLC1Q5lr8Jl6Ly4PrBDKz
          aIcKKwoWKuU5eHMBrdoe4lzdfulfLx34b2nbXDF2Pf5tmhaDz1134o3RPD7emfluDS4uoLkW6K67aAFrxUo0liq2hNxMECpifj5v
          Jee72uN1XmpLDpUGFOWZRMzYfT4/7H8aRL9c/T7woXqU29G3J/D32AxnYF9Si8rfF1In4dQLAAA=
          PATCH64
          base64 -d diagnostics/v48-patch.gz.b64 | gzip -dc > diagnostics/v48.patch
          printf '%s  %s\n' '90ef72d276f04d356eb60e53c88e8986965a19af156057581815821d7ae59344' diagnostics/v48.patch | sha256sum -c -
          cd kernel
          git apply --check ../diagnostics/v48.patch
          git apply ../diagnostics/v48.patch
          git diff --check
          echo 'Patch check PASSED'

      - name: V50 targeted safety fixes and modem gate
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          cp = Path('kernel/drivers/soc/samsung/cal-if/pmucal_cp.c')
          src = cp.read_text()
          old = 'panic("cp reset release fail");'
          assert src.count(old) == 1, 'Unexpected reset-release panic layout'
          src = src.replace(old, '/* V50: return error rather than reboot on failed release. */')
          anchor = 'static bool v46_cp_off_latched;'
          assert src.count(anchor) == 1
          src = src.replace(anchor, anchor + '\n\nbool pmucal_cp_is_off_latched(void)\n{\n    return READ_ONCE(v46_cp_off_latched);\n}\n')
          cp.write_text(src)
          hdr = Path('kernel/drivers/soc/samsung/cal-if/pmucal_cp.h')
          h = hdr.read_text()
          anchor = 'extern int pmucal_cp_reset_release(void);'
          assert h.count(anchor) == 1
          hdr.write_text(h.replace(anchor, anchor + '\nextern bool pmucal_cp_is_off_latched(void);'))
          modem = Path('kernel/drivers/misc/modem_v1/modem_ctrl_ss310ap.c')
          m = modem.read_text()
          for sig in ('static int ss310ap_on(struct modem_ctl *mc)', 'static int ss310ap_dump_start(struct modem_ctl *mc)'):
              anchor = sig + '\n{'
              assert m.count(anchor) == 1, 'Missing or changed function: ' + sig
              # Check latch before entering modem controller; no changes to boot-time behavior.
              gate = ('\n#ifdef CONFIG_CP_PMUCAL\n'
                      '    if (pmucal_cp_is_off_latched()) {\n'
                      '        mif_err("V50: CP off latched; rejecting modem restart\\n");\n'
                      '        mc->phone_state = STATE_OFFLINE;\n'
                      '        return -EPERM;\n'
                      '    }\n'
                      '#endif\n')
              m = m.replace(anchor, anchor + gate)
          # A local declaration avoids depending on cross-directory private headers.
          marker = 'static int ss310ap_on(struct modem_ctl *mc)'
          assert m.count(marker) == 1
          m = m.replace(marker, '#ifdef CONFIG_CP_PMUCAL\nextern bool pmucal_cp_is_off_latched(void);\n#endif\n\n' + marker)
          modem.write_text(m)
          print('V50: panic fix, read-only latch getter, and 2 modem gates inserted')
          PYCODE
          cd kernel
          git diff --check
          git diff > ../diagnostics/v50-full.patch
          grep -q 'pmucal_cp_is_off_latched' ../diagnostics/v50-full.patch

      - name: Configure original XCover4s kernel
        run: |
          set -euo pipefail
          cd kernel
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig 2>&1 | tee ../diagnostics/config.log
          cp out/.config ../diagnostics/kernel.config

      - name: Targeted CP compile FIRST
        run: |
          set -euo pipefail
          cd kernel
          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            drivers/soc/samsung/cal-if/pmucal_cp.o \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.o \
            2>&1 | tee ../diagnostics/cp-compile.log | sed -E "/aarch64-linux-gnu-objdump: Warning: (Unrecognized form: 0x(22|23)|Bogus end-of-siblings marker|Further warnings about bogus end-of-sibling markers suppressed)/d"
          test -s out/drivers/soc/samsung/cal-if/pmucal_cp.o
          cp out/drivers/soc/samsung/cal-if/pmucal_cp.o ../diagnostics/pmucal_cp.o
          cp out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o ../diagnostics/modem_ctrl_ss310ap.o

      - name: Full kernel build ONLY after CP passes
        run: |
          set -euo pipefail
          cd kernel
          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error Image \
            2>&1 | tee ../diagnostics/full-build.log | sed -E "/aarch64-linux-gnu-objdump: Warning: (Unrecognized form: 0x(22|23)|Bogus end-of-siblings marker|Further warnings about bogus end-of-sibling markers suppressed)/d"
          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image ../diagnostics/Image
          sha256sum ../diagnostics/Image > ../diagnostics/Image.sha256
          file ../diagnostics/Image

      - name: Add accurate flash-status notes
        if: always()
        run: |
          mkdir -p diagnostics
          cat > diagnostics/READ-ME.txt <<'NOTE'
          V50: builds V48 CP latch plus no-release-panic and SS310AP start/dump gates.
          This is NOT a flashable boot.img or Odin .tar.
          Rootbroker auto-start is NOT included: first boot test must be manual.
          Automatic lockscreen trigger needs real device integration/testing.
          V49 review boot image is NOT safe to flash (AVB/header invalid).
          RF silence and boot safety are NOT proven by compilation.
          Do not flash Image directly. Keep the known-good boot backup.
          If full-build.log is absent, an earlier stage failed.
          NOTE

      - name: Upload results even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V50-REVIEW-DIAGNOSTICS
          if-no-files-found: warn
          path: diagnostics/
