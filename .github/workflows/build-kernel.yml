name: Inspect XCover4s Kernel Hooks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kernel.yml"

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Download exact XCover4s kernel source
        run: |
          git clone --depth=1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      - name: Show exact KernelSU hook locations
        working-directory: kernel
        run: |
          echo "========== KERNEL VERSION =========="
          grep -E 'VERSION =|PATCHLEVEL =|SUBLEVEL =' Makefile | head -3

          echo
          echo "========== EXEC.C =========="
          grep -n -A45 -B15 \
            "int do_execve(" fs/exec.c || true

          echo
          echo "========== EXECVE COMMON =========="
          grep -n -A20 -B10 \
            "do_execveat_common" fs/exec.c | tail -100 || true

          echo
          echo "========== OPEN.C / FACCESSAT =========="
          grep -n -A45 -B15 \
            "SYSCALL_DEFINE3(faccessat" fs/open.c || true

          echo
          echo "========== READ_WRITE.C / READ =========="
          grep -n -A35 -B15 \
            "SYSCALL_DEFINE3(read" fs/read_write.c || true

          echo
          echo "========== STAT.C / NEWFSTATAT =========="
          grep -n -A45 -B15 \
            "SYSCALL_DEFINE4(newfstatat" fs/stat.c || true

          echo
          echo "========== REBOOT.C =========="
          grep -n -A45 -B15 \
            "SYSCALL_DEFINE4(reboot" kernel/reboot.c || true
