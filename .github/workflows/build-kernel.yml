name: XCover4s - CP HARD OFF + SELinux Permissive v3

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: kernel
  KERNEL_REPO: https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
  KERNEL_BRANCH: lineage-18.1
  KERNEL_DEFCONFIG: lineage_xcover4s_defconfig

  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            make \
            cpio \
            rsync \
            python3 \
            git

      - name: Clone kernel
        run: |
          set -eux

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo "========================================"
          echo "SOURCE COMMIT"
          echo "========================================"

          git -C "$KERNEL_DIR" rev-parse HEAD

      # ============================================================
      # SELINUX -> PERMISSIVE
      # ============================================================

      - name: Patch SELinux permissive
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):
              text = p.read_text(errors="ignore")
              old = text

              text = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  text
              )

              if text != old:
                  p.write_text(text)
                  changed.append(str(p))

          print("SELinux files changed:")
          for p in changed:
              print("  " + p)

          if not changed:
              raise SystemExit(
                  "ERROR: Could not locate SELinux enforcing defaults"
              )
          PY

      # ============================================================
      # CENTRAL CELLULAR CP POWER LOCKOUT
      #
      # Leave SS310AP modem driver untouched.
      # Block CP_POWER_ON centrally.
      # CP_POWER_OFF continues to work normally.
      # ============================================================

      - name: Patch cellular CP HARD OFF
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          FILE="drivers/soc/samsung/pmu-cp.c"

          test -f "$FILE"

          cp "$FILE" pmu-cp.original.c

          python3 <<'PY'
          from pathlib import Path

          p = Path("drivers/soc/samsung/pmu-cp.c")

          text = p.read_text()

          needle = "int exynos_set_cp_power_onoff(enum cp_mode mode)\n{"

          if text.count(needle) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "exynos_set_cp_power_onoff() definition"
              )

          lines = [
              "int exynos_set_cp_power_onoff(enum cp_mode mode)",
              "{",
              "\t/*",
              "\t * XCOVER4S CELLULAR CP HARD LOCKOUT",
              "\t *",
              "\t * Never permit the cellular communication processor",
              "\t * to transition into CP_POWER_ON.",
              "\t *",
              "\t * CP_POWER_OFF operations remain untouched.",
              "\t */",
              "\tif (mode == CP_POWER_ON) {",
              "\t\tpr_info(\"XCOVER4S: blocked cellular CP_POWER_ON\\\\n\");",
              "\t\treturn 0;",
              "\t}",
          ]

          replacement = "\n".join(lines)

          text = text.replace(
              needle,
              replacement,
              1
          )

          p.write_text(text)

          print("CP HARD OFF patch installed.")
          PY

          echo
          echo "========================================"
          echo "PATCHED FUNCTION"
          echo "========================================"

          grep -n -A30 -B5 \
            "int exynos_set_cp_power_onoff" \
            "$FILE"

          echo
          echo "========================================"
          echo "DIFF"
          echo "========================================"

          git diff -- "$FILE"

      # ============================================================
      # VERIFY GENERATED C SOURCE BEFORE BUILD
      # ============================================================

      - name: Verify CP patch syntax
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          FILE="drivers/soc/samsung/pmu-cp.c"

          echo "========================================"
          echo "VERIFY EXACT PATCH"
          echo "========================================"

          grep -nF \
            'pr_info("XCOVER4S: blocked cellular CP_POWER_ON\n");' \
            "$FILE"

          COUNT="$(
            grep -cF \
              'pr_info("XCOVER4S: blocked cellular CP_POWER_ON\n");' \
              "$FILE"
          )"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: expected exactly one CP lockout message"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          p = Path("drivers/soc/samsung/pmu-cp.c")
          text = p.read_text()

          good = (
              'pr_info("XCOVER4S: blocked '
              'cellular CP_POWER_ON\\n");'
          )

          if good not in text:
              raise SystemExit(
                  "ERROR: correct pr_info C string not present"
              )

          bad = (
              'pr_info("XCOVER4S: blocked '
              'cellular CP_POWER_ON\n");'
          )

          if bad in text:
              raise SystemExit(
                  "ERROR: literal newline detected inside C string"
              )

          print("C string syntax verification PASSED")
          PY

      # ============================================================
      # CONFIG
      # ============================================================

      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          rm -rf out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            "$KERNEL_DEFCONFIG"

          CONFIG="out/.config"

          test -f "$CONFIG"

          if grep -q \
            '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' \
            "$CONFIG"
          then
            sed -i \
              's/^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=.*/CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0/' \
              "$CONFIG"
          else
            echo \
              'CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0' \
              >> "$CONFIG"
          fi

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo "========================================"
          echo "SELINUX CONFIG"
          echo "========================================"

          grep -E \
            "^CONFIG_SECURITY_SELINUX=|^CONFIG_SECURITY_SELINUX_BOOTPARAM=|^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=|^CONFIG_SECURITY_SELINUX_DEVELOP=" \
            "$CONFIG" || true

          VALUE="$(
            grep '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' \
              "$CONFIG" \
              | cut -d= -f2
          )"

          if [ "$VALUE" != "0" ]; then
            echo "ERROR: SELinux bootparam value != 0"
            exit 1
          fi

      # ============================================================
      # FINAL SOURCE VERIFICATION
      # ============================================================

      - name: Verify final source
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          FILE="drivers/soc/samsung/pmu-cp.c"

          echo "========================================"
          echo "VERIFY CP HARD OFF"
          echo "========================================"

          grep -n -A8 -B8 \
            'XCOVER4S: blocked cellular CP_POWER_ON' \
            "$FILE"

          echo
          echo "========================================"
          echo "VERIFY SS310AP DRIVER UNTOUCHED"
          echo "========================================"

          if ! git diff --quiet -- \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.c
          then
            echo "ERROR: SS310AP modem driver was modified"
            git diff -- \
              drivers/misc/modem_v1/modem_ctrl_ss310ap.c
            exit 1
          fi

          echo "OK: SS310AP driver untouched"

          echo
          echo "========================================"
          echo "SELINUX SOURCE"
          echo "========================================"

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            || true

          echo
          echo "FINAL SOURCE CHECK PASSED"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        env:
          KCFLAGS: -Wno-error
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING XCOVER4S"
          echo "SELINUX PERMISSIVE"
          echo "CELLULAR CP HARD OFF"
          echo "========================================"

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 \
          | awk '
              /aarch64-linux-gnu-objdump: Warning:/ { next }
              /Unrecognized form: 0x[0-9a-fA-F]+/ { next }
              /Corrupt attribute/ { next }
              /Bogus end-of-siblings marker/ { next }
              /Further warnings about bogus end-of-sibling markers suppressed/ { next }

              /^[[:space:]]+CC[[:space:]]+/ { next }
              /^[[:space:]]+LD[[:space:]]+/ { next }
              /^[[:space:]]+AS[[:space:]]+/ { next }
              /^[[:space:]]+AR[[:space:]]+/ { next }
              /^[[:space:]]+HOSTCC[[:space:]]+/ { next }
              /^[[:space:]]+HOSTLD[[:space:]]+/ { next }

              {
                  print
                  fflush()
              }
            ' \
          | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "MAKE EXIT CODE: $STATUS"
          echo "========================================"

          exit "$STATUS"

      # ============================================================
      # STRICT RESULT VERIFICATION
      # ============================================================

      - name: Verify successful kernel
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image does not exist"
            exit 1
          fi

          SIZE="$(stat -c%s "$IMAGE")"

          echo "Kernel size: $SIZE bytes"

          if [ "$SIZE" -lt 20000000 ]; then
            echo "ERROR: Kernel Image unexpectedly small"
            exit 1
          fi

          echo
          echo "========================================"
          echo "KERNEL BUILD PASSED"
          echo "========================================"

          ls -lh "$IMAGE"

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo
          echo "SELINUX:"
          grep \
            "^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=" \
            out/.config

          echo
          echo "CP HARD OFF:"
          grep -nF \
            'pr_info("XCOVER4S: blocked cellular CP_POWER_ON\n");' \
            drivers/soc/samsung/pmu-cp.c

      # ============================================================
      # SHOW IMPORTANT MESSAGES
      # ============================================================

      - name: Show important messages
        if: always()
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          echo "========================================"
          echo "IMPORTANT BUILD MESSAGES"
          echo "========================================"

          if [ -f build.log ]; then
            grep -iE \
              "error:|fatal error:|undefined reference|warning:|FAILED|Error [0-9]+|section mismatch" \
              build.log \
              | tail -300 || true
          fi

      # ============================================================
      # PACKAGE ONLY AFTER SUCCESS
      # ============================================================

      - name: Package successful kernel
        shell: bash
        run: |
          set -eux

          IMAGE="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          mkdir -p artifacts

          cp \
            "$IMAGE" \
            artifacts/Image-CP-HARD-OFF-SELINUX-PERMISSIVE-v3

          cp \
            "${KERNEL_DIR}/out/.config" \
            artifacts/kernel-config

          cp \
            "${KERNEL_DIR}/build.log" \
            artifacts/build.log

          cp \
            "${KERNEL_DIR}/pmu-cp.original.c" \
            artifacts/

          cp \
            "${KERNEL_DIR}/drivers/soc/samsung/pmu-cp.c" \
            artifacts/pmu-cp.PATCHED.c

          cd "${KERNEL_DIR}"

          git diff \
            -- security/selinux \
               drivers/soc/samsung/pmu-cp.c \
            > ../artifacts/final-kernel.patch

          cd ..

          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      - name: Upload successful kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-CP-HARD-OFF-SELINUX-PERMISSIVE-v3
          path: artifacts/
          if-no-files-found: error
