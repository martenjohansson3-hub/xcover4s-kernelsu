
name: XCOVER4S V43 DISPLAY FIX DIAGNOSTICS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: mkdir -p dist

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            git make gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            libncurses-dev python3 cpio rsync

      - name: Clone kernel
        run: |
          set -euo pipefail
          git clone --branch lineage-18.1 \
            --single-branch \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          git -C kernel checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Capture display clock code
        run: |
          set -euo pipefail

          FILE=kernel/drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

          sed -n '2390,2520p' "$FILE" \
            > dist/display-clock-source.txt

          grep -RnE \
            'struct decon_clocks|decon_clocks_table|CLK_ID_VCLK' \
            kernel/drivers/video/fbdev/exynos/dpu_7885 \
            > dist/display-clock-references.txt || true

          cp "$FILE" dist/decon_reg-original.c

          echo "Display clock source captured."

      - name: Configure kernel
        run: |
          set -euo pipefail

          make -C kernel O=out \
            lineage_xcover4s_defconfig \
            2>&1 | tee dist/configure.log

      - name: Prepare kernel headers
        run: |
          set -euo pipefail

          make -C kernel O=out -j2 prepare \
            2>&1 | tee dist/prepare.log

          make -C kernel O=out -j2 scripts \
            2>&1 | tee dist/scripts.log

      - name: Compile only failing display object
        shell: bash
        run: |
          set -uo pipefail

          echo "Testing decon_reg.o only"

          make -C kernel O=out -j1 \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            2>&1 | tee dist/display-test.log

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -eq 0 ]; then
            echo PASS | tee dist/result.txt
          else
            echo FAIL | tee dist/result.txt
          fi

          exit "$STATUS"

      - name: Collect error details
        if: always()
        run: |
          mkdir -p dist

          if [ -f dist/display-test.log ]; then
            grep -nEi \
              'error:|fatal error:|Error [0-9]+' \
              dist/display-test.log \
              > dist/errors.txt || true

            tail -100 dist/display-test.log \
              > dist/build-tail.txt
          fi

          if [ ! -f dist/result.txt ]; then
            echo INCOMPLETE > dist/result.txt
          fi

          echo "Diagnostic only. Do not flash." \
            > dist/flash-status.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V43-DISPLAY-DIAGNOSTICS
          path: dist/
          retention-days: 30
          if-no-files-found: error
