name: XCOVER4S V34 CP POWER INVESTIGATION

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Install analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y git python3

      - name: Fetch exact V33.1 kernel source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          mkdir -p diagnostics
          git -C kernel rev-parse HEAD > diagnostics/source-commit.txt

      - name: Trace CP power supply and shutdown paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('kernel')
          patterns = {
            'cp_api': re.compile(r'\b(?:cal_cp_|pmucal_cp_|exynos_cp_|cp_power_|cp_on|cp_off|cp_reset|modem_power)\w*\b', re.I),
            'pmu_sequences': re.compile(r'\b(?:CP_PWR|CP_POWER|CP_CTRL|CP_STATUS|CP_RESET|CP_START|CP_ACTIVE|CP2AP|AP2CP|PMU_CP|PMUCAL_CP)\w*\b', re.I),
            'regulators': re.compile(r'\b(?:regulator_(?:get|enable|disable|is_enabled)|vdd_cp|vdd_modem|vdd_mif|vdd_mdm|ldo_cp)\w*\b', re.I),
          }
          exts = {'.c', '.h', '.dts', '.dtsi'}
          results = {key: [] for key in patterns}
          for path in root.rglob('*'):
            if not path.is_file() or path.suffix not in exts:
              continue
            if any(part in {'.git', 'out'} for part in path.parts):
              continue
            try:
              lines = path.read_text(errors='replace').splitlines()
            except OSError:
              continue
            for i, line in enumerate(lines, 1):
              for key, regex in patterns.items():
                if regex.search(line):
                  results[key].append(f'{path.relative_to(root)}:{i}: {line[:350]}')
          for key, matches in results.items():
            Path(f'diagnostics/{key}.txt').write_text('\n'.join(matches) + '\n')
            print(key, len(matches), 'matches')
          targets = [
            'drivers/soc/samsung/cal-if/cal-if.c',
            'drivers/soc/samsung/cal-if/pmucal',
          ]
          for target in targets:
            path = root / target
            if path.is_file():
              Path('diagnostics/' + path.name + '.source.txt').write_text(path.read_text(errors='replace'))
          report = '''V34 DIAGNOSTIC ONLY.\nV33.1 was the last successful kernel baseline.\nThis workflow does NOT patch CP power, build a kernel, or make an Odin TAR.\nReset asserted is NOT equivalent to CP power removed.\nReview pmucal sequences, modem control, and regulator/device tree evidence before attempting a power-off patch.\nEven a software power-off call is not proof of zero voltage: hardware measurement is required.\n'''
          Path('diagnostics/README.txt').write_text(report)
          PY

      - name: Upload complete CP investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V34-CP-POWER-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
