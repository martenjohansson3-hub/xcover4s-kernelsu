
name: XCover4s CP Power OFF v6

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  KCFLAGS: -Wno-error

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 make bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang lld llvm cpio rsync

      - name: Clone kernel
        run: |
          set -eux
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel rev-parse HEAD

      - name: Patch CP power control and SELinux
        working-directory: kernel
        run: |
          set -eux
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("drivers/soc/samsung/pmu-cp.c")
          s = p.read_text()

          needle = "int exynos_set_cp_power_onoff(enum cp_mode mode)\n{"
          if s.count(needle) != 1:
              raise SystemExit("CP function mismatch")

          patch = (
              "int exynos_set_cp_power_onoff(enum cp_mode mode)\n"
              "{\n"
              "\t/* XCOVER4S_V6_CP_OFF */\n"
              "\tif (mode == CP_POWER_ON) {\n"
              "\t\tpr_info(\"XCOVER4S_V6: redirect CP ON to OFF\\n\");\n"
              "\t\tmode = CP_POWER_OFF;\n"
              "\t}\n"
          )
          p.write_text(s.replace(needle, patch, 1))

          changed = []
          for f in Path("security/selinux").rglob("*.c"):
              old = f.read_text()
              new = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  old
              )
              if old != new:
                  f.write_text(new)
                  changed.append(str(f))

          if not changed:
              raise SystemExit("SELinux patch not applied")
          print("SELinux files:", changed)
          PY

      - name: Verify CP patch
        working-directory: kernel
        run: |
          set -eux
          python3 <<'PY'
          from pathlib import Path

          s = Path("drivers/soc/samsung/pmu-cp.c").read_text()

          for item in [
              "XCOVER4S_V6_CP_OFF",
              "mode = CP_POWER_OFF;",
              "exynos_sys_powerdown_conf_cp();",
              "cp_ctrl & ~CP_PWRON"
          ]:
              if item not in s:
                  raise SystemExit("Missing: " + item)

          print("CP source verification passed")
          PY

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux
          make O="$PWD/out" ARCH=arm64 lineage_xcover4s_defconfig

          python3 <<'PY'
          from pathlib import Path
          p = Path("out/.config")
          s = p.read_text()
          key = "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE="
          lines = [x for x in s.splitlines() if not x.startswith(key)]
          lines.append(key + "0")
          p.write_text("\n".join(lines) + "\n")
          PY

          make O="$PWD/out" ARCH=arm64 olddefconfig
          grep '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0$' out/.config

      - name: Targeted CP compile test
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            drivers/soc/samsung/pmu-cp.o \
            > targeted-build.log 2>&1

          cat targeted-build.log | grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            || true

          echo "TARGETED CP COMPILE PASSED"

      - name: Full kernel build
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            > build.log 2>&1

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            build.log || true

          echo "FULL KERNEL BUILD PASSED"

      - name: Package successful kernel
        working-directory: kernel
        run: |
          set -eux
          mkdir -p ../artifacts

          cp out/arch/arm64/boot/Image \
            ../artifacts/Image-CP-POWER-OFF-v6

          cp out/.config ../artifacts/kernel-config
          cp build.log ../artifacts/build.log
          cp targeted-build.log ../artifacts/targeted-build.log
          cp drivers/soc/samsung/pmu-cp.c \
            ../artifacts/pmu-cp-patched.c

          git diff > ../artifacts/kernel.patch
          git rev-parse HEAD > ../artifacts/source-commit.txt

          sha256sum ../artifacts/Image-CP-POWER-OFF-v6 \
            > ../artifacts/SHA256SUMS

      - name: Upload successful build
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-CP-POWER-OFF-v6
          path: artifacts/
          if-no-files-found: error

      - name: Show errors if build failed
        if: failure()
        working-directory: kernel
        run: |
          echo "=== LAST RELEVANT BUILD ERRORS ==="
          for f in targeted-build.log build.log; do
            if [ -f "$f" ]; then
              grep -Ei \
                'fatal error:|error:|undefined reference|No rule to make target|make.*Error' \
                "$f" | tail -60 || true
              tail -30 "$f" || true
            fi
          done
