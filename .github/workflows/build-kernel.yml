
      - name: Fix display driver floating point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("kernel/drivers/video/fbdev/exynos/dpu_7885/decon_reg.c")
          s = p.read_text()

          # Locate the display clock table declaration.
          pattern = re.compile(
              r'(?m)^([ \t]*(?:(?:static|const)\s+)*)'
              r'(float|double)'
              r'([ \t]+decon_clocks_table\s*\[[^;]*?=\s*\{)',
              re.S
          )
          matches = list(pattern.finditer(s))

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one floating-point clock table; found {len(matches)}"
              )

          m = matches[0]
          end = s.find("};", m.end())

          if end < 0:
              raise SystemExit("Clock table terminator not found")

          table = s[m.end():end]

          if re.search(r'\d+\.\d+', table):
              raise SystemExit(
                  "Clock table contains fractional values; manual review required"
              )

          s = (
              s[:m.start(2)]
              + "unsigned long"
              + s[m.end(2):]
          )

          p.write_text(s)

          print("PASS: display clock table uses integer type")
          PY

          git -C kernel diff --check
