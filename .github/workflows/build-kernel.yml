name: XCover4s KernelSU Ultra Fast Test 6

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      # ============================================================
      # 1. INSTALL
      # ============================================================

      - name: Install build tools
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            curl \
            python3 \
            clang \
            lld \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            ccache

      # ============================================================
      # 2. KERNEL
      # ============================================================

      - name: Clone kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      # ============================================================
      # 3. KERNELSU
      # ============================================================

      - name: Install KernelSU Next
        working-directory: kernel
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

          echo "===== KSU VERSION ====="

          git -C KernelSU-Next \
            describe --tags --always \
            || true

      # ============================================================
      # 4. APPLY ALL KNOWN COMPAT FIXES
      # ============================================================

      - name: Apply compatibility fixes
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo " APPLYING KNOWN FIXES"
          echo "=========================================="

          grep -R -l \
            'linux/compiler_types.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
            's|<linux/compiler_types.h>|<linux/compiler.h>|g'

          grep -R -l \
            'linux/sched/signal.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
            's|<linux/sched/signal.h>|<linux/sched.h>|g'

          grep -R -l \
            'linux/sched/task.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
            's|<linux/sched/task.h>|<linux/sched.h>|g'

          grep -R -l \
            'linux/sched/user.h' \
            drivers/kernelsu \
            2>/dev/null \
            | xargs -r sed -i \
            's|<linux/sched/user.h>|<linux/sched.h>|g'

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("drivers/kernelsu")

          # --------------------------------------------------------
          # full_name_hash
          # --------------------------------------------------------

          for p in root.rglob("*.c"):

              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              s = re.sub(
                  r'full_name_hash\s*\(\s*NULL\s*,\s*'
                  r'([^,]+?)\s*,\s*strlen\s*\(\s*\1\s*\)\s*\)',
                  r'full_name_hash((const unsigned char *)\1, strlen(\1))',
                  s
              )

              if s != old:
                  p.write_text(s)
                  print("PATCHED HASH:", p)

          # --------------------------------------------------------
          # compat syscall
          # --------------------------------------------------------

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              if "in_compat_syscall()" not in s:
                  continue

              s = s.replace(
                  "in_compat_syscall()",
                  "is_compat_task()"
              )

              if "#include <linux/compat.h>" not in s:
                  s = "#include <linux/compat.h>\n" + s

              p.write_text(s)

              print("PATCHED COMPAT:", p)

          # --------------------------------------------------------
          # kvmalloc / kvfree
          # --------------------------------------------------------

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if p.suffix not in (".c", ".h"):
                  continue

              try:
                  s = p.read_text()
              except Exception:
                  continue

              old = s

              s = re.sub(
                  r'\bkvmalloc\s*\(\s*([^,]+?)\s*,\s*'
                  r'GFP_[A-Z0-9_| ()]+\s*\)',
                  r'vmalloc(\1)',
                  s
              )

              s = s.replace(
                  "kvfree(",
                  "vfree("
              )

              if s != old:

                  if "#include <linux/vmalloc.h>" not in s:
                      s = "#include <linux/vmalloc.h>\n" + s

                  p.write_text(s)

                  print("PATCHED ALLOCATION:", p)

          # --------------------------------------------------------
          # Force apk_sign compatibility
          # --------------------------------------------------------

          apk = root / "manager" / "apk_sign.c"

          if apk.exists():

              s = apk.read_text()

              s = s.replace(
                  "#include <linux/vmalloc.h>\n",
                  ""
              )

              s = re.sub(
                  r'\bkvmalloc\s*\(\s*([^,]+?)\s*,\s*GFP_KERNEL\s*\)',
                  r'vmalloc(\1)',
                  s
              )

              s = s.replace(
                  "kvfree(",
                  "vfree("
              )

              s = "#include <linux/vmalloc.h>\n" + s

              apk.write_text(s)

              print("PATCHED APK_SIGN")

          # --------------------------------------------------------
          # ALIGN_DOWN
          # --------------------------------------------------------

          adb = root / "feature" / "adb_root.c"

          if adb.exists():

              s = adb.read_text()

              if (
                  "ALIGN_DOWN(" in s and
                  "#ifndef ALIGN_DOWN" not in s
              ):

                  s = (
                      "#ifndef ALIGN_DOWN\n"
                      "#define ALIGN_DOWN(x, a) "
                      "((x) & ~((typeof(x))(a) - 1))\n"
                      "#endif\n\n"
                  ) + s

                  adb.write_text(s)

                  print("PATCHED ALIGN_DOWN")

          # --------------------------------------------------------
          # sulog compatibility
          # --------------------------------------------------------

          event = root / "sulog" / "event.c"

          if event.exists():

              s = event.read_text()

              s = s.replace(
                  "#if KERNEL_VERSION(4, 19, 0) <= LINUX_VERSION_CODE",
                  "#if KERNEL_VERSION(4, 14, 0) <= LINUX_VERSION_CODE"
              )

              event.write_text(s)

          # --------------------------------------------------------
          # selinux_hide:
          # remove unavailable ARM64 set_memory header
          # --------------------------------------------------------

          hide = root / "feature" / "selinux_hide.c"

          if not hide.exists():
              raise SystemExit(
                  "ERROR: selinux_hide.c missing"
              )

          s = hide.read_text()

          s = s.replace(
              "#include <asm/set_memory.h>\n",
              ""
          )

          s = s.replace(
              '#include "asm/set_memory.h"\n',
              ""
          )

          # --------------------------------------------------------
          # NEW FIX:
          # __nocfi does not exist on this old kernel/toolchain.
          #
          # Do NOT replace every use. Define the missing annotation
          # as empty for this compatibility test.
          # --------------------------------------------------------

          if "__nocfi" in s:

              if "#ifndef __nocfi" not in s:

                  compat = (
                      "\n"
                      "#ifndef __nocfi\n"
                      "#define __nocfi\n"
                      "#endif\n"
                      "\n"
                  )

                  # Put definition before the source body.
                  s = compat + s

                  print("ADDED __nocfi COMPATIBILITY")

          hide.write_text(s)

          print("PATCHED SELINUX_HIDE")
          print("ALL KNOWN FIXES COMPLETE")
          PY

          echo
          echo "=========================================="
          echo " SELINUX_HIDE DIAGNOSTIC"
          echo "=========================================="

          grep -n \
            -E '__nocfi|set_memory|asm/set_memory' \
            drivers/kernelsu/feature/selinux_hide.c \
            || true

          echo
          echo "===== FIRST 30 LINES ====="

          head -30 \
            drivers/kernelsu/feature/selinux_hide.c

      # ============================================================
      # 5. CONFIG
      # ============================================================

      - name: Configure
        working-directory: kernel
        run: |
          set -eux

          if ! grep -q '^CONFIG_KSU=y' \
            arch/arm64/configs/lineage_xcover4s_defconfig
          then
              echo 'CONFIG_KSU=y' \
                >> arch/arm64/configs/lineage_xcover4s_defconfig
          fi

          export CCACHE_DIR="$HOME/.ccache"

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          make \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          grep '^CONFIG_KSU=y' \
            out/.config

      # ============================================================
      # 6. MINIMUM PREPARE
      #
      # We still need generated kernel headers. This cannot safely
      # be skipped when starting with a fresh GitHub runner.
      # ============================================================

      - name: Minimal kernel prepare
        working-directory: kernel
        run: |
          set -eux

          export CCACHE_DIR="$HOME/.ccache"

          echo "=========================================="
          echo " MINIMAL PREPARE"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            prepare \
            scripts

          echo
          echo "=========================================="
          echo " GENERATE SELINUX HEADERS"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            security/selinux/ \
            > selinux-prep.log \
            2>&1

          FLASK=$(
            find out \
              -type f \
              -name flask.h \
              -print \
              -quit
          )

          if [ -z "$FLASK" ]; then

              echo "ERROR: flask.h missing"

              tail -100 \
                selinux-prep.log \
                || true

              exit 1

          fi

          echo "FLASK = $FLASK"

      # ============================================================
      # 7. ULTRA-FAST TARGETED COMPILE
      #
      # ONLY compile the object that failed in Test 5.
      # ============================================================

      - name: Compile only selinux_hide
        working-directory: kernel
        run: |
          set +e

          echo "=========================================="
          echo " ULTRA FAST TARGET TEST"
          echo " TARGET: selinux_hide.o"
          echo "=========================================="

          export CCACHE_DIR="$HOME/.ccache"

          START=$(date +%s)

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            drivers/kernelsu/feature/selinux_hide.o \
            > target-build.log \
            2>&1

          RESULT=$?

          END=$(date +%s)
          SECONDS_USED=$((END - START))

          echo "$RESULT" \
            > target-result.txt

          echo
          echo "=========================================="
          echo " TARGET RESULT: $RESULT"
          echo " COMPILE TIME: ${SECONDS_USED}s"
          echo "=========================================="

          echo
          echo "===== REAL ERRORS ====="

          grep -n -iE \
            "fatal error:|error:|undefined reference|multiple definition|No rule to make target|implicit declaration|undeclared|too many arguments|incompatible pointer|unknown type name|no member named|conflicting types|expected" \
            target-build.log \
            | grep -viE \
              'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
            | tail -300 \
            || true

          echo
          echo "===== CLEAN OUTPUT ====="

          grep -viE \
            'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
            target-build.log \
            | tail -120 \
            || true

          if [ "$RESULT" -eq 0 ]; then

              echo
              echo "=========================================="
              echo " SELINUX_HIDE.O PASSED"
              echo "=========================================="

          else

              echo
              echo "=========================================="
              echo " SELINUX_HIDE.O STILL HAS AN ERROR"
              echo "=========================================="

          fi

          exit "$RESULT"

      # ============================================================
      # 8. REPORT
      # ============================================================

      - name: Create diagnostics
        if: always()
        working-directory: kernel
        run: |
          set +e

          REPORT="$GITHUB_WORKSPACE/test6-report.txt"

          {
              echo "=========================================="
              echo " XCOVER4S KSU TEST 6"
              echo " TARGETED SELINUX_HIDE TEST"
              echo "=========================================="

              echo
              echo "RESULT:"

              cat target-result.txt \
                2>/dev/null \
                || echo "TARGET DID NOT RUN"

              echo
              echo "SELINUX_HIDE REFERENCES:"

              grep -n \
                -E '__nocfi|set_memory|asm/set_memory' \
                drivers/kernelsu/feature/selinux_hide.c \
                2>/dev/null \
                || true

              echo
              echo "ERRORS:"

              if [ -f target-build.log ]; then

                  grep -n -iE \
                    "fatal error:|error:|undefined reference|multiple definition|No rule to make target|implicit declaration|undeclared|too many arguments|incompatible pointer|unknown type name|no member named|conflicting types|expected" \
                    target-build.log \
                    | grep -viE \
                      'objdump:|Unrecognized form:|DIE at offset|Bogus end-of-siblings' \
                    | tail -400 \
                    || true

              fi

          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 9. ARTIFACT
      # ============================================================

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-test6-ultrafast
          path: |
            test6-report.txt
            kernel/target-build.log
            kernel/target-result.txt
            kernel/selinux-prep.log
            kernel/out/.config
          if-no-files-found: warn
