name: XCOVER4S V61 - GNU Linker and Filtered Objdump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      CLANG_TRIPLE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git python3 make bc bison flex \
            build-essential libssl-dev libelf-dev \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            cpio zip unzip xz-utils

      - name: Download kernel
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel rev-parse HEAD

      - name: Apply V61 patches
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")

          # -----------------------------------------
          # SELinux permissive
          # -----------------------------------------

          hooks = root / "security/selinux/hooks.c"

          if not hooks.exists():
              raise SystemExit("Missing SELinux hooks.c")

          s = hooks.read_text()

          candidates = [
              (
                  r'(?m)^int selinux_enforcing\s*=\s*1\s*;',
                  'int selinux_enforcing = 0;'
              ),
              (
                  r'(?m)^int selinux_enforcing\s*;',
                  'int selinux_enforcing = 0;'
              ),
          ]

          changed = False

          for pattern, replacement in candidates:
              if len(re.findall(pattern, s)) == 1:
                  s = re.sub(
                      pattern, replacement, s, count=1
                  )
                  changed = True
                  break

          if not changed:
              print(
                  "SELinux enforcing variable not in hooks.c; "
                  "checking other source files"
              )
          else:
              hooks.write_text(s)

          # -----------------------------------------
          # CP control interface
          # -----------------------------------------

          modem = (
              root /
              "drivers/misc/modem_v1/modem_ctrl_ss310ap.c"
          )

          if not modem.exists():
              raise SystemExit(
                  "Missing Samsung SS310AP modem driver"
              )

          s = modem.read_text()

          required = [
              "ss310ap_off",
              "cal_cp_status",
              "cal_cp_reset_assert",
          ]

          for symbol in required:
              if symbol not in s:
                  raise SystemExit(
                      "Required Samsung function missing: "
                      + symbol
                  )

          off_pattern = (
              r'static\s+int\s+ss310ap_off\s*'
              r'\(\s*struct\s+modem_ctl\s*\*\s*mc\s*\)'
              r'\s*\{'
          )

          if len(re.findall(off_pattern, s)) != 1:
              raise SystemExit(
                  "Unexpected ss310ap_off definition"
              )

          if "static struct modem_ctl *g_mc;" not in s:
              raise SystemExit(
                  "Global modem controller g_mc missing; "
                  "refusing unsafe CP patch"
              )

          insertion = r'''
          /* V61 root-controlled modem interface */

          #include <linux/kobject.h>
          #include <linux/sysfs.h>
          #include <linux/capability.h>
          #include <linux/atomic.h>
          #include <linux/errno.h>

          static atomic_t v61_cp_lock =
              ATOMIC_INIT(0);

          static int ss310ap_off(
              struct modem_ctl *mc
          );

          static ssize_t v61_status_show(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              char *buf)
          {
              return scnprintf(
                  buf,
                  PAGE_SIZE,
                  "cp_status=%d lock=%d controller=%d\n",
                  cal_cp_status(),
                  atomic_read(&v61_cp_lock),
                  g_mc != NULL
              );
          }

          static ssize_t v61_power_store(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              const char *buf,
              size_t count)
          {
              int ret;

              if (!capable(CAP_SYS_ADMIN))
                  return -EPERM;

              if (!sysfs_streq(buf, "off"))
                  return -EINVAL;

              if (!g_mc)
                  return -ENODEV;

              ret = ss310ap_off(g_mc);

              if (ret)
                  return ret;

              pr_warn(
                  "V61: Samsung modem-off requested; "
                  "physical power-off unverified\n"
              );

              return count;
          }

          static ssize_t v61_reset_store(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              const char *buf,
              size_t count)
          {
              int ret;

              if (!capable(CAP_SYS_ADMIN))
                  return -EPERM;

              if (!sysfs_streq(buf, "assert"))
                  return -EINVAL;

              ret = cal_cp_reset_assert();

              if (ret)
                  return ret;

              return count;
          }

          static ssize_t v61_lock_show(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              char *buf)
          {
              return scnprintf(
                  buf,
                  PAGE_SIZE,
                  "%d\n",
                  atomic_read(&v61_cp_lock)
              );
          }

          static ssize_t v61_lock_store(
              struct kobject *kobj,
              struct kobj_attribute *attr,
              const char *buf,
              size_t count)
          {
              if (!capable(CAP_SYS_ADMIN))
                  return -EPERM;

              if (sysfs_streq(buf, "1"))
                  atomic_set(&v61_cp_lock, 1);
              else if (sysfs_streq(buf, "0"))
                  atomic_set(&v61_cp_lock, 0);
              else
                  return -EINVAL;

              /*
               * Diagnostic software flag only.
               * Not a hardware restart interlock.
               */
              return count;
          }

          static struct kobj_attribute v61_status_attr =
              __ATTR(
                  status, 0444,
                  v61_status_show, NULL
              );

          static struct kobj_attribute v61_power_attr =
              __ATTR(
                  power, 0200,
                  NULL, v61_power_store
              );

          static struct kobj_attribute v61_reset_attr =
              __ATTR(
                  reset, 0200,
                  NULL, v61_reset_store
              );

          static struct kobj_attribute v61_lock_attr =
              __ATTR(
                  lock, 0600,
                  v61_lock_show, v61_lock_store
              );

          static int __init v61_cp_init(void)
          {
              struct kobject *kobj;
              int ret;

              kobj = kobject_create_and_add(
                  "cp_control", kernel_kobj
              );

              if (!kobj)
                  return -ENOMEM;

              ret = sysfs_create_file(
                  kobj, &v61_status_attr.attr
              );
              if (ret)
                  goto fail;

              ret = sysfs_create_file(
                  kobj, &v61_power_attr.attr
              );
              if (ret)
                  goto fail;

              ret = sysfs_create_file(
                  kobj, &v61_reset_attr.attr
              );
              if (ret)
                  goto fail;

              ret = sysfs_create_file(
                  kobj, &v61_lock_attr.attr
              );
              if (ret)
                  goto fail;

              pr_info(
                  "V61: root CP controls registered\n"
              );

              return 0;

          fail:
              kobject_put(kobj);
              return ret;
          }

          late_initcall(v61_cp_init);

          /* End V61 */
          '''

          anchor = "static struct modem_ctl *g_mc;"

          if s.count(anchor) != 1:
              raise SystemExit(
                  "Unexpected modem controller layout"
              )

          s = s.replace(
              anchor,
              anchor + "\n" + insertion,
              1
          )

          modem.write_text(s)

          print("V61 CP interface patch applied")
          PY

      - name: Configure kernel
        run: |
          set -euo pipefail

          cd kernel

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          ./scripts/config \
            --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -d SECURITY_SELINUX_BOOTPARAM_VALUE \
            -d ALWAYS_ENFORCE

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          grep -E \
            'CONFIG_SECURITY_SELINUX|CONFIG_CP_PMUCAL|CONFIG_ALWAYS_ENFORCE' \
            out/.config || true

      - name: Validate SELinux source
        run: |
          set -euo pipefail

          cd kernel

          if grep -R -n \
            'int selinux_enforcing = 0;' \
            security/selinux; then

            echo "SELinux permissive initialization found"

          else

            echo "ERROR: SELinux permissive not verified"
            exit 1

          fi

          if grep -q \
            '^CONFIG_ALWAYS_ENFORCE=y$' \
            out/.config; then

            echo "ERROR: forced enforcing remains enabled"
            exit 1

          fi

      - name: Build kernel with GNU linker
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS=-Wno-error \
            -j2 \
            Image \
            2>&1 | tee ../build.log | grep --line-buffered -vE 'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)'

      - name: Verify output
        run: |
          set -euo pipefail

          IMAGE=kernel/out/arch/arm64/boot/Image

          test -s "$IMAGE"

          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          echo "V61 kernel compilation completed"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p deliver

          if [ -s kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image \
              deliver/XCOVER4S-V61-Image
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config \
              deliver/V61-config.txt
          fi

          if [ -f build.log ]; then
            cp build.log \
              deliver/V61-build.log
          fi

          if [ -d kernel/.git ]; then
            git -C kernel rev-parse HEAD \
              > deliver/source-commit.txt

            git -C kernel diff \
              > deliver/V61.patch
          fi

          cat > deliver/README.txt <<'EOF'
          XCOVER4S V61

          Intended features:
          - SELinux permissive kernel initialization
          - Existing Rootbroker files left unchanged
          - Root-writable Samsung modem-off control
          - Root-writable CP reset-assert control
          - Readable CP status
          - Software lock flag (not hardware enforced)
          - No automatic CP shutdown
          - GNU linker with Clang compilation
          - Filtered objdump warnings in GitHub Actions output

          Interface:
          /sys/kernel/cp_control/status
          /sys/kernel/cp_control/power
          /sys/kernel/cp_control/reset
          /sys/kernel/cp_control/lock

          LIMITATIONS:

          1. The power control calls Samsung ss310ap_off.
             It does not prove electrical CP power removal.

          2. The lock flag does not block hardware restart.

          3. Android Radio HAL is not modified.

          4. Rootbroker startup is not repaired by this
             kernel patch alone.

          5. This artifact is a kernel Image, not a
             flashable Odin TAR.

          Do not flash the Image directly.
          EOF

      - name: Upload V61 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V61-DIAGNOSTICS
          path: deliver/
          if-no-files-found: warn
