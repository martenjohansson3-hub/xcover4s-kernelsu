name: XCover4s - Find CP Power Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone kernel
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      - name: Find CP power implementation
        working-directory: kernel
        run: |
          echo "========================================"
          echo "exynos_set_cp_power_onoff"
          echo "========================================"

          grep -RIn \
            --exclude-dir=.git \
            "exynos_set_cp_power_onoff" \
            . || true

          echo
          echo "========================================"
          echo "CP_POWER_ON / CP_POWER_OFF"
          echo "========================================"

          grep -RInE \
            --exclude-dir=.git \
            "CP_POWER_(ON|OFF)" \
            drivers arch include \
            | head -300 || true
