name: XCOVER4S CP HARDWARE STATUS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 unzip zip curl jq \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Prepare source and original boot
        run: |
          set -euo pipefail

          test -f kernel_samsung_exynos7885-lineage-18.1.zip
          test -f boot.img

          test "$(stat -c %s boot.img)" -eq 37748736

          mkdir source
          unzip -q kernel_samsung_exynos7885-lineage-18.1.zip -d source

          test -f source/kernel_samsung_exynos7885-lineage-18.1/Makefile

          mv source/kernel_samsung_exynos7885-lineage-18.1 kernel

          cp boot.img original-boot.img

          sha256sum original-boot.img

      - name: Add read-only CP status
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/drivers/soc/samsung/exynos-pmu.c")
          s = p.read_text()

          anchor = "static struct regmap *pmureg;"
          assert s.count(anchor) == 1

          code = r'''
          #ifdef CONFIG_CP_PMUCAL
          static ssize_t cp_hw_status_show(
                  struct device *dev,
                  struct device_attribute *attr,
                  char *buf)
          {
                  static const struct {
                          const char *name;
                          unsigned int offset;
                  } regs[] = {
                          { "CP_CTRL_NS", 0x0030 },
                          { "CP_CTRL_S", 0x0034 },
                          { "RESET_SEQUENCER_STATUS", 0x0504 },
                          { "CENTRAL_SEQ_CP_STATUS", 0x0284 },
                  };

                  ssize_t len = 0;
                  unsigned int value;
                  int i;
                  int ret;

                  if (IS_ERR_OR_NULL(pmureg))
                          return -ENODEV;

                  for (i = 0; i < ARRAY_SIZE(regs); i++) {
                          ret = regmap_read(
                                  pmureg,
                                  regs[i].offset,
                                  &value);

                          if (ret)
                                  return ret;

                          len += scnprintf(
                                  buf + len,
                                  PAGE_SIZE - len,
                                  "%s=0x%08x\n",
                                  regs[i].name,
                                  value);
                  }

                  return len;
          }

          static DEVICE_ATTR_RO(cp_hw_status);
          #endif
          '''

          s = s.replace(anchor, anchor + "\n" + code)

          anchor = "register_cpus_notifier(&exynos_pmu_cpus_nb);"
          assert s.count(anchor) == 1

          s = s.replace(anchor, anchor + '''
          #ifdef CONFIG_CP_PMUCAL
                  if (device_create_file(dev, &dev_attr_cp_hw_status))
                          dev_warn(dev, "CP status unavailable\\n");
          #endif
          ''')

          p.write_text(s)
          PY

      - name: Build kernel
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          make O=out lineage_xcover4s_defconfig

          grep -q '^CONFIG_CP_PMUCAL=y' out/.config
          grep -q '^CONFIG_EXYNOS_PMU=y' out/.config

          make O=out -j"$(nproc)" Image dtbs

          test -s out/arch/arm64/boot/Image

      - name: Download magiskboot packer
        run: |
          set -euo pipefail

          URL=$(curl -fsSL \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url')

          test "$URL" != "null"

          curl -fL "$URL" -o magisk.apk

          unzip -p magisk.apk \
            lib/x86_64/libmagiskboot.so > magiskboot

          chmod +x magiskboot

      - name: Repack boot image
        run: |
          set -euo pipefail

          mkdir repack

          cp original-boot.img repack/original-boot.img
          cp magiskboot repack/magiskboot

          cd repack

          ./magiskboot unpack original-boot.img

          test -s kernel

          # Preserve the original kernel packaging format.
          # Stop if the original contains an embedded DTB or
          # compression that this workflow cannot safely replace.
          python3 - <<'PY'
          from pathlib import Path

          k = Path("kernel").read_bytes()

          if not k.startswith(b'\x7fELF') and \
             k[0x38:0x3c] != bytes.fromhex("41524d64"):
              raise SystemExit(
                  "Original kernel format requires additional "
                  "verification before repacking."
              )
          PY

          cp ../kernel/out/arch/arm64/boot/Image kernel

          ./magiskboot repack original-boot.img boot.img

          test -s boot.img

          cd ..

      - name: Verify image structure
        run: |
          set -euo pipefail

          mkdir verify

          cp repack/boot.img verify/boot.img
          cp magiskboot verify/magiskboot

          cd verify

          ./magiskboot unpack boot.img

          test -s kernel

          cd ..

          sha256sum repack/boot.img
          ls -lh repack/boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-BOOT
          path: repack/boot.img
          if-no-files-found: error
