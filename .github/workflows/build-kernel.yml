echo "=== SELINUX ==="
grep -RInE "selinux_enforcing|SELINUX_ENFORCING|security_setenforce" \
  kernel/security/selinux kernel/security 2>/dev/null | head -80

echo "=== LOCATION/CELL ==="
grep -RInE "SUPL|AGPS|GNSS|GPS|location|cell.*location|network.*location|geolocation" \
  kernel/drivers kernel/net 2>/dev/null | head -150
