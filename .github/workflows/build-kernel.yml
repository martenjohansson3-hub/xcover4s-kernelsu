name: XCover4s Kernel - SELinux Permissive Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: kernel
  KERNEL_REPO: https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
  KERNEL_BRANCH: lineage-18.1
  KERNEL_DEFCONFIG: lineage_xcover4s_defconfig

  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            make \
            cpio \
            rsync \
            python3 \
            git \
            curl

      - name: Clone XCover4s kernel
        run: |
          set -eux

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo "=== KERNEL ==="
          git -C "$KERNEL_DIR" rev-parse HEAD

          echo "=== DEFCONFIG ==="
          ls -lh "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

      - name: Locate SELinux enforcement code
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          echo "=== SELINUX REFERENCES ==="

          grep -RInE \
            "selinux_enforcing|SELINUX_ENFORCING|security_setenforce" \
            security/selinux security 2>/dev/null \
            | head -100 || true

      - name: Apply SELinux permissive default
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          matches = []

          for p in Path("security/selinux").rglob("*.c"):
              text = p.read_text(errors="ignore")

              if "selinux_enforcing" in text:
                  matches.append((p, text))

          print("SELinux candidate files:")

          for p, _ in matches:
              print("  ", p)

          if not matches:
              raise SystemExit(
                  "ERROR: selinux_enforcing was not found."
              )

          changed = []

          for p, text in matches:
              original = text

              text = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  text
              )

              if text != original:
                  p.write_text(text)
                  changed.append(str(p))

          print("Changed files:")

          for x in changed:
              print("  ", x)

          if len(changed) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one SELinux "
                  "enforcement definition to change."
              )
          PY

          echo
          echo "=== SELINUX AFTER CHANGE ==="

          grep -RInE \
            "selinux_enforcing\s*=" \
            security/selinux 2>/dev/null

      - name: Locate modem RF and regulator control
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set +e

          echo
          echo "========================================"
          echo "MODEM / CP / RF REFERENCES"
          echo "========================================"

          grep -RInE \
            "modem|cpif|cp_power|cp.*power|modap|link_pm|mif|radio" \
            arch/arm64 drivers include 2>/dev/null \
            | head -400

          echo
          echo "========================================"
          echo "REGULATOR REFERENCES"
          echo "========================================"

          grep -RInE \
            "regulator_(enable|disable)|regulator_get|regulator_bulk|regulator.*disable|regulator.*enable" \
            drivers arch/arm64 2>/dev/null \
            | head -400

          echo
          echo "========================================"
          echo "DEVICE TREE MODEM / RF / POWER"
          echo "========================================"

          grep -RInE \
            "modem|cpif|cp_power|vdd.*cp|vdd.*modem|regulator.*cp|regulator.*modem|modap|mif" \
            arch/arm64/boot/dts 2>/dev/null \
            | head -400

          echo
          echo "NOTE:"
          echo "No modem/RF regulator is disabled by this test."
          echo "This step is identification only."

          true

      - name: Verify WiFi and GNSS remain untouched
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          echo "WiFi/GNSS source code is not modified."

          git diff -- \
            drivers/net \
            drivers/gnss \
            drivers/gps \
            arch/arm64/boot/dts \
            2>/dev/null || true

      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          rm -rf out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            "$KERNEL_DEFCONFIG"

          ./scripts/config \
            --file "$PWD/out/.config" \
            -e SECURITY_SELINUX || true

          ./scripts/config \
            --file "$PWD/out/.config" \
            -e SECURITY_SELINUX_DEVELOP || true

          ./scripts/config \
            --file "$PWD/out/.config" \
            -e SECURITY_SELINUX_BOOTPARAM || true

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "=== FINAL SELINUX CONFIG ==="

          grep -E \
            "CONFIG_SECURITY_SELINUX|CONFIG_SECURITY_SELINUX_DEVELOP|CONFIG_SECURITY_SELINUX_BOOTPARAM" \
            out/.config || true

      - name: Build full kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          KCFLAGS: -Wno-error
        run: |
          set -eux

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 | tee build.log

      - name: Verify kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          test -f out/arch/arm64/boot/Image

          echo
          echo "========================================"
          echo "KERNEL IMAGE"
          echo "========================================"

          ls -lh out/arch/arm64/boot/Image

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          sha256sum out/arch/arm64/boot/Image

          echo
          echo "========================================"
          echo "SELINUX CONFIG"
          echo "========================================"

          grep -E \
            "CONFIG_SECURITY_SELINUX|CONFIG_SECURITY_SELINUX_DEVELOP|CONFIG_SECURITY_SELINUX_BOOTPARAM" \
            out/.config || true

      - name: Package artifacts
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            "${KERNEL_DIR}/out/arch/arm64/boot/Image" \
            artifacts/Image-permissive

          cp \
            "${KERNEL_DIR}/out/.config" \
            artifacts/kernel-config

          cp \
            "${KERNEL_DIR}/build.log" \
            artifacts/build.log

          tar -czf \
            artifacts/xcover4s-kernel-selinux-permissive.tar.gz \
            -C artifacts \
            Image-permissive \
            kernel-config \
            build.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-kernel-selinux-permissive
          path: artifacts/
          if-no-files-found: error
