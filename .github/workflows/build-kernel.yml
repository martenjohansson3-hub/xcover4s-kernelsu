
name: XCOVER4S V17 - CP Source Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-cp:
    name: Inspect exact CP kernel source
    runs-on: ubuntu-22.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone pinned kernel
        shell: bash
        run: |
          set -euo pipefail

          git init kernel
          git -C kernel remote add origin \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git

          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel checkout --detach FETCH_HEAD

          echo "Kernel commit:"
          git -C kernel rev-parse HEAD

      - name: Inspect CP function definitions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          FILE="kernel/drivers/soc/samsung/pmu-cp.c"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: CP source file missing"
            find kernel/drivers -iname '*cp*' \
              > diagnostics/cp-files.txt
            exit 1
          fi

          echo "=== CP source details ==="
          wc -l "$FILE"
          sha256sum "$FILE"

          echo "=== Relevant function names ==="
          grep -nE \
            'exynos_cp_reset|exynos_cp_release|exynos_set_cp_power_onoff' \
            "$FILE" \
            | tee diagnostics/function-matches.txt \
            || true

          echo "=== CP power and reset references ==="
          grep -nEi \
            'cp_power|cp_start|cp_reset|cp_release|power_on|power_off|secure' \
            "$FILE" \
            | tee diagnostics/power-references.txt \
            || true

          echo "=== Full CP source ==="
          cat "$FILE" \
            | tee diagnostics/pmu-cp.c.txt

          echo "=== Related declarations ==="
          grep -R -nE \
            'exynos_cp_reset|exynos_cp_release|exynos_set_cp_power_onoff' \
            kernel/drivers/soc/samsung \
            kernel/include \
            > diagnostics/all-cp-references.txt \
            || true

          echo "=== Kernel version ==="
          git -C kernel rev-parse HEAD \
            | tee diagnostics/kernel-commit.txt

      - name: Check SELinux source
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SELinux enforcing references ==="

          grep -R -nE \
            'selinux_enforcing|enforcing_setup|SELINUX_BOOTPARAM' \
            kernel/security/selinux \
            | head -150 \
            | tee diagnostics/selinux-references.txt \
            || true

          echo "=== SELinux configuration ==="

          grep -nE \
            'SECURITY_SELINUX|SECURITY_SELINUX_DEVELOP' \
            kernel/arch/arm64/configs/lineage_xcover4s_defconfig \
            | tee diagnostics/selinux-config.txt \
            || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V17-CP-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
