
name: XCover4s Automatic CP Reset

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make python3 clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev

      - name: Download XCover4s kernel
        run: |
          git clone --depth 1 \
            https://github.com/AlexFurina/android_kernel_samsung_xcover4s.git \
            kernel

      - name: Require CP reset and restart protection
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Samsung CP functions"

          grep -R -l \
            'pmucal_cp_reset_assert' \
            drivers/soc/samsung \
            > /tmp/cp-reset-sources.txt

          cat /tmp/cp-reset-sources.txt

          echo
          echo "Automatic CP reset and restart protection"
          echo "must be implemented before compilation."

          echo "::error::CP lock implementation not yet integrated."
          exit 1

      - name: Compile kernel
        if: success()
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make -j"$(nproc)" Image
