            | gzip -dc > diagnostics/v50.patch

          echo \
            "9741c05944d7693ae9ad1141769c26cba788a7695a38b18125d871f31207ef87  diagnostics/v50.patch" \
            | sha256sum -c -

          cd kernel

          git apply --check ../diagnostics/v50.patch
          git apply ../diagnostics/v50.patch
          git diff --check

      - name: V51 safety and CP path audit
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")
          out = Path("diagnostics")
          cp = root / "drivers/soc/samsung/cal-if/pmucal_cp.c"
          modem = root / "drivers/misc/modem_v1/modem_ctrl_ss310ap.c"

          c = cp.read_text()
          m = modem.read_text()

          required_cp = [
              "v46_cp_off_latched",
              "pmucal_cp_reset_assert",
              "pmucal_cp_reset_release",
              "pmucal_cp_init",
              "pmucal_cp_is_off_latched",
          ]

          required_modem = [
              "ss310ap_on",
              "ss310ap_dump_start",
              "pmucal_cp_is_off_latched",
              "return -EPERM",
          ]

          for name in required_cp:
              assert name in c, "Missing CP feature: " + name

          for name in required_modem:
              assert name in m, "Missing modem feature: " + name

          assert 'panic("cp reset release fail")' not in c

          # Verify that the latch check is inside the named functions.
          for name in ("ss310ap_on", "ss310ap_dump_start"):
              match = re.search(
                  r"static\s+int\s+" + name +
                  r"\s*\([^)]*\)\s*\{",
                  m
              )
              assert match, "Missing function: " + name
              body_start = match.end()
              body = m[body_start:body_start + 650]
              assert "pmucal_cp_is_off_latched()" in body
              assert "return -EPERM" in body

          report = []
          report.append("V51 CP SOURCE AUDIT")
          report.append("===================")
          report.append("PMUCAL latch: PRESENT")
          report.append("Modem on gate: PRESENT")
          report.append("Modem dump gate: PRESENT")
          report.append("Release panic: REMOVED")
          report.append("")
          report.append("CP-related references across source tree:")
          report.append("")

          terms = (
              "pmucal_cp_init",
              "pmucal_cp_reset_release",
              "pmucal_cp_reset_assert",
              "cal_cp_init",
              "cal_cp_reset_release",
              "exynos_set_cp_power_onoff",
              "cp_power_on",
              "ss310ap_on",
              "ss310ap_dump_start",
          )

          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix not in (".c", ".h"):
                  continue
              try:
                  lines = p.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              for n, line in enumerate(lines, 1):
                  if any(term in line for term in terms):
                      report.append(
                          f"{p.relative_to(root)}:{n}: {line.strip()}"
                      )

          (out / "cp-path-audit.txt").write_text(
              "\n".join(report) + "\n"
          )

          print("CP source checks passed")
          print("Cross-reference audit saved")
          PY

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig \
            2>&1 | tee ../diagnostics/config.log

          cp out/.config ../diagnostics/kernel.config

          grep -q '^CONFIG_CP_PMUCAL=y' out/.config
          grep -q '^CONFIG_SEC_MODEM_SS310AP=y' out/.config

      - name: Compile CP components first
        run: |
          set -euo pipefail
          cd kernel

          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            drivers/soc/samsung/cal-if/pmucal_cp.o \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.o \
            2>&1 | tee ../diagnostics/cp-compile.log

          test -s out/drivers/soc/samsung/cal-if/pmucal_cp.o
          test -s out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o

          cp out/drivers/soc/samsung/cal-if/pmucal_cp.o \
            ../diagnostics/pmucal_cp.o

          cp out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o \
            ../diagnostics/modem_ctrl_ss310ap.o

      - name: Build complete kernel
        run: |
          set -euo pipefail
          cd kernel

          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            Image \
            2>&1 | tee ../diagnostics/full-build.log

          test -s out/arch/arm64/boot/Image

          cp out/arch/arm64/boot/Image \
            ../diagnostics/Image

          sha256sum ../diagnostics/Image \
            > ../diagnostics/Image.sha256

          file ../diagnostics/Image \
            > ../diagnostics/Image.file.txt

      - name: Save full patch and safety notes
        if: always()
        run: |
          mkdir -p diagnostics

          if [ -d kernel/.git ]; then
            git -C kernel diff \
              > diagnostics/v51-full.patch
          fi

          cat > diagnostics/READ-ME.txt <<'NOTE'
          XCOVER4S V51 CP SAFETY AUDIT

          Based on V50 compiled CP patch.

          Includes:
          - PMUCAL CP-off latch
          - PMUCAL restart blocking
          - SS310AP on blocking
          - SS310AP dump-start blocking
          - Removal of reset-release panic
          - Source-wide CP call-site inventory
          - Targeted compilation
          - Full ARM64 kernel compilation

          Important limitations:
          - Source audit does not prove all runtime paths are blocked.
          - No automatic CP-off trigger is installed.
          - Rootbroker integration is not installed.
          - SELinux is not modified.
          - RF transmission is not measured.
          - Device boot compatibility is not proven.
          - This artifact is NOT flashable with Odin.

          Do not flash the raw Image.
          Keep the original working boot backup.
          NOTE

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V51-FINAL-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
