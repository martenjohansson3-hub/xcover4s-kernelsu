name: Build XCover4s KernelSU Next

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            clang lld gcc-aarch64-linux-gnu curl git

      - name: Download kernel source
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

      - name: Integrate KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Enable KernelSU
        run: |
          cd kernel
          mkdir -p out
          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          ./scripts/config --file out/.config \
            -e KSU

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          grep -E "CONFIG_KSU" out/.config || true

      - name: Build KernelSU kernel
        run: |
          cd kernel
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error"

      - name: Show build result
        run: |
          echo "=== KernelSU config ==="
          grep -E "CONFIG_KSU" kernel/out/.config || true
          echo "=== Kernel output ==="
          find kernel/out/arch/arm64/boot -maxdepth 2 -type f -printf '%p %s bytes\n' || true

      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-kernelsu-next
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/.config
          if-no-files-found: error
