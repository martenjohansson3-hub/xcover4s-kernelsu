name: XCOVER4S V51 FINAL CP AUDIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v51:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang lld python3 cpio file

      - name: Get exact kernel source
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            --single-branch \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          git checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          test "$(git rev-parse HEAD)" = \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          mkdir -p ../diagnostics

          git rev-parse HEAD \
            > ../diagnostics/source-commit.txt

