
name: XCover4s V47 CP targeted test

on:
  workflow_dispatch:

jobs:
  cp-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev clang lld python3

      - name: Checkout known source revision
        run: |
          git clone --filter=blob:none --branch lineage-18.1 --single-branch \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          cd kernel
          git checkout 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply embedded CP patch
        run: |
          cat > /tmp/cp.patch.gz.b64 <<'PATCH64'
          H4sIAAAAAAAC/9VWbW/bNhD+LP+Kq4cEsiVZfqubl2WN0blFgCQ1sqUrhgECQ1O2YJnUSMpJMfi/70gpfveQYsGA+YNt8o7PvT13ZBAEQMKR
          TOZMqlAJGioyUzkfh5SkQRKH2SzHfxHNGrTieR48vFT58hKClt8Br+W3TuHysuL9kHCa5iMGP6YJz5/CmRjlKcuIJLPG5Kc98lyzp70SJiUX
          VlLxwjp86fbOYEZ4TtL0G6RE0wkbwYdhIOIYSKyZhD4fSZGMQGkidZ41oB5WPFzohMLPg49Xt4Po5v7XwVd33u2h/1Eq6LR2vlR5ECKFUoSg
          UWnj3DhQqiRcr2sopl0quNJAJ0RCfU5SH4oNpWVONUyZ5CyNbPxQn2Zr5rawxgbLojzkcczky4EO6kUiU+smzPIC/qp4gJ8GOo+rzWj8Ujbe
          lo2tbIFGi4KWBuiDu1Ly4XjTmA+399fXPjR7zabxtwLLGldXLJpU9+xLwqzAMuyd/w68dge/kWFQAagD3DGdS66gCYKDyillSjXgs54w+Zgo
          5gNnY8zOnAHySEhM0og1zNGwEpjML+1HCU+0O0fe1HZKI2QyTjiq7dXGTIJjVCXT56WrnabfA6/b89tN66wjrZ/QRIUF6niHbZd1WQLalW0P
          S1T3eIu1VjkGd5extecarxByfhDDfEovg8FwcHdT7i+KH7mkwqFs1DZ8/QdLpZUiuoVpqwqE9XpR0BWoKUKuIADDQppBsbbFc5xnj9lTJhQO
          AC1g+Nvdh/61SRyTMaFYZlOJk7ZhTavVLmnjmFyh6Zotm5PJCInhVo8UHKmzkiRIpQnhI5w/YzQcSIYtERGlmMT+Yn/mjCP6H7zqGwTHGd7c
          o+FoeIez5asPURTnnEYRhhugAcIT6lbRfwsDJUxMkrRqEuI4z0OtTIuR5JLBY6InIkeWGICpcQVJDeqb0mxmRxraXs8kOIuSfKdvbcjtt2XI
          UH/tXikyIlnKiGIvb5p9x7a6xxQk4bEwFTlSbs1kGQ4n2F48rRPTbK3uyQu7ba/3/8e22wzktfuPUMOFiCK6xC5c7oDd+c427JyemPdBt9v2
          Oz1bJOT22apURfUX5SXfB4WET7EJZKIZiBhaoDH+Mb5FIBOPTAYj8cgbSGVKOBcainBti9gybFz6//663uIHjgBsw9H5NmfWazZFLC1Q5lr8
          Jl6Ly4PrBDKzaIcKKwoWKuU5eHMBrdoe4lzdfulfLx34b2nbXDF2Pf5tmhaDz1134o3RPD7emfluDS4uoLkW6K67aAFrxUo0liq2hNxMECpi
          fj5vJee72uN1XmpLDpUGFOWZRMzYfT4/7H8aRL9c/T7woXqU29G3J/D32AxnYF9Si8rfF1In4dQLAAA=
          PATCH64
          base64 -d /tmp/cp.patch.gz.b64 | gzip -d > /tmp/cp.patch
          cd kernel
          git apply --check /tmp/cp.patch
          git apply /tmp/cp.patch
          git diff --check

      - name: Configure and compile CP only
        run: |
          cd kernel
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig
          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            drivers/soc/samsung/cal-if/pmucal_cp.o

      - name: Prepare root trigger for later integration
        run: |
          mkdir -p integration
          cat > integration/cp-after-boot.sh <<'SCRIPT'
          #!/system/bin/sh
          # For integration into an EXISTING privileged boot service only.
          # sys.boot_completed is NOT a verified lockscreen event.
          PATH=/system/bin:/system/xbin
          PARAM=/sys/module/pmucal_cp/parameters/v46_cp_off
          while [ "$(getprop sys.boot_completed)" != 1 ]; do
            sleep 1
          done
          [ -w "$PARAM" ] || exit 1
          printf '1\n' > "$PARAM" || exit 1
          [ "$(cat "$PARAM")" = 1 ] || exit 1
          SCRIPT
          chmod +x integration/cp-after-boot.sh
          cat > integration/READ-ME.txt <<'TEXT'
          V47 is a TARGETED COMPILE TEST, NOT A FLASHABLE KERNEL.
          The CP patch reuses the V46 prototype. Its latching and modem
          coverage are NOT verified on the physical device.
          The supplied script is NOT automatically installed to Rootbroker.
          The trigger uses sys.boot_completed and may be later than the
          lockscreen. Do NOT assume the 3-second target is met.
          No guarantee about absence of RF transmissions is possible yet.
          TEXT
          sh -n integration/cp-after-boot.sh

      - name: Upload diagnostics and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V47-CP-TARGETED
          if-no-files-found: warn
          path: |
            /tmp/cp.patch
            kernel/out/.config
            kernel/out/drivers/soc/samsung/cal-if/pmucal_cp.o
            integration/
