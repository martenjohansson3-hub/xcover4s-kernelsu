
name: XCover4s CP Power Diagnostics

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Download Samsung kernel
        run: |
          git clone --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

      - name: Inspect CP power control
        run: |
          mkdir -p results

          {
            echo "=== PMU CP CONTROL ==="
            sed -n '1,460p' kernel/drivers/soc/samsung/pmu-cp.c

            echo "=== CP POWER REFERENCES ==="
            grep -RnE \
              'CP_POWER_ON|CP_POWER_OFF|cp_power_status|cp_reset|exynos_set_cp_power' \
              kernel/drivers/soc/samsung \
              kernel/drivers/misc/modem_v1 \
              || true

            echo "=== PMU REGISTER REFERENCES ==="
            grep -RnE \
              'CP_STATUS|CP_CTRL|CP_CONFIGURATION|CP_RESET|CP_PWR' \
              kernel/include \
              kernel/drivers/soc/samsung \
              | head -300 || true
          } > results/cp-power-diagnostics.txt

          cp kernel/drivers/soc/samsung/pmu-cp.c \
            results/pmu-cp.c

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-cp-power-diagnostics
          path: results/
