
name: XCOVER4S V40 FULL BUILD AND BOOT AUDIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 \
            ripgrep

      - name: Prepare output
        run: mkdir -p dist

      - name: Check optional boot backup
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path("private/boot-backup.img")

          if not p.is_file():
              print(
                  "No private boot backup. "
                  "Kernel build will continue."
              )
          elif p.stat().st_size == 0:
              print(
                  "Empty boot backup. "
                  "Kernel build will continue."
              )
          else:
              with p.open("rb") as f:
                  magic = f.read(8)

              print("Boot size:", p.stat().st_size)
              print("Boot magic:", repr(magic))
              print(
                  "Boot SHA256:",
                  hashlib.sha256(
                      p.read_bytes()
                  ).hexdigest()
              )

              if magic != b"ANDROID!":
                  print(
                      "Boot image format not validated. "
                      "No repacking will occur."
                  )
              else:
                  print(
                      "Android boot magic detected. "
                      "Full layout still unverified."
                  )
          PY

      - name: Clone exact kernel source
        run: |
          set -euo pipefail

          git clone \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel rev-parse HEAD \
            > dist/source-commit.txt

      - name: Audit original modem paths
        run: |
          set -euo pipefail

          cd kernel

          rg -n \
            'pmucal_cp_init|pmucal_cp_reset_release|pmucal_cp_reset_assert|cal_cp_init|cal_cp_reset_release|IOCTL_MODEM_ON|IOCTL_MODEM_RESET|IOCTL_MODEM_BOOT_ON|IOCTL_MODEM_DL_START|CP_PWRON|CP_POWER_ON|CP_POWER_OFF|ss310ap_on' \
            drivers \
            > ../dist/cp-callers-before.txt || true

      - name: Apply V40 guarded CPLOCK
        run: |
          set -euo pipefail

          cat > /tmp/v40_patch.py <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/soc/samsung/cal-if/pmucal_cp.c"
          )

          source = path.read_text()

          if "CPLOCK_V40" in source:
              raise SystemExit("Already patched")

          for name in (
              "pmucal_cp_init",
              "pmucal_cp_reset_release",
          ):
              pattern = re.compile(
                  r"(\bint\s+"
                  + re.escape(name)
                  + r"\s*\(\s*void\s*\)\s*\{"
                  r"\s*int\s+ret\s*;)"
              )

              matches = list(pattern.finditer(source))

              if len(matches) != 1:
                  raise SystemExit(
                      f"Unexpected source layout: {name}"
                  )

              match = matches[0]

              lock = (
                  "\n\t/* CPLOCK_V40 */\n"
                  "\tpr_warn_ratelimited("
                  f"\"CPLOCK: denied {name}\\n\""
                  ");\n"
                  "\treturn -EPERM;\n"
              )

              source = (
                  source[:match.end()]
                  + lock
                  + source[match.end():]
              )

              print("Patched:", name)

          if "#include <linux/errno.h>" not in source:
              source = (
                  "#include <linux/errno.h>\n"
                  + source
              )

          if "#include <linux/printk.h>" not in source:
              source = (
                  "#include <linux/printk.h>\n"
                  + source
              )

          if source.count("/* CPLOCK_V40 */") != 2:
              raise SystemExit("Patch verification failed")

          path.write_text(source)
          PY

          python3 /tmp/v40_patch.py

          git -C kernel diff --check
          git -C kernel diff > dist/v40.patch

          test -s dist/v40.patch

      - name: Configure kernel
        run: |
          set -euo pipefail

          cd kernel

          make O=out lineage_xcover4s_defconfig
          make O=out olddefconfig

          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config
          grep -qx 'CONFIG_SEC_MODEM_SS310AP=y' out/.config
          grep -qx 'CONFIG_UMTS_MODEM_SS310AP=y' out/.config

          cp out/.config ../dist/kernel.config

      - name: Full kernel build
        run: |
          set -euo pipefail

          cd kernel

          make O=out -j2 Image \
            2>&1 | tee ../dist/build.log

          test -s out/arch/arm64/boot/Image

      - name: Validate ARM64 kernel
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import struct
          import hashlib

          p = Path(
              "kernel/out/arch/arm64/boot/Image"
          )

          data = p.read_bytes()

          if len(data) < 1000000:
              raise SystemExit(
                  "Kernel Image too small"
              )

          magic = struct.unpack_from(
              "<I", data, 0x38
          )[0]

          if magic != 0x644d5241:
              raise SystemExit(
                  "Invalid ARM64 Image magic"
              )

          print("ARM64 Image header OK")
          print("Image size:", len(data))
          print(
              "SHA256:",
              hashlib.sha256(data).hexdigest()
          )
          PY

          cp \
            kernel/out/arch/arm64/boot/Image \
            dist/Image

          sha256sum dist/Image \
            > dist/Image.sha256

      - name: Audit remaining CP paths
        if: always()
        run: |
          mkdir -p dist

          if [ -d kernel/drivers ]; then
            (
              cd kernel

              rg -n \
                'pmucal_cp_init|pmucal_cp_reset_release|pmucal_cp_reset_assert|cal_cp_init|cal_cp_reset_release|IOCTL_MODEM_ON|IOCTL_MODEM_RESET|IOCTL_MODEM_BOOT_ON|IOCTL_MODEM_DL_START|CP_PWRON|CP_POWER_ON|CP_POWER_OFF|ss310ap_on' \
                drivers \
                || true
            ) > dist/cp-callers-after.txt
          fi

      - name: Collect failure diagnostics
        if: always()
        run: |
          mkdir -p dist

          if [ -d kernel/.git ]; then
            git -C kernel diff > dist/v40.patch
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config dist/kernel.config
          fi

          cat > dist/README.txt <<'EOF'
          XCOVER4S V40 EXPERIMENTAL

          Full kernel build independent of boot backup.

          CPLOCK gates:
          - pmucal_cp_init
          - pmucal_cp_reset_release

          NOT VERIFIED:
          - Safe CP power-down
          - All modem restart paths
          - Boot compatibility
          - Physical CP power state
          - Odin repacking

          No Odin flash package generated.
          DO NOT FLASH THIS IMAGE DIRECTLY.
          EOF

      - name: Upload V40
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V40-FULL-BUILD
          path: dist/
          if-no-files-found: error
          retention-days: 30
