          cd kernel

          git apply --check /tmp/v55.patch
          git apply /tmp/v55.patch
          git diff --check

      - name: V59 early CP shutdown
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCP'
          from pathlib import Path

          p = Path(
              'kernel/drivers/soc/samsung/cal-if/pmucal_cp.c'
          )

          s = p.read_text()

          required = [
              'v46_cp_off_set',
              'v46_cp_off_latched',
              'pmucal_cp_reset_assert',
              'pmucal_cp_reset_release'
          ]

          for symbol in required:
              if symbol not in s:
                  raise SystemExit(
                      'Missing CP symbol: ' + symbol
                  )

          if '#include <linux/init.h>' not in s:
              s = '#include <linux/init.h>\n' + s

          if 'v59_cp_off_init' in s:
              raise SystemExit('V59 already applied')

          code = r'''
          /*
           * XCOVER4S V59
           * Automatic early CP shutdown.
           *
           * Existing V55 restart guards remain active.
           */
          static int __init v59_cp_off_init(void)
          {
              int ret;

              pr_info("V59: early CP shutdown requested\n");

              ret = v46_cp_off_set("1", NULL);

              if (ret)
                  pr_err("V59: CP shutdown failed: %d\n", ret);
              else
                  pr_info("V59: CP-off latch active\n");

              return 0;
          }

          subsys_initcall(v59_cp_off_init);
          '''

          p.write_text(s + '\n' + code)
          PYCP

      - name: V59 configure kernel and SELinux
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          mkdir -p ../out

          make O=../out lineage_xcover4s_defconfig

          scripts/config --file ../out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=../out olddefconfig

          grep -q '^CONFIG_SECURITY_SELINUX=y$' \
            ../out/.config

          grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' \
            ../out/.config

          grep -q '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0$' \
            ../out/.config

          echo "V59: SELinux boot configuration verified"

          grep CONFIG_SECURITY_SELINUX \
            ../out/.config > ../selinux-config.txt

      - name: Verify CP source modifications
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'subsys_initcall(v59_cp_off_init)' \
            kernel/drivers/soc/samsung/cal-if/pmucal_cp.c

          grep -q 'v46_cp_off_latched' \
            kernel/drivers/soc/samsung/cal-if/pmucal_cp.c

          grep -q 'pmucal_cp_is_off_latched' \
            kernel/drivers/misc/modem_v1/modem_ctrl_ss310ap.c

          git -C kernel diff --check

          echo "V59 CP source checks passed"

      - name: Build ARM64 kernel
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export KCFLAGS=-Wno-error

          make O=../out -j2 Image \
            2>&1 | tee ../build.log

          test -s ../out/arch/arm64/boot/Image

          echo "V59 kernel Image built successfully"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p deliver

          cp build.log deliver/ 2>/dev/null || true
          cp source-commit.txt deliver/ 2>/dev/null || true
          cp selinux-config.txt deliver/ 2>/dev/null || true

          cp out/.config deliver/kernel.config \
            2>/dev/null || true

          cp out/arch/arm64/boot/Image \
            deliver/Image 2>/dev/null || true

          if [ -d kernel/.git ]; then
            git -C kernel diff \
              > deliver/v59.patch || true
          fi

          cat > deliver/READ-ME.txt <<'EOF'
          XCOVER4S V59

          CP:
          Automatic early CP shutdown requested.
          V55 restart protection retained.
          subsys_initcall used instead of late_initcall.

          SELINUX:
          Boot permissive requested through kernel config.
          Runtime state is not yet verified.

          IMPORTANT:
          A successful build does not prove RF shutdown.
          The Image is not an Odin-flashable boot image.
          Original boot image and repacking are required.
          EOF

      - name: Upload V59 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V59-DIAGNOSTICS
          path: deliver/
          retention-days: 14
