name: XCover4s SELinux-only kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex build-essential \
            clang lld gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3

      - name: Get pinned XCover4s kernel
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          test "$(git -C kernel rev-parse HEAD)" = \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Patch SELinux only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          h = Path('kernel/security/selinux/hooks.c')
          s = h.read_text()

          initial = re.compile(
              r'(?m)^(\s*int\s+selinux_enforcing\s*(?:__\w+\s*)?=\s*)[^;]+;'
          )
          matches = list(initial.finditer(s))
          if len(matches) != 1:
              raise SystemExit(
                  f'Expected one selinux_enforcing definition, got {len(matches)}'
              )

          s = initial.sub(
              lambda m: m.group(1) + '0;',
              s,
              count=1
          )

          setup = re.search(
              r'static\s+int\s+__init\s+enforcing_setup\s*\([^)]*\)\s*\{',
              s
          )
          if not setup:
              raise SystemExit('enforcing_setup missing')

          start = setup.end()
          end = s.find('\n}', start)
          if end < 0 or end - start > 2000:
              raise SystemExit('Cannot locate enforcing_setup end')

          s = (
              s[:start]
              + '\n\tselinux_enforcing = 0;\n\treturn 1;'
              + s[end:]
          )
          h.write_text(s)

          fs = Path('kernel/security/selinux/selinuxfs.c')
          f = fs.read_text()

          match = re.search(
              r'static\s+ssize_t\s+sel_write_enforce\s*\([^)]*\)\s*\{',
              f
          )
          if not match:
              raise SystemExit('sel_write_enforce not found')

          f = (
              f[:match.end()]
              + '\n\treturn -EPERM; /* Deny enforcement writes */\n'
              + f[match.end():]
          )
          fs.write_text(f)
          PY

          git -C kernel diff --check
          git -C kernel diff --name-only | tee changed-files.txt

          test "$(wc -l < changed-files.txt)" -eq 2
          grep -qx 'security/selinux/hooks.c' changed-files.txt
          grep -qx 'security/selinux/selinuxfs.c' changed-files.txt

          git -C kernel diff > selinux-only.patch

      - name: Build ARM64 Image
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            lineage_xcover4s_defconfig

          kernel/scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            -d SECURITY_SELINUX_DISABLE

          kernel/scripts/config \
            --file out/.config \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 Image 2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image

      - name: Upload kernel and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-SELINUX-ONLY-IMAGE-AND-LOGS
          path: |
            out/arch/arm64/boot/Image
            out/.config
            selinux-only.patch
            changed-files.txt
            build.log
          if-no-files-found: warn
