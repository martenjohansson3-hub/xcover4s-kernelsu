name: XCover4s KSU v0.9.5 Full Build + Real Progress

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git clang lld llvm \
            libssl-dev libelf-dev gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu curl zip

          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Clone known-good kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo "===== KERNELSU COMMIT ====="
          git -C KernelSU rev-parse HEAD

          echo "===== KBUILD INTEGRATION ====="
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile || true

      - name: Configure XCover4s kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          chmod +x scripts/config

          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -e KSU

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_(KSU|OVERLAY_FS|SECURITY_SELINUX|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
            out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX=y$' out/.config

          cp out/.config "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: Generate SELinux headers
        working-directory: kernel
        run: |
          set -euxo pipefail

          LOG="$GITHUB_WORKSPACE/selinux-build.log"
          : > "$LOG"

          echo "=========================================="
          echo " GENERATING SELINUX HEADERS"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            security/selinux/ \
            > "$LOG" 2>&1

          echo "===== SELINUX COMPLETE ====="

          if [ ! -s out/security/selinux/flask.h ]; then
            echo "ERROR: flask.h was not generated"
            tail -300 "$LOG"
            exit 1
          fi

          ls -lh out/security/selinux/flask.h

      - name: Full KernelSU kernel build with real progress
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/full-build.log"
          : > "$LOG"

          echo "=========================================="
          echo " XCOVER4S FULL KERNELSU BUILD"
          echo " REAL PROGRESS MONITOR ENABLED"
          echo "=========================================="
          echo

          START_TIME=$(date +%s)

          (
            LAST_SIZE=-1
            LAST_OBJECTS=-1
            STALE_COUNT=0

            while true; do
              sleep 30

              NOW=$(date +%s)
              ELAPSED=$((NOW - START_TIME))

              if [ -f "$LOG" ]; then
                SIZE=$(stat -c%s "$LOG" 2>/dev/null || echo 0)
                LINES=$(wc -l < "$LOG" 2>/dev/null || echo 0)
              else
                SIZE=0
                LINES=0
              fi

              OBJECTS=$(find out \
                -type f \
                -name '*.o' \
                2>/dev/null | wc -l)

              echo
              echo "=========================================="
              echo "[PROGRESS] ${ELAPSED}s"
              echo "Log lines:    $LINES"
              echo "Log size:     $SIZE bytes"
              echo "Object files: $OBJECTS"

              if [ -f out/arch/arm64/boot/Image ]; then
                IMAGE_SIZE=$(stat -c%s out/arch/arm64/boot/Image)
                echo "Kernel Image: CREATED ($IMAGE_SIZE bytes)"
              else
                echo "Kernel Image: not created yet"
              fi

              echo
              echo "Latest build activity:"
              tail -5 "$LOG" 2>/dev/null || true
              echo "=========================================="

              if [ "$SIZE" = "$LAST_SIZE" ] && \
                 [ "$OBJECTS" = "$LAST_OBJECTS" ]; then
                STALE_COUNT=$((STALE_COUNT + 1))
              else
                STALE_COUNT=0
              fi

              LAST_SIZE="$SIZE"
              LAST_OBJECTS="$OBJECTS"

              # 10 checks x 30 sec = 5 minutes
              if [ "$STALE_COUNT" -ge 10 ]; then
                echo
                echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                echo "WARNING: NO VISIBLE BUILD PROGRESS"
                echo "for approximately 5 minutes."
                echo
                echo "The build is NOT automatically killed."
                echo "A long compiler/linker operation may still"
                echo "legitimately be running."
                echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              fi

            done
          ) &

          MONITOR_PID=$!

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            > "$LOG" 2>&1

          RESULT=$?

          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true

          echo "$RESULT" > "$GITHUB_WORKSPACE/full-build-result.txt"

          echo
          echo "=========================================="
          echo " BUILD FINISHED"
          echo " RESULT: $RESULT"
          echo "=========================================="

          echo
          echo "===== FINAL LOG ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$LOG" | tail -500 || true

          if [ "$RESULT" -ne 0 ]; then
            echo
            echo "FULL KERNEL BUILD FAILED"
            exit "$RESULT"
          fi

          echo
          echo "FULL KERNEL BUILD SUCCESSFUL"

      - name: Verify kernel artifacts
        if: always()
        working-directory: kernel
        run: |
          set +e

          {
            echo "===== IMAGE ====="

            if [ -f out/arch/arm64/boot/Image ]; then
              ls -lh out/arch/arm64/boot/Image
              stat -c '%s bytes' out/arch/arm64/boot/Image
              sha256sum out/arch/arm64/boot/Image
              file out/arch/arm64/boot/Image
            else
              echo "IMAGE NOT FOUND"
            fi

            echo
            echo "===== IMAGE.GZ ====="

            if [ -f out/arch/arm64/boot/Image.gz ]; then
              ls -lh out/arch/arm64/boot/Image.gz
              stat -c '%s bytes' out/arch/arm64/boot/Image.gz
              sha256sum out/arch/arm64/boot/Image.gz
            else
              echo "Image.gz NOT FOUND"
            fi

            echo
            echo "===== KERNELSU OBJECTS ====="

            find out/drivers/kernelsu \
              -type f \
              -name '*.o' \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== KERNELSU STRINGS IN IMAGE ====="

            if [ -f out/arch/arm64/boot/Image ]; then
              strings out/arch/arm64/boot/Image \
                | grep -iE 'KernelSU|kernelsu' \
                | head -100 || true
            fi

          } > "$GITHUB_WORKSPACE/artifact-info.txt"

          cat "$GITHUB_WORKSPACE/artifact-info.txt"

      - name: Extract diagnostics
        if: always()
        run: |
          set +e

          {
            echo "===== BUILD ERRORS ====="

            grep -niE \
              'error:|fatal error:|undefined reference|No rule to make target|make.*Error' \
              full-build.log \
              2>/dev/null || true

            echo
            echo "===== KERNELSU LINES ====="

            grep -niE \
              'kernelsu|ksu' \
              full-build.log \
              2>/dev/null || true

            echo
            echo "===== FINAL 300 BUILD LINES ====="

            tail -300 full-build.log \
              2>/dev/null || true

          } > build-diagnostics.txt

          cat build-diagnostics.txt

      - name: Copy kernel artifacts
        if: always()
        run: |
          set +e

          mkdir -p kernel-artifacts

          [ ! -f kernel/out/arch/arm64/boot/Image ] || \
            cp kernel/out/arch/arm64/boot/Image \
               kernel-artifacts/Image

          [ ! -f kernel/out/arch/arm64/boot/Image.gz ] || \
            cp kernel/out/arch/arm64/boot/Image.gz \
               kernel-artifacts/Image.gz

          find kernel/out/arch/arm64/boot \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp {} kernel-artifacts/ \; \
            2>/dev/null || true

          ls -lh kernel-artifacts || true

      - name: Create summary
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 Full Build"
            echo "==================================="
            echo
            echo "NO BOOT IMAGE"
            echo "DO NOT FLASH THESE RAW FILES"
            echo

            echo "KERNEL COMMIT:"
            git -C kernel rev-parse HEAD 2>/dev/null || true

            echo
            echo "KERNELSU COMMIT:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true

            echo
            echo "CONFIG:"
            grep -E \
              'CONFIG_(KSU|OVERLAY_FS|SECURITY_SELINUX)' \
              kernel/out/.config \
              2>/dev/null || true

            echo
            echo "BUILD RESULT:"
            cat full-build-result.txt \
              2>/dev/null || echo "NO RESULT"

            echo
            echo "IMAGE:"
            if [ -f kernel/out/arch/arm64/boot/Image ]; then
              stat -c '%s bytes' \
                kernel/out/arch/arm64/boot/Image
              sha256sum \
                kernel/out/arch/arm64/boot/Image
            else
              echo "NOT CREATED"
            fi

          } > build-summary.txt

          cat build-summary.txt

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-full-kernel-progress
          path: kernel-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-full-diagnostics-progress
          path: |
            kernel-config.txt
            selinux-build.log
            full-build.log
            full-build-result.txt
            artifact-info.txt
            build-diagnostics.txt
            build-summary.txt
          if-no-files-found: warn
          retention-days: 14
