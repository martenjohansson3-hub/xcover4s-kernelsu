name: XCover4s CP Hardware Status Boot

on:
  workflow_dispatch:
    inputs:
      kernel_zip_url:
        description: "Direct download URL for Exynos7885 kernel source ZIP"
        required: true
        type: string
      original_boot_zip_url:
        description: "Direct download URL for ZIP containing working original boot.img"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 unzip zip curl \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download source and original boot
        env:
          KERNEL_URL: ${{ inputs.kernel_zip_url }}
          BOOT_URL: ${{ inputs.original_boot_zip_url }}
        run: |
          set -euo pipefail

          curl -fL --retry 3 "$KERNEL_URL" -o kernel.zip
          curl -fL --retry 3 "$BOOT_URL" -o original-boot.zip

          mkdir -p source original
          unzip -q kernel.zip -d source
          unzip -q original-boot.zip -d original

          KERNEL_DIR=$(find source -type f \
            -path '*/arch/arm64/configs/lineage_xcover4s_defconfig' \
            -printf '%h\n' | head -1)

          test -n "$KERNEL_DIR"

          KERNEL_ROOT="${KERNEL_DIR%/arch/arm64/configs}"
          test -f "$KERNEL_ROOT/Makefile"

          mv "$KERNEL_ROOT" kernel

          BOOT_FILE=$(find original -type f -name '*.img' | head -1)
          test -n "$BOOT_FILE"

          cp "$BOOT_FILE" original-boot.img

          test "$(stat -c %s original-boot.img)" -eq 37748736

          echo "Original boot SHA256:"
          sha256sum original-boot.img

      - name: Verify original boot identity
        run: |
          set -euo pipefail

          EXPECTED="f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9"

          ACTUAL=$(sha256sum original-boot.img | cut -d' ' -f1)

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Original boot image does not match uploaded reference."
            exit 1
          fi

      - name: Add read-only CP PMU status
        run: |
          set -euo pipefail

          cd kernel

          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/soc/samsung/exynos-pmu.c")
          s = p.read_text()

          anchor = "static struct regmap *pmureg;"
          assert s.count(anchor) == 1, "PMU anchor not found"

          code = r'''
          #ifdef CONFIG_SOC_EXYNOS7885
          static ssize_t cp_hw_status_show(
                  struct device *dev,
                  struct device_attribute *attr,
                  char *buf)
          {
                  static const struct {
                          const char *name;
                          unsigned int offset;
                  } regs[] = {
                          { "CP_CTRL_NS", 0x0030 },
                          { "CP_CTRL_S", 0x0034 },
                          { "RESET_SEQUENCER_STATUS", 0x0504 },
                          { "CENTRAL_SEQ_CP_STATUS", 0x0284 },
                  };

                  ssize_t len = 0;
                  unsigned int val;
                  int i, ret;

                  if (IS_ERR_OR_NULL(pmureg))
                          return -ENODEV;

                  for (i = 0; i < ARRAY_SIZE(regs); i++) {
                          ret = regmap_read(pmureg, regs[i].offset, &val);
                          if (ret)
                                  return ret;

                          len += scnprintf(
                                  buf + len,
                                  PAGE_SIZE - len,
                                  "%s [PMU+0x%04x] = 0x%08x\n",
                                  regs[i].name,
                                  regs[i].offset,
                                  val);
                  }

                  return len;
          }

          static DEVICE_ATTR_RO(cp_hw_status);
          #endif
          '''

          s = s.replace(anchor, anchor + "\n" + code)

          anchor2 = "register_cpus_notifier(&exynos_pmu_cpus_nb);"
          assert s.count(anchor2) == 1, "Probe anchor not found"

          s = s.replace(anchor2, anchor2 + '''
          #ifdef CONFIG_SOC_EXYNOS7885
                  if (device_create_file(dev, &dev_attr_cp_hw_status))
                          dev_warn(dev, "CP status file unavailable\\n");
          #endif
          ''')

          p.write_text(s)
          PY

      - name: Build XCover4s kernel
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          make O=out lineage_xcover4s_defconfig

          grep -q '^CONFIG_SOC_EXYNOS7885=y' out/.config
          grep -q '^CONFIG_CP_PMUCAL=y' out/.config

          make O=out -j"$(nproc)" Image dtbs

          test -s out/arch/arm64/boot/Image

      - name: Get boot image packer
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk-v30.7.apk \
            -o magisk.apk

          unzip -p magisk.apk \
            lib/x86_64/libmagiskboot.so > magiskboot

          chmod +x magiskboot

          ./magiskboot 2>&1 | head -20 || true

      - name: Repack original boot image
        run: |
          set -euo pipefail

          mkdir -p repack

          cp original-boot.img repack/original-boot.img
          cp magiskboot repack/magiskboot

          cd repack

          ./magiskboot unpack original-boot.img

          test -s kernel

          cp ../kernel/out/arch/arm64/boot/Image kernel

          ./magiskboot repack original-boot.img boot.img

          test -s boot.img

          echo "Generated boot image:"
          ls -lh boot.img
          sha256sum boot.img

      - name: Verify boot image can be unpacked
        run: |
          set -euo pipefail

          mkdir -p verify

          cp repack/boot.img verify/boot.img
          cp magiskboot verify/magiskboot

          cd verify

          ./magiskboot unpack boot.img

          test -s kernel

          echo "Boot image structure verified."

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: XCover4s-boot-img
          path: repack/boot.img
          if-no-files-found: error
          retention-days: 7
