name: Build XCover4s Kernel

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libelf-dev gcc-aarch64-linux-gnu

      - name: Download GCC 4.9 toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc49

      - name: Download kernel source
        run: |
          git clone --depth=1 -b lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

      - name: Configure XCover4s
        run: |
          cd kernel
          mkdir -p out
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android- \
            lineage_xcover4s_defconfig

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android- \
            KCFLAGS="-Wno-error"

      - name: Show build result
        run: |
          echo "=== Kernel output ==="
          find kernel/out/arch/arm64/boot -maxdepth 2 -type f -printf '%p %s bytes\n' || true

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-kernel
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn
