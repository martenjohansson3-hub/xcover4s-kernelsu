
name: XCOVER4S V45 CP POWER OFF BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git make gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu build-essential \
            bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 cpio rsync

      - name: Kernel source
        run: |
          set -euo pipefail
          mkdir -p dist
          git clone --branch lineage-18.1 \
            --single-branch \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          git -C kernel checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel rev-parse HEAD \
            > dist/source-commit.txt

      - name: Apply display fix and CP power-off policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          display = Path(
              'kernel/drivers/video/fbdev/exynos/'
              'dpu_7885/decon_reg.c'
          )
          s = display.read_text()
          old = 'const double decon_clocks_table[][CLK_ID_MAX]'
          assert s.count(old) == 1, 'display declaration changed'
          display.write_text(
              s.replace(
                  old,
                  'const unsigned long decon_clocks_table[][CLK_ID_MAX]',
                  1
              )
          )

          pmu = Path(
              'kernel/drivers/soc/samsung/cal-if/pmucal_cp.c'
          )
          s = pmu.read_text()

          for h in (
              '#include <linux/errno.h>',
              '#include <linux/printk.h>'
          ):
              if h not in s:
                  s = h + '\n' + s

          # The original assert sequence requests CP_PWRON=0
          # and waits for CP OFF.
          # Never panic if PMU refuses.
          assert s.count(
              'panic("cp reset assert fail");'
          ) == 1

          s = s.replace(
              'panic("cp reset assert fail");',
              'pr_err("CPLOCK V45: CP power-off failed\\n");',
              1
          )

          for name in (
              'pmucal_cp_init',
              'pmucal_cp_reset_release'
          ):
              pat = (
                  r'(int\s+' + name +
                  r'\s*\(\s*void\s*\)\s*\{\s*int\s+ret\s*;)'
              )

              def replacement(m):
                  return m.group(1) + (
                      '\n\t/* V45: deny CP start */\n'
                      '\tret = pmucal_cp_status();\n'
                      '\tif (ret > 0) {\n'
                      '\t\tret = pmucal_cp_reset_assert();\n'
                      '\t\tif (ret) pr_err("CPLOCK V45: shutdown failed: %d\\n", ret);\n'
                      '\t}\n'
                      '\tpr_warn("CPLOCK V45: denied CP start\\n");\n'
                      '\treturn -EPERM;\n'
                  )

              s, n = re.subn(
                  pat, replacement, s, count=1
              )
              assert n == 1, name + ' not found'

          pmu.write_text(s)

          modem = Path(
              'kernel/drivers/misc/modem_v1/'
              'modem_ctrl_ss310ap.c'
          )
          s = modem.read_text()

          # Keep the driver registered.
          # Deny CP start/restart/dump.
          for name in (
              'ss310ap_on',
              'ss310ap_reset',
              'ss310ap_dump_start'
          ):
              pat = (
                  r'(static\s+int\s+' + name +
                  r'\s*\(\s*struct\s+modem_ctl\s*'
                  r'\*\s*mc\s*\)\s*\{)'
              )

              addition = (
                  '\n\t/* CPLOCK V45: request CP off */\n'
                  '\tint cplock_ret = cal_cp_status();\n'
                  '\tif (cplock_ret > 0) {\n'
                  '\t\tcplock_ret = cal_cp_reset_assert();\n'
                  '\t\tif (cplock_ret) mif_err("CPLOCK V45: power-off failed: %d\\n", cplock_ret);\n'
                  '\t}\n'
                  '\treturn -EPERM;\n'
              )

              s, n = re.subn(
                  pat,
                  lambda m: m.group(1) + addition,
                  s,
                  count=1
              )
              assert n == 1, name + ' not found'

          # Ensure off() requests CP shutdown.
          pat = (
              r'(static\s+int\s+ss310ap_off'
              r'\s*\(\s*struct\s+modem_ctl\s*'
              r'\*\s*mc\s*\)\s*\{)'
          )

          addition = (
              '\n\tint cplock_ret = cal_cp_status();\n'
              '\tif (cplock_ret > 0) {\n'
              '\t\tcplock_ret = cal_cp_reset_assert();\n'
              '\t\tif (cplock_ret) mif_err("CPLOCK V45: power-off failed: %d\\n", cplock_ret);\n'
              '\t}\n'
          )

          s, n = re.subn(
              pat,
              lambda m: m.group(1) + addition,
              s,
              count=1
          )
          assert n == 1, 'ss310ap_off not found'

          modem.write_text(s)
          print('V45 changes applied')
          PY

          git -C kernel diff > dist/v45.patch
          test -s dist/v45.patch

      - name: Configure
        run: |
          set -euo pipefail
          make -C kernel O=out \
            lineage_xcover4s_defconfig \
            2>&1 | tee dist/configure.log

          cp kernel/out/.config dist/kernel.config

          grep -E \
            '^CONFIG_(CP_PMUCAL|SEC_MODEM_SS310AP|UMTS_MODEM_SS310AP)=' \
            dist/kernel.config \
            | tee dist/selected-config.txt

      - name: Prepare
        run: |
          set -euo pipefail
          make -C kernel O=out -j2 prepare \
            2>&1 | tee dist/prepare.log
          make -C kernel O=out -j2 scripts \
            2>&1 | tee dist/scripts.log

      - name: Targeted compile tests
        run: |
          set -euo pipefail

          make -C kernel O=out -j2 \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            2>&1 | tee dist/display-test.log

          make -C kernel O=out -j2 \
            drivers/soc/samsung/cal-if/pmucal_cp.o \
            2>&1 | tee dist/cp-test.log

          make -C kernel O=out -j2 \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.o \
            2>&1 | tee dist/modem-test.log

      - name: Full kernel build
        run: |
          set -euo pipefail
          make -C kernel O=out -j2 Image \
            2>&1 | tee dist/build.log
          echo 'FULL BUILD PASSED' > dist/result.txt

      - name: Verify ARM64 Image
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path(
              'kernel/out/arch/arm64/boot/Image'
          )
          assert p.is_file()

          with p.open('rb') as f:
              f.seek(0x38)
              assert struct.unpack(
                  '<I', f.read(4)
              )[0] == 0x644d5241

          print('Valid ARM64 Image:', p.stat().st_size)
          PY

          cp kernel/out/arch/arm64/boot/Image \
            dist/Image

          sha256sum dist/Image \
            > dist/Image.sha256

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p dist

          for n in display-test cp-test modem-test build; do
            if [ -f dist/$n.log ]; then
              grep -nEi \
                'error:|fatal error:|undefined reference|Error [0-9]+' \
                dist/$n.log \
                > dist/$n-errors.txt || true

              tail -100 dist/$n.log \
                > dist/$n-tail.txt
            fi
          done

          cat > dist/FLASH-STATUS.txt <<'EOF'
          V45 EXPERIMENTAL CP POWER-OFF KERNEL

          Compiling successfully does NOT prove CP is off.
          CP power-off is not verified on hardware.
          No boot.img or Odin TAR is included.

          NOT FLASH READY.
          DO NOT FLASH RAW IMAGE.
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V45-CP-POWER-OFF
          path: dist/
          retention-days: 30
          if-no-files-found: error
