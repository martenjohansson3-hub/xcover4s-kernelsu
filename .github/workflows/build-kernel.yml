name: XCover4s - Permissive + SS310AP Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: kernel
  KERNEL_REPO: https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
  KERNEL_BRANCH: lineage-18.1
  KERNEL_DEFCONFIG: lineage_xcover4s_defconfig

  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            make \
            cpio \
            rsync \
            python3 \
            git

      - name: Clone kernel
        run: |
          set -eux

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo
          echo "========================================"
          echo "KERNEL SOURCE"
          echo "========================================"

          git -C "$KERNEL_DIR" rev-parse HEAD

      - name: Patch SELinux default permissive
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):
              text = p.read_text(errors="ignore")
              original = text

              text = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  text
              )

              if text != original:
                  p.write_text(text)
                  changed.append(str(p))

          print("Changed SELinux source files:")

          for p in changed:
              print("  " + p)

          if not changed:
              raise SystemExit(
                  "ERROR: No selinux_enforcing assignment was changed"
              )
          PY

          echo
          echo "========================================"
          echo "SELINUX SOURCE AFTER PATCH"
          echo "========================================"

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "SELINUX SOURCE DIFF"
          echo "========================================"

          git diff -- security/selinux

      - name: Targeted SS310AP modem analysis
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set +e

          OUT="modem-analysis.log"

          : > "$OUT"

          {
            echo "========================================"
            echo "XCOVER4S SS310AP MODEM ANALYSIS"
            echo "========================================"
            echo

            echo "===== SS310AP FILES ====="

            find . -type f \
              \( \
                -iname '*ss310*' \
                -o -iname '*s327*' \
                -o -iname '*modem*' \
                -o -iname '*cpif*' \
              \) \
              | sort

            echo
            echo "===== SS310AP / S327AP REFERENCES ====="

            grep -RInE \
              "SS310AP|ss310ap|S327AP|s327ap" \
              drivers \
              arch/arm64 \
              include \
              2>/dev/null

            echo
            echo "===== XCOVER4S DTS REFERENCES ====="

            grep -RInE \
              "xcover4s|s327ap|ss310ap|modem|cpif" \
              arch/arm64/boot/dts \
              2>/dev/null

            echo
            echo "===== MODEM POWER FUNCTIONS ====="

            grep -RInE \
              "modem.*power|power.*modem|cp.*power|power.*cp|modem_on|modem_off|modem_reset|cp_on|cp_off|cp_reset|power_on|power_off" \
              drivers \
              arch/arm64 \
              include \
              2>/dev/null

            echo
            echo "===== GPIO / RESET / ACTIVE CONTROL ====="

            grep -RInE \
              "gpio.*cp|cp.*gpio|gpio.*modem|modem.*gpio|cp_reset|cp_on|cp_active|phone_active|pda_active|reset_req|cp_wakeup|ap_wakeup" \
              drivers \
              arch/arm64/boot/dts \
              include \
              2>/dev/null

            echo
            echo "===== REGULATORS NEAR MODEM / CP ====="

            grep -RInE \
              "vdd.*(cp|modem)|vcc.*(cp|modem)|(cp|modem).*vdd|(cp|modem).*vcc|regulator.*(cp|modem)|(cp|modem).*regulator" \
              drivers \
              arch/arm64/boot/dts \
              include \
              2>/dev/null

            echo
            echo "===== REGULATOR ENABLE / DISABLE ====="

            grep -RInE \
              "regulator_(get|enable|disable|force_disable)|devm_regulator_get" \
              drivers \
              2>/dev/null \
              | grep -Ei \
                "modem|cp|ss310|s327|mif|link" || true

            echo
            echo "===== MODEM CONTROL STRUCTURES ====="

            grep -RInE \
              "modem_ctl|modem_data|modem_ops|modemctl|modem_ctrl|cp_ctrl|cpif" \
              drivers \
              include \
              2>/dev/null

            echo
            echo "===== MODEM CONFIG ====="

            grep -RInE \
              "CONFIG_.*(SS310|MODEM|CPIF|SIPC)" \
              arch/arm64/configs \
              2>/dev/null

            echo
            echo "===== WIFI / WLAN REFERENCES FOR SEPARATION ====="

            grep -RInE \
              "wlan|wifi|bcmdhd|dhd" \
              arch/arm64/boot/dts \
              2>/dev/null \
              | head -200

            echo
            echo "===== GPS / GNSS REFERENCES FOR SEPARATION ====="

            grep -RInE \
              "gps|gnss" \
              arch/arm64/boot/dts \
              drivers \
              2>/dev/null \
              | head -200

          } >> "$OUT"

          echo
          echo "========================================"
          echo "MODEM ANALYSIS CREATED"
          echo "========================================"

          wc -l "$OUT"

          true

      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          rm -rf out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            "$KERNEL_DEFCONFIG"

          CONFIG="out/.config"

          test -f "$CONFIG"

          if grep -q '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' "$CONFIG"; then

            sed -i \
              's/^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=.*/CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0/' \
              "$CONFIG"

          else

            echo \
              'CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0' \
              >> "$CONFIG"

          fi

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "========================================"
          echo "SELINUX CONFIG"
          echo "========================================"

          grep -E \
            "^CONFIG_SECURITY_SELINUX=|^CONFIG_SECURITY_SELINUX_BOOTPARAM=|^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=|^CONFIG_SECURITY_SELINUX_DEVELOP=" \
            "$CONFIG" || true

          VALUE="$(grep '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' "$CONFIG" | cut -d= -f2)"

          if [ "$VALUE" != "0" ]; then
            echo "ERROR: SELinux bootparam value is NOT 0"
            exit 1
          fi

          echo
          echo "SELinux bootparam default = PERMISSIVE"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        env:
          KCFLAGS: -Wno-error
        run: |
          set -o pipefail

          echo
          echo "========================================"
          echo "BUILDING XCOVER4S KERNEL"
          echo "========================================"
          echo

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 \
          | awk '
              /aarch64-linux-gnu-objdump: Warning:/ { next }
              /Unrecognized form: 0x[0-9a-fA-F]+/ { next }
              /Corrupt attribute/ { next }
              /Bogus end-of-siblings marker/ { next }
              /Further warnings about bogus end-of-sibling markers suppressed/ { next }

              /^[[:space:]]+CC[[:space:]]+/ { next }
              /^[[:space:]]+CC[[:space:]]+\[M\]/ { next }
              /^[[:space:]]+LD[[:space:]]+/ { next }
              /^[[:space:]]+AS[[:space:]]+/ { next }
              /^[[:space:]]+AR[[:space:]]+/ { next }
              /^[[:space:]]+HOSTCC[[:space:]]+/ { next }
              /^[[:space:]]+HOSTLD[[:space:]]+/ { next }

              {
                  print
                  fflush()
              }
            ' \
          | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "MAKE EXIT CODE: $STATUS"
          echo "========================================"

          exit "$STATUS"

      - name: Verify new kernel
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo
          echo "========================================"
          echo "NEW KERNEL SUCCESSFULLY BUILT"
          echo "========================================"

          ls -lh "$IMAGE"

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo
          echo "========================================"
          echo "FINAL SELINUX CONFIG"
          echo "========================================"

          grep -E \
            "^CONFIG_SECURITY_SELINUX=|^CONFIG_SECURITY_SELINUX_BOOTPARAM=|^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=|^CONFIG_SECURITY_SELINUX_DEVELOP=" \
            out/.config || true

          echo
          echo "========================================"
          echo "FINAL SELINUX SOURCE"
          echo "========================================"

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            2>/dev/null || true

      - name: Show important build messages
        if: always()
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "IMPORTANT BUILD MESSAGES"
          echo "========================================"

          if [ -f build.log ]; then

            grep -iE \
              "error:|fatal error:|undefined reference|warning:|FAILED|Error [0-9]+|section mismatch" \
              build.log \
              | tail -300 || true

          fi

      - name: Package results
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          IMAGE="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          if [ -f "$IMAGE" ]; then
            cp \
              "$IMAGE" \
              artifacts/Image-selinux-permissive
          fi

          if [ -f "${KERNEL_DIR}/out/.config" ]; then
            cp \
              "${KERNEL_DIR}/out/.config" \
              artifacts/kernel-config
          fi

          if [ -f "${KERNEL_DIR}/build.log" ]; then
            cp \
              "${KERNEL_DIR}/build.log" \
              artifacts/build.log
          fi

          if [ -f "${KERNEL_DIR}/modem-analysis.log" ]; then
            cp \
              "${KERNEL_DIR}/modem-analysis.log" \
              artifacts/modem-analysis.log
          fi

          echo
          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-permissive-ss310ap-analysis
          path: artifacts/
          if-no-files-found: warn
