
name: XCOVER4S V39 BUILD AND ODIN CANDIDATE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 \
            python3-pip lz4

      - name: Verify private boot backup
        run: |
          set -euo pipefail

          test -s private/boot-backup.img

          python3 - <<'PY'
          from pathlib import Path

          p = Path("private/boot-backup.img")
          header = p.open("rb").read(8)

          if header != b"ANDROID!":
              raise SystemExit(
                  "Unsupported boot image magic. "
                  "Refusing to repack."
              )

          print("Android boot image magic OK")
          print("Boot backup size:", p.stat().st_size)
          PY

      - name: Clone exact kernel source
        run: |
          set -euo pipefail

          git clone \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply guarded V39 CPLOCK
        run: |
          set -euo pipefail

          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "kernel/drivers/soc/samsung/cal-if/pmucal_cp.c"
          )

          source = path.read_text()

          for name in (
              "pmucal_cp_init",
              "pmucal_cp_reset_release",
          ):
              pattern = re.compile(
                  r"(\bint\s+"
                  + re.escape(name)
                  + r"\s*\(\s*void\s*\)\s*\{"
                  r"\s*int\s+ret\s*;)"
              )

              matches = list(pattern.finditer(source))

              if len(matches) != 1:
                  raise SystemExit(
                      f"Unexpected source layout: {name}"
                  )

              insertion = (
                  matches[0].group(1)
                  + "\n"
                  + "\t/* CPLOCK_V39 */\n"
                  + "\tpr_warn_ratelimited("
                  + f"\"CPLOCK: denied {name}\\n\""
                  + ");\n"
                  + "\treturn -EPERM;\n"
              )

              source = (
                  source[:matches[0].start()]
                  + insertion
                  + source[matches[0].end():]
              )

          if "#include <linux/errno.h>" not in source:
              source = (
                  "#include <linux/errno.h>\n"
                  + source
              )

          if "#include <linux/printk.h>" not in source:
              source = (
                  "#include <linux/printk.h>\n"
                  + source
              )

          path.write_text(source)

          if source.count("/* CPLOCK_V39 */") != 2:
              raise SystemExit("CPLOCK patch verification failed")
          PY

          python3 /tmp/patch.py

          git -C kernel diff --check

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          make O=out lineage_xcover4s_defconfig
          make O=out olddefconfig

          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config
          grep -qx 'CONFIG_SEC_MODEM_SS310AP=y' out/.config
          grep -qx 'CONFIG_UMTS_MODEM_SS310AP=y' out/.config

      - name: Full kernel build
        run: |
          set -euo pipefail
          cd kernel

          make O=out -j2 Image \
            2>&1 | tee ../v39-build.log

          test -s out/arch/arm64/boot/Image

      - name: Install Android boot image tools
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/osm0sis/mkbootimg.git \
            boottools

          test -f boottools/unpackbootimg
          test -f boottools/mkbootimg

      - name: Prepare Odin candidate
        run: |
          set -euo pipefail

          mkdir -p dist unpacked

          cp private/boot-backup.img \
            dist/known-good-boot.img

          cp kernel/out/arch/arm64/boot/Image \
            dist/Image

          # A boot image cannot be safely repacked
          # until all original boot parameters,
          # ramdisk, DTB and header layout have
          # been verified.
          #
          # Deliberately fail closed rather than
          # producing an unvalidated Odin tar.

          echo \
            "Boot repack requires verified original layout." \
            > dist/REPACK-NOT-VALIDATED.txt

          echo \
            "No flashable Odin package generated." \
            >> dist/REPACK-NOT-VALIDATED.txt

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p dist

          if [ -f v39-build.log ]; then
            cp v39-build.log dist/build.log
          fi

          if [ -d kernel/.git ]; then
            git -C kernel diff > dist/v39.patch
            git -C kernel rev-parse HEAD \
              > dist/source-commit.txt
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config dist/kernel.config
          fi

          cat > dist/README.txt <<'EOF'
          XCOVER4S V39

          Experimental CPLOCK kernel build.

          This build blocks two PMUCAL CP-start
          entry points but does not implement
          a complete verified CP power-off lock.

          The kernel has not been boot-tested.

          No Odin flash package is generated.

          DO NOT FLASH THE OUTPUT.
          EOF

      - name: Upload V39 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V39-BUILD-AND-REPACK-AUDIT
          path: dist/
          if-no-files-found: error
          retention-days: 14
