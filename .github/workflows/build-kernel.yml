name: XCover4s KernelSU v0.9.5 Kconfig Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            curl

      - name: Clone known-good XCover4s kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " INSTALL KERNELSU v0.9.5"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo
          echo "===== KERNELSU COMMIT ====="

          git -C KernelSU rev-parse HEAD

          echo
          echo "===== GIT STATUS ====="

          git status --short

      - name: Inspect KernelSU integration
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/ksu-integration.txt"
          : > "$LOG"

          {
            echo "=========================================="
            echo " KERNELSU INTEGRATION DIAGNOSTIC"
            echo "=========================================="
            echo

            echo "===== KernelSU directory ====="
            find KernelSU -maxdepth 3 -type f | sort
            echo

            echo "===== KernelSU Kconfig ====="
            if [ -f KernelSU/kernel/Kconfig ]; then
              cat KernelSU/kernel/Kconfig
            else
              echo "KernelSU/kernel/Kconfig NOT FOUND"
            fi
            echo

            echo "===== KernelSU Makefiles ====="
            find KernelSU \
              -maxdepth 3 \
              \( -name Makefile -o -name Kconfig \) \
              -print \
              -exec sh -c '
                echo "----- $1 -----"
                cat "$1"
                echo
              ' _ {} \;
            echo

            echo "===== References to KernelSU / KSU ====="

            grep -RniE \
              'KernelSU|CONFIG_KSU|source.*KernelSU|obj-\$\(CONFIG_KSU\)' \
              . \
              --exclude-dir=.git \
              --exclude-dir=out \
              2>/dev/null | head -500 || true

            echo
            echo "===== kernel/Kconfig tail ====="
            tail -100 kernel/Kconfig 2>/dev/null || true

            echo
            echo "===== kernel/Makefile tail ====="
            tail -100 kernel/Makefile 2>/dev/null || true

          } >> "$LOG" 2>&1

          cat "$LOG"

      - name: Generate normal XCover4s config
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          cp out/.config \
            "$GITHUB_WORKSPACE/config-before-ksu.txt"

      - name: Test CONFIG_KSU
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/ksu-config-test.txt"
          : > "$LOG"

          {
            echo "=========================================="
            echo " CONFIG_KSU TEST"
            echo "=========================================="
            echo

            echo "===== BEFORE ====="

            grep -E \
              'CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
              out/.config || true

            echo
            echo "===== scripts/config exists? ====="

            ls -l scripts/config || true

            echo
            echo "===== Enable CONFIG_KSU ====="

            chmod +x scripts/config 2>/dev/null || true

            scripts/config \
              --file out/.config \
              -e KSU

            echo
            echo "===== Immediately after scripts/config ====="

            grep -E \
              'CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
              out/.config || true

            cp out/.config \
              "$GITHUB_WORKSPACE/config-after-scripts-config.txt"

            echo
            echo "===== Run olddefconfig ====="

            make \
              O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              olddefconfig

            OLDRESULT=$?

            echo
            echo "olddefconfig result: $OLDRESULT"

            echo
            echo "===== AFTER olddefconfig ====="

            grep -E \
              'CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
              out/.config || true

            echo
            echo "===== Search KSU in final config ====="

            grep -n 'KSU' out/.config || true

            echo
            echo "===== Relevant KPROBE settings ====="

            grep -nE \
              'KPROBE|KALLSYMS|TRACEPOINT|FTRACE' \
              out/.config || true

          } >> "$LOG" 2>&1

          cp out/.config \
            "$GITHUB_WORKSPACE/config-after-olddefconfig.txt"

          cat "$LOG"

          # IMPORTANT:
          # Do not fail here even if CONFIG_KSU disappeared.
          # We want the diagnostic artifact.

          exit 0

      - name: Check integration files
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/integration-files.txt"
          : > "$LOG"

          {
            echo "===== kernel/Kconfig ====="

            grep -n -B5 -A10 \
              'KernelSU' \
              kernel/Kconfig || true

            echo
            echo "===== kernel/Makefile ====="

            grep -n -B5 -A10 \
              'KernelSU' \
              kernel/Makefile || true

            echo
            echo "===== CONFIG_KSU definition ====="

            grep -Rni \
              '^config KSU' \
              KernelSU . \
              --exclude-dir=.git \
              --exclude-dir=out \
              2>/dev/null || true

          } >> "$LOG" 2>&1

          cat "$LOG"

      - name: Create summary
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 Kconfig Diagnostic"
            echo "==========================================="
            echo
            echo "NO KERNEL BUILD"
            echo "NO BOOT IMAGE"
            echo "NOT FOR FLASHING"
            echo

            echo "KERNEL:"
            git -C kernel rev-parse HEAD 2>/dev/null || true

            echo
            echo "KERNELSU:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true

            echo
            echo "FINAL CONFIG:"
            grep -E \
              'CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
              kernel/out/.config 2>/dev/null || true

          } > diagnostic-summary.txt

          cat diagnostic-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-Kconfig-diagnostic
          path: |
            ksu-integration.txt
            ksu-config-test.txt
            integration-files.txt
            config-before-ksu.txt
            config-after-scripts-config.txt
            config-after-olddefconfig.txt
            diagnostic-summary.txt
          if-no-files-found: warn
          retention-days: 14
