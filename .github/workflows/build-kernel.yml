name: XCover4s CLEAN Clang11 Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git curl \
            python3 libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip unzip xz-utils

      - name: Install Android Clang 11
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            android-clang

          echo "===== AVAILABLE CLANG VERSIONS ====="
          find android-clang/clang-r*/bin \
            -maxdepth 1 -name clang -type f -print || true

          CLANG_BIN="$(
            find android-clang/clang-r*/bin \
              -maxdepth 1 -name clang -type f -print |
            while read f; do
              if "$f" --version 2>/dev/null | grep -q '11\.0\.2'; then
                dirname "$f"
                break
              fi
            done
          )"

          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: Android clang 11.0.2 not found"
            exit 1
          fi

          echo "$CLANG_BIN" > "$GITHUB_WORKSPACE/clang-path.txt"

          echo "===== SELECTED COMPILER ====="
          "$CLANG_BIN/clang" --version

      - name: Clone CLEAN kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== SOURCE STATUS ====="
          git status --porcelain

          test -z "$(git status --porcelain)"

      - name: Configure CLEAN kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          CLANG_BIN="$(cat "$GITHUB_WORKSPACE/clang-path.txt")"
          export PATH="$GITHUB_WORKSPACE/$CLANG_BIN:$PATH"

          clang --version

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== ROOT CHECK ====="

          if grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "ERROR: KernelSU unexpectedly enabled"
            exit 1
          fi

          echo "NO KERNELSU"

          cp out/.config "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: Build CLEAN kernel with heartbeat
        working-directory: kernel
        run: |
          set +e

          CLANG_BIN="$(cat "$GITHUB_WORKSPACE/clang-path.txt")"
          export PATH="$GITHUB_WORKSPACE/$CLANG_BIN:$PATH"

          RAW="$GITHUB_WORKSPACE/full-build.log"
          : > "$RAW"

          echo "=========================================="
          echo " XCOVER4S CLEAN CLANG11 BUILD"
          echo " NO ROOT / NO KERNELSU"
          echo "=========================================="

          START=$(date +%s)

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            > "$RAW" 2>&1 &

          BUILD_PID=$!

          while kill -0 "$BUILD_PID" 2>/dev/null
          do
            sleep 30

            if kill -0 "$BUILD_PID" 2>/dev/null; then
              NOW=$(date +%s)
              SECONDS_RUNNING=$((NOW-START))
              LOGSIZE=$(du -h "$RAW" 2>/dev/null | cut -f1)

              echo "[HEARTBEAT] build running: ${SECONDS_RUNNING}s | log: ${LOGSIZE}"
            fi
          done

          wait "$BUILD_PID"
          RESULT=$?

          echo "$RESULT" > "$GITHUB_WORKSPACE/full-build-result.txt"

          echo "=========================================="
          echo " BUILD RESULT: $RESULT"
          echo "=========================================="

          echo "===== LAST 300 CLEAN LOG LINES ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$RAW" |
            tail -300 || true

          if [ "$RESULT" -ne 0 ]; then
            echo "BUILD FAILED"
            exit "$RESULT"
          fi

          echo "CLEAN CLANG11 BUILD SUCCESSFUL"

      - name: Verify output
        working-directory: kernel
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          find out/arch/arm64/boot \
            -maxdepth 4 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | tee "$GITHUB_WORKSPACE/output-list.txt"

          FOUND=0

          for FILE in \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image-dtb
          do
            if [ -s "$FILE" ]; then
              cp "$FILE" "$GITHUB_WORKSPACE/output/"
              FOUND=1
            fi
          done

          test "$FOUND" -eq 1

          find out/arch/arm64/boot \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print \
            | sort \
            | tee "$GITHUB_WORKSPACE/dtb-list.txt" || true

          mkdir -p "$GITHUB_WORKSPACE/output/dtb"

          while IFS= read -r FILE
          do
            [ -n "$FILE" ] || continue

            REL="${FILE#out/arch/arm64/boot/}"
            DEST="$GITHUB_WORKSPACE/output/dtb/$REL"

            mkdir -p "$(dirname "$DEST")"
            cp "$FILE" "$DEST"

          done < "$GITHUB_WORKSPACE/dtb-list.txt"

      - name: Kernel diagnostics
        working-directory: kernel
        run: |
          set -euxo pipefail

          CLANG_BIN="$(cat "$GITHUB_WORKSPACE/clang-path.txt")"
          export PATH="$GITHUB_WORKSPACE/$CLANG_BIN:$PATH"

          {
            echo "XCOVER4S CLEAN CLANG11 TEST"
            echo "==========================="
            echo
            echo "COMPILER:"
            clang --version
            echo
            echo "KERNEL COMMIT:"
            git rev-parse HEAD
            echo
            echo "KERNEL RELEASE:"
            strings out/arch/arm64/boot/Image |
              grep -m1 'Linux version' || true
            echo
            echo "IMAGE:"
            ls -l out/arch/arm64/boot/Image
            sha256sum out/arch/arm64/boot/Image
            echo
            echo "IMAGE.GZ:"
            ls -l out/arch/arm64/boot/Image.gz || true
            sha256sum out/arch/arm64/boot/Image.gz || true
            echo
            echo "KSU:"
            grep '^CONFIG_KSU' out/.config ||
              echo "CONFIG_KSU NOT PRESENT"

          } > "$GITHUB_WORKSPACE/build-info.txt"

          cat "$GITHUB_WORKSPACE/build-info.txt"

      - name: Package test build
        run: |
          set -euxo pipefail

          cp kernel-config.txt output/
          cp build-info.txt output/
          cp output-list.txt output/
          cp dtb-list.txt output/

          cd output

          find . \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 |
            sort -z |
            xargs -0 sha256sum \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

          zip -r \
            "$GITHUB_WORKSPACE/xcover4s-CLEAN-clang11.zip" \
            .

      - name: Upload CLEAN Clang11 kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-CLEAN-clang11
          path: |
            xcover4s-CLEAN-clang11.zip
            build-info.txt
            full-build-result.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-CLEAN-clang11-diagnostics
          path: |
            full-build.log
            full-build-result.txt
            kernel-config.txt
            build-info.txt
            output-list.txt
            dtb-list.txt
            clang-path.txt
          if-no-files-found: warn
          retention-days: 14
