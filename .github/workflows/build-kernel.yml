
name: XCOVER4S V28 DISPLAY DIAGNOSTICS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Clone kernel
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

      - name: Inspect display debug definitions
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cd kernel

          BASE=drivers/video/fbdev/exynos/dpu_7885

          {
            echo "=== SOURCE COMMIT ==="
            git rev-parse HEAD

            echo
            echo "=== EVENT LOG SYMBOLS ==="
            grep -RnE \
              'event_log_idx|DPU_EVENT_LOG_MAX|struct dpu_log|event_log\[' \
              "$BASE" || true

            echo
            echo "=== DEBUG CONFIGURATION ==="
            grep -RnE \
              'CONFIG_.*DEBUG|CONFIG_.*LOG|DPU_EVENT' \
              "$BASE/decon.h" \
              "$BASE/decon_abd.c" \
              "$BASE/Kconfig" 2>/dev/null || true

            echo
            echo "=== DECON DEBUG STRUCTURE ==="
            grep -n -A100 -B15 \
              'struct decon_debug' \
              "$BASE/decon.h" || true

            echo
            echo "=== FAILING FUNCTION ==="
            sed -n '830,925p' \
              "$BASE/decon_abd.c"

            echo
            echo "=== DEBUG MACROS ==="
            sed -n '865,930p' \
              "$BASE/decon.h"

            echo
            echo "=== PANEL BUILD RULES ==="
            cat "$BASE/panels/Makefile"

          } > ../diagnostics/display-debug.txt 2>&1

          cat ../diagnostics/display-debug.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V28-DIAGNOSTICS
          path: diagnostics/
