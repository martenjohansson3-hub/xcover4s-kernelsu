
name: XCOVER4S V30 DECON DIAGNOSTICS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev

      - name: Clone kernel
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          mkdir -p diagnostics

      - name: Inspect DECON source
        run: |
          set -euo pipefail
          cd kernel

          BASE=drivers/video/fbdev/exynos/dpu_7885

          {
            echo "=== SOURCE COMMIT ==="
            git rev-parse HEAD

            echo
            echo "=== KCONFIG DEFINITIONS ==="
            grep -RnE \
              'config DECON_EVENT_LOG|DECON_EVENT_LOG|DPU_EVENT_LOG_MAX' \
              --include='Kconfig*' \
              --include='*.h' \
              --include='*.c' \
              "$BASE" || true

            echo
            echo "=== EVENT LOG FIELD REFERENCES ==="
            grep -RnE \
              'event_log_idx|event_log\[|DPU_EVENT_LOG_MAX' \
              "$BASE" || true

            echo
            echo "=== DECON DEBUG STRUCTURE ==="
            grep -n -A110 -B15 \
              'struct decon_debug' \
              "$BASE/decon.h" || true

            echo
            echo "=== DECON ABD RELEVANT SOURCE ==="
            sed -n '800,950p' \
              "$BASE/decon_abd.c"

            echo
            echo "=== DECON HEADER DEBUG MACROS ==="
            sed -n '830,970p' \
              "$BASE/decon.h"

            echo
            echo "=== KCONFIG AND MAKEFILES ==="
            grep -RnE \
              'DECON_EVENT_LOG|DECON_DEBUG|DPU_DEBUG' \
              "$BASE/Kconfig" \
              "$BASE/Makefile" \
              arch/arm64/configs/lineage_xcover4s_defconfig \
              2>/dev/null || true

          } > ../diagnostics/source-analysis.txt 2>&1

      - name: Test kernel configuration
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          {
            echo "=== ORIGINAL CONFIG ==="
            grep -E \
              'DECON_EVENT_LOG|DECON_DEBUG|DPU_DEBUG' \
              out/.config || true

            echo
            echo "=== REQUEST ENABLE ==="
            scripts/config --file out/.config \
              -e DECON_EVENT_LOG

            grep DECON_EVENT_LOG out/.config || true

            echo
            echo "=== RUN OLDDEFCONFIG ==="
            make O=out olddefconfig

            echo
            echo "=== FINAL CONFIG ==="
            grep -E \
              'DECON_EVENT_LOG|DECON_DEBUG|DPU_DEBUG' \
              out/.config || true

            echo
            echo "=== SYMBOL PRESENT? ==="
            if grep -q '^CONFIG_DECON_EVENT_LOG=y$' out/.config; then
              echo "RESULT: ENABLED"
            else
              echo "RESULT: NOT ENABLED"
              echo "Possible missing Kconfig symbol or dependency"
            fi

          } > ../diagnostics/config-analysis.txt 2>&1

          cp out/.config ../diagnostics/final.config

      - name: Print results
        if: always()
        run: |
          for file in diagnostics/*.txt; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
            fi
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V30-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
