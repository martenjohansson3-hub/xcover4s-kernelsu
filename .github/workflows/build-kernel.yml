
name: XCOVER4S V22 CP HARD OFF TEST

on:
  workflow_dispatch:

jobs:
  hard-off-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-14 lld-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev

      - name: Get kernel source
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          mkdir -p diagnostics
          git -C kernel rev-parse HEAD \
            > diagnostics/source-commit.txt

      - name: Create HARD OFF experiment
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "kernel/drivers/soc/samsung/cal-if/cal-if.c"
          )

          original = p.read_text()
          modified = original

          replacements = {
              "cal_cp_init":
                  'pr_warn("V22: CP hard off requested\\n");'
                  '\n\tpmucal_cp_reset_assert();',

              "cal_cp_reset_release":
                  'pr_warn("V22: CP restart blocked\\n");'
                  '\n\tpmucal_cp_reset_assert();',
          }

          for name, body in replacements.items():
              pattern = (
                  r'(void\s+' + name +
                  r'\s*\(\s*void\s*\)\s*\{)'
                  r'([^{}]*)'
                  r'(\})'
              )

              matches = list(
                  re.finditer(pattern, modified)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "Cannot safely patch " + name
                  )

              modified, count = re.subn(
                  pattern,
                  lambda m: (
                      m.group(1) +
                      "\n\t/* V22 CP HARD OFF TEST */\n\t" +
                      body + "\n" +
                      m.group(3)
                  ),
                  modified,
                  count=1
              )

              assert count == 1

          p.write_text(modified)

          assert modified != original
          print("V22 CP HARD OFF patch prepared")
          PY

          git -C kernel diff \
            > diagnostics/v22-hard-off.patch

      - name: Validate shutdown sequence
        run: |
          set -euo pipefail

          FILE=kernel/drivers/soc/samsung/cal-if/exynos7885/pmucal_cp_exynos7885.h

          test -f "$FILE"

          grep -q 'struct pmucal_seq cp_reset_assert' \
            "$FILE"

          grep -q 'CP_CTRL_NS__CP_PWRON' "$FILE"

          grep -q 'CENTRAL_SEQ_CP_STATUS__STATES' \
            "$FILE"

          {
            echo "CP shutdown sequence found"
            echo
            grep -nE \
              'cp_reset_assert|CP_PWRON|CENTRAL_SEQ_CP_STATUS' \
              "$FILE"
          } > diagnostics/power-sequence.txt

      - name: Verify GNSS and WiFi untouched
        run: |
          set -euo pipefail

          git -C kernel diff --name-only \
            > diagnostics/changed-files.txt

          if grep -Ei \
            'gnss|gps|wifi|wlan|dts' \
            diagnostics/changed-files.txt; then
            echo "ERROR: protected sources changed"
            exit 1
          fi

          echo "Protected sources unchanged" \
            > diagnostics/protected-sources.txt

      - name: Prepare kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          grep -q '^CONFIG_CP_PMUCAL=y' out/.config

          make O=out -j2 prepare scripts

      - name: Compile modified CP object
        run: |
          set -o pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 \
            drivers/soc/samsung/cal-if/cal-if.o \
            2>&1 | tee ../diagnostics/compile.log

      - name: Inspect compiled symbols
        run: |
          set -euo pipefail

          OBJ=kernel/out/drivers/soc/samsung/cal-if/cal-if.o

          test -s "$OBJ"

          aarch64-linux-gnu-nm "$OBJ" \
            > diagnostics/symbols.txt

          grep -q 'cal_cp_init' diagnostics/symbols.txt
          grep -q 'cal_cp_reset_release' \
            diagnostics/symbols.txt

          echo "TARGETED COMPILE PASSED" \
            > diagnostics/result.txt

          echo "Runtime power-off NOT verified" \
            >> diagnostics/result.txt

          echo "DO NOT FLASH THIS TEST" \
            >> diagnostics/result.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V22-HARD-OFF-TEST
          path: diagnostics/
          if-no-files-found: warn
