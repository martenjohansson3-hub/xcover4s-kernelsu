
name: XCOVER4S V19 - Exact Patch Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch exact kernel
        shell: bash
        run: |
          set -euo pipefail
          git init kernel
          git -C kernel remote add origin \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach FETCH_HEAD
          mkdir -p diagnostics
          git -C kernel rev-parse HEAD \
            | tee diagnostics/commit.txt

      - name: Inspect exact CP definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("kernel/drivers/soc/samsung/pmu-cp.c")
          src = path.read_text()
          output = []

          names = [
              "exynos_cp_reset",
              "exynos_cp_release",
              "exynos_set_cp_power_onoff",
          ]

          for name in names:
              output.append(f"\n===== {name} =====")
              matches = list(re.finditer(
                  r"\b" + re.escape(name) + r"\s*\(",
                  src
              ))
              output.append(f"Occurrences: {len(matches)}")

              for match in matches:
                  start = src.rfind("\n", 0, match.start()) + 1
                  line = src.count("\n", 0, match.start()) + 1
                  output.append(f"\nOccurrence at line {line}")
                  output.append(src[start:match.start() + 900])

          text = "\n".join(output)
          print(text)
          Path("diagnostics/cp-functions.txt").write_text(text)
          Path("diagnostics/pmu-cp.c").write_text(src)
          PY

      - name: Inspect SELinux definitions
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SELinux enforcing references ====="

          grep -R -n -E \
            'selinux_enforcing|enforcing_setup|SELINUX_BOOTPARAM' \
            kernel/security/selinux \
            | tee diagnostics/selinux-references.txt \
            || true

          echo "===== SELinux configuration ====="

          grep -n -E \
            'SECURITY_SELINUX|SELINUX_DEVELOP|SELINUX_BOOTPARAM' \
            kernel/arch/arm64/configs/lineage_xcover4s_defconfig \
            | tee diagnostics/selinux-config.txt \
            || true

          cp kernel/security/selinux/hooks.c \
            diagnostics/selinux-hooks.c

          cp kernel/security/selinux/ss/services.c \
            diagnostics/selinux-services.c

      - name: Check V18 assumptions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          cp = Path(
              "kernel/drivers/soc/samsung/pmu-cp.c"
          ).read_text()

          results = []

          for name in [
              "exynos_cp_reset",
              "exynos_cp_release",
              "exynos_set_cp_power_onoff",
          ]:
              pattern = (
                  r"(?m)^[ \t]*int[ \t]+"
                  + re.escape(name)
                  + r"[ \t]*\([^;{}]*\)[ \t]*\{"
              )
              count = len(list(re.finditer(pattern, cp)))
              results.append(
                  f"V18 regex for {name}: {count} matches"
              )

          total = 0
          for filename in [
              "kernel/security/selinux/hooks.c",
              "kernel/security/selinux/ss/services.c",
          ]:
              content = Path(filename).read_text()
              count = len(re.findall(
                  r"\bselinux_enforcing\s*=\s*1\s*;",
                  content
              ))
              results.append(
                  f"V18 SELinux assignments in {filename}: "
                  f"{count}"
              )
              total += count

          results.append(
              f"Total V18 SELinux matches: {total}"
          )

          report = "\n".join(results) + "\n"
          print(report)

          Path(
              "diagnostics/v18-assumptions.txt"
          ).write_text(report)
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V19-PATCH-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
