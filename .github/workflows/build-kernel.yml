
name: XCOVER4S V64 - Build and capture errors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v64:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex git make \
            clang lld gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 \
            cpio gzip xz-utils unzip

      - name: Verify original boot
        shell: bash
        run: |
          set -euo pipefail
          unzip -o boot-original-for-github.zip -d .
          test -s boot-original.img
          echo 'f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  boot-original.img' | sha256sum -c -

      - name: Download pinned kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply V64 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_kernel.py
          python3 tools/apply_kernel.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/drivers/soc/samsung/cal-if/pmucal_cp.c")
          s = p.read_text()

          old = "static DEFINE_SRCU(v64_cp_srcu);"
          new = "DEFINE_SRCU(v64_cp_srcu);"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)

          assert new in p.read_text()
          print("V64 SRCU declaration checked")
          PY

          git -C kernel diff --check

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export KCFLAGS=-Wno-error

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            lineage_xcover4s_defconfig

          kernel/scripts/config --file out/.config \
            -e CP_PMUCAL \
            -e OVERLAY_FS

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config

      - name: Compile V64 and capture first real error
        id: compile
        shell: bash
        run: |
          set -uo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          set +e
          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 Image > V64-build.log 2>&1
          result=$?
          set -e

          echo "BUILD_EXIT_CODE=$result" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("V64-build.log").read_text(errors="replace")
          lines = log.splitlines()
          pattern = re.compile(
              r"fatal error:|error:|undefined reference|"
              r"multiple definition|No rule to make target|"
              r"Error [1-9][0-9]*"
          )

          matches = [
              i for i, line in enumerate(lines)
              if pattern.search(line)
          ]

          output = []
          for i in matches[:30]:
              start = max(0, i - 8)
              end = min(len(lines), i + 10)
              output.append(
                  f"\n===== LOG LINES {start + 1}-{end} =====\n"
                  + "\n".join(lines[start:end])
              )

          if not output:
              output.append(
                  "No explicit compiler error matched.\n"
                  + "\n".join(lines[-150:])
              )

          report = "\n".join(output)
          Path("V64-ERRORS.txt").write_text(report)
          print(report)
          PY

          echo "Compiler exit code: $result"

          if [ "$result" -ne 0 ]; then
            exit 1
          fi

          test -s out/arch/arm64/boot/Image

      - name: Build rootbroker and init wrapper
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          aarch64-linux-gnu-gcc \
            -static -Os \
            -o tools/rootbroker.arm64 \
            tools/rootbroker.c

          aarch64-linux-gnu-gcc \
            -static -Os \
            -o tools/init-wrapper.arm64 \
            tools/init-wrapper.c

          test -s tools/rootbroker.arm64
          test -s tools/init-wrapper.arm64

      - name: Repack boot and create Odin TAR
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/repack_boot.py

          test -s deliver/boot.img
          test "$(stat -c %s deliver/boot.img)" = 37748736

          tar -C deliver --format=ustar \
            -cf deliver/V64-EXPERIMENTAL-ODIN.tar boot.img

          mkdir -p restore
          cp boot-original.img restore/boot.img

          tar -C restore --format=ustar \
            -cf deliver/V64-ORIGINAL-RESTORE.tar boot.img

          sha256sum deliver/*.tar \
            > deliver/V64-checksums.txt

      - name: Upload diagnostics and boot files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V64-RESULTS
          path: |
            V64-build.log
            V64-ERRORS.txt
            out/.config
            out/arch/arm64/boot/Image
            deliver/
          if-no-files-found: warn
          retention-days: 14

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "===================================="
          echo "XCOVER4S V64 BUILD RESULT"
          echo "===================================="

          if [ -f V64-ERRORS.txt ]; then
            cat V64-ERRORS.txt
          fi

          if [ -s deliver/V64-EXPERIMENTAL-ODIN.tar ]; then
            echo "Odin TAR generated, not hardware-verified."
          else
            echo "No completed Odin TAR."
          fi
