
name: XCOVER4S V20 - CP OFF SELinux Permissive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-
      EXPECTED_BOOT_SHA: f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-14 lld-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            make curl unzip jq cpio python3

      - name: Check original boot
        id: original
        run: |
          set -euo pipefail
          if [ -f boot-original.img ]; then
            echo "$EXPECTED_BOOT_SHA  boot-original.img" | sha256sum -c -
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Original boot missing. Kernel-only artifact."
          fi

      - name: Fetch pinned kernel
        run: |
          set -euo pipefail
          git init kernel
          git -C kernel remote add origin \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply verified-layout patches
        shell: bash
        run: |
          set -euo pipefail

          cat > patch_v20.py <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")
          cp = root / "drivers/soc/samsung/pmu-cp.c"
          src = cp.read_text()

          def replace_body(source, name, body):
              pattern = (
                  r"(?m)^[ \t]*int[ \t]+"
                  + re.escape(name)
                  + r"\s*\([^;{}]*\)\s*\{"
              )
              matches = list(re.finditer(pattern, source))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"{name}: expected 1 definition, "
                      f"found {len(matches)}"
                  )

              match = matches[0]
              start = match.end() - 1
              depth = 0
              end = None

              for pos in range(start, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          end = pos
                          break

              if end is None:
                  raise RuntimeError(
                      f"{name}: closing brace missing"
                  )

              return (
                  source[:start + 1]
                  + "\n"
                  + body
                  + "\n"
                  + source[end:]
              )

          src = replace_body(
              src,
              "exynos_cp_reset",
              "\t/* V20: prevent CP reset/start */\n"
              "\treturn -EPERM;"
          )

          src = replace_body(
              src,
              "exynos_cp_release",
              "\t/* V20: prevent CP release */\n"
              "\treturn -EPERM;"
          )

          # Preserve the OFF path; reject the ON request.
          name = "exynos_set_cp_power_onoff"
          pattern = (
              r"(?m)^[ \t]*int[ \t]+"
              + name
              + r"\s*\(\s*enum\s+cp_mode\s+mode\s*\)\s*\{"
          )
          matches = list(re.finditer(pattern, src))
          if len(matches) != 1:
              raise RuntimeError(
                  "CP power function signature mismatch"
              )

          at = matches[0].end()
          src = (
              src[:at]
              + "\n\t/* V20: reject CP power-on */\n"
              + "\tif (mode == CP_POWER_ON)\n"
              + "\t\treturn -EPERM;\n"
              + src[at:]
          )
          cp.write_text(src)
          print("PASS: 3 CP functions patched")

          # V19 identified five explicit assignments.
          total = 0
          for relative in [
              "security/selinux/hooks.c",
              "security/selinux/ss/services.c",
          ]:
              path = root / relative
              data = path.read_text()
              data, count = re.subn(
                  r"\bselinux_enforcing\s*=\s*1\s*;",
                  "selinux_enforcing = 0;",
                  data
              )
              path.write_text(data)
              total += count
              print(f"{relative}: {count} assignments")

          if total != 5:
              raise RuntimeError(
                  f"Expected 5 SELinux assignments, got {total}"
              )

          print("PASS: SELinux source changes")
          PY

          python3 patch_v20.py
          git -C kernel diff --check
          git -C kernel diff > kernel-v20.patch
          test -s kernel-v20.patch
          git -C kernel diff --stat

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p out

          make O="$PWD/out" \
            ARCH=arm64 \
            lineage_xcover4s_defconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path("out/.config")
          lines = path.read_text().splitlines()

          settings = {
              "CONFIG_SECURITY_SELINUX": "y",
              "CONFIG_SECURITY_SELINUX_DEVELOP": "y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM": "y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE": "1",
          }

          lines = [
              line for line in lines
              if not any(
                  line.startswith(k + "=")
                  or line == f"# {k} is not set"
                  for k in settings
              )
          ]

          lines += [
              f"{key}={value}"
              for key, value in settings.items()
          ]

          path.write_text("\n".join(lines) + "\n")
          PY

          make O="$PWD/out" \
            ARCH=arm64 CC=clang-14 \
            KCFLAGS=-Wno-error olddefconfig

          grep -q '^CONFIG_SECURITY_SELINUX=y$' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=1$' out/.config

          echo "Kernel configuration verified."

      - name: Fast CP compile test
        working-directory: kernel
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=20s 8m \
            make -j4 \
              O="$PWD/out" \
              ARCH=arm64 \
              CC=clang-14 \
              KCFLAGS=-Wno-error \
              drivers/soc/samsung/pmu-cp.o \
              2>&1 | tee targeted-build.log

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Targeted compile failed."
            exit "$RESULT"
          fi

          test -s out/drivers/soc/samsung/pmu-cp.o
          echo "PASS: CP source compiled."

      - name: Full kernel build - live log
        working-directory: kernel
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting V20 kernel compilation"
          date -u

          (
            while true; do
              sleep 60
              echo "===== V20 HEARTBEAT ====="
              date -u
              if [ -f build.log ]; then
                du -h build.log
                tail -5 build.log
              fi
            done
          ) &
          HEARTBEAT=$!

          trap 'kill "$HEARTBEAT" 2>/dev/null || true' EXIT

          set +e
          timeout --signal=TERM --kill-after=30s 35m \
            make -j4 \
              O="$PWD/out" \
              ARCH=arm64 \
              CC=clang-14 \
              KCFLAGS=-Wno-error \
              Image dtbs \
              2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Full build failed: $RESULT"
            tail -100 build.log
            exit "$RESULT"
          fi

          test -s out/arch/arm64/boot/Image
          echo "PASS: KERNEL COMPILED"
          ls -lh out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V20-KERNEL
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/build.log
            kernel/targeted-build.log
            kernel-v20.patch
          retention-days: 14

      - name: Download MagiskBoot
        if: success() && steps.original.outputs.available == 'true'
        run: |
          set -euo pipefail

          URL="$(
            curl -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '
                .assets[]
                | select(.name | endswith(".apk"))
                | .browser_download_url
              ' | head -1
          )"

          test -n "$URL"
          test "$URL" != "null"

          curl -fL --retry 3 "$URL" -o magisk.apk
          unzip -p magisk.apk \
            lib/x86_64/libmagiskboot.so > magiskboot

          test -s magiskboot
          chmod +x magiskboot

      - name: Repack and inspect boot image
        if: success() && steps.original.outputs.available == 'true'
        run: |
          set -euo pipefail

          mkdir -p boot-work boot-verify
          cp boot-original.img boot-work/boot.img
          cp magiskboot boot-work/magiskboot

          cd boot-work
          ./magiskboot unpack boot.img
          test -s kernel

          cp ../kernel/out/arch/arm64/boot/Image kernel

          ./magiskboot repack boot.img \
            boot-CP-OFF-SELINUX-v20.img

          test -s boot-CP-OFF-SELINUX-v20.img

          cp boot-CP-OFF-SELINUX-v20.img \
            ../boot-verify/boot.img

          cd ../boot-verify
          cp ../magiskboot ./magiskboot
          ./magiskboot unpack boot.img

          cmp kernel \
            ../kernel/out/arch/arm64/boot/Image

          echo "PASS: Repacked image contains V20 kernel."
          echo "WARNING: Bootability not verified."
          echo "WARNING: CP power-off not verified."
          sha256sum boot.img

      - name: Upload unverified boot image
        if: success() && steps.original.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V20-BOOT-UNVERIFIED
          path: |
            boot-work/boot-CP-OFF-SELINUX-v20.img
            kernel-v20.patch
          retention-days: 14

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V20-DIAGNOSTICS
          path: |
            patch_v20.py
            kernel-v20.patch
            kernel/targeted-build.log
            kernel/build.log
            kernel/out/.config
          if-no-files-found: warn
          retention-days: 14
