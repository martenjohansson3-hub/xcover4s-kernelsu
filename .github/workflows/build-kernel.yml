
name: XCover4s Original Kernel with KernelSU-Next

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang-14 \
            lld-14 llvm-14 cpio curl flex git \
            libssl-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Checkout original XCover4s kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/kernel-commit.txt"
          test -f arch/arm64/configs/lineage_xcover4s_defconfig

      - name: Integrate KernelSU-Next legacy
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig

      - name: Configure kernel and KernelSU hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CC=clang-14
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU_KPROBE_HOOKS \
            --enable CONFIG_KSU

          make O=out olddefconfig

          grep -E \
            '^(CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBE_HOOKS|CONFIG_KSU)=' \
            out/.config | tee "$GITHUB_WORKSPACE/ksu-config.txt"

          for option in CONFIG_KPROBES CONFIG_KSU; do
            grep -qx "${option}=y" out/.config
          done

          cp out/.config "$GITHUB_WORKSPACE/kernel.config"

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CC=clang-14
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out -j2 Image.gz-dtb 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

          IMAGE=out/arch/arm64/boot/Image.gz-dtb
          test -s "$IMAGE"

          mkdir -p "$GITHUB_WORKSPACE/kernel-artifact"
          cp "$IMAGE" "$GITHUB_WORKSPACE/kernel-artifact/"
          cp out/.config "$GITHUB_WORKSPACE/kernel-artifact/kernel.config"

          sha256sum "$IMAGE" \
            | tee "$GITHUB_WORKSPACE/kernel-artifact/SHA256SUMS.txt"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCover4s-KernelSU-Next-Build
          path: |
            kernel-artifact/
            kernel-commit.txt
            kernel.config
            ksu-config.txt
            build.log
          if-no-files-found: warn
          retention-days: 14
