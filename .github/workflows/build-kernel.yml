
name: XCOVER4S V24 FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio

      - name: Download kernel source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

          mkdir -p diagnostics
          git -C kernel rev-parse HEAD > diagnostics/source-commit.txt

      - name: Apply corrected V24 patches
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("kernel/drivers/soc/samsung/cal-if/cal-if.c")
          s = p.read_text()

          changes = [
              (
                  r'(void cal_cp_init\(void\)\s*\{\s*)'
                  r'pmucal_cp_init\(\);',
                  r'\g<1>pr_warn("V24 CP init blocked\n");'
                  '\n\tpmucal_cp_reset_assert();'
              ),
              (
                  r'(void cal_cp_reset_release\(void\)\s*\{\s*)'
                  r'pmucal_cp_reset_release\(\);',
                  r'\g<1>pr_warn("V24 CP release blocked\n");'
                  '\n\tpmucal_cp_reset_assert();'
              )
          ]

          for pattern, replacement in changes:
              s, count = re.subn(pattern, replacement, s)
              if count != 1:
                  raise SystemExit(
                      f"CP patch failed: expected 1 match, got {count}"
                  )

          p.write_text(s)

          p = Path(
              "kernel/drivers/video/fbdev/exynos/"
              "dpu_7885/decon_reg.c"
          )
          s = p.read_text()
          old = "const double decon_clocks_table[][CLK_ID_MAX]"
          new = "const unsigned long decon_clocks_table[][CLK_ID_MAX]"

          if s.count(old) != 1:
              raise SystemExit("Display patch target not found")

          p.write_text(s.replace(old, new))
          print("V24 patches applied successfully")
          PY

          git -C kernel diff > diagnostics/v24.patch

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF \
            -d DEBUG_INFO_BTF_MODULES \
            -d KALLSYMS_ALL

          scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=out olddefconfig

          cp out/.config ../diagnostics/final.config

          grep -E \
            'CONFIG_CP_PMUCAL=|CONFIG_SECURITY_SELINUX|CONFIG_DEBUG_INFO|CONFIG_KALLSYMS' \
            out/.config > ../diagnostics/config-check.txt || true

      - name: Verify patches
        run: |
          set -euo pipefail

          grep -n 'V24 CP init blocked' \
            kernel/drivers/soc/samsung/cal-if/cal-if.c

          grep -n 'V24 CP release blocked' \
            kernel/drivers/soc/samsung/cal-if/cal-if.c

          grep -n 'const unsigned long decon_clocks_table' \
            kernel/drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

          echo "PATCHES VERIFIED" > diagnostics/patch-result.txt

      - name: Targeted compile test
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 \
            drivers/soc/samsung/cal-if/cal-if.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            2>&1 | tee ../diagnostics/targeted-build.log

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 Image \
            2>&1 | tee ../diagnostics/build.log

      - name: Measure kernel
        run: |
          set -euo pipefail

          IMAGE=kernel/out/arch/arm64/boot/Image
          test -s "$IMAGE"

          SIZE=$(stat -c%s "$IMAGE")

          {
            echo "V21 original target: 23327848 bytes"
            echo "V23 kernel: 25139944 bytes"
            echo "V24 kernel: $SIZE bytes"
            echo
            echo "Boot partition capacity: 37748736 bytes"
            echo "Final fit requires repacking and checking boot.img."
          } | tee diagnostics/kernel-size.txt

      - name: Prepare kernel artifact
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp kernel/out/arch/arm64/boot/Image artifact/Image
          cp diagnostics/v24.patch artifact/v24.patch
          cp diagnostics/kernel-size.txt artifact/kernel-size.txt
          cp diagnostics/final.config artifact/final.config

          sha256sum artifact/Image > artifact/SHA256SUMS

          cat > artifact/STATUS.txt <<'EOF'
          XCOVER4S V24

          Kernel build completed.

          CP reset-assert patch included.
          CP supply power-off is NOT proven.

          SELinux permissive boot configuration requested.
          Runtime SELinux state is NOT yet verified.

          NOT FLASHABLE.
          Repack with original boot components first.
          Verify boot.img fits partition before flashing.
          EOF

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V24-KERNEL
          path: artifact/

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V24-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
