name: XCover4s CLEAN Test Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            zip

          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Clone CLEAN kernel source
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== VERIFY SOURCE IS CLEAN ====="
          git status --short
          test -z "$(git status --porcelain)"

      - name: Configure CLEAN kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== VERIFY NO KERNELSU ====="

          if grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "ERROR: CONFIG_KSU IS ENABLED"
            exit 1
          fi

          echo "KernelSU is NOT enabled."

          cp out/.config "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: Build CLEAN kernel
        working-directory: kernel
        run: |
          set +e

          RAW="$GITHUB_WORKSPACE/full-build.log"
          : > "$RAW"

          echo "=========================================="
          echo " XCOVER4S CLEAN KERNEL BUILD"
          echo " NO ROOT / NO KERNELSU"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            > "$RAW" 2>&1

          RESULT=$?

          echo "$RESULT" > "$GITHUB_WORKSPACE/full-build-result.txt"

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$RAW" | tail -300 || true

          if [ "$RESULT" -ne 0 ]; then
            echo "CLEAN BUILD FAILED: $RESULT"
            exit "$RESULT"
          fi

          echo "CLEAN BUILD SUCCESSFUL"

      - name: Verify CLEAN output
        working-directory: kernel
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          echo "===== KERNEL OUTPUTS ====="

          find out/arch/arm64/boot \
            -maxdepth 4 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | tee "$GITHUB_WORKSPACE/output-list.txt"

          FOUND=0

          for FILE in \
            out/arch/arm64/boot/Image \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image-dtb
          do
            if [ -s "$FILE" ]; then
              echo "FOUND: $FILE"
              cp "$FILE" "$GITHUB_WORKSPACE/output/"
              FOUND=1
            fi
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: NO KERNEL IMAGE"
            exit 1
          fi

          echo "===== DTB OUTPUTS ====="

          find out/arch/arm64/boot \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print \
            | sort \
            | tee "$GITHUB_WORKSPACE/dtb-list.txt" || true

          mkdir -p "$GITHUB_WORKSPACE/output/dtb"

          while IFS= read -r FILE
          do
            [ -n "$FILE" ] || continue

            REL="${FILE#out/arch/arm64/boot/}"
            DEST="$GITHUB_WORKSPACE/output/dtb/$REL"

            mkdir -p "$(dirname "$DEST")"
            cp "$FILE" "$DEST"

          done < "$GITHUB_WORKSPACE/dtb-list.txt"

      - name: Create build information
        run: |
          set -euxo pipefail

          {
            echo "XCover4s CLEAN Test Kernel"
            echo "=========================="
            echo
            echo "NO ROOT"
            echo "NO KERNELSU"
            echo "NO SOURCE PATCHES"
            echo
            echo "DATE:"
            date -u
            echo
            echo "KERNEL COMMIT:"
            git -C kernel rev-parse HEAD
            echo
            echo "CONFIG KSU CHECK:"
            grep '^CONFIG_KSU' kernel/out/.config || echo "CONFIG_KSU NOT PRESENT"
            echo
            echo "OUTPUTS:"
            find output -type f -printf '%p %s bytes\n' | sort

          } > build-info.txt

          cat build-info.txt

      - name: Package CLEAN test kernel
        run: |
          set -euxo pipefail

          cp kernel-config.txt output/
          cp build-info.txt output/
          cp output-list.txt output/
          cp dtb-list.txt output/

          cd output

          find . \
            -type f \
            ! -name SHA256SUMS.txt \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt

          echo "===== SHA256 ====="
          cat SHA256SUMS.txt

          zip -r \
            "$GITHUB_WORKSPACE/xcover4s-CLEAN-test-kernel.zip" \
            .

      - name: Upload CLEAN kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-CLEAN-test-kernel
          path: |
            xcover4s-CLEAN-test-kernel.zip
            build-info.txt
            full-build-result.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-CLEAN-test-diagnostics
          path: |
            full-build.log
            full-build-result.txt
            kernel-config.txt
            build-info.txt
            output-list.txt
            dtb-list.txt
          if-no-files-found: warn
          retention-days: 14
