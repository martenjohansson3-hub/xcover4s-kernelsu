
name: XCOVER4S V64 - Experimental Odin boot with rootbroker and CP latch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v64:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Check out your files
        uses: actions/checkout@v4

      - name: Confirm original boot image and scripts
        shell: bash
        run: |
          set -euo pipefail
          test -s boot-original-for-github.zip
          unzip -o boot-original-for-github.zip -d .
          test -s boot-original.img
          test -s tools/rootbroker.c
          test -s tools/init-wrapper.c
          test -s tools/apply_kernel.py
          test -s tools/repack_boot.py
          echo 'f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  boot-original.img' | sha256sum -c -

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex git make clang lld \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 cpio gzip xz-utils

      - name: Get pinned Samsung kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel fetch --depth 1 origin 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          test "$(git -C kernel rev-parse HEAD)" = 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply V64 CP patch and fix duplicate static
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile tools/apply_kernel.py
          python3 tools/apply_kernel.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path("kernel/drivers/soc/samsung/cal-if/pmucal_cp.c")
          s = p.read_text()

          old = "static DEFINE_SRCU(v64_cp_srcu);"
          new = "DEFINE_SRCU(v64_cp_srcu);"

          if s.count(old) != 1:
              raise SystemExit(
                  "Expected exactly one duplicate-static SRCU declaration"
              )

          s = s.replace(old, new, 1)
          p.write_text(s)

          assert old not in p.read_text()
          assert new in p.read_text()

          print("V64: duplicate static fixed")
          PY

          git -C kernel diff --check
          git -C kernel diff > V64-applied-kernel.patch
          test -s V64-applied-kernel.patch

      - name: Build ARM64 kernel Image
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error

          mkdir -p out

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            lineage_xcover4s_defconfig

          kernel/scripts/config --file out/.config \
            -e CP_PMUCAL \
            -e OVERLAY_FS

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config
          grep -qx 'CONFIG_OVERLAY_FS=y' out/.config

          make -C kernel \
            O="$GITHUB_WORKSPACE/out" \
            -j2 Image 2>&1 | tee V64-build.log

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

      - name: Build ARM64 rootbroker and init wrapper
        shell: bash
        run: |
          set -euo pipefail

          aarch64-linux-gnu-gcc \
            -static -Os -Wall -Wextra -Werror \
            -o tools/rootbroker.arm64 \
            tools/rootbroker.c

          aarch64-linux-gnu-gcc \
            -static -Os -Wall -Wextra -Werror \
            -o tools/init-wrapper.arm64 \
            tools/init-wrapper.c

          file tools/rootbroker.arm64 tools/init-wrapper.arm64

          for elf in tools/rootbroker.arm64 tools/init-wrapper.arm64; do
            readelf -h "$elf" | grep -q 'Machine:.*AArch64'

            if readelf -l "$elf" | grep -q INTERP; then
              echo "ERROR: dynamically linked early boot binary: $elf" >&2
              exit 1
            fi
          done

      - name: Repack boot image and create Odin TAR
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/repack_boot.py

          test "$(stat -c %s deliver/boot.img)" = 37748736

          tar -C deliver \
            --format=ustar \
            -cf deliver/V64-EXPERIMENTAL-ODIN.tar \
            boot.img

          mkdir -p restore
          cp boot-original.img restore/boot.img

          tar -C restore \
            --format=ustar \
            -cf deliver/V64-ORIGINAL-RESTORE.tar \
            boot.img

          cp V64-build.log deliver/
          cp V64-applied-kernel.patch deliver/
          cp out/.config deliver/

          sha256sum \
            deliver/*.tar \
            deliver/boot.img \
            > deliver/V64-checksums.txt

          cat > deliver/IMPORTANT-READ-FIRST.txt <<'EOF'
          XCOVER4S V64 EXPERIMENTAL

          This package has NOT been boot-tested on hardware.

          No KernelSU or Magisk is installed by this workflow.

          Manual CP latch:
          echo 1 > /sys/kernel/cp_control/hard_off_lock

          Check result:
          cat /sys/kernel/cp_control/hard_off_result

          A result of 0 does NOT prove physical modem power-off.

          Not all CP reactivation paths have been verified.
          Emergency call paths have NOT been proven blocked.
          RF silence and Wi-Fi operation have NOT been verified.

          SELinux is not modified by this workflow.

          Rootbroker and init-wrapper are experimental.
          Boot failure remains possible.

          Do not flash without a working recovery procedure.
          EOF

          ls -lah deliver/

      - name: Upload V64 Odin and restore package
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V64-EXPERIMENTAL-FLASH-PACKAGE
          path: deliver/
          if-no-files-found: error
          retention-days: 14
