name: Build XCover4s KernelSU Next Legacy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kernel.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            curl \
            git

      - name: Download kernel source
        run: |
          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

      - name: Integrate KernelSU Next Legacy
        working-directory: kernel
        run: |
          set -eux
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      - name: Configure kernel and enable KernelSU
        working-directory: kernel
        run: |
          set -eux

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          ./scripts/config --file out/.config -e KPROBES
          ./scripts/config --file out/.config -e KPROBE_EVENTS
          ./scripts/config --file out/.config -e EXT4_FS
          ./scripts/config --file out/.config -e KSU_KPROBE_HOOKS
          ./scripts/config --file out/.config -e KSU

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== KernelSU config check ====="
          grep '^CONFIG_KPROBES=y' out/.config
          grep '^CONFIG_KPROBE_EVENTS=y' out/.config
          grep '^CONFIG_EXT4_FS=y' out/.config
          grep '^CONFIG_KSU_KPROBE_HOOKS=y' out/.config
          grep '^CONFIG_KSU=y' out/.config

      - name: Build KernelSU kernel
        working-directory: kernel
        run: |
          set -eux
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error"

      - name: Show build result
        working-directory: kernel
        run: |
          echo "===== FINAL KERNELSU CONFIG ====="
          grep '^CONFIG_KPROBES=y' out/.config
          grep '^CONFIG_KPROBE_EVENTS=y' out/.config
          grep '^CONFIG_EXT4_FS=y' out/.config
          grep '^CONFIG_KSU_KPROBE_HOOKS=y' out/.config
          grep '^CONFIG_KSU=y' out/.config

          echo
          echo "===== KERNEL FILES ====="
          ls -lh out/arch/arm64/boot/

      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-kernelsu-next-legacy
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/.config
          if-no-files-found: warn
