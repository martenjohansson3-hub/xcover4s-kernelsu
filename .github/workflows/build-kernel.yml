
name: XCOVER4S V32 KERNEL BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio

      - name: Clone kernel
        run: |
          set -euo pipefail
          mkdir -p diagnostics artifact
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel rev-parse HEAD > diagnostics/source-commit.txt

      - name: Apply V32 patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"Patch mismatch: {path}")
              p.write_text(s.replace(old, new))

          cp = Path("kernel/drivers/soc/samsung/cal-if/cal-if.c")
          s = cp.read_text()

          patches = [
              (
                  r'(void cal_cp_init\(void\)\s*\{\s*)'
                  r'pmucal_cp_init\(\);',
                  'pr_warn("V32 CP init blocked");\n'
                  '\tpmucal_cp_reset_assert();'
              ),
              (
                  r'(void cal_cp_reset_release\(void\)\s*\{\s*)'
                  r'pmucal_cp_reset_release\(\);',
                  'pr_warn("V32 CP release blocked");\n'
                  '\tpmucal_cp_reset_assert();'
              )
          ]

          for pattern, body in patches:
              s, count = re.subn(
                  pattern,
                  lambda m, b=body: m.group(1) + b,
                  s
              )
              if count != 1:
                  raise SystemExit(f"CP patch mismatch: {count}")

          cp.write_text(s)

          base = "kernel/drivers/video/fbdev/exynos/dpu_7885/"

          replace_once(
              base + "decon_reg.c",
              "const double decon_clocks_table[][CLK_ID_MAX]",
              "const unsigned long decon_clocks_table[][CLK_ID_MAX]"
          )

          replace_once(
              base + "decon.h",
              "#define decon_create_debugfs(...) do { } while(0)",
              "#define decon_create_debugfs(...) (0)"
          )

          replace_once(
              base + "decon.h",
              "#define decon_destroy_debugfs(..) do { } while(0)",
              "#define decon_destroy_debugfs(...) do { } while(0)"
          )

          helper = Path(base + "helper.c")
          hs = helper.read_text()

          if not re.search(r'\bACQUIRE_FENCE_LEN\b', hs):
              raise SystemExit("Fence reference missing")

          if not re.search(
              r'^\s*#\s*define\s+ACQUIRE_FENCE_LEN\b',
              hs, re.M
          ):
              helper.write_text(
                  "#ifndef ACQUIRE_FENCE_LEN\n"
                  "#define ACQUIRE_FENCE_LEN 1024\n"
                  "#endif\n\n" + hs
              )

          # V32: Avoid compiling ABD event-log reader
          # when its required definitions are unavailable.
          abd = Path(base + "decon_abd.c")
          s = abd.read_text()

          lines = s.splitlines(keepends=True)
          start = None

          for i, line in enumerate(lines):
              if re.search(
                  r'^\s*(?:static\s+)?(?:int|void)\s+'
                  r'\w*event\w*\s*\(',
                  line
              ):
                  if i + 25 < len(lines):
                      block = "".join(lines[i:i+45])
                      if "event_log_idx" in block:
                          start = i
                          break

          if start is None:
              raise SystemExit(
                  "Could not identify ABD event-log function safely"
              )

          print(
              "Found ABD event-log function near line",
              start + 1
          )

          # Do not automatically alter unknown function
          # boundaries. Record source for diagnostics.
          Path("diagnostics-abd-location.txt").write_text(
              "".join(lines[max(0,start-10):start+100])
          )

          abd.write_text(s)
          PY

          git -C kernel diff > diagnostics/v32.patch
          cp kernel/diagnostics-abd-location.txt \
            diagnostics/abd-location.txt

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF \
            -d DEBUG_INFO_BTF_MODULES \
            -d KALLSYMS_ALL \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=out olddefconfig

          cp out/.config ../diagnostics/final.config

      - name: Fast targeted test
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 \
            drivers/soc/samsung/cal-if/cal-if.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_core.o \
            drivers/video/fbdev/exynos/dpu_7885/helper.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_abd.o \
            2>&1 | tee ../diagnostics/targeted-build.log

      - name: Full kernel build
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 Image \
            2>&1 | tee ../diagnostics/full-build.log

      - name: Package kernel
        run: |
          set -euo pipefail

          IMAGE=kernel/out/arch/arm64/boot/Image
          test -s "$IMAGE"

          cp "$IMAGE" artifact/Image
          cp diagnostics/v32.patch artifact/v32.patch
          cp diagnostics/final.config artifact/final.config

          sha256sum artifact/Image \
            > artifact/SHA256SUMS

          stat -c '%s bytes' "$IMAGE" \
            > artifact/kernel-size.txt

          cat > artifact/STATUS.txt <<'EOF'
          XCOVER4S V32

          Kernel compilation completed.

          CP reset-assert patch included.
          Physical modem power-off NOT verified.

          SELinux boot settings requested.
          Runtime SELinux state NOT verified.

          NOT AN ODIN FLASHABLE IMAGE.

          Requires original boot.img repacking,
          partition size validation and testing.
          EOF

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V32-KERNEL
          path: artifact/

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V32-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
