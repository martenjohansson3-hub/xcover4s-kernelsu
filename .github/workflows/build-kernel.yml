name: XCOVER4S V51 CP AUDIT FILTERED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang llvm lld \
            python3 cpio file ripgrep

          mkdir -p diagnostics

      - name: Download exact XCover 4s kernel
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            --single-branch \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          git checkout --detach \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          test "$(git rev-parse HEAD)" = \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git rev-parse HEAD \
            > ../diagnostics/source-commit.txt

      - name: Configure XCover 4s
        run: |
          set -euo pipefail

          cd kernel

          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig \
            2>&1 | tee ../diagnostics/config.log

          cp out/.config ../diagnostics/kernel.config

          grep -E \
            '^CONFIG_.*(MODEM|CP_|PMUCAL|EXYNOS)' \
            out/.config \
            > ../diagnostics/modem-config.txt || true

          grep -q '^CONFIG_CP_PMUCAL=y' out/.config
          grep -q '^CONFIG_SEC_MODEM_SS310AP=y' out/.config

      - name: Search CP restart paths
        run: |
          set -euo pipefail

          rg -n -i \
            --glob '*.[ch]' \
            'pmucal_cp_|cal_cp_|exynos_cp_|ss310ap_|cp_power|cp_reset|modem_reset|modem_on|modem_boot|boot_on|dump_start|CP_PWRON|CP_START|CP_ACTIVE|IOCTL_MODEM_' \
            kernel/drivers \
            kernel/arch/arm64 \
            kernel/include \
            > diagnostics/all-cp-references.txt || true

          rg -n \
            --glob '*.[ch]' \
            'pmucal_cp_init|pmucal_cp_reset_release|pmucal_cp_reset_assert|exynos_cp_init|exynos_cp_release|exynos_cp_reset|exynos_set_cp_power_onoff|ss310ap_on|ss310ap_reset|ss310ap_boot_on|ss310ap_dump_start' \
            kernel \
            > diagnostics/restart-call-sites.txt || true

          rg -n \
            --glob '*.[ch]' \
            'panic\(|BUG\(|BUG_ON\(|WARN_ON\(' \
            kernel/drivers/misc/modem_v1 \
            kernel/drivers/soc/samsung/cal-if \
            > diagnostics/modem-panic-paths.txt || true

      - name: Save complete modem sources
        run: |
          set -euo pipefail

          tar -czf diagnostics/modem-v1-source.tar.gz \
            -C kernel \
            drivers/misc/modem_v1

          tar -czf diagnostics/cal-if-source.tar.gz \
            -C kernel \
            drivers/soc/samsung/cal-if

          if [ -f kernel/drivers/soc/samsung/pmu-cp.c ]; then
            cp kernel/drivers/soc/samsung/pmu-cp.c \
              diagnostics/pmu-cp.c
          fi

      - name: Analyze CP functions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")
          out = Path("diagnostics")

          names = [
              "ss310ap_on",
              "ss310ap_off",
              "ss310ap_reset",
              "ss310ap_boot_on",
              "ss310ap_boot_off",
              "ss310ap_dump_start",
              "pmucal_cp_init",
              "pmucal_cp_reset_assert",
              "pmucal_cp_reset_release",
              "exynos_cp_init",
              "exynos_cp_release",
              "exynos_cp_reset",
              "exynos_set_cp_power_onoff",
              "cal_cp_init",
              "cal_cp_reset_release",
          ]

          report = [
              "XCOVER4S V51 CP RESTART AUDIT",
              "=" * 50,
              "",
          ]

          for name in names:
              report.append("FUNCTION: " + name)
              found = False

              for p in root.rglob("*"):
                  if not p.is_file():
                      continue

                  if p.suffix not in (".c", ".h"):
                      continue

                  try:
                      lines = p.read_text(
                          errors="replace"
                      ).splitlines()
                  except OSError:
                      continue

                  for n, line in enumerate(lines, 1):
                      if re.search(
                          r"\b" + re.escape(name) + r"\b",
                          line
                      ):
                          found = True
                          report.append(
                              f"{p.relative_to(root)}:{n}: "
                              f"{line.strip()}"
                          )

              if not found:
                  report.append("NOT FOUND")

              report.append("")

          (out / "function-analysis.txt").write_text(
              "\n".join(report) + "\n"
          )

          print("CP function audit complete")
          PY

      - name: Compile CP components
        id: compile
        continue-on-error: true
        run: |
          set -euo pipefail

          cd kernel

          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            drivers/soc/samsung/cal-if/pmucal_cp.o \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.o \
            2>&1 | tee ../diagnostics/targeted-compile.log

          test -s \
            out/drivers/soc/samsung/cal-if/pmucal_cp.o

          test -s \
            out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o

      - name: Disassemble CP objects with filtered warnings
        if: steps.compile.outcome == 'success'
        run: |
          set -euo pipefail

          mkdir -p diagnostics/disassembly

          for object in \
            kernel/out/drivers/soc/samsung/cal-if/pmucal_cp.o \
            kernel/out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o
          do
            name="$(basename "$object" .o)"

            aarch64-linux-gnu-objdump \
              -d "$object" \
              > "diagnostics/disassembly/${name}.txt" \
              2> >(
                grep -vE \
                  'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)([[:space:]]|$)' \
                  >&2
              )
          done

          echo "Disassembly complete"

      - name: Save build status and source information
        if: always()
        run: |
          mkdir -p diagnostics

          {
            echo "XCOVER4S V51 DIAGNOSTICS"
            echo
            echo "Source commit:"
            if [ -d kernel/.git ]; then
              git -C kernel rev-parse HEAD
            else
              echo "Source unavailable"
            fi
            echo
            echo "Targeted compile outcome:"
            echo "${{ steps.compile.outcome }}"
            echo
            echo "Note:"
            echo "This is a source audit of the ORIGINAL kernel."
            echo "No V50 CP-off patch is applied."
            echo "No boot.img is generated."
            echo "No Odin TAR is generated."
            echo "Do not flash these diagnostic artifacts."
          } > diagnostics/README.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V51-CP-AUDIT-FILTERED
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow if CP compilation failed
        if: steps.compile.outcome == 'failure'
        run: |
          echo "CP compilation failed. Check targeted-compile.log"
          exit 1
