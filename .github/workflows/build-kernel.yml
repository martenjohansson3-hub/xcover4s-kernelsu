
name: XCOVER4S V31 TARGETED BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio

      - name: Clone kernel
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel rev-parse HEAD > diagnostics/source-commit.txt

      - name: Apply source fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"Patch mismatch: {path}")
              p.write_text(s.replace(old, new))

          cp = Path("kernel/drivers/soc/samsung/cal-if/cal-if.c")
          s = cp.read_text()

          patches = [
              (
                  r'(void cal_cp_init\(void\)\s*\{\s*)'
                  r'pmucal_cp_init\(\);',
                  'pr_warn("V31 CP init blocked");\n'
                  '\tpmucal_cp_reset_assert();'
              ),
              (
                  r'(void cal_cp_reset_release\(void\)\s*\{\s*)'
                  r'pmucal_cp_reset_release\(\);',
                  'pr_warn("V31 CP release blocked");\n'
                  '\tpmucal_cp_reset_assert();'
              )
          ]

          for pattern, body in patches:
              s, count = re.subn(
                  pattern,
                  lambda m, b=body: m.group(1) + b,
                  s
              )
              if count != 1:
                  raise SystemExit(f"CP patch mismatch: {count}")

          cp.write_text(s)

          base = "kernel/drivers/video/fbdev/exynos/dpu_7885/"

          replace_once(
              base + "decon_reg.c",
              "const double decon_clocks_table[][CLK_ID_MAX]",
              "const unsigned long decon_clocks_table[][CLK_ID_MAX]"
          )

          replace_once(
              base + "decon.h",
              "#define decon_create_debugfs(...) do { } while(0)",
              "#define decon_create_debugfs(...) (0)"
          )

          replace_once(
              base + "decon.h",
              "#define decon_destroy_debugfs(..) do { } while(0)",
              "#define decon_destroy_debugfs(...) do { } while(0)"
          )

          helper = Path(base + "helper.c")
          hs = helper.read_text()

          if not re.search(r'\bACQUIRE_FENCE_LEN\b', hs):
              raise SystemExit("ACQUIRE_FENCE_LEN reference missing")

          if not re.search(
              r'^\s*#\s*define\s+ACQUIRE_FENCE_LEN\b',
              hs, re.M
          ):
              helper.write_text(
                  "#ifndef ACQUIRE_FENCE_LEN\n"
                  "#define ACQUIRE_FENCE_LEN 1024\n"
                  "#endif\n\n" + hs
              )

          print("V31 patches applied")
          PY

          git -C kernel diff > diagnostics/v31.patch

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF \
            -d DEBUG_INFO_BTF_MODULES \
            -d KALLSYMS_ALL \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=out olddefconfig

          cp out/.config ../diagnostics/final.config

          if grep -q '^CONFIG_DECON_EVENT_LOG=y$' out/.config; then
            echo "DECON_EVENT_LOG enabled"
          else
            echo "DECON_EVENT_LOG not enabled"
          fi

      - name: Targeted compilation
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          set +e
          make O=out -j2 \
            drivers/soc/samsung/cal-if/cal-if.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_core.o \
            drivers/video/fbdev/exynos/dpu_7885/helper.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_abd.o \
            > ../diagnostics/targeted-build.log 2>&1

          RESULT=$?
          set -e

          tail -n 100 ../diagnostics/targeted-build.log

          if [ "$RESULT" -eq 0 ]; then
            echo "PASS" > ../diagnostics/STATUS.txt
          else
            echo "FAIL - exit code $RESULT" \
              > ../diagnostics/STATUS.txt
          fi

          exit "$RESULT"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V31-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
