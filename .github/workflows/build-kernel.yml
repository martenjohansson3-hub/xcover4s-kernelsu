name: XCover4s KernelSU v0.9.5 Drivers Compile Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            curl

      - name: Clone known-good kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo
          echo "===== KERNELSU COMMIT ====="
          git -C KernelSU rev-parse HEAD

          echo
          echo "===== INTEGRATION ====="
          grep -n "kernelsu" \
            drivers/Kconfig \
            drivers/Makefile || true

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          chmod +x scripts/config

          scripts/config \
            --file out/.config \
            -e OVERLAY_FS

          scripts/config \
            --file out/.config \
            -e KSU

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_(OVERLAY_FS|KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
            out/.config || true

          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config

          cp out/.config \
            "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: Compile drivers with KernelSU
        working-directory: kernel
        run: |
          set +e

          RAW="$GITHUB_WORKSPACE/drivers-build.log"
          : > "$RAW"

          echo "=========================================="
          echo " XCOVER4S DRIVERS + KERNELSU TEST"
          echo " CONFIG_OVERLAY_FS=y"
          echo " CONFIG_KSU=y"
          echo " NO BOOT IMAGE"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            drivers/ \
            > "$RAW" 2>&1

          RESULT=$?

          echo "$RESULT" \
            > "$GITHUB_WORKSPACE/drivers-build-result.txt"

          echo
          echo "===== LAST 500 RELEVANT LINES ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$RAW" | tail -500 || true

          echo
          echo "===== RESULT ====="
          echo "DRIVERS BUILD RESULT: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo "DRIVERS/KERNELSU BUILD FAILED"
            exit "$RESULT"
          fi

          echo
          echo "DRIVERS/KERNELSU BUILD SUCCESSFUL"

      - name: Inspect KernelSU output
        if: always()
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/ksu-output.txt"
          : > "$LOG"

          {
            echo "===== KernelSU source ====="

            find drivers/kernelsu \
              -maxdepth 2 \
              -type f \
              -print \
              2>/dev/null | sort || true

            echo
            echo "===== KernelSU compiled objects ====="

            find out/drivers/kernelsu \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== Search all KSU objects ====="

            find out \
              -type f \
              \( -iname '*ksu*.o' \
                 -o -path '*/kernelsu/*.o' \) \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== KernelSU references in build log ====="

            grep -niE \
              'kernelsu|ksu' \
              "$GITHUB_WORKSPACE/drivers-build.log" \
              2>/dev/null || true

          } >> "$LOG" 2>&1

          cat "$LOG"

      - name: Extract errors and warnings
        if: always()
        run: |
          set +e

          {
            echo "===== ERRORS ====="

            grep -niE \
              'error:|fatal error:|undefined reference|No rule to make target|make.*Error' \
              drivers-build.log \
              2>/dev/null || true

            echo
            echo "===== KERNELSU LINES ====="

            grep -niE \
              'kernelsu|ksu' \
              drivers-build.log \
              2>/dev/null || true

            echo
            echo "===== WARNINGS NEAR KERNELSU ====="

            grep -niE \
              'warning:.*kernelsu|kernelsu.*warning:|warning:.*ksu|ksu.*warning:' \
              drivers-build.log \
              2>/dev/null || true

          } > error-summary.txt

          cat error-summary.txt

      - name: Create summary
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 Drivers Compile Test"
            echo "============================================="
            echo
            echo "NO BOOT IMAGE"
            echo "NOT FOR FLASHING"
            echo

            echo "KERNEL COMMIT:"
            git -C kernel rev-parse HEAD 2>/dev/null || true

            echo
            echo "KERNELSU COMMIT:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true

            echo
            echo "CONFIG:"
            grep -E \
              'CONFIG_(OVERLAY_FS|KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
              kernel/out/.config \
              2>/dev/null || true

            echo
            echo "BUILD RESULT:"
            cat drivers-build-result.txt \
              2>/dev/null || echo "NO RESULT"

            echo
            echo "KERNELSU OBJECT COUNT:"
            find kernel/out/drivers/kernelsu \
              -type f \
              -name '*.o' \
              2>/dev/null | wc -l || true

          } > test-summary.txt

          cat test-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-drivers-compile-test
          path: |
            drivers-build.log
            drivers-build-result.txt
            kernel-config.txt
            ksu-output.txt
            error-summary.txt
            test-summary.txt
          if-no-files-found: warn
          retention-days: 14
