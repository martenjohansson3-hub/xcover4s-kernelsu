
name: XCOVER4S V25 FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio

      - name: Clone source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

          mkdir -p diagnostics
          git -C kernel rev-parse HEAD \
            > diagnostics/source-commit.txt

      - name: Apply V25 patches
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          cp = Path("kernel/drivers/soc/samsung/cal-if/cal-if.c")
          s = cp.read_text()

          patches = [
              (
                  r'(void cal_cp_init\(void\)\s*\{\s*)'
                  r'pmucal_cp_init\(\);',
                  'pr_warn("V25 CP init blocked");\n'
                  '\tpmucal_cp_reset_assert();'
              ),
              (
                  r'(void cal_cp_reset_release\(void\)\s*\{\s*)'
                  r'pmucal_cp_reset_release\(\);',
                  'pr_warn("V25 CP release blocked");\n'
                  '\tpmucal_cp_reset_assert();'
              )
          ]

          for pattern, body in patches:
              s, n = re.subn(
                  pattern,
                  lambda m, b=body: m.group(1) + b,
                  s
              )
              if n != 1:
                  raise SystemExit(
                      f"CP patch failed: {n} matches"
                  )

          cp.write_text(s)

          decon = Path(
              "kernel/drivers/video/fbdev/exynos/"
              "dpu_7885/decon_reg.c"
          )

          s = decon.read_text()
          old = "const double decon_clocks_table[][CLK_ID_MAX]"
          new = "const unsigned long decon_clocks_table[][CLK_ID_MAX]"

          if s.count(old) != 1:
              raise SystemExit("decon_reg.c patch failed")

          decon.write_text(s.replace(old, new))

          header = Path(
              "kernel/drivers/video/fbdev/exynos/"
              "dpu_7885/decon.h"
          )

          s = header.read_text()
          old = "#define decon_destroy_debugfs(..)"
          new = "#define decon_destroy_debugfs(...)"

          if s.count(old) != 1:
              raise SystemExit("decon.h patch failed")

          header.write_text(s.replace(old, new))

          print("All V25 patches applied")
          PY

          git -C kernel diff > diagnostics/v25.patch

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF \
            -d DEBUG_INFO_BTF_MODULES \
            -d KALLSYMS_ALL

          scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=out olddefconfig

          cp out/.config ../diagnostics/final.config

      - name: Fast targeted test
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 \
            drivers/soc/samsung/cal-if/cal-if.o \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.o \
            2>&1 | tee ../diagnostics/targeted-build.log

      - name: Full kernel build
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 Image \
            2>&1 | tee ../diagnostics/build.log

      - name: Measure and package
        run: |
          set -euo pipefail

          IMAGE=kernel/out/arch/arm64/boot/Image
          test -s "$IMAGE"

          mkdir -p artifact

          SIZE=$(stat -c%s "$IMAGE")

          {
            echo "V25 Image: $SIZE bytes"
            echo "Original kernel: 23327848 bytes"
            echo "Boot partition: 37748736 bytes"
            echo "Actual fit requires boot image repacking."
          } | tee diagnostics/kernel-size.txt

          cp "$IMAGE" artifact/Image
          cp diagnostics/v25.patch artifact/v25.patch
          cp diagnostics/final.config artifact/final.config
          cp diagnostics/kernel-size.txt artifact/kernel-size.txt

          sha256sum artifact/Image > artifact/SHA256SUMS

          cat > artifact/STATUS.txt <<'EOF'
          XCOVER4S V25

          CP reset-assert patch included.
          Actual modem power-off is unverified.

          SELinux permissive boot setting requested.
          Runtime SELinux state is unverified.

          NOT FLASHABLE YET.
          Requires boot.img repacking and verification.
          EOF

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V25-KERNEL
          path: artifact/

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V25-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
