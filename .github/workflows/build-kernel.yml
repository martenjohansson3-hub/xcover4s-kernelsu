name: XCover4s KSU v0.9.5 SELinux Generate Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git clang lld llvm \
            libssl-dev libelf-dev gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu curl

      - name: Clone known-good kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel
          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo "===== KERNELSU COMMIT ====="
          git -C KernelSU rev-parse HEAD

          echo "===== INTEGRATION ====="
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile || true

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          chmod +x scripts/config

          scripts/config --file out/.config -e OVERLAY_FS
          scripts/config --file out/.config -e KSU

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "===== CONFIG ====="

          grep -E \
            'CONFIG_(OVERLAY_FS|KSU|SECURITY_SELINUX)' \
            out/.config || true

          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config

          cp out/.config "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: Inspect SELinux build rules
        working-directory: kernel
        run: |
          set +e

          {
            echo "===== security/selinux/Makefile ====="
            cat security/selinux/Makefile 2>/dev/null || true

            echo
            echo "===== include Makefile ====="
            cat security/selinux/include/Makefile 2>/dev/null || true

            echo
            echo "===== flask references ====="

            grep -Rni \
              'flask.h' \
              security/selinux \
              scripts \
              2>/dev/null || true

            echo
            echo "===== genheaders / flask targets ====="

            grep -RniE \
              'genheaders|flask|av_permissions' \
              security/selinux/Makefile \
              security/selinux/include \
              scripts \
              2>/dev/null || true

          } > "$GITHUB_WORKSPACE/selinux-rules.txt"

          cat "$GITHUB_WORKSPACE/selinux-rules.txt"

      - name: Generate SELinux headers
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/selinux-generate.log"
          : > "$LOG"

          echo "=========================================="
          echo " GENERATING SELINUX HEADERS"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            security/selinux/ \
            > "$LOG" 2>&1

          RESULT=$?

          echo "$RESULT" \
            > "$GITHUB_WORKSPACE/selinux-generate-result.txt"

          echo "===== RESULT: $RESULT ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$LOG" | tail -400 || true

          exit 0

      - name: Locate generated SELinux headers
        working-directory: kernel
        run: |
          set +e

          {
            echo "===== FLASK.H ====="

            find . \
              -type f \
              -name flask.h \
              -printf '%p %s bytes\n' \
              2>/dev/null || true

            echo
            echo "===== AV_PERMISSIONS.H ====="

            find . \
              -type f \
              -name av_permissions.h \
              -printf '%p %s bytes\n' \
              2>/dev/null || true

            echo
            echo "===== OUT SECURITY FILES ====="

            find out/security \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

          } > "$GITHUB_WORKSPACE/generated-headers.txt"

          cat "$GITHUB_WORKSPACE/generated-headers.txt"

      - name: Compile drivers with KernelSU
        working-directory: kernel
        run: |
          set +e

          RAW="$GITHUB_WORKSPACE/ksu-build.log"
          : > "$RAW"

          echo "=========================================="
          echo " KERNELSU COMPILE AFTER SELINUX"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            drivers/ \
            > "$RAW" 2>&1

          RESULT=$?

          echo "$RESULT" \
            > "$GITHUB_WORKSPACE/ksu-build-result.txt"

          echo
          echo "===== KSU BUILD RESULT: $RESULT ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$RAW" | tail -500 || true

          exit 0

      - name: Inspect KernelSU compilation
        if: always()
        working-directory: kernel
        run: |
          set +e

          {
            echo "===== KERNELSU OUTPUT ====="

            find out/drivers/kernelsu \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== OBJECTS ====="

            find out/drivers/kernelsu \
              -type f \
              -name '*.o' \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== KERNELSU BUILD LINES ====="

            grep -niE \
              'kernelsu|ksu' \
              "$GITHUB_WORKSPACE/ksu-build.log" \
              2>/dev/null || true

          } > "$GITHUB_WORKSPACE/ksu-objects.txt"

          cat "$GITHUB_WORKSPACE/ksu-objects.txt"

      - name: Extract important errors
        if: always()
        run: |
          set +e

          {
            echo "===== SELINUX ERRORS ====="

            grep -niE \
              'error:|fatal error:|No rule to make target|make.*Error' \
              selinux-generate.log \
              2>/dev/null || true

            echo
            echo "===== KERNELSU ERRORS ====="

            grep -niE \
              'error:|fatal error:|undefined reference|No rule to make target|make.*Error' \
              ksu-build.log \
              2>/dev/null || true

            echo
            echo "===== FLASK.H REFERENCES ====="

            grep -ni \
              'flask.h' \
              selinux-generate.log \
              ksu-build.log \
              2>/dev/null || true

          } > error-summary.txt

          cat error-summary.txt

      - name: Create summary
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 SELinux Generate Test"
            echo "=============================================="
            echo
            echo "NO BOOT IMAGE"
            echo "NOT FOR FLASHING"
            echo

            echo "KERNEL:"
            git -C kernel rev-parse HEAD 2>/dev/null || true

            echo
            echo "KERNELSU:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true

            echo
            echo "CONFIG:"
            grep -E \
              'CONFIG_(OVERLAY_FS|KSU|SECURITY_SELINUX)' \
              kernel/out/.config \
              2>/dev/null || true

            echo
            echo "SELINUX GENERATE RESULT:"
            cat selinux-generate-result.txt \
              2>/dev/null || echo "NO RESULT"

            echo
            echo "KSU BUILD RESULT:"
            cat ksu-build-result.txt \
              2>/dev/null || echo "NO RESULT"

            echo
            echo "FLASK.H:"
            find kernel \
              -type f \
              -name flask.h \
              -printf '%p %s bytes\n' \
              2>/dev/null || true

            echo
            echo "KSU OBJECT COUNT:"
            find kernel/out/drivers/kernelsu \
              -type f \
              -name '*.o' \
              2>/dev/null | wc -l || true

          } > test-summary.txt

          cat test-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-selinux-generate-test
          path: |
            kernel-config.txt
            selinux-rules.txt
            selinux-generate.log
            selinux-generate-result.txt
            generated-headers.txt
            ksu-build.log
            ksu-build-result.txt
            ksu-objects.txt
            error-summary.txt
            test-summary.txt
          if-no-files-found: warn
          retention-days: 14
