
name: XCOVER4S V36 CP POWER LOCK AUDIT

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Clone kernel
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          mkdir -p diagnostics
          git -C kernel rev-parse HEAD > diagnostics/source-commit.txt

      - name: Trace SS310AP power control
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")
          files = [
              "drivers/misc/modem_v1/modem_ctrl_ss310ap.c",
              "drivers/soc/samsung/cal-if/cal-if.c",
              "drivers/soc/samsung/cal-if/pmucal_cp.c",
          ]

          pattern = re.compile(
              r"CP_POWER_(ON|OFF)|cal_cp_(init|reset|status)"
              r"|pmucal_cp_|ss310ap_(on|off|reset)"
              r"|exynos_(set_cp_power_onoff|cp_release|cp_reset)"
              r"|IOCTL_MODEM_ON"
          )

          for rel in files:
              p = root / rel
              if not p.exists():
                  raise SystemExit("Missing: " + rel)

              lines = p.read_text(errors="replace").splitlines()
              hits = [
                  i for i, line in enumerate(lines)
                  if pattern.search(line)
              ]

              output = []
              for i in hits:
                  a = max(0, i - 9)
                  b = min(len(lines), i + 11)
                  output.append(f"\n--- {rel}:{i+1} ---\n")
                  output.extend(
                      f"{j+1}: {lines[j]}\n"
                      for j in range(a, b)
                  )

              Path(
                  "diagnostics/" + p.name + ".txt"
              ).write_text("".join(output))

          config = root / (
              "arch/arm64/configs/"
              "lineage_xcover4s_defconfig"
          )

          Path(
              "diagnostics/defconfig-modem.txt"
          ).write_text(
              "\n".join(
                  line for line in config.read_text().splitlines()
                  if re.search(
                      r"CP_|MODEM|SS310|PMUCAL", line
                  )
              ) + "\n"
          )

          callers = []
          for p in (root / "drivers").rglob("*.[ch]"):
              try:
                  for i, line in enumerate(
                      p.read_text(
                          errors="replace"
                      ).splitlines(), 1
                  ):
                      if re.search(
                          r"pmucal_cp_init\("
                          r"|pmucal_cp_reset_release\("
                          r"|exynos_set_cp_power_onoff\("
                          r"|IOCTL_MODEM_ON",
                          line
                      ):
                          callers.append(
                              f"{p.relative_to(root)}:"
                              f"{i}: {line.strip()}"
                          )
              except OSError:
                  pass

          Path(
              "diagnostics/all-power-callers.txt"
          ).write_text("\n".join(callers) + "\n")

          Path("diagnostics/README.txt").write_text(
              "V36 CP POWER AUDIT\n"
              "No kernel or Odin TAR produced.\n"
              "V35 patched an inactive preprocessor branch.\n"
              "Identify active power-off sequence and "
              "all reactivation paths before locking CP.\n"
          )

          print("V36 audit completed")
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V36-CP-POWER-AUDIT
          path: diagnostics/
          if-no-files-found: warn
