
name: XCOVER4S V63 - Permanent CP Off Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make python3 bc bison flex \
            build-essential clang llvm lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            libncurses-dev cpio zip unzip

      - name: Download kernel source
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          git -C kernel rev-parse HEAD | tee source-commit.txt

      - name: Verify permanent CP lock implementation
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("kernel")
          modem = root / "drivers/misc/modem_v1/modem_ctrl_ss310ap.c"
          cal = root / "drivers/soc/samsung/cal-if/pmucal_cp.c"

          for path in (modem, cal):
              if not path.is_file():
                  raise SystemExit(f"Missing source: {path}")

          source = modem.read_text(errors="replace")
          cal_source = cal.read_text(errors="replace")

          required = {
              "Manual hard-off interface": "hard_off_lock",
              "Persistent in-memory lock": "cp_hard_off_latched",
              "CP reset assertion": "cal_cp_reset_assert",
              "CP reset release": "cal_cp_reset_release",
              "CP power-on control": "cal_cp_power_on",
          }

          report = []
          for label, symbol in required.items():
              found = symbol in source or symbol in cal_source
              report.append(
                  f"{label}: {'FOUND' if found else 'MISSING'}"
              )

          Path("V63-CP-REVIEW.txt").write_text(
              "\n".join(report) + "\n"
          )

          print("\n".join(report))

          # V63 must never silently build an ordinary kernel
          # and claim the modem has a permanent hard-off lock.
          #
          # Presence of symbols alone is not sufficient:
          # all power-on and reset-release paths must be
          # reviewed, including callers outside these files.
          #
          # The verified patch must be added before this gate
          # can be removed.

          raise SystemExit(
              "V63 BLOCKED: permanent CP hard-off patch "
              "has not yet been verified against this "
              "kernel source. Refusing unsafe build."
          )
          PY

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          mkdir -p out
          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_BOOTPARAM \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=out ARCH=arm64 olddefconfig
          cp out/.config ../kernel-config.txt

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS=-Wno-error \
            -j2 Image \
            2>&1 | tee ../build.log

      - name: Collect source evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          for f in \
            source-commit.txt \
            V63-CP-REVIEW.txt \
            kernel-config.txt \
            build.log
          do
            if [ -f "$f" ]; then
              cp "$f" diagnostics/
            fi
          done

          if [ -d kernel/.git ]; then
            git -C kernel diff \
              > diagnostics/kernel-changes.patch
          fi

          for f in \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.c \
            drivers/soc/samsung/cal-if/pmucal_cp.c
          do
            if [ -f "kernel/$f" ]; then
              cp "kernel/$f" diagnostics/
            fi
          done

      - name: Upload V63 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V63-CP-SOURCES
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
