
name: XCOVER4S V21 - Quiet Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CLANG_TRIPLE: aarch64-linux-gnu-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-14 lld-14 gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev make python3

      - name: Fetch kernel
        run: |
          set -euo pipefail
          git init kernel
          git -C kernel remote add origin \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach FETCH_HEAD

      - name: Apply CP OFF and SELinux patches
        run: |
          set -euo pipefail

          cat > patch.py <<'PY'
          from pathlib import Path
          import re

          root = Path("kernel")
          path = root / "drivers/soc/samsung/pmu-cp.c"
          src = path.read_text()

          def replace_body(source, name, body):
              pattern = (
                  r"(?m)^[ \t]*int[ \t]+"
                  + re.escape(name)
                  + r"\s*\([^;{}]*\)\s*\{"
              )
              matches = list(re.finditer(pattern, source))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"{name}: {len(matches)} matches"
                  )

              start = matches[0].end() - 1
              depth = 0
              end = None

              for i in range(start, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break

              if end is None:
                  raise RuntimeError("Unmatched braces")

              return (
                  source[:start + 1]
                  + "\n" + body + "\n"
                  + source[end:]
              )

          src = replace_body(
              src,
              "exynos_cp_reset",
              "\treturn -EPERM;"
          )
          src = replace_body(
              src,
              "exynos_cp_release",
              "\treturn -EPERM;"
          )

          pattern = (
              r"(?m)^[ \t]*int[ \t]+"
              r"exynos_set_cp_power_onoff"
              r"\s*\(\s*enum\s+cp_mode\s+mode\s*\)\s*\{"
          )
          matches = list(re.finditer(pattern, src))
          if len(matches) != 1:
              raise RuntimeError("CP power function mismatch")

          at = matches[0].end()
          src = (
              src[:at]
              + "\n\tif (mode == CP_POWER_ON)\n"
              + "\t\treturn -EPERM;\n"
              + src[at:]
          )
          path.write_text(src)

          total = 0
          for filename in [
              "security/selinux/hooks.c",
              "security/selinux/ss/services.c",
          ]:
              p = root / filename
              text = p.read_text()
              text, count = re.subn(
                  r"\bselinux_enforcing\s*=\s*1\s*;",
                  "selinux_enforcing = 0;",
                  text
              )
              p.write_text(text)
              total += count

          if total != 5:
              raise RuntimeError(
                  f"SELinux assignments: {total}, expected 5"
              )

          print("CP and SELinux patches applied")
          PY

          python3 patch.py
          git -C kernel diff --check
          git -C kernel diff > kernel-v21.patch

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p out

          make O="$PWD/out" \
            lineage_xcover4s_defconfig

          python3 - <<'PY'
          from pathlib import Path

          p = Path("out/.config")
          lines = p.read_text().splitlines()

          values = {
              "CONFIG_SECURITY_SELINUX": "y",
              "CONFIG_SECURITY_SELINUX_DEVELOP": "y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM": "y",
              "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE": "1",
          }

          lines = [
              line for line in lines
              if not any(
                  line.startswith(k + "=")
                  or line == f"# {k} is not set"
                  for k in values
              )
          ]

          lines += [
              f"{k}={v}" for k, v in values.items()
          ]

          p.write_text("\n".join(lines) + "\n")
          PY

          make O="$PWD/out" \
            CC=clang-14 \
            KCFLAGS=-Wno-error \
            olddefconfig

      - name: Fast CP compile test
        working-directory: kernel
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --signal=TERM --kill-after=20s 8m \
            make -j4 O="$PWD/out" \
              CC=clang-14 \
              KCFLAGS=-Wno-error \
              drivers/soc/samsung/pmu-cp.o \
              > targeted-build.log 2>&1

          RESULT=$?
          set -e

          grep -v \
            'aarch64-linux-gnu-objdump: Warning:' \
            targeted-build.log || true

          if [ "$RESULT" -ne 0 ]; then
            tail -80 targeted-build.log
            exit "$RESULT"
          fi

          echo "CP compile PASSED"

      - name: Full kernel build - filtered output
        working-directory: kernel
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting kernel compilation..."
          date -u

          set +e
          timeout --signal=TERM --kill-after=30s 35m \
            make -j4 O="$PWD/out" \
              CC=clang-14 \
              KCFLAGS=-Wno-error \
              Image dtbs \
              > build.log 2>&1

          RESULT=$?
          set -e

          echo "===== BUILD OUTPUT ====="

          grep -v \
            'aarch64-linux-gnu-objdump: Warning:' \
            build.log | tail -150 || true

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Kernel build failed: $RESULT"
            exit "$RESULT"
          fi

          test -s out/arch/arm64/boot/Image

          echo "KERNEL COMPILED SUCCESSFULLY"
          ls -lh out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V21-KERNEL
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/build.log
            kernel/targeted-build.log
            kernel-v21.patch
          retention-days: 14

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V21-DIAGNOSTICS
          path: |
            patch.py
            kernel-v21.patch
            kernel/build.log
            kernel/targeted-build.log
            kernel/out/.config
          if-no-files-found: warn
          retention-days: 14
