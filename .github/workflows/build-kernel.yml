          git apply /tmp/v55.patch
          git diff --check

      - name: V58 early CP shutdown and permanent latch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCP'
          from pathlib import Path

          p = Path(
              'kernel/drivers/soc/samsung/cal-if/pmucal_cp.c'
          )

          s = p.read_text()

          # V55 must already provide the CP-off mechanism.
          required = [
              'v46_cp_off_set',
              'v46_cp_off_latched',
              'pmucal_cp_reset_assert',
              'pmucal_cp_reset_release'
          ]

          for symbol in required:
              if symbol not in s:
                  raise SystemExit(
                      'Missing V55 symbol: ' + symbol
                  )

          if s.count('static int v46_cp_off_set(') != 2:
              raise SystemExit(
                  'Unexpected V55 CP-off function layout'
              )

          if '#include <linux/init.h>' not in s:
              s = '#include <linux/init.h>\n' + s

          # Request shutdown during kernel initialization.
          # Latch is activated only if the existing V55
          # status verification succeeds.
          code = r'''
          /*
           * XCOVER4S V58
           * Automatic CP shutdown.
           * Keep the V55 restart protection.
           */
          static int __init v58_cp_off_init(void)
          {
              int ret;

              pr_info("V58: requesting early CP shutdown\n");

              ret = v46_cp_off_set("1", NULL);

              if (ret) {
                  pr_err(
                      "V58: CP shutdown failed: %d\n",
                      ret
                  );
              } else {
                  pr_info(
                      "V58: CP shutdown latched\n"
                  );
              }

              return 0;
          }

          late_initcall(v58_cp_off_init);
          '''

          if 'v58_cp_off_init' in s:
              raise SystemExit(
                  'V58 already applied'
              )

          p.write_text(s + '\n' + code)
          PYCP

      - name: V58 SELinux permissive at boot
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYSEL'
          from pathlib import Path
          import re

          p = Path(
              'kernel/security/selinux/hooks.c'
          )

          s = p.read_text()

          pattern = (
              r'(?m)^(\s*(?:static\s+)?int\s+'
              r'selinux_enforcing\s*=\s*)1(\s*;)'
          )

          matches = list(re.finditer(pattern, s))

          if len(matches) != 1:
              raise SystemExit(
                  'SELinux default layout differs; '
                  'cannot safely patch'
              )

          m = matches[0]

          s = (
              s[:m.start()]
              + m.group(1)
              + '0'
              + m.group(2)
              + s[m.end():]
          )

          p.write_text(s)
          PYSEL

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          mkdir -p ../out

          make O=../out lineage_xcover4s_defconfig

          scripts/config \
            --file ../out/.config \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            -d SECURITY_SELINUX_DISABLE

          scripts/config \
            --file ../out/.config \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=../out olddefconfig

          grep CONFIG_SECURITY_SELINUX ../out/.config \
            > ../selinux-config.txt || true

      - name: Compile ARM64 kernel
        shell: bash
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export KCFLAGS=-Wno-error

          make O=../out -j2 Image \
            2>&1 | tee ../build.log

      - name: Collect V58 diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p deliver

          cp build.log deliver/ 2>/dev/null || true
          cp selinux-config.txt deliver/ 2>/dev/null || true
          cp out/.config deliver/kernel.config \
            2>/dev/null || true

          cp out/arch/arm64/boot/Image \
            deliver/Image 2>/dev/null || true

          if [ -d kernel/.git ]; then
            git -C kernel diff \
              > deliver/v58.patch || true

            git -C kernel rev-parse HEAD \
              > deliver/source-commit.txt || true
          fi

          cat > deliver/READ-ME.txt <<'EOF'
          XCOVER4S V58

          CP:
          Early automatic shutdown requested.
          V55 latch and restart guards retained.

          SELINUX:
          Boot-time permissive requested.

          IMPORTANT:
          Kernel Image is not an Odin-flashable TAR.
          Successful compilation does not prove CP RF-off.
          Boot and hardware behavior remain unverified.
          EOF

      - name: Upload V58 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V58-DIAGNOSTICS
          path: deliver/
          retention-days: 14
