name: XCover4s KernelSU v0.9.5 Overlay Compile Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            curl

          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Clone known-good kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== CLEAN SOURCE ====="
          git status --short

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " KERNELSU v0.9.5 INTEGRATION"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo
          echo "===== KERNELSU COMMIT ====="
          git -C KernelSU rev-parse HEAD

          echo
          echo "===== KERNELSU INTEGRATION ====="
          grep -n "kernelsu" drivers/Kconfig drivers/Makefile || true

      - name: Configure XCover4s kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          echo
          echo "===== ORIGINAL CONFIG ====="

          grep -E \
            'CONFIG_(OVERLAY_FS|KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
            out/.config || true

          cp out/.config \
            "$GITHUB_WORKSPACE/config-original.txt"

      - name: Enable OverlayFS and KernelSU
        working-directory: kernel
        run: |
          set -euxo pipefail

          chmod +x scripts/config

          echo "===== ENABLE OVERLAY_FS ====="

          scripts/config \
            --file out/.config \
            -e OVERLAY_FS

          echo "===== ENABLE KSU ====="

          scripts/config \
            --file out/.config \
            -e KSU

          echo
          echo "===== CONFIG BEFORE OLDDEFCONFIG ====="

          grep -E \
            'CONFIG_(OVERLAY_FS|KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
            out/.config || true

          cp out/.config \
            "$GITHUB_WORKSPACE/config-before-olddefconfig.txt"

          echo
          echo "===== RUN OLDDEFCONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_(OVERLAY_FS|KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
            out/.config || true

          cp out/.config \
            "$GITHUB_WORKSPACE/config-final.txt"

          echo
          echo "===== VERIFY OVERLAY_FS ====="

          if ! grep -q '^CONFIG_OVERLAY_FS=y$' out/.config; then
            echo "ERROR: CONFIG_OVERLAY_FS DID NOT SURVIVE OLDDEFCONFIG"
            exit 1
          fi

          echo "CONFIG_OVERLAY_FS=y confirmed."

          echo
          echo "===== VERIFY KERNELSU ====="

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "ERROR: CONFIG_KSU DID NOT SURVIVE OLDDEFCONFIG"
            exit 1
          fi

          echo "CONFIG_KSU=y confirmed."

      - name: Targeted KernelSU compile test
        working-directory: kernel
        run: |
          set +e

          RAW="$GITHUB_WORKSPACE/ksu-compile.log"
          : > "$RAW"

          echo "=========================================="
          echo " KERNELSU TARGETED COMPILE"
          echo " OVERLAY_FS=y"
          echo " KSU=y"
          echo " NO BOOT IMAGE"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            drivers/kernelsu/built-in.o \
            > "$RAW" 2>&1

          RESULT=$?

          echo "$RESULT" \
            > "$GITHUB_WORKSPACE/ksu-compile-result.txt"

          echo
          echo "===== COMPILE OUTPUT ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$RAW" | tail -500 || true

          echo
          echo "===== RESULT ====="
          echo "KernelSU compile result: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo "KERNELSU TARGETED COMPILE FAILED"
            exit "$RESULT"
          fi

          echo
          echo "KERNELSU TARGETED COMPILE SUCCESSFUL"

      - name: Verify KernelSU objects
        if: always()
        working-directory: kernel
        run: |
          set +e

          {
            echo "===== KernelSU build files ====="

            find out/drivers/kernelsu \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== built-in.o ====="

            ls -lh \
              out/drivers/kernelsu/built-in.o \
              2>/dev/null || true

          } | tee "$GITHUB_WORKSPACE/ksu-object-info.txt"

      - name: Create diagnostic summary
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 Overlay Compile Test"
            echo "============================================="
            echo
            echo "NO BOOT IMAGE"
            echo "NOT FOR FLASHING"
            echo

            echo "KERNEL COMMIT:"
            git -C kernel rev-parse HEAD 2>/dev/null || true

            echo
            echo "KERNELSU COMMIT:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true

            echo
            echo "FINAL CONFIG:"
            grep -E \
              'CONFIG_(OVERLAY_FS|KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
              kernel/out/.config 2>/dev/null || true

            echo
            echo "COMPILE RESULT:"
            cat ksu-compile-result.txt \
              2>/dev/null || echo "NO COMPILE RESULT"

          } > ksu-test-summary.txt

          cat ksu-test-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-overlay-compile-test
          path: |
            config-original.txt
            config-before-olddefconfig.txt
            config-final.txt
            ksu-compile.log
            ksu-compile-result.txt
            ksu-object-info.txt
            ksu-test-summary.txt
          if-no-files-found: warn
          retention-days: 14
