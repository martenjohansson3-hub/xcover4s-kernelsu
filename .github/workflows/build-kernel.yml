
name: XCOVER4S V22 FINAL PREFLIGHT

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Download kernel
        run: |
          set -euo pipefail
          git clone --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          mkdir -p diagnostics
          git -C kernel rev-parse HEAD \
            > diagnostics/commit.txt

      - name: Audit every CP power path
        run: |
          set -euo pipefail

          {
            echo "=== CP POWER CALLS ==="
            grep -RnE \
              'cal_cp_|pmucal_cp_|exynos_cp_|exynos_set_cp_power_onoff' \
              kernel/drivers/misc/modem_if \
              kernel/drivers/misc/modem_v1 \
              kernel/drivers/soc/samsung \
              || true

            echo "=== CP PMUCAL IMPLEMENTATION ==="
            grep -RnE \
              'pmucal_cp_(init|reset_assert|reset_release)|cp_reset_assert|CP_PWRON' \
              kernel/drivers/soc/samsung/cal-if \
              || true

          } > diagnostics/cp-power-paths.txt

      - name: Audit GNSS dependencies
        run: |
          set -euo pipefail

          {
            echo "=== GNSS PMU REFERENCES ==="
            grep -RnE \
              'pmu|power|reset|clock|regulator|CP_|cp_' \
              kernel/drivers/misc/gnss_if \
              || true

            echo "=== GNSS CONFIG ==="
            grep -E \
              'CONFIG_.*(GNSS|GPS|CP_PMUCAL)' \
              kernel/arch/arm64/configs/lineage_xcover4s_defconfig \
              || true

          } > diagnostics/gnss-check.txt

      - name: Audit SELinux permissive options
        run: |
          set -euo pipefail

          {
            echo "=== SELINUX CONFIG ==="
            grep -E \
              '^CONFIG_SECURITY_SELINUX|^CONFIG_LSM' \
              kernel/arch/arm64/configs/lineage_xcover4s_defconfig \
              || true

            echo "=== SELINUX ENFORCING DEFAULT ==="
            grep -Rn \
              'CONFIG_SECURITY_SELINUX_DEVELOP' \
              kernel/security/selinux \
              kernel/arch/arm64/configs \
              || true

            echo "=== SELINUX BOOT PARAMETERS ==="
            grep -RnE \
              'enforcing=|selinux=|selinux_enforcing' \
              kernel/security/selinux \
              | head -100 || true

          } > diagnostics/selinux-check.txt

      - name: Record V22 build requirements
        run: |
          cat > diagnostics/next-build.txt <<'EOF'
          TARGET:
          Samsung XCover 4s /e/OS

          REQUIRED:
          1. CP shutdown sequence must complete.
          2. CP must not restart.
          3. GNSS startup must remain functional.
          4. Wi-Fi must remain functional.
          5. SELinux permissive in the same final build.
          6. Original boot image must remain untouched.

          STATUS:
          Source audit only.
          No flashable boot image produced.
          Hardware power-off not yet verified.
          EOF

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V22-FINAL-PREFLIGHT
          path: diagnostics/
          if-no-files-found: warn
