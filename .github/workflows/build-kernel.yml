name: XCover4s KernelSU v0.9.5 Full Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            curl \
            zip

          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Clone known-good kernel
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== SOURCE STATUS ====="
          git status --short

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " INTEGRATE KERNELSU v0.9.5"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo
          echo "===== KERNELSU COMMIT ====="
          git -C KernelSU rev-parse HEAD

          echo
          echo "===== KBUILD INTEGRATION ====="
          grep -n "kernelsu" \
            drivers/Kconfig \
            drivers/Makefile || true

      - name: Configure XCover4s KernelSU kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          chmod +x scripts/config

          scripts/config \
            --file out/.config \
            -e OVERLAY_FS

          scripts/config \
            --file out/.config \
            -e KSU

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_(KSU|OVERLAY_FS|SECURITY_SELINUX|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)' \
            out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX=y$' out/.config

          cp out/.config \
            "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: Generate SELinux headers
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/selinux-build.log"
          : > "$LOG"

          echo "=========================================="
          echo " GENERATING SELINUX HEADERS"
          echo "=========================================="

          (
            SECONDS_RUNNING=0

            while true; do
              echo "[HEARTBEAT] SELinux build running - ${SECONDS_RUNNING}s - $(date -u '+%H:%M:%S UTC')"
              sleep 30
              SECONDS_RUNNING=$((SECONDS_RUNNING + 30))
            done
          ) &

          HEARTBEAT_PID=$!

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            security/selinux/ \
            > "$LOG" 2>&1

          RESULT=$?

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          wait "$HEARTBEAT_PID" 2>/dev/null || true

          echo "$RESULT" \
            > "$GITHUB_WORKSPACE/selinux-result.txt"

          echo
          echo "===== SELINUX RESULT: $RESULT ====="

          find out/security/selinux \
            -name flask.h \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$LOG" | tail -200 || true

          if [ "$RESULT" -ne 0 ]; then
            exit "$RESULT"
          fi

          if [ ! -s out/security/selinux/flask.h ]; then
            echo "ERROR: flask.h WAS NOT GENERATED"
            exit 1
          fi

          echo "SELinux preparation successful."

      - name: Full KernelSU kernel build
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/full-build.log"
          : > "$LOG"

          echo "=========================================="
          echo " XCOVER4S FULL KERNELSU KERNEL BUILD"
          echo "=========================================="
          echo
          echo "This creates kernel artifacts only."
          echo "NO BOOT IMAGE."
          echo "NOT FOR FLASHING YET."
          echo

          (
            SECONDS_RUNNING=0

            while true; do
              echo "[HEARTBEAT] FULL KERNEL BUILD running - ${SECONDS_RUNNING}s - $(date -u '+%H:%M:%S UTC')"
              sleep 30
              SECONDS_RUNNING=$((SECONDS_RUNNING + 30))
            done
          ) &

          HEARTBEAT_PID=$!

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            > "$LOG" 2>&1

          RESULT=$?

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          wait "$HEARTBEAT_PID" 2>/dev/null || true

          echo "$RESULT" \
            > "$GITHUB_WORKSPACE/full-build-result.txt"

          echo
          echo "===== FULL BUILD RESULT: $RESULT ====="

          echo
          echo "===== LAST 500 RELEVANT LINES ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$LOG" | tail -500 || true

          if [ "$RESULT" -ne 0 ]; then
            echo
            echo "FULL KERNEL BUILD FAILED"
            exit "$RESULT"
          fi

          echo
          echo "FULL KERNEL BUILD SUCCESSFUL"

      - name: Verify kernel artifacts
        if: always()
        working-directory: kernel
        run: |
          set +e

          LOG="$GITHUB_WORKSPACE/artifact-info.txt"
          : > "$LOG"

          {
            echo "=========================================="
            echo " KERNEL ARTIFACT VERIFICATION"
            echo "=========================================="
            echo

            echo "===== Image ====="

            if [ -f out/arch/arm64/boot/Image ]; then
              ls -lh out/arch/arm64/boot/Image
              stat -c '%s bytes' out/arch/arm64/boot/Image
              sha256sum out/arch/arm64/boot/Image
              file out/arch/arm64/boot/Image
            else
              echo "Image NOT FOUND"
            fi

            echo
            echo "===== Image.gz ====="

            if [ -f out/arch/arm64/boot/Image.gz ]; then
              ls -lh out/arch/arm64/boot/Image.gz
              stat -c '%s bytes' out/arch/arm64/boot/Image.gz
              sha256sum out/arch/arm64/boot/Image.gz
              file out/arch/arm64/boot/Image.gz
            else
              echo "Image.gz NOT FOUND"
            fi

            echo
            echo "===== DTB / DTBO ====="

            find out/arch/arm64/boot \
              -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== KernelSU objects ====="

            find out/drivers/kernelsu \
              -type f \
              -name '*.o' \
              -printf '%p %s bytes\n' \
              2>/dev/null | sort || true

            echo
            echo "===== KernelSU strings in Image ====="

            if [ -f out/arch/arm64/boot/Image ]; then
              strings out/arch/arm64/boot/Image \
                | grep -iE 'KernelSU|kernelsu' \
                | head -50 || true
            fi

          } >> "$LOG" 2>&1

          cat "$LOG"

      - name: Extract errors and warnings
        if: always()
        run: |
          set +e

          {
            echo "===== ERRORS ====="

            grep -niE \
              'error:|fatal error:|undefined reference|No rule to make target|make.*Error' \
              full-build.log \
              2>/dev/null || true

            echo
            echo "===== KERNELSU BUILD LINES ====="

            grep -niE \
              'kernelsu|ksu' \
              full-build.log \
              2>/dev/null || true

            echo
            echo "===== SECTION MISMATCH ====="

            grep -ni \
              'section mismatch' \
              full-build.log \
              2>/dev/null || true

          } > build-diagnostics.txt

          cat build-diagnostics.txt

      - name: Copy successful kernel artifacts
        if: always()
        run: |
          set +e

          mkdir -p kernel-artifacts

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image \
              kernel-artifacts/Image
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz \
              kernel-artifacts/Image.gz
          fi

          find kernel/out/arch/arm64/boot \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp {} kernel-artifacts/ \; \
            2>/dev/null || true

          echo "===== COPIED ARTIFACTS ====="
          ls -lh kernel-artifacts || true

      - name: Create build summary
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 Full Kernel Build"
            echo "==========================================="
            echo
            echo "IMPORTANT:"
            echo "KERNEL ARTIFACT ONLY"
            echo "NO BOOT IMAGE"
            echo "DO NOT FLASH THESE FILES DIRECTLY"
            echo

            echo "KERNEL COMMIT:"
            git -C kernel rev-parse HEAD 2>/dev/null || true

            echo
            echo "KERNELSU COMMIT:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true

            echo
            echo "CONFIG:"
            grep -E \
              'CONFIG_(KSU|OVERLAY_FS|SECURITY_SELINUX)' \
              kernel/out/.config \
              2>/dev/null || true

            echo
            echo "SELINUX RESULT:"
            cat selinux-result.txt \
              2>/dev/null || echo "NO RESULT"

            echo
            echo "FULL BUILD RESULT:"
            cat full-build-result.txt \
              2>/dev/null || echo "NO RESULT"

            echo
            echo "IMAGE:"
            if [ -f kernel/out/arch/arm64/boot/Image ]; then
              stat -c '%s bytes' \
                kernel/out/arch/arm64/boot/Image
              sha256sum \
                kernel/out/arch/arm64/boot/Image
            else
              echo "NOT CREATED"
            fi

            echo
            echo "IMAGE.GZ:"
            if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              stat -c '%s bytes' \
                kernel/out/arch/arm64/boot/Image.gz
              sha256sum \
                kernel/out/arch/arm64/boot/Image.gz
            else
              echo "NOT CREATED"
            fi

          } > build-summary.txt

          cat build-summary.txt

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-full-kernel
          path: |
            kernel-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-full-diagnostics
          path: |
            kernel-config.txt
            selinux-build.log
            selinux-result.txt
            full-build.log
            full-build-result.txt
            artifact-info.txt
            build-diagnostics.txt
            build-summary.txt
          if-no-files-found: warn
          retention-days: 14
