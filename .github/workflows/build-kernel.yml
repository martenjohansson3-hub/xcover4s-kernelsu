name: XCover4s KernelSU v0.9.5 Compile Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            flex \
            git \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            curl \
            zip

          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Clone known-good kernel source
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== VERIFY CLEAN SOURCE ====="
          git status --short
          test -z "$(git status --porcelain)"

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " INTEGRATING KERNELSU v0.9.5"
          echo " NON-GKI TEST"
          echo "=========================================="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

          echo
          echo "===== KERNELSU DIRECTORY ====="
          test -d KernelSU
          ls -la KernelSU

          echo
          echo "===== KERNELSU COMMIT ====="
          git -C KernelSU rev-parse HEAD

          echo
          echo "===== SOURCE CHANGES AFTER KSU ====="
          git status --short

      - name: Configure kernel with KernelSU
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          echo "===== BASE CONFIG CREATED ====="

          if [ ! -x scripts/config ]; then
            chmod +x scripts/config || true
          fi

          scripts/config --file out/.config \
            -e KSU \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "===== KSU CONFIG ====="
          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS)=' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "ERROR: CONFIG_KSU IS NOT ENABLED"
            exit 1
          fi

          echo
          echo "CONFIG_KSU=y confirmed."

          cp out/.config "$GITHUB_WORKSPACE/kernel-config.txt"

      - name: KernelSU targeted compile test
        working-directory: kernel
        run: |
          set +e

          RAW="$GITHUB_WORKSPACE/ksu-target-build.log"
          : > "$RAW"

          echo "=========================================="
          echo " KERNELSU TARGETED COMPILE TEST"
          echo " NO BOOT IMAGE"
          echo " DO NOT FLASH"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            kernel/built-in.o \
            > "$RAW" 2>&1

          RESULT=$?

          echo "$RESULT" > "$GITHUB_WORKSPACE/ksu-target-result.txt"

          echo
          echo "===== LAST RELEVANT BUILD OUTPUT ====="

          grep -vE \
            'aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)' \
            "$RAW" | tail -400 || true

          echo
          echo "===== RESULT ====="
          echo "TARGET BUILD RESULT: $RESULT"

          if [ "$RESULT" -ne 0 ]; then
            echo "KERNELSU TARGETED BUILD FAILED"
            exit "$RESULT"
          fi

          echo "KERNELSU TARGETED BUILD SUCCESSFUL"

      - name: Verify KernelSU objects
        working-directory: kernel
        run: |
          set -euxo pipefail

          echo "===== SEARCH KERNELSU BUILD OUTPUT ====="

          find out \
            -type f \
            \( -name '*ksu*.o' \
               -o -path '*/KernelSU/*' \
               -o -path '*/kernelsu/*' \) \
            -print \
            | sort \
            | tee "$GITHUB_WORKSPACE/ksu-object-list.txt" \
            || true

          echo
          echo "===== KERNEL BUILT-IN OBJECT ====="

          if [ -s out/kernel/built-in.o ]; then
            ls -lh out/kernel/built-in.o
          else
            echo "ERROR: out/kernel/built-in.o WAS NOT CREATED"
            exit 1
          fi

      - name: Create test information
        if: always()
        run: |
          set +e

          {
            echo "XCover4s KernelSU v0.9.5 Compile Test"
            echo "===================================="
            echo
            echo "NO BOOT IMAGE"
            echo "NOT FOR FLASHING"
            echo
            echo "DATE:"
            date -u
            echo
            echo "KERNEL COMMIT:"
            git -C kernel rev-parse HEAD 2>/dev/null || true
            echo
            echo "KERNELSU COMMIT:"
            git -C kernel/KernelSU rev-parse HEAD 2>/dev/null || true
            echo
            echo "KERNELSU CONFIG:"
            grep -E \
              '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS)=' \
              kernel/out/.config 2>/dev/null || true
            echo
            echo "TARGET RESULT:"
            cat ksu-target-result.txt 2>/dev/null || echo "NO RESULT"
          } > ksu-test-info.txt

          cat ksu-test-info.txt

      - name: Upload KernelSU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-KSU-v095-target-test
          path: |
            ksu-target-build.log
            ksu-target-result.txt
            kernel-config.txt
            ksu-object-list.txt
            ksu-test-info.txt
          if-no-files-found: warn
          retention-days: 14
