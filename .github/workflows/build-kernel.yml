
name: XCover4s KernelSU-Next Legacy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            cpio curl flex git libssl-dev \
            python3 python-is-python3 \
            unzip wget xz-utils zip \
            gcc-aarch64-linux-gnu

      - name: Download Android Clang 11
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"

          curl -fL --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r383902b/clang-r383902b.tar.gz" \
            -o clang.tar.gz

          mkdir clang
          tar -xzf clang.tar.gz -C clang

          CLANG="$(find "$PWD/clang" -type f \
            -path '*/bin/clang' | head -n 1)"

          test -n "$CLANG"
          chmod +x "$CLANG"

          "$CLANG" --version
          echo "$(dirname "$CLANG")" \
            >> "$GITHUB_PATH"

      - name: Checkout XCover4s kernel
        run: |
          set -euo pipefail

          git clone --depth=1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          test -f arch/arm64/configs/lineage_xcover4s_defconfig

          git rev-parse HEAD \
            | tee "$GITHUB_WORKSPACE/kernel-commit.txt"

      - name: Integrate KernelSU-Next Legacy
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          test -d KernelSU
          test -f KernelSU/kernel/Makefile

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU_KPROBE_HOOKS

          make O=out olddefconfig

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_KPROBE_HOOKS)=' \
            out/.config \
            | tee "$GITHUB_WORKSPACE/ksu-config.txt"

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config

          cp out/.config \
            "$GITHUB_WORKSPACE/kernel.config"

      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -j"$(nproc)" \
            O=out \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb

          test -s out/arch/arm64/boot/Image.gz-dtb

          cp out/arch/arm64/boot/Image.gz-dtb \
            "$GITHUB_WORKSPACE/Image.gz-dtb"

          sha256sum "$GITHUB_WORKSPACE/Image.gz-dtb" \
            | tee "$GITHUB_WORKSPACE/kernel.sha256"

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCover4s-KernelSU-Next-Legacy-BUILD-ONLY
          path: |
            Image.gz-dtb
            kernel.config
            ksu-config.txt
            kernel-commit.txt
            kernel.sha256
          if-no-files-found: warn
          retention-days: 14
