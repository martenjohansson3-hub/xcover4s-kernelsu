name: XCOVER4S V59 EARLY CP HARD OFF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            libssl-dev libelf-dev \
            clang lld gcc-aarch64-linux-gnu \
            python3 zip gzip

      - name: Download kernel source
        shell: bash
        run: |
          set -euo pipefail

          git clone --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          cd kernel

          git checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git rev-parse HEAD > ../source-commit.txt

