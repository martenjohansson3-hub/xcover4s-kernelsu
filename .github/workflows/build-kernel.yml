name: XCOVER4S V64 - Experimental Odin boot with rootbroker and CP latch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v64:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Check out your files
        uses: actions/checkout@v4

      - name: Confirm original /e/OS boot image and scripts
        shell: bash
        run: |
          set -euo pipefail
          test -s boot-original-for-github.zip
          unzip -o boot-original-for-github.zip -d .
          test -s boot-original.img
          test -s tools/rootbroker.c
          test -s tools/init-wrapper.c
          test -s tools/apply_kernel.py
          test -s tools/repack_boot.py
          echo 'f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9  boot-original.img' | sha256sum -c -

      - name: Install pinned build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex git make clang lld \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 cpio gzip xz-utils

      - name: Get exactly the V62-tested kernel base
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel
          git -C kernel fetch --depth 1 origin 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          git -C kernel checkout --detach 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          test "$(git -C kernel rev-parse HEAD)" = 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Patch kernel CP latch and early SELinux default
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_kernel.py
          git -C kernel diff --check
          git -C kernel diff > V64-applied-kernel.patch
          test -s V64-applied-kernel.patch

      - name: Build full ARM64 Image with CP PMUCAL and overlayfs
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export KCFLAGS=-Wno-error
          mkdir -p out
          make -C kernel O="$GITHUB_WORKSPACE/out" lineage_xcover4s_defconfig
          kernel/scripts/config --file out/.config \
            -e CP_PMUCAL \
            -e OVERLAY_FS \
            -e SECURITY_SELINUX \
            -e SECURITY_SELINUX_DEVELOP \
            -e SECURITY_SELINUX_BOOTPARAM \
            -d SECURITY_SELINUX_DISABLE
          kernel/scripts/config --file out/.config --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0
          make -C kernel O="$GITHUB_WORKSPACE/out" olddefconfig
          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config
          grep -qx 'CONFIG_OVERLAY_FS=y' out/.config
          grep -qx 'CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0' out/.config
          make -C kernel O="$GITHUB_WORKSPACE/out" -j2 Image 2>&1 | tee V64-build.log
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

      - name: Build own static ARM64 rootbroker and init wrapper (NO KernelSU)
        shell: bash
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc -static -Os -Wall -Wextra -Werror \
            -o tools/rootbroker.arm64 tools/rootbroker.c
          aarch64-linux-gnu-gcc -static -Os -Wall -Wextra -Werror \
            -o tools/init-wrapper.arm64 tools/init-wrapper.c
          file tools/rootbroker.arm64 tools/init-wrapper.arm64
          for elf in tools/rootbroker.arm64 tools/init-wrapper.arm64; do
            readelf -h "$elf" | grep -q 'Machine:.*AArch64'
            if readelf -l "$elf" | grep -q INTERP; then
              echo "ERROR: $elf is dynamically linked and unsafe for early boot" >&2
              exit 1
            fi
          done

      - name: Repack original boot ramdisk and update AVB hash footer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/repack_boot.py
          test "$(stat -c %s deliver/boot.img)" = 37748736
          tar -C deliver --format=ustar -cf deliver/V64-EXPERIMENTAL-ODIN.tar boot.img
          mkdir -p restore
          cp boot-original.img restore/boot.img
          tar -C restore --format=ustar -cf deliver/V64-ORIGINAL-RESTORE.tar boot.img
          cp V64-build.log V64-applied-kernel.patch out/.config deliver/
          sha256sum deliver/*.tar deliver/boot.img > deliver/V64-checksums.txt
          printf '%s\n' \
            'V64 is FLASH-PACKAGED but has NOT been boot-tested on hardware.' \
            'No KernelSU, Magisk or authorization prompt; any su caller receives UID 0.' \
            'CP manually triggered: echo 1 > /sys/kernel/cp_control/hard_off_lock (as root).' \
            'After trigger: cat /sys/kernel/cp_control/hard_off_result; 0 is syscall success, NOT RF proof.' \
            'Physical radio shutdown and permanent CP inhibition are NOT verified.' \
            'Init wrapper and overlayfs su visibility are experimental and may bootloop.' \
            'Do not flash without Odin restore readiness and a verified download mode.' \
            > deliver/IMPORTANT-READ-FIRST.txt
          ls -lah deliver/

      - name: Upload V64 Odin package and original restore
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V64-EXPERIMENTAL-FLASH-PACKAGE
          path: deliver/
          if-no-files-found: error
          retention-days: 14
