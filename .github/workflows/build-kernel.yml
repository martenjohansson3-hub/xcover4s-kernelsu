name: XCover4s KernelSU Next Build + Diagnostics

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: System information
        run: |
          set -x
          uname -a
          lsb_release -a || true
          df -h
          free -h
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3

      - name: Show compiler versions
        run: |
          echo "===== GCC ====="
          aarch64-linux-gnu-gcc --version || true

          echo "===== CLANG ====="
          clang --version || true

          echo "===== LLD ====="
          ld.lld --version || true

          echo "===== MAKE ====="
          make --version || true

      - name: Clone XCover4s kernel
        run: |
          git clone --depth=1 --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git log -1 --oneline

          echo "===== TOP LEVEL ====="
          ls -la

          echo "===== DEFCONFIG SEARCH ====="
          find arch/arm64/configs -maxdepth 1 -type f | sort | grep -i xcover || true

      - name: Install KernelSU Next legacy
        working-directory: kernel
        run: |
          set -euxo pipefail

          rm -rf KernelSU-Next drivers/kernelsu

          git clone --depth=1 \
            --branch v3.4.0-legacy \
            https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

          echo "===== KERNELSU COMMIT ====="
          cd KernelSU-Next
          git log -1 --oneline
          cd ..

          cp -a KernelSU-Next/kernel drivers/kernelsu

          echo "===== KERNELSU FILES ====="
          find drivers/kernelsu -maxdepth 2 -type f | sort | head -200

      - name: Apply old-kernel compatibility fixes
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== BEFORE PATCHES ====="

          grep -R -n "full_name_hash" drivers/kernelsu || true
          grep -R -n "kvmalloc" drivers/kernelsu || true
          grep -R -n "ALIGN_DOWN" drivers/kernelsu || true

          # ----------------------------------------------------------
          # Old kernel full_name_hash() compatibility
          #
          # Newer kernels:
          # full_name_hash(salt, name, len)
          #
          # This Samsung kernel uses the older:
          # full_name_hash(name, len)
          # ----------------------------------------------------------

          grep -RIl 'full_name_hash([^,]*,[^,]*,[^,]*)' drivers/kernelsu \
            | while read -r f; do
                sed -E -i \
                  's/full_name_hash\([^,]+,[[:space:]]*([^,]+),[[:space:]]*([^)]+)\)/full_name_hash(\1, \2)/g' \
                  "$f" || true
              done

          # Known KernelSU usage.
          sed -i \
            's/full_name_hash(NULL, name, len)/full_name_hash(name, len)/g' \
            drivers/kernelsu/*.c 2>/dev/null || true

          sed -i \
            's/full_name_hash(NULL, name, strlen(name))/full_name_hash(name, strlen(name))/g' \
            drivers/kernelsu/*.c 2>/dev/null || true

          # ----------------------------------------------------------
          # kvmalloc() compatibility
          #
          # Older Samsung kernel doesn't provide kvmalloc.
          # vmalloc is adequate for the KernelSU buffer here.
          # ----------------------------------------------------------

          if grep -R -q '\bkvmalloc(' drivers/kernelsu; then
            grep -RIl '\bkvmalloc(' drivers/kernelsu | while read -r f; do
              sed -i 's/\bkvmalloc(/vmalloc(/g' "$f"

              if ! grep -q 'linux/vmalloc.h' "$f"; then
                sed -i '1i#include <linux/vmalloc.h>' "$f"
              fi
            done
          fi

          # ----------------------------------------------------------
          # ALIGN_DOWN compatibility
          #
          # The diagnostic build showed:
          #
          # adb_root.c:
          # implicit declaration of function ALIGN_DOWN
          #
          # Provide it only when the old kernel does not.
          # ----------------------------------------------------------

          ADBROOT="drivers/kernelsu/feature/adb_root.c"

          if [ -f "$ADBROOT" ]; then
            if grep -q 'ALIGN_DOWN' "$ADBROOT"; then
              if ! grep -q '#define ALIGN_DOWN' "$ADBROOT"; then

                sed -i '1i\
          #ifndef ALIGN_DOWN\
          #define ALIGN_DOWN(x, a) ALIGN((x) - ((a) - 1), (a))\
          #endif\
          ' "$ADBROOT"

              fi
            fi
          fi

          echo "===== AFTER PATCHES ====="

          echo "--- full_name_hash ---"
          grep -R -n "full_name_hash" drivers/kernelsu || true

          echo "--- kvmalloc ---"
          grep -R -n "kvmalloc" drivers/kernelsu || true

          echo "--- vmalloc ---"
          grep -R -n "vmalloc" drivers/kernelsu || true

          echo "--- ALIGN_DOWN ---"
          grep -R -n "ALIGN_DOWN" drivers/kernelsu || true

      - name: Add KernelSU to kernel build system
        working-directory: kernel
        run: |
          set -euxo pipefail

          if ! grep -q 'kernelsu/' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i\
          source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          echo "===== DRIVERS MAKEFILE ====="
          tail -30 drivers/Makefile

          echo "===== KCONFIG KSU ====="
          grep -n -C3 kernelsu drivers/Kconfig || true

      - name: Inspect KernelSU hooks
        working-directory: kernel
        run: |
          echo "=========================================="
          echo " KERNELSU HOOK DIAGNOSTICS"
          echo "=========================================="

          echo "===== exec hooks ====="
          grep -R -n \
            "ksu_handle_execve\|ksu_handle_execveat" \
            fs kernel security drivers/kernelsu 2>/dev/null || true

          echo "===== vfs hooks ====="
          grep -R -n \
            "ksu_handle_vfs_read\|ksu_handle_vfs_write\|ksu_handle_stat" \
            fs kernel security drivers/kernelsu 2>/dev/null || true

          echo "===== input hooks ====="
          grep -R -n \
            "ksu_handle_input_handle_event" \
            drivers input fs security 2>/dev/null || true

          echo "===== KernelSU symbols ====="
          grep -R -n \
            "ksu_handle_" \
            drivers/kernelsu | head -200 || true

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          rm -rf out
          mkdir -p out

          make O=out lineage_xcover4s_defconfig

          echo "CONFIG_KSU=y" >> out/.config

          make O=out olddefconfig

          echo "=========================================="
          echo " CONFIG DIAGNOSTICS"
          echo "=========================================="

          grep '^CONFIG_KSU' out/.config || true

          echo "===== CONFIG INFO ====="
          grep -E \
            'CONFIG_(ARM64|KSU|MODULES|SECURITY|KALLSYMS|OVERLAY_FS|TMPFS)' \
            out/.config || true

          cp out/.config kernel-config.txt

      - name: Pre-build source diagnostics
        working-directory: kernel
        run: |
          {
            echo "=========================================="
            echo " XCover4s PRE-BUILD DIAGNOSTICS"
            echo "=========================================="

            echo
            echo "===== DATE ====="
            date

            echo
            echo "===== KERNEL VERSION ====="
            make kernelversion || true

            echo
            echo "===== COMPILER ====="
            aarch64-linux-gnu-gcc --version || true

            echo
            echo "===== ALIGN_DOWN DEFINITIONS ====="
            grep -R -n \
              '#define ALIGN_DOWN' \
              include drivers/kernelsu 2>/dev/null || true

            echo
            echo "===== ALIGN_DOWN USAGE ====="
            grep -R -n \
              'ALIGN_DOWN' \
              drivers/kernelsu 2>/dev/null || true

            echo
            echo "===== FULL_NAME_HASH ====="
            grep -R -n \
              'full_name_hash' \
              drivers/kernelsu include/linux 2>/dev/null || true

            echo
            echo "===== KVMALLOC ====="
            grep -R -n \
              'kvmalloc' \
              drivers/kernelsu 2>/dev/null || true

            echo
            echo "===== VMALLOC ====="
            grep -R -n \
              'vmalloc' \
              drivers/kernelsu 2>/dev/null || true

            echo
            echo "===== KSU CONFIG ====="
            grep CONFIG_KSU out/.config || true

            echo
            echo "===== KSU MAKEFILE ====="
            cat drivers/kernelsu/Makefile || true

            echo
            echo "===== KSU KCONFIG ====="
            head -100 drivers/kernelsu/Kconfig || true

          } | tee prebuild-diagnostics.txt

      - name: Build kernel with heartbeat
        working-directory: kernel
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " STARTING KERNEL BUILD"
          echo " HEARTBEAT EVERY 30 SECONDS"
          echo "=========================================="

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          BUILD_LOG="$PWD/build.log"

          (
            make \
              O=out \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              KCFLAGS="-Wno-error" \
              -j"$(nproc)" \
              2>&1

            echo "${PIPESTATUS[0]}" > build-result.txt
          ) | tee "$BUILD_LOG" &

          BUILD_PID=$!

          SECONDS_RUNNING=0

          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 30
            SECONDS_RUNNING=$((SECONDS_RUNNING + 30))
            echo "Kernel build still running... ${SECONDS_RUNNING}s"
          done

          wait "$BUILD_PID"
          PIPE_RESULT=$?

          if [ -f build-result.txt ]; then
            RESULT=$(cat build-result.txt)
          else
            RESULT=$PIPE_RESULT
          fi

          echo
          echo "=========================================="
          echo " BUILD FINISHED - RESULT: $RESULT"
          echo "=========================================="

          echo "$RESULT" > final-build-result.txt

          # Do not fail here.
          # Diagnostics and artifacts must still run.
          exit 0

      - name: Analyze build result
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set +e

          echo "==========================================" | tee build-summary.txt
          echo " XCover4s BUILD ANALYSIS" | tee -a build-summary.txt
          echo "==========================================" | tee -a build-summary.txt

          if [ -f final-build-result.txt ]; then
            echo "Build result: $(cat final-build-result.txt)" \
              | tee -a build-summary.txt
          else
            echo "Build result file missing" \
              | tee -a build-summary.txt
          fi

          echo "" | tee -a build-summary.txt
          echo "===== REAL ERRORS =====" \
            | tee -a build-summary.txt

          if [ -f build.log ]; then
            grep -iE \
              '(^|[ :])(fatal error:|error:|undefined reference|implicit declaration|No such file|Error [0-9]+|FAILED)' \
              build.log \
              | tail -300 \
              | tee real-errors.txt \
              | tee -a build-summary.txt || true
          else
            echo "build.log missing" \
              | tee -a build-summary.txt
          fi

          echo "" | tee -a build-summary.txt
          echo "===== WARNINGS =====" \
            | tee -a build-summary.txt

          if [ -f build.log ]; then
            grep -i 'warning:' build.log \
              | tail -300 \
              > warnings.txt || true

            cat warnings.txt \
              | tee -a build-summary.txt || true
          fi

          echo "" | tee -a build-summary.txt
          echo "===== KERNELSU ERRORS/WARNINGS =====" \
            | tee -a build-summary.txt

          if [ -f build.log ]; then
            grep -iE \
              'kernelsu|ksu|adb_root|apk_sign|allowlist|full_name_hash|ALIGN_DOWN|kvmalloc' \
              build.log \
              | tail -500 \
              > kernelsu-build-lines.txt || true

            cat kernelsu-build-lines.txt \
              | tee -a build-summary.txt || true
          fi

      - name: Inspect generated kernel files
        if: always()
        working-directory: kernel
        run: |
          {
            echo "=========================================="
            echo " GENERATED FILE DIAGNOSTICS"
            echo "=========================================="

            echo
            echo "===== ARM64 BOOT DIRECTORY ====="
            ls -lah out/arch/arm64/boot/ 2>/dev/null || true

            echo
            echo "===== POSSIBLE KERNEL IMAGES ====="
            find out -type f \
              \( \
                -name 'Image' \
                -o -name 'Image.gz' \
                -o -name 'Image.gz-dtb' \
                -o -name 'zImage' \
                -o -name '*.dtb' \
              \) \
              -print \
              2>/dev/null || true

            echo
            echo "===== LARGE OUTPUT FILES ====="
            find out -type f -size +1M \
              -printf '%s %p\n' \
              2>/dev/null \
              | sort -nr \
              | head -100 || true

          } | tee output-files.txt

      - name: Hash generated kernel images
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set +e

          : > kernel-hashes.txt

          while IFS= read -r f; do
            echo "===== $f =====" >> kernel-hashes.txt
            ls -lh "$f" >> kernel-hashes.txt
            sha256sum "$f" >> kernel-hashes.txt
            file "$f" >> kernel-hashes.txt
            echo >> kernel-hashes.txt
          done < <(
            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              \( \
                -name 'Image' \
                -o -name 'Image.gz' \
                -o -name 'Image.gz-dtb' \
                -o -name '*.dtb' \
              \) \
              2>/dev/null
          )

          cat kernel-hashes.txt

      - name: Final diagnostic report
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          {
            echo "=========================================="
            echo " FINAL XCover4s DIAGNOSTIC REPORT"
            echo "=========================================="

            echo
            echo "Kernel source:"
            git remote -v || true

            echo
            echo "Kernel commit:"
            git log -1 --oneline || true

            echo
            echo "KernelSU commit:"
            git -C KernelSU-Next log -1 --oneline || true

            echo
            echo "Build result:"
            cat final-build-result.txt 2>/dev/null || echo UNKNOWN

            echo
            echo "CONFIG_KSU:"
            grep CONFIG_KSU out/.config 2>/dev/null || true

            echo
            echo "Kernel images:"
            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              \( \
                -name 'Image' \
                -o -name 'Image.gz' \
                -o -name 'Image.gz-dtb' \
              \) \
              -exec ls -lh {} \; \
              2>/dev/null || true

            echo
            echo "Number of errors:"
            grep -ciE \
              'fatal error:|error:|undefined reference|implicit declaration' \
              build.log 2>/dev/null || true

            echo
            echo "Number of warnings:"
            grep -ci 'warning:' \
              build.log 2>/dev/null || true

            echo
            echo "ALIGN_DOWN remaining references:"
            grep -R -n ALIGN_DOWN \
              drivers/kernelsu 2>/dev/null || true

            echo
            echo "kvmalloc remaining references:"
            grep -R -n '\bkvmalloc(' \
              drivers/kernelsu 2>/dev/null || true

            echo
            echo "=========================================="
            echo " END REPORT"
            echo "=========================================="

          } | tee final-diagnostic-report.txt

      - name: Prepare successful kernel artifact
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          mkdir -p kernel-artifact

          cp out/arch/arm64/boot/Image \
            kernel-artifact/ 2>/dev/null || true

          cp out/arch/arm64/boot/Image.gz \
            kernel-artifact/ 2>/dev/null || true

          cp out/arch/arm64/boot/Image.gz-dtb \
            kernel-artifact/ 2>/dev/null || true

          find out/arch/arm64/boot \
            -type f \
            -name '*.dtb' \
            -exec cp {} kernel-artifact/ \; \
            2>/dev/null || true

          cp kernel-hashes.txt \
            kernel-artifact/ 2>/dev/null || true

          ls -lah kernel-artifact

      - name: Upload complete diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-full-diagnostics
          if-no-files-found: warn
          path: |
            kernel/build.log
            kernel/build-summary.txt
            kernel/real-errors.txt
            kernel/warnings.txt
            kernel/kernelsu-build-lines.txt
            kernel/prebuild-diagnostics.txt
            kernel/output-files.txt
            kernel/kernel-hashes.txt
            kernel/final-diagnostic-report.txt
            kernel/kernel-config.txt
            kernel/final-build-result.txt

      - name: Upload built kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-kernelsu-next
          if-no-files-found: warn
          path: kernel/kernel-artifact/
