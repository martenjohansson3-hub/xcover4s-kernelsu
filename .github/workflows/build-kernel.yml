name: XCover4s - FINAL CP OFF + SELinux Permissive

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: kernel
  KERNEL_REPO: https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
  KERNEL_BRANCH: lineage-18.1
  KERNEL_DEFCONFIG: lineage_xcover4s_defconfig

  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            make \
            cpio \
            rsync \
            python3 \
            git

      - name: Clone kernel
        run: |
          set -eux

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo "========================================"
          echo "SOURCE COMMIT"
          echo "========================================"

          git -C "$KERNEL_DIR" rev-parse HEAD

      # ============================================================
      # SELINUX -> DEFAULT PERMISSIVE
      # ============================================================

      - name: Patch SELinux permissive
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):

              text = p.read_text(errors="ignore")
              old = text

              text = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  text
              )

              if text != old:
                  p.write_text(text)
                  changed.append(str(p))

          print("SELinux files changed:")

          for p in changed:
              print("  " + p)

          if not changed:
              raise SystemExit(
                  "ERROR: Could not locate SELinux enforcing defaults"
              )
          PY

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            || true

      # ============================================================
      # SS310AP / S327AP CP POWER LOCKOUT
      # ============================================================

      - name: Patch SS310AP CP permanently OFF
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          FILE="drivers/misc/modem_v1/modem_ctrl_ss310ap.c"

          test -f "$FILE"

          echo "========================================"
          echo "ORIGINAL SS310AP POWER CALLS"
          echo "========================================"

          grep -n \
            "exynos_set_cp_power_onoff" \
            "$FILE" || true

          cp "$FILE" modem_ctrl_ss310ap.original.c

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("drivers/misc/modem_v1/modem_ctrl_ss310ap.c")

          text = p.read_text()
          original = text

          # --------------------------------------------------------
          # 1. Disable every direct CP_POWER_ON request in this
          #    SS310AP-specific driver.
          #
          #    We deliberately do NOT touch GNSS, Wi-Fi or Bluetooth.
          # --------------------------------------------------------

          on_calls = len(re.findall(
              r'exynos_set_cp_power_onoff\s*\(\s*CP_POWER_ON\s*\)\s*;',
              text
          ))

          print("CP_POWER_ON calls found:", on_calls)

          if on_calls == 0:
              raise SystemExit(
                  "ERROR: No CP_POWER_ON call found in SS310AP driver"
              )

          text = re.sub(
              r'exynos_set_cp_power_onoff\s*\(\s*CP_POWER_ON\s*\)\s*;',
              'exynos_set_cp_power_onoff(CP_POWER_OFF); '
              '/* XCOVER4S: cellular CP locked OFF */',
              text
          )

          if text == original:
              raise SystemExit(
                  "ERROR: SS310AP source was not changed"
              )

          p.write_text(text)

          print(
              "All direct SS310AP CP_POWER_ON requests "
              "replaced with CP_POWER_OFF."
          )
          PY

          echo
          echo "========================================"
          echo "VERIFY CP_POWER_ON IS GONE FROM SS310AP"
          echo "========================================"

          if grep -nE \
            "exynos_set_cp_power_onoff[[:space:]]*\([[:space:]]*CP_POWER_ON" \
            "$FILE"
          then
            echo "ERROR: CP_POWER_ON still exists in SS310AP driver"
            exit 1
          fi

          echo "OK: no direct CP_POWER_ON remains."

          echo
          echo "========================================"
          echo "CP POWER CALLS AFTER PATCH"
          echo "========================================"

          grep -n \
            "exynos_set_cp_power_onoff" \
            "$FILE" || true

          echo
          echo "========================================"
          echo "SS310AP DIFF"
          echo "========================================"

          git diff -- "$FILE"

      # ============================================================
      # CONFIG
      # ============================================================

      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          rm -rf out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            "$KERNEL_DEFCONFIG"

          CONFIG="out/.config"

          test -f "$CONFIG"

          if grep -q \
            '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' \
            "$CONFIG"
          then

            sed -i \
              's/^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=.*/CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0/' \
              "$CONFIG"

          else

            echo \
              'CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0' \
              >> "$CONFIG"
          fi

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "========================================"
          echo "SELINUX CONFIG"
          echo "========================================"

          grep -E \
            "^CONFIG_SECURITY_SELINUX=|^CONFIG_SECURITY_SELINUX_BOOTPARAM=|^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=|^CONFIG_SECURITY_SELINUX_DEVELOP=" \
            "$CONFIG" || true

          VALUE="$(
            grep '^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=' \
              "$CONFIG" \
              | cut -d= -f2
          )"

          if [ "$VALUE" != "0" ]; then
            echo "ERROR: SELinux bootparam value != 0"
            exit 1
          fi

      # ============================================================
      # FINAL SAFETY VERIFICATION BEFORE COMPILATION
      # ============================================================

      - name: Verify final source patches
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          FILE="drivers/misc/modem_v1/modem_ctrl_ss310ap.c"

          echo "========================================"
          echo "FINAL SOURCE CHECK"
          echo "========================================"

          if grep -qE \
            "exynos_set_cp_power_onoff[[:space:]]*\([[:space:]]*CP_POWER_ON" \
            "$FILE"
          then
            echo "ERROR: SS310AP can still request CP_POWER_ON"
            exit 1
          fi

          grep -n \
            "XCOVER4S: cellular CP locked OFF" \
            "$FILE"

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            || true

          echo
          echo "SOURCE CHECK PASSED"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build final kernel
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        env:
          KCFLAGS: -Wno-error
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING FINAL XCOVER4S KERNEL"
          echo "SELINUX PERMISSIVE"
          echo "SS310AP CP POWER LOCKOUT"
          echo "========================================"

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            2>&1 \
          | awk '
              /aarch64-linux-gnu-objdump: Warning:/ { next }
              /Unrecognized form: 0x[0-9a-fA-F]+/ { next }
              /Corrupt attribute/ { next }
              /Bogus end-of-siblings marker/ { next }
              /Further warnings about bogus end-of-sibling markers suppressed/ { next }

              /^[[:space:]]+CC[[:space:]]+/ { next }
              /^[[:space:]]+LD[[:space:]]+/ { next }
              /^[[:space:]]+AS[[:space:]]+/ { next }
              /^[[:space:]]+AR[[:space:]]+/ { next }
              /^[[:space:]]+HOSTCC[[:space:]]+/ { next }
              /^[[:space:]]+HOSTLD[[:space:]]+/ { next }

              {
                  print
                  fflush()
              }
            ' \
          | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "MAKE EXIT CODE: $STATUS"
          echo "========================================"

          exit "$STATUS"

      # ============================================================
      # VERIFY RESULT
      # ============================================================

      - name: Verify final kernel
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo
          echo "========================================"
          echo "FINAL KERNEL BUILT"
          echo "========================================"

          ls -lh "$IMAGE"

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo
          echo "SELINUX:"
          grep -E \
            "^CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=" \
            out/.config

          echo
          echo "SS310AP:"
          grep -n \
            "XCOVER4S: cellular CP locked OFF" \
            drivers/misc/modem_v1/modem_ctrl_ss310ap.c

      # ============================================================
      # IMPORTANT WARNINGS ONLY
      # ============================================================

      - name: Show important messages
        if: always()
        working-directory: ${{ env.KERNEL_DIR }}
        shell: bash
        run: |
          echo "========================================"
          echo "IMPORTANT BUILD MESSAGES"
          echo "========================================"

          if [ -f build.log ]; then

            grep -iE \
              "error:|fatal error:|undefined reference|warning:|FAILED|Error [0-9]+|section mismatch" \
              build.log \
              | tail -300 || true

          fi

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package final results
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          IMAGE="${KERNEL_DIR}/out/arch/arm64/boot/Image"

          if [ -f "$IMAGE" ]; then
            cp \
              "$IMAGE" \
              artifacts/Image-FINAL-CP-OFF-SELINUX-PERMISSIVE
          fi

          if [ -f "${KERNEL_DIR}/out/.config" ]; then
            cp \
              "${KERNEL_DIR}/out/.config" \
              artifacts/kernel-config
          fi

          if [ -f "${KERNEL_DIR}/build.log" ]; then
            cp \
              "${KERNEL_DIR}/build.log" \
              artifacts/build.log
          fi

          if [ -f "${KERNEL_DIR}/modem_ctrl_ss310ap.original.c" ]; then
            cp \
              "${KERNEL_DIR}/modem_ctrl_ss310ap.original.c" \
              artifacts/
          fi

          if [ -f "${KERNEL_DIR}/drivers/misc/modem_v1/modem_ctrl_ss310ap.c" ]; then
            cp \
              "${KERNEL_DIR}/drivers/misc/modem_v1/modem_ctrl_ss310ap.c" \
              artifacts/modem_ctrl_ss310ap.PATCHED.c
          fi

          cd "${KERNEL_DIR}"

          git diff \
            -- security/selinux \
               drivers/misc/modem_v1/modem_ctrl_ss310ap.c \
            > ../artifacts/final-kernel.patch || true

          cd ..

          echo
          echo "========================================"
          echo "FINAL ARTIFACTS"
          echo "========================================"

          ls -lh artifacts/

      - name: Upload final kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-FINAL-CP-OFF-SELINUX-PERMISSIVE
          path: artifacts/
          if-no-files-found: error
