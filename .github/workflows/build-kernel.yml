
name: XCOVER4S V41 SINGLE CP TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        run: |
          mkdir -p dist
          echo "V41 SINGLE CP COMPILE TEST" > dist/README.txt
          echo "NOT FLASHABLE" >> dist/README.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev \
            libelf-dev python3

      - name: Download exact kernel source
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          git -C kernel fetch --depth 1 origin \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel checkout \
            6020dfa8315134187f07ca903c9d2ed7ee0256f5

          git -C kernel rev-parse HEAD \
            > dist/source-commit.txt

      - name: Apply V41 compile-test patch
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "kernel/drivers/soc/samsung/cal-if/pmucal_cp.c"
          )

          s = p.read_text()

          if "#include <linux/errno.h>" not in s:
              s = "#include <linux/errno.h>\n" + s

          if "#include <linux/printk.h>" not in s:
              s = "#include <linux/printk.h>\n" + s

          names = [
              "pmucal_cp_init",
              "pmucal_cp_reset_release",
          ]

          for name in names:
              pattern = (
                  r"(int\s+" + name +
                  r"\s*\(\s*void\s*\)\s*\{\s*int\s+ret\s*;)"
              )

              def patch(m):
                  return (
                      m.group(1)
                      + "\n\t/* CPLOCK_V41_TEST */\n"
                      + '\tpr_warn("CPLOCK V41: denied '
                      + name + '\\n");\n'
                      + "\treturn -EPERM;\n"
                  )

              s, count = re.subn(
                  pattern, patch, s, count=1
              )

              if count != 1:
                  raise SystemExit(
                      "Cannot safely patch " + name
                  )

              print("Patched", name)

          p.write_text(s)
          PY

          git -C kernel diff > dist/v41.patch
          test -s dist/v41.patch

      - name: Configure kernel
        run: |
          set -euo pipefail

          make -C kernel O=out \
            lineage_xcover4s_defconfig \
            > dist/configure.log 2>&1

          cp kernel/out/.config dist/kernel.config

      - name: Single targeted CP compile test
        id: test
        shell: bash
        run: |
          set -uo pipefail

          make -C kernel O=out -j2 \
            drivers/soc/samsung/cal-if/pmucal_cp.o \
            > dist/compile.log 2>&1

          RESULT=$?

          if [ "$RESULT" -eq 0 ] && \
             [ -s kernel/out/drivers/soc/samsung/cal-if/pmucal_cp.o ]; then
            echo "PASS" > dist/result.txt
            echo "CP source compiled successfully"
          else
            echo "FAIL" > dist/result.txt
            echo "CP source compilation failed"
            tail -100 dist/compile.log
            exit 1
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p dist

          {
            echo "XCOVER4S V41"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Flash ready: NO"
            echo
            echo "Files:"
            find dist -maxdepth 1 -type f \
              -printf '%f %s bytes\n'
          } > dist/diagnostics.txt

          if [ -d kernel/.git ]; then
            git -C kernel diff \
              > dist/v41.patch || true
          fi

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config \
              dist/kernel.config
          fi

          if [ -f dist/compile.log ]; then
            grep -n -E \
              'error:|warning:|Error |FAILED' \
              dist/compile.log \
              > dist/errors.txt || true
          fi

          if [ ! -f dist/result.txt ]; then
            echo "INCOMPLETE" > dist/result.txt
          fi

      - name: Upload V41 test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V41-SINGLE-TEST
          path: dist/
          if-no-files-found: error
          retention-days: 30
