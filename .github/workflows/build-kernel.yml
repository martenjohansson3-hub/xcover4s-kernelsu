
name: XCOVER4S V22 FULL KERNEL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-14 lld-14 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev cpio

      - name: Download source
        run: |
          set -euo pipefail
          git clone --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          mkdir -p diagnostics
          git -C kernel rev-parse HEAD \
            > diagnostics/source-commit.txt

      - name: Apply V22 CP experiment
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "kernel/drivers/soc/samsung/cal-if/cal-if.c"
          )
          s = p.read_text()

          changes = [
              (
                  "void cal_cp_init(void)\n"
                  "{\n\tpmucal_cp_init();\n}",
                  "void cal_cp_init(void)\n"
                  "{\n"
                  '\tpr_warn("V22 CP init blocked\\n");\n'
                  "\tpmucal_cp_reset_assert();\n}"
              ),
              (
                  "void cal_cp_reset_release(void)\n"
                  "{\n\tpmucal_cp_reset_release();\n}",
                  "void cal_cp_reset_release(void)\n"
                  "{\n"
                  '\tpr_warn("V22 CP release blocked\\n");\n'
                  "\tpmucal_cp_reset_assert();\n}"
              )
          ]

          for old, new in changes:
              if s.count(old) != 1:
                  raise SystemExit(
                      "Unexpected CP source. Stopping."
                  )
              s = s.replace(old, new)

          p.write_text(s)
          PY

          git -C kernel diff \
            > diagnostics/v22.patch

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out lineage_xcover4s_defconfig

          grep -q '^CONFIG_CP_PMUCAL=y' out/.config

          scripts/config --file out/.config \
            -e SECURITY_SELINUX_DEVELOP \
            -d SECURITY_SELINUX_BOOTPARAM_VALUE \
            --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0

          make O=out olddefconfig

          cp out/.config ../diagnostics/final.config

      - name: Compile kernel
        run: |
          set -o pipefail
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS=-Wno-error

          make O=out -j2 Image \
            2>&1 | tee ../diagnostics/build.log

      - name: Collect kernel
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp kernel/out/arch/arm64/boot/Image \
            artifact/Image

          test -s artifact/Image

          sha256sum artifact/Image \
            > artifact/SHA256SUMS

          cp diagnostics/v22.patch artifact/

          echo "Kernel compilation passed" \
            > artifact/STATUS.txt

          echo "CP hardware power-off unverified" \
            >> artifact/STATUS.txt

          echo "SELinux runtime state unverified" \
            >> artifact/STATUS.txt

          echo "NOT FLASHABLE" \
            >> artifact/STATUS.txt

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V22-KERNEL
          path: artifact/

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V22-BUILD-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
