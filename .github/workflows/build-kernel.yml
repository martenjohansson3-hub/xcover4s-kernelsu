
      - name: Diagnose KernelSU hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== KERNEL COMMIT ==="
          git rev-parse HEAD

          echo "=== KERNELSU VERSION ==="
          grep -n -E 'KernelSU-Next version|No hooks were defined' \
            drivers/kernelsu/Kbuild

          echo "=== HOOK DETECTION LOGIC ==="
          sed -n '100,200p' drivers/kernelsu/Kbuild

          echo "=== AVAILABLE KERNEL HOOKS ==="
          grep -R -n -E \
            'ksu_handle_(prctl|stat|sys_reboot|vfs_read|execveat|input)' \
            fs kernel drivers include security \
            --include='*.c' --include='*.h' \
            | head -250 \
            | tee "$GITHUB_WORKSPACE/kernel-hook-candidates.txt" || true

          echo "=== KPROBE SUPPORT ==="
          grep -E '^CONFIG_(KPROBES|KPROBE_EVENTS|KSU)=' out/.config || true

          echo "=== KERNELSU HOOK REFERENCES ==="
          grep -R -n -E \
            'manual hooks|No hooks were defined|KSU.*HOOK|HOOKS' \
            drivers/kernelsu \
            --include='Kbuild' --include='Kconfig' \
            --include='*.md' \
            | head -200 \
            | tee "$GITHUB_WORKSPACE/kernelsu-hook-requirements.txt" || true

      - name: Upload hook diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCover4s-KernelSU-Hook-Diagnostics
          path: |
            kernel-hook-candidates.txt
            kernelsu-hook-requirements.txt
          if-no-files-found: warn
          retention-days: 14
