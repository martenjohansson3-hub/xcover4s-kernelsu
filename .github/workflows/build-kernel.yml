name: XCover4s CP v12 - Source Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  KCFLAGS: -Wno-error

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:

      - name: Install build tools
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Clone exact kernel source
        run: |
          set -eux

          rm -rf kernel

          git clone \
            --depth 1 \
            --branch lineage-18.1 \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel

          echo
          echo "========================================"
          echo "KERNEL COMMIT"
          echo "========================================"

          git -C kernel rev-parse HEAD

      - name: Locate modem and CP source
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "CP / MODEM SOURCE FILES"
          echo "========================================"

          find drivers -type f \
            \( \
              -iname '*cp*.c' \
              -o -iname '*modem*.c' \
              -o -iname '*ss310*.c' \
            \) \
            | sort

      - name: Inspect pmu-cp source
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          FILE="drivers/soc/samsung/pmu-cp.c"

          test -f "$FILE"

          echo
          echo "========================================"
          echo "FILE"
          echo "$FILE"
          echo "========================================"

          wc -l "$FILE"

          echo
          echo "========================================"
          echo "FUNCTIONS"
          echo "========================================"

          grep -n \
            -E \
            '^[[:space:]]*(static[[:space:]]+)?(int|void|bool|u32)[[:space:]]+[a-zA-Z0-9_]*cp[a-zA-Z0-9_]*[[:space:]]*\(' \
            "$FILE" \
            || true

          echo
          echo "========================================"
          echo "CP SYMBOLS"
          echo "========================================"

          grep -n \
            -E \
            'CP_POWER_ON|CP_POWER_OFF|CP_PWRON|CP_START|CP_RESET|CP_CTRL|exynos_cp_|exynos_set_cp_power' \
            "$FILE" \
            || true

      - name: Dump complete CP functions
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          FILE="drivers/soc/samsung/pmu-cp.c"

          python3 <<'PY'
          from pathlib import Path

          p = Path("drivers/soc/samsung/pmu-cp.c")
          s = p.read_text()

          names = [
              "exynos_cp_reset",
              "exynos_cp_release",
              "exynos_set_cp_power_onoff",
          ]

          def extract(text, name):
              markers = [
                  "int " + name + "(",
                  "static int " + name + "(",
                  "void " + name + "(",
                  "static void " + name + "(",
              ]

              start = -1

              for marker in markers:
                  x = text.find(marker)
                  if x >= 0:
                      start = x
                      break

              if start < 0:
                  return None

              brace = text.find("{", start)

              if brace < 0:
                  return None

              depth = 0
              i = brace

              while i < len(text):
                  if text[i] == "{":
                      depth += 1

                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return text[start:i + 1]

                  i += 1

              return None

          out = []

          for name in names:
              out.append("")
              out.append("=" * 72)
              out.append(name)
              out.append("=" * 72)

              body = extract(s, name)

              if body is None:
                  out.append("FUNCTION NOT FOUND")

              else:
                  out.append(body)

          Path("cp-functions.txt").write_text(
              "\n".join(out) + "\n"
          )

          print("\n".join(out))
          PY

      - name: Inspect CP register definitions
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "REGISTER DEFINITIONS"
          echo "========================================"

          grep -R -n \
            -E \
            '#define[[:space:]]+CP_(PWRON|START|RESET)|CP_CTRL_(S|NS)|EXYNOS_PMU_CP_CTRL_(S|NS)' \
            drivers include arch \
            2>/dev/null \
            | head -200 \
            || true

      - name: Inspect PMU read/write APIs
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "PMU READ / WRITE DEFINITIONS"
          echo "========================================"

          grep -R -n \
            -E \
            'exynos_pmu_(read|write)|exynos_smc_(read|write)' \
            drivers include arch \
            2>/dev/null \
            | head -300 \
            || true

      - name: Find every CP power-on caller
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "EVERY CP POWER-ON CALLER"
          echo "========================================"

          grep -R -n \
            -E \
            'exynos_set_cp_power_onoff[[:space:]]*\(' \
            drivers arch include \
            2>/dev/null \
            || true

          echo
          echo "========================================"
          echo "EVERY CP_POWER_ON REFERENCE"
          echo "========================================"

          grep -R -n \
            'CP_POWER_ON' \
            drivers arch include \
            2>/dev/null \
            | head -300 \
            || true

      - name: Find every CP power-off caller
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "EVERY CP_POWER_OFF REFERENCE"
          echo "========================================"

          grep -R -n \
            'CP_POWER_OFF' \
            drivers arch include \
            2>/dev/null \
            | head -300 \
            || true

      - name: Inspect modem control driver
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "MODEM CONTROL REFERENCES"
          echo "========================================"

          grep -R -n \
            -E \
            'ss310ap|modem_ctrl|cp_reset|cp_start|cp_power|modem_power' \
            drivers \
            2>/dev/null \
            | head -500 \
            || true

      - name: Check whether source supports assumed APIs
        working-directory: kernel
        shell: bash
        run: |
          set -eux

          echo
          echo "========================================"
          echo "API ASSUMPTION CHECK"
          echo "========================================"

          for symbol in \
            exynos_pmu_read \
            exynos_pmu_write \
            exynos_smc_read \
            exynos_smc_write
          do
            echo
            echo "SYMBOL: $symbol"

            grep -R -n \
              "$symbol" \
              drivers include arch \
              2>/dev/null \
              | head -50 \
              || true
          done

      - name: Build diagnostic report
        working-directory: kernel
        run: |
          set -eux

          {
            echo "XCOVER4S CP v12 DIAGNOSTIC"
            echo
            echo "Kernel commit:"
            git rev-parse HEAD
            echo
            echo "Kernel branch:"
            git branch --show-current
            echo
            echo "Source status:"
            git status --short
            echo
            echo "pmu-cp.c SHA256:"
            sha256sum drivers/soc/samsung/pmu-cp.c
            echo
            echo "pmu-cp.c size:"
            wc -c drivers/soc/samsung/pmu-cp.c
          } > diagnostic-summary.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-CP-v12-SOURCE-DIAGNOSTIC
          path: |
            kernel/cp-functions.txt
            kernel/diagnostic-summary.txt
            kernel/drivers/soc/samsung/pmu-cp.c
          if-no-files-found: error
