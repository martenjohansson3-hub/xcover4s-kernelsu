name: XCover4s - SELinux Permissive Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: kernel
  KERNEL_REPO: https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git
  KERNEL_BRANCH: lineage-18.1
  KERNEL_DEFCONFIG: lineage_xcover4s_defconfig

  ARCH: arm64
  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            make \
            cpio \
            rsync \
            python3 \
            git

      - name: Clone XCover4s kernel
        run: |
          set -eux

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth 1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$KERNEL_DEFCONFIG"

          echo "========================================"
          echo "KERNEL SOURCE OK"
          echo "========================================"

          git -C "$KERNEL_DIR" rev-parse HEAD

      - name: Force SELinux permissive
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          changed = []

          for p in Path("security/selinux").rglob("*.c"):
              text = p.read_text(errors="ignore")
              original = text

              text = re.sub(
                  r'(\bselinux_enforcing\s*=\s*)1(\s*;)',
                  r'\g<1>0\g<2>',
                  text
              )

              if text != original:
                  p.write_text(text)
                  changed.append(str(p))

          print("Changed SELinux files:")

          for p in changed:
              print("  " + p)

          if not changed:
              raise SystemExit(
                  "ERROR: No SELinux enforcing assignment changed"
              )
          PY

          echo
          echo "========================================"
          echo "SELINUX RESULT"
          echo "========================================"

          grep -RInE \
            "selinux_enforcing[[:space:]]*=" \
            security/selinux \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "SELINUX DIFF"
          echo "========================================"

          git diff -- security/selinux

      - name: Find modem RF power control
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set +e

          {
            echo "========================================"
            echo "MODEM / CP / RF"
            echo "========================================"

            grep -RInE \
              "modem|cpif|cp_power|cp.*power|modap|link_pm|mif|radio" \
              arch/arm64 drivers include \
              2>/dev/null | head -500

            echo
            echo "========================================"
            echo "REGULATORS"
            echo "========================================"

            grep -RInE \
              "regulator_(enable|disable)|regulator_get|regulator_bulk" \
              drivers arch/arm64 \
              2>/dev/null | head -500

            echo
            echo "========================================"
            echo "MODEM DEVICE TREE"
            echo "========================================"

            grep -RInE \
              "modem|cpif|cp_power|vdd.*cp|vdd.*modem|regulator.*cp|regulator.*modem|modap|mif" \
              arch/arm64/boot/dts \
              2>/dev/null | head -500

            echo
            echo "========================================"
            echo "RADIO CONFIG"
            echo "========================================"

            grep -RInE \
              "CONFIG_.*(MODEM|CPIF|RADIO|RF|MIF|MODAP)" \
              arch/arm64/configs \
              2>/dev/null | head -300

          } | tee modem-analysis.log

          true

      - name: Prepare kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          rm -rf out

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            "$KERNEL_DEFCONFIG"

          make \
            O="$PWD/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "========================================"
          echo "SELINUX CONFIG"
          echo "========================================"

          grep -E \
            "CONFIG_SECURITY_SELINUX|CONFIG_SECURITY_SELINUX_DEVELOP|CONFIG_SECURITY_SELINUX_BOOTPARAM" \
            out/.config || true

      - name: Build full kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          KCFLAGS: -Wno-error
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          make -j"$(nproc)" \
            O="$PWD/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            Image dtbs \
            > >(tee build-full.log \
              | grep -v -E \
              'aarch64-linux-gnu-objdump: Warning: (Unrecognized form: 0x22|Unrecognized form: 0x23|Corrupt attribute|Corrupt attribute block length|Bogus end-of-siblings marker|Further warnings about bogus end-of-sibling markers suppressed)') \
            2> >(tee -a build-full.log >&2 \
              | grep -v -E \
              'aarch64-linux-gnu-objdump: Warning: (Unrecognized form: 0x22|Unrecognized form: 0x23|Corrupt attribute|Corrupt attribute block length|Bogus end-of-siblings marker|Further warnings about bogus end-of-sibling markers suppressed)' >&2)

          BUILD_STATUS=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_STATUS"
          echo "========================================"

          exit "$BUILD_STATUS"

      - name: Create clean build log
        if: always()
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ -f build-full.log ]; then

            grep -v -E \
              'aarch64-linux-gnu-objdump: Warning: (Unrecognized form: 0x22|Unrecognized form: 0x23|Corrupt attribute|Corrupt attribute block length|Bogus end-of-siblings marker|Further warnings about bogus end-of-sibling markers suppressed)' \
              build-full.log \
              > build-clean.log || true

          else
            touch build-clean.log
          fi

          echo
          echo "========================================"
          echo "IMPORTANT BUILD MESSAGES"
          echo "========================================"

          grep -iE \
            "error:|fatal error:|undefined reference|warning:|FAILED|Error [0-9]+" \
            build-clean.log \
            | tail -200 || true

      - name: Verify kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -eux

          test -f out/arch/arm64/boot/Image

          echo
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

          ls -lh out/arch/arm64/boot/Image

          echo
          echo "SHA256:"
          sha256sum out/arch/arm64/boot/Image

      - name: Package results
        if: always()
        run: |
          mkdir -p artifacts

          if [ -f "${KERNEL_DIR}/out/arch/arm64/boot/Image" ]; then
            cp \
              "${KERNEL_DIR}/out/arch/arm64/boot/Image" \
              artifacts/Image-selinux-permissive
          fi

          if [ -f "${KERNEL_DIR}/out/.config" ]; then
            cp \
              "${KERNEL_DIR}/out/.config" \
              artifacts/kernel-config
          fi

          if [ -f "${KERNEL_DIR}/build-clean.log" ]; then
            cp \
              "${KERNEL_DIR}/build-clean.log" \
              artifacts/build-clean.log
          fi

          if [ -f "${KERNEL_DIR}/build-full.log" ]; then
            cp \
              "${KERNEL_DIR}/build-full.log" \
              artifacts/build-full.log
          fi

          if [ -f "${KERNEL_DIR}/modem-analysis.log" ]; then
            cp \
              "${KERNEL_DIR}/modem-analysis.log" \
              artifacts/modem-analysis.log
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcover4s-build-results
          path: artifacts/
          if-no-files-found: warn
