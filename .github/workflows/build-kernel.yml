          90HzUm2+RhrIzLu05TJzDHiG5FzF3X3Z27zleosl6nkWfF8QLv8DRPFCtCoVAAA=
          PATCH64
          base64 -d diagnostics/v51.patch.gz.b64 | gzip -dc > diagnostics/v51.patch
          echo '7f0ebd23cea817b2048a9bc9ceb4483827b83112b7710aa496ee959fa36bc0d8  diagnostics/v51.patch' | sha256sum -c -
          cd kernel
          git apply --check ../diagnostics/v51.patch
          git apply ../diagnostics/v51.patch
          git diff --check
          git diff > ../diagnostics/applied.patch
          grep -q 'V51: CP-off latch blocks ss310ap_reset' drivers/misc/modem_v1/modem_ctrl_ss310ap.c
          grep -q 'V51: CP-off latch blocks ss310ap_boot_on' drivers/misc/modem_v1/modem_ctrl_ss310ap.c

      - name: V52 force SELinux Permissive inside kernel
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          import re
          p = Path('kernel/security/selinux/ss/services.c')
          s = p.read_text()
          pattern = r'(int\s+security_setenforce\s*\(\s*int\s+enforcing\s*\)\s*\{)'
          matches = list(re.finditer(pattern, s))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one security_setenforce(int enforcing) in services.c; refusing an unsafe patch')
          pos = matches[0].end()
          if 'V52_FORCE_PERMISSIVE' in s:
              raise SystemExit('V52 SELinux patch appears already applied')
          s = s[:pos] + '\n\t/* V52_FORCE_PERMISSIVE: ignore requests to enable enforcing mode. */\n\tenforcing = 0;\n' + s[pos:]
          p.write_text(s)
          check = p.read_text()
          assert check.count('V52_FORCE_PERMISSIVE') == 1
          assert 'enforcing = 0;' in check[matches[0].start():matches[0].start()+500]
          print('Patched security_setenforce(): requests to enable Enforcing are forced to Permissive.')
          PYPATCH
          grep -n -A8 'security_setenforce' kernel/security/selinux/ss/services.c | head -n 20
          git -C kernel diff --check
          git -C kernel diff -- security/selinux/ss/services.c > diagnostics/v52-selinux-only.patch
          test -s diagnostics/v52-selinux-only.patch

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineage_xcover4s_defconfig 2>&1 | tee ../diagnostics/config.log
          cp out/.config ../diagnostics/kernel.config
          grep -q '^CONFIG_CP_PMUCAL=y' out/.config
          grep -q '^CONFIG_SEC_MODEM_SS310AP=y' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y' out/.config
          if grep -q '^CONFIG_ALWAYS_ENFORCE=y' out/.config; then echo 'Kernel forces SELinux enforcing: refusing to build'; exit 1; fi

      - name: Targeted compile before full build
        run: |
          set -euo pipefail
          cd kernel
          make -j2 O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-Wno-error drivers/soc/samsung/cal-if/pmucal_cp.o drivers/misc/modem_v1/modem_ctrl_ss310ap.o 2>&1 | tee ../diagnostics/targeted.log | sed -E '/aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)/d'
          test -s out/drivers/soc/samsung/cal-if/pmucal_cp.o
          test -s out/drivers/misc/modem_v1/modem_ctrl_ss310ap.o

      - name: Full ARM64 Image build
        run: |
          set -euo pipefail
          cd kernel
          make -j2 O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-Wno-error Image 2>&1 | tee ../diagnostics/full-build.log | sed -E '/aarch64-linux-gnu-objdump: Warning: Unrecognized form: 0x(22|23)/d'
          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image ../artifacts/Image

      - name: Repack boot and regenerate unsigned AVB hash and footer
        run: |
          set -euo pipefail
          python3 - <<'PYREPACK'
          from pathlib import Path
          import struct,hashlib,json,tarfile
          base=Path('artifacts'); original=Path('boot-original.img').read_bytes(); kernel=(base/'Image').read_bytes()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert len(original)==37748736, 'Unexpected boot partition size'
          assert sha(original)=='f94927e36475b2c6ba7b2c1925c3a5969d8d42b321ffc9309aa653cddc7a99e9', 'Wrong original boot backup'
          assert original[:8]==b'ANDROID!' and original[-64:-60]==b'AVBf'
          u32=lambda off:struct.unpack_from('<I',original,off)[0]
          ks,rs,ss,pg,dt=u32(8),u32(16),u32(24),u32(36),u32(40)
          assert (ks,rs,pg)==(23295720,837785,2048), 'Unexpected boot header'
          assert 20000000<len(kernel)<27000000, 'Unexpected kernel size'
          align=lambda n:(n+pg-1)//pg*pg
          ro=pg+align(ks);so=ro+align(rs);dto=so+align(ss)
          ramdisk=original[ro:ro+rs];second=original[so:so+ss];dtb=original[dto:dto+dt]
          assert ro+rs<len(original) and dto+dt<len(original)
          origsize,vbo,vbs=struct.unpack_from('>QQQ',original,len(original)-64+12)
          assert (origsize,vbo,vbs)==(24137728,24137728,704)
          vb=bytearray(original[vbo:vbo+vbs]);assert vb[:4]==b'AVB0'
          assert struct.unpack_from('>I',vb,28)[0]==0, 'AVB must be unsigned algorithm NONE'
          d=256
          assert struct.unpack_from('>QQ',vb,d)==(2,184)
          assert struct.unpack_from('>Q',vb,d+16)[0]==origsize
          assert vb[d+24:d+30]==b'sha256'
          assert struct.unpack_from('>III',vb,d+56)==(4,32,32)
          assert vb[d+132:d+136]==b'boot'
          salt=bytes(vb[d+136:d+168])
          assert hashlib.sha256(salt+original[:origsize]).digest()==bytes(vb[d+168:d+200]), 'Original AVB invalid'
          header=bytearray(original[:pg]);struct.pack_into('<I',header,8,len(kernel))
          oldcmd=bytes(header[64:576]).split(b'\0',1)[0]
          for arg in (b'enforcing=0',b'androidboot.selinux=permissive'):
           if arg not in oldcmd.split(): oldcmd+=b' '+arg
          assert len(oldcmd)<512, 'Boot cmdline too long'
          header[64:576]=oldcmd+b'\0'*(512-len(oldcmd))
          assert b'androidboot.selinux=permissive' in oldcmd and b'enforcing=0' in oldcmd
          h=hashlib.sha1()
          for data in (kernel,ramdisk,second,dtb):
           h.update(data);h.update(struct.pack('<I',len(data)))
          header[576:608]=h.digest()+b'\0'*12
          payload=bytes(header)+kernel+b'\0'*(align(len(kernel))-len(kernel))+ramdisk+b'\0'*(align(rs)-rs)+second+b'\0'*(align(ss)-ss)+dtb+b'\0'*(align(dt)-dt)
          assert len(payload)%pg==0
          struct.pack_into('>Q',vb,d+16,len(payload));vb[d+168:d+200]=hashlib.sha256(salt+payload).digest()
          new_vbo=(len(payload)+63)//64*64
          assert new_vbo+vbs<len(original)-64, 'New kernel does not fit boot partition'
          out=bytearray(len(original));out[:len(payload)]=payload;out[new_vbo:new_vbo+vbs]=vb
          footer=bytearray(original[-64:]);struct.pack_into('>QQQ',footer,12,len(payload),new_vbo,vbs);out[-64:]=footer
          candidate=base/'boot.img';candidate.write_bytes(out)
          check=candidate.read_bytes();nro=pg+align(len(kernel))
          assert check[nro:nro+rs]==ramdisk, 'Ramdisk changed'
          assert check[pg:pg+len(kernel)]==kernel
          assert check[576:596]==h.digest()
          assert hashlib.sha256(salt+check[:len(payload)]).digest()==check[new_vbo+d+168:new_vbo+d+200]
          with tarfile.open(base/'XCOVER4S-V52-PERMISSIVE-ODIN-UNTESTED.tar','w',format=tarfile.USTAR_FORMAT) as t:t.add(candidate,arcname='boot.img')
          with tarfile.open(base/'XCOVER4S-V52-ORIGINAL-RESTORE.tar','w',format=tarfile.USTAR_FORMAT) as t:t.add('boot-original.img',arcname='boot.img')
          with tarfile.open(base/'XCOVER4S-V52-PERMISSIVE-ODIN-UNTESTED.tar') as t:
           members=t.getmembers()
           assert len(members)==1 and members[0].name=='boot.img' and t.extractfile(members[0]).read()==check
          report={'status':'STRUCTURALLY_VERIFIED_NOT_DEVICE_TESTED','original_sha256':sha(original),'candidate_sha256':sha(check),'kernel_sha256':sha(kernel),'ramdisk_sha256':sha(ramdisk),'avb_algorithm':'NONE','original_avb_hash_valid':True,'candidate_avb_hash_valid':True,'header_sha1_valid':True,'cp_off_manual_only':False,'trigger_installer_in_artifact':True,'trigger_install_required_before_flash':True,'trigger_device_tested':False,'runtime_rf_silence_verified':False,'selinux_boot_cmdline':oldcmd.decode('ascii'),'selinux_permissive_runtime_verified':False,'selinux_boot_target':'Permissive requested; device test required'}
          (base/'verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PYREPACK

      - name: Package boot-completed CP-off trigger and installer
        run: |
          set -euo pipefail
          cat > artifacts/v52-cp-off.sh <<'TRIGGER'
          #!/system/bin/sh
          [ "$(getprop sys.boot_completed)" = 1 ] || exit 19
          PATH=/system/bin:/system/xbin:/vendor/bin
          /system/bin/log -t V52CP 'boot completed: requesting CP off' || true
          PARAM=''
          for P in /sys/module/*/parameters/v46_cp_off; do
            [ -e "$P" ] || continue
            [ -z "$PARAM" ] || exit 12
            PARAM="$P"
          done
          [ -n "$PARAM" ] || exit 13
          [ -w "$PARAM" ] || exit 14
          STATE=$(cat "$PARAM" 2>/dev/null) || exit 15
          [ "$STATE" = 1 ] && exit 0
          [ "$STATE" = 0 ] || exit 16
          printf '1\n' > "$PARAM" || exit 17
          [ "$(cat "$PARAM")" = 1 ] || exit 18
          /system/bin/log -t V52CP 'CP-off latch enabled; RF not independently verified' || true
          TRIGGER

          cat > artifacts/v52-cp-off.rc <<'INITRC'
          service v52_cp_off /system/bin/sh /data/adb/v52-cp-off.sh
              class late_start
              user root
              group root
              seclabel u:r:su:s0
              disabled
              oneshot

          on property:sys.boot_completed=1
              start v52_cp_off
          INITRC

          cat > artifacts/INSTALL-BEFORE-FLASH.ps1 <<'POWERSHELL'
          $ErrorActionPreference = 'Stop'
          $here = Split-Path -Parent $MyInvocation.MyCommand.Path
          $adbCandidates = @(
            (Join-Path $env:LOCALAPPDATA 'Android\Sdk\platform-tools\adb.exe'),
            (Join-Path $env:USERPROFILE 'Downloads\platform-tools\adb.exe')
          )
          $adbCmd = Get-Command adb.exe -ErrorAction SilentlyContinue
          if ($adbCmd) { $adb = $adbCmd.Source }
          else { $adb = $adbCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $adb) { throw 'adb.exe not found. Install Android platform-tools.' }
          function RunAdb { & $adb @args; if ($LASTEXITCODE -ne 0) { throw "adb failed ($LASTEXITCODE): $args" } }
          RunAdb root
          RunAdb wait-for-device
          $id = (& $adb shell id)
          if ($LASTEXITCODE -ne 0 -or $id -notmatch 'uid=0\(root\)') { throw 'ADB root required' }
          $state = (& $adb shell 'getprop sys.boot_completed').Trim()
          if ($state -ne '1') { throw 'Android has not finished booting' }
          $original = Join-Path $here 'v52-cp-off.rc'
          $script = Join-Path $here 'v52-cp-off.sh'
          if (!(Test-Path $original) -or !(Test-Path $script)) { throw 'Missing generated trigger files' }
          RunAdb push $script /data/adb/v52-cp-off.sh
          RunAdb shell 'chown root:root /data/adb/v52-cp-off.sh; chmod 700 /data/adb/v52-cp-off.sh; restorecon /data/adb/v52-cp-off.sh'
          RunAdb remount
          RunAdb push $original /system/etc/init/v52-cp-off.rc
          RunAdb shell 'chown root:root /system/etc/init/v52-cp-off.rc; chmod 644 /system/etc/init/v52-cp-off.rc; restorecon /system/etc/init/v52-cp-off.rc; sync'
          $check = (& $adb shell 'ls -lZ /system/etc/init/v52-cp-off.rc /data/adb/v52-cp-off.sh')
          if ($LASTEXITCODE -ne 0) { throw 'Installed files cannot be read' }
          Write-Host $check
          Write-Host 'Trigger staged for NEXT boot. Do not reboot until V52 boot image has been reviewed and you are ready to flash.'
          POWERSHELL

          python3 - <<'PYCHECK'
          from pathlib import Path
          a=Path('artifacts/v52-cp-off.rc').read_text()
          b=Path('artifacts/v52-cp-off.sh').read_text()
          assert 'on property:sys.boot_completed=1' in a
          assert 'oneshot' in a and 'start v52_cp_off' in a
          assert 'v46_cp_off' in b
          print('Static trigger and init configuration checks passed; NOT device tested')
          PYCHECK

      - name: Upload verified candidate and restore package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V52-COMPLETE-CANDIDATE-UNTESTED
          path: |
            artifacts/boot.img
            artifacts/XCOVER4S-V52-PERMISSIVE-ODIN-UNTESTED.tar
            artifacts/XCOVER4S-V52-ORIGINAL-RESTORE.tar
            artifacts/verification.json
            artifacts/v52-cp-off.sh
            artifacts/v52-cp-off.rc
            artifacts/INSTALL-BEFORE-FLASH.ps1
            diagnostics/applied.patch
            diagnostics/kernel.config
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V52-FAILED-DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
