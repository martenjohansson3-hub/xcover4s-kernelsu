
name: XCover4s V46 targeted CP compile

on:
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler and kernel prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev python3 clang lld

      - name: Get original kernel
        run: |
          git clone --filter=blob:none \
            --branch lineage-18.1 \
            --single-branch \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git kernel

          cd kernel
          git checkout 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply V46 patch
        run: |
          cd kernel
          git apply --check ../patches/v46.patch
          git apply ../patches/v46.patch

      - name: Configure kernel
        run: |
          cd kernel
          mkdir -p out

          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            lineage_xcover4s_defconfig

          grep -E 'CONFIG_CP_PMUCAL=|CONFIG_SOC_EXYNOS7885=' out/.config

      - name: Compile V46 CP module
        run: |
          cd kernel

          make -j2 O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-Wno-error \
            drivers/soc/samsung/cal-if/pmucal_cp.o

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V46-TARGETED-CHECK
          path: |
            kernel/out/drivers/soc/samsung/cal-if/pmucal_cp.o
            kernel/out/.config
