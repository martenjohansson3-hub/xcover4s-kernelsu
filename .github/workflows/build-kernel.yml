
name: XCOVER4S V37 FULL CPLOCK BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KCFLAGS: -Wno-error

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev python3 zip

      - name: Clone exact V36 kernel source
        run: |
          set -euo pipefail
          git clone \
            https://github.com/exynos7885-dev/kernel_samsung_exynos7885.git \
            kernel
          cd kernel
          git checkout 6020dfa8315134187f07ca903c9d2ed7ee0256f5

      - name: Apply CPLOCK and build fixes
        run: |
          set -euo pipefail
          cat > /tmp/v37_patch.py <<'PY'
          from pathlib import Path

          root = Path("kernel")

          def replace(rel, old, new, count=1):
              p = root / rel
              s = p.read_text()
              found = s.count(old)
              if found != count:
                  raise SystemExit(
                      f"PATCH FAILED {rel}: "
                      f"expected {count}, found {found}: {old!r}"
                  )
              p.write_text(s.replace(old, new))
              print("PATCHED", rel)

          # Existing V33 build compatibility fixes.
          replace(
              "drivers/video/fbdev/exynos/dpu_7885/decon_reg.c",
              "const double decon_clocks_table",
              "const unsigned long decon_clocks_table"
          )

          replace(
              "drivers/video/fbdev/exynos/dpu_7885/decon.h",
              "#define decon_create_debugfs(...) do { } while(0)",
              "#define decon_create_debugfs(...) (0)"
          )

          replace(
              "drivers/video/fbdev/exynos/dpu_7885/decon.h",
              "#define decon_destroy_debugfs(..) do { } while(0)",
              "#define decon_destroy_debugfs(...) do { } while(0)"
          )

          helper = root / (
              "drivers/video/fbdev/exynos/dpu_7885/helper.c"
          )
          h = helper.read_text()
          if "ACQUIRE_FENCE_LEN" not in h:
              raise SystemExit("Expected ACQUIRE_FENCE_LEN usage missing")
          helper.write_text(
              "#ifndef ACQUIRE_FENCE_LEN\n"
              "#define ACQUIRE_FENCE_LEN 1024\n"
              "#endif\n\n" + h
          )

          # Central CP start gates in the ACTIVE PMUCAL path.
          p = root / "drivers/soc/samsung/cal-if/pmucal_cp.c"
          s = p.read_text()

          if "CPLOCK V37" in s:
              raise SystemExit("Already patched")

          s = (
              '#include <linux/errno.h>\n'
              '#include <linux/init.h>\n'
              '#include <linux/kernel.h>\n'
              '#include <linux/printk.h>\n'
              + s
          )

          for name in (
              "pmucal_cp_init",
              "pmucal_cp_reset_release",
          ):
              needle = f"int {name}(void)\n{{"
              if s.count(needle) != 1:
                  raise SystemExit(
                      f"Cannot locate {name} exactly once"
                  )
              replacement = (
                  needle
                  + '\n\t/* CPLOCK V37: deny modem activation */'
                  + '\n\tpr_warn_ratelimited('
                  + '"CPLOCK: denied ' + name + '\\n");'
                  + '\n\treturn -EPERM;\n'
              )
              s = s.replace(needle, replacement, 1)

          # OFF uses Samsung's actual Exynos7885
          # reset-assert sequence, without panic-on-error.
          s += r'''

          /* CPLOCK V37: power down CP after PMUCAL setup. */
          static int __init xcover4s_cp_lock_off(void)
          {
              int ret;

              pr_info("CPLOCK: force-off requested\n");

              if (!pmucal_cp_list.reset_assert) {
                  pr_err("CPLOCK: reset_assert unavailable\n");
                  return 0;
              }

              ret = pmucal_rae_handle_cp_seq(
                  pmucal_cp_list.reset_assert,
                  pmucal_cp_list.num_reset_assert);

              if (ret)
                  pr_err("CPLOCK: force-off failed: %d\n", ret);
              else
                  pr_info("CPLOCK: force-off sequence complete\n");

              return 0;
          }
          late_initcall(xcover4s_cp_lock_off);
          '''

          p.write_text(s)
          print("PATCHED PMUCAL CPLOCK")

          # Guard the driver-level modem ON entry.
          p = root / (
              "drivers/misc/modem_v1/"
              "modem_ctrl_ss310ap.c"
          )
          s = p.read_text()
          needle = "static int ss310ap_on(struct modem_ctl *mc)\n{"

          if s.count(needle) != 1:
              raise SystemExit("SS310AP ON entry not found")

          s = s.replace(
              needle,
              needle
              + '\n\t/* CPLOCK V37 */'
              + '\n\tmif_err("CPLOCK: modem_on denied\\n");'
              + '\n\tmc->phone_state = STATE_OFFLINE;'
              + '\n\treturn -EPERM;\n',
              1
          )
          p.write_text(s)
          print("PATCHED SS310AP ON gate")

          # Record all remaining activation references.
          import re
          patterns = re.compile(
              r"CP_POWER_ON|cal_cp_init|cal_cp_reset_release"
              r"|pmucal_cp_init|pmucal_cp_reset_release"
          )
          with open("/tmp/cp-callers.txt", "w") as out:
              for p in (root / "drivers").rglob("*.c"):
                  for i, line in enumerate(
                      p.read_text(errors="replace").splitlines(), 1
                  ):
                      if patterns.search(line):
                          out.write(
                              f"{p}:{i}: {line}\n"
                          )
          PY

          python3 /tmp/v37_patch.py

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p out

          make O=out \
            lineage_xcover4s_defconfig

          make O=out olddefconfig

          grep -qx 'CONFIG_CP_PMUCAL=y' out/.config
          grep -qx 'CONFIG_SEC_MODEM_SS310AP=y' out/.config

      - name: Full kernel build
        run: |
          set -euo pipefail
          cd kernel

          make O=out -j2 Image \
            2>&1 | tee /tmp/v37-build.log

          test -s out/arch/arm64/boot/Image

      - name: Validate kernel output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          p = Path(
              "kernel/out/arch/arm64/boot/Image"
          )
          data = p.read_bytes()

          if len(data) < 1000000:
              raise SystemExit("Kernel too small")

          magic = struct.unpack_from("<I", data, 0x38)[0]
          if magic != 0x644d5241:
              raise SystemExit("Invalid ARM64 Image magic")

          print("ARM64 Image header OK")
          print("Kernel bytes:", len(data))
          PY

      - name: Package kernel and diagnostics
        run: |
          set -euo pipefail
          mkdir -p dist

          cp kernel/out/arch/arm64/boot/Image \
            dist/Image

          cp kernel/out/.config \
            dist/final.config

          cp /tmp/v37-build.log \
            dist/build.log

          cp /tmp/cp-callers.txt \
            dist/cp-callers.txt

          git -C kernel diff \
            > dist/v37.patch

          git -C kernel rev-parse HEAD \
            > dist/source-commit.txt

          sha256sum dist/Image \
            > dist/Image.sha256

          cat > dist/README.txt <<'EOF'
          XCOVER4S V37 EXPERIMENTAL CPLOCK

          Full kernel build only.
          NOT an Odin-flashable image.

          PMUCAL CP activation gates installed.
          PMUCAL reset-assert scheduled at late init.

          NOT YET VERIFIED:
          - Boot success
          - CP physical power-off
          - All CP reactivation paths
          - Wi-Fi functionality

          Do not flash Image directly with Odin.
          EOF

      - name: Upload V37 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XCOVER4S-V37-FULL-KERNEL
          path: dist/
          if-no-files-found: warn
          retention-days: 30
